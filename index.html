<script>
/* ===== V39: thông báo tường/tim/bảng tin, đi tới đúng vị trí, bảng tin thời gian thực ===== */
let NXHOLD=0,NXBIG=0;
{const o=loadFriendsUI;loadFriendsUI=function(){if(NXHOLD)return;return o.apply(this,arguments)}}
{const o=loadWallThread;loadWallThread=function(owner,lim){return o.call(this,owner,NXBIG?100:lim)}}

const NX=window.__nx={names:{},busy:0,last:0};
const nxWait=async(f,ms)=>{const t0=Date.now();while(Date.now()-t0<(ms||3500)){try{const r=f();if(r)return r}catch(e){}await new Promise(r=>setTimeout(r,70))}return null};

/* ---- viền sáng (màu theo chủ đề: var(--g2)) ---- */
function nxFocus(id){
 const el=document.getElementById(id);
 if(!el){toast('Nội dung này không còn hiển thị');return false}
 el.classList.remove('nglow');
 el.scrollIntoView({behavior:'smooth',block:'center'});
 void el.offsetWidth;el.classList.add('nglow');
 setTimeout(()=>{if(el.classList.contains('nglow'))el.scrollIntoView({block:'center'})},650);
 setTimeout(()=>el.classList.remove('nglow'),4600);
 return true}

/* ---- bảng tin: lấy riêng 1 bài khi bài chưa nằm trong trang đã tải ---- */
async function feedEnsure(pid){
 if(FEED.posts.some(p=>p.id==pid))return true;
 const {data:p}=await supabaseClient.from('feed_posts').select('id, user_id, image, caption, music, created_at').eq('id',pid).maybeSingle();
 if(!p)return false;
 const [lk,cm]=await Promise.all([
  supabaseClient.from('feed_likes').select('post_id, user_id').eq('post_id',pid),
  supabaseClient.from('feed_comments').select('id, post_id, user_id, body, created_at').eq('post_id',pid).order('created_at',{ascending:true})]);
 FEED.likes[pid]={n:0,me:0};FEED.cm[pid]=cm.data||[];
 (lk.data||[]).forEach(r=>{FEED.likes[pid].n++;if(r.user_id===currentUser.id)FEED.likes[pid].me=1});
 await feedProfiles([p.user_id,...FEED.cm[pid].map(c=>c.user_id)]);
 await feedClLoad(FEED.cm[pid]);
 FEED.posts.push(p);FEED.posts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 return true}

/* ---- chạm vào thông báo → tới đúng chỗ ---- */
async function nxGo(t){
 if(!t||!currentUser)return;
 try{
  if(t.k=='feed'){
   FEEDMODE='feed';SD.open('friends');
   await nxWait(()=>document.getElementById('feed-box'));
   await nxWait(()=>!FEED.busy,6000);
   if(!await feedEnsure(t.pid)){toast('Bài đăng không còn nữa');feedPaint();return}
   if(t.cid)FEED.open[t.pid]=true;
   feedPaint();
   await new Promise(r=>setTimeout(r,200));
   if(!(t.cid&&nxFocus('fcm-'+t.cid)))nxFocus('fp-'+t.pid);
  }else if(t.k=='wall'){
   NXHOLD=1;NXBIG=1;
   SD.open('friends');
   await nxWait(()=>document.getElementById('friend-content'));
   if(t.owner===currentUser.id)await viewMyWall();else await visitFriend(t.owner);
   NXBIG=0;
   setTimeout(()=>{NXHOLD=0},700);
   await new Promise(r=>setTimeout(r,220));
   nxFocus('wm-'+t.mid);
  }
 }catch(e){console.warn(e)}
 finally{NXBIG=0;setTimeout(()=>{NXHOLD=0},900)}}
window.nxGo=nxGo;

/* ---- engine thông báo ---- */
async function nxNames(ids){
 const need=[...new Set(ids)].filter(u=>u&&!NX.names[u]);
 if(!need.length)return;
 try{const {data}=await supabaseClient.from('profiles').select('id, display_name, username').in('id',need);
  (data||[]).forEach(p=>NX.names[p.id]=p)}catch(e){}
 need.forEach(u=>{if(!NX.names[u])NX.names[u]={}})}
const nxName=u=>{const p=NX.names[u]||{};return p.display_name||p.username||'Một người chơi'};
const nxSnip=x=>{x=String(x||'').replace(/^↩\d+\|/,'').replace(/\u27e6A:[^\u27e7]*\u27e7/g,' [đính kèm] ').replace(/\s+/g,' ').trim();return x.length>40?x.slice(0,40)+'…':x};

NX.check=async function(){
 if(typeof currentUser==='undefined'||!currentUser||typeof s==='undefined'||!s||NX.busy)return;
 if(Date.now()-NX.last<3000)return;
 NX.busy=1;NX.last=Date.now();
 try{
  const me=currentUser.id,sb=supabaseClient,nowIso=()=>new Date().toISOString();
  s.nSeen=s.nSeen||[];s.nInit=s.nInit||{};s.notifs=s.notifs||[];
  const seen=new Set(s.nSeen),fresh=[];
  const take=(src,list)=>{
   if(!s.nInit[src]){list.forEach(x=>{seen.add(x.key);s.nSeen.push(x.key)});s.nInit[src]=1;return}
   list.forEach(x=>{if(seen.has(x.key))return;seen.add(x.key);s.nSeen.push(x.key);fresh.push(x)})};

  /* A) người khác ký tường / trả lời trên tường của mình (không tính mình tự trả lời) */
  try{
   const {data:inb,error}=await sb.from('wall_messages').select('id, from_user, to_user, parent_id, created_at')
    .eq('to_user',me).neq('from_user',me).not('message','like','JSGIFT1:%').order('created_at',{ascending:false}).limit(40);
   if(!error){
    await nxNames((inb||[]).map(m=>m.from_user));
    take('wm',(inb||[]).map(m=>({key:'wm:'+m.id,type:'wall',time:m.created_at,tgt:{k:'wall',owner:me,mid:m.id},
     text:m.parent_id==null?'Bạn có một lượt ký tường mới':nxName(m.from_user)+' đã trả lời phần ký tường của bạn'})))}
  }catch(e){}

  /* B) bạn bè trả lời mình ở tường của họ  +  C) bạn bè thả tim ký tường/trả lời của mình */
  try{
   const {data:mine,error}=await sb.from('wall_messages').select('id, to_user, parent_id, created_at')
    .eq('from_user',me).not('message','like','JSGIFT1:%').order('created_at',{ascending:false}).limit(150);
   if(!error&&mine&&mine.length){
    const mm=new Map(mine.map(m=>[m.id,m]));
    const rootsElsewhere=mine.filter(m=>m.parent_id==null&&m.to_user!==me).map(m=>m.id);
    if(rootsElsewhere.length){
     const {data:rp,error:e2}=await sb.from('wall_messages').select('id, from_user, to_user, parent_id, created_at')
      .in('parent_id',rootsElsewhere).neq('from_user',me).order('created_at',{ascending:false}).limit(40);
     if(!e2){
      await nxNames((rp||[]).flatMap(r=>[r.from_user,r.to_user]));
      take('wp',(rp||[]).map(r=>({key:'wp:'+r.id,type:'wall',time:r.created_at,tgt:{k:'wall',owner:r.to_user,mid:r.id},
       text:r.from_user===r.to_user?nxName(r.from_user)+' đã trả lời lại bạn trong tường của họ':nxName(r.from_user)+' đã trả lời bạn trong tường của '+nxName(r.to_user)})))}
    }
    const {data:rx,error:e3}=await sb.from('wall_reactions').select('*').in('message_id',[...mm.keys()]).neq('user_id',me).eq('reaction','heart').limit(120);
    if(!e3){
     await nxNames((rx||[]).map(r=>r.user_id));
     take('wr',(rx||[]).filter(r=>mm.has(r.message_id)).map(r=>{const m=mm.get(r.message_id);
      return {key:'wr:'+r.message_id+':'+r.user_id,type:'heart',time:r.created_at||nowIso(),tgt:{k:'wall',owner:m.to_user,mid:m.id},
       text:nxName(r.user_id)+' đã tim phần '+(m.parent_id==null?'ký tường':'trả lời')+' của bạn'}}))}
   }
  }catch(e){}

  /* D) bảng tin: tim + bình luận trên bài của mình */
  try{
   const {data:mp,error}=await sb.from('feed_posts').select('id').eq('user_id',me).order('created_at',{ascending:false}).limit(40);
   if(!error&&mp&&mp.length){
    const ids=mp.map(p=>p.id);
    const [lk,cm]=await Promise.all([
     sb.from('feed_likes').select('*').in('post_id',ids).neq('user_id',me).limit(200),
     sb.from('feed_comments').select('id, post_id, user_id, body, created_at').in('post_id',ids).neq('user_id',me).order('created_at',{ascending:false}).limit(60)]);
    await nxNames([...(lk.data||[]).map(r=>r.user_id),...(cm.data||[]).map(r=>r.user_id)]);
    if(!lk.error)take('fl',(lk.data||[]).map(r=>({key:'fl:'+r.post_id+':'+r.user_id,type:'heart',time:r.created_at||nowIso(),tgt:{k:'feed',pid:r.post_id},
     text:nxName(r.user_id)+' đã thả tim bài đăng bảng tin của bạn'})));
    if(!cm.error)take('fc',(cm.data||[]).map(c=>({key:'fc:'+c.id,type:'feed',time:c.created_at,tgt:{k:'feed',pid:c.post_id,cid:c.id},
     text:nxName(c.user_id)+' đã bình luận bài đăng bảng tin của bạn: “'+nxSnip(c.body)+'”'})))}
  }catch(e){}

  /* E) bảng tin: bạn bè thả tim bình luận của mình */
  try{
   const {data:mc,error}=await sb.from('feed_comments').select('id, post_id, body').eq('user_id',me).order('created_at',{ascending:false}).limit(100);
   if(!error&&mc&&mc.length){
    const cmap=new Map(mc.map(c=>[c.id,c]));
    const {data:cx,error:e2}=await sb.from('feed_comment_likes').select('*').in('comment_id',[...cmap.keys()]).neq('user_id',me).limit(200);
    if(!e2){
     await nxNames((cx||[]).map(r=>r.user_id));
     take('fcl',(cx||[]).filter(r=>cmap.has(r.comment_id)).map(r=>{const c=cmap.get(r.comment_id);
      return {key:'fcl:'+r.comment_id+':'+r.user_id,type:'heart',time:r.created_at||nowIso(),tgt:{k:'feed',pid:c.post_id,cid:c.id},
       text:nxName(r.user_id)+' đã thả tim bình luận của bạn: “'+nxSnip(c.body)+'”'}}))}
   }
  }catch(e){}

  fresh.sort((a,b)=>new Date(a.time)-new Date(b.time));
  fresh.forEach(x=>s.notifs.unshift({type:x.type,id:x.key,text:x.text,time:x.time,read:false,tgt:x.tgt}));
  if(s.nSeen.length>800)s.nSeen=s.nSeen.slice(-600);
  if(s.notifs.length>50)s.notifs=s.notifs.slice(0,50);
  try{save()}catch(e){}
 }catch(e){console.warn(e)}
 finally{NX.busy=0}};

/* ---- bảng tin thời gian thực ---- */
function feedLikeRefresh(pid){
 const b=document.getElementById('fl-'+pid);if(!b)return;
 const L=FEED.likes[pid]||{n:0,me:0};
 b.innerHTML=feedLikeBtn(pid);b.classList.toggle('liked',!!L.me)}
async function feedSync(){
 if(typeof currentUser==='undefined'||!currentUser||FEED.busy||FEED.syn||FEED.err)return;
 const box=document.getElementById('feed-box'),sd=document.getElementById('sd');
 if(!box||!box.isConnected||(sd&&!sd.classList.contains('on'))||!FEED.ids.length)return;
 FEED.syn=1;const stamp=FEED.lk||0;
 try{
  const uid=currentUser.id;
  let q=supabaseClient.from('feed_posts').select('id, user_id, caption, music, created_at').in('user_id',FEED.ids).order('created_at',{ascending:false});
  q=FEED.posts.length?q.gte('created_at',FEED.posts[FEED.posts.length-1].created_at).limit(60):q.limit(FEED_PAGE);
  const {data:ps,error}=await q;
  if(error||(FEED.lk||0)!==stamp)return;
  const light=ps||[],known=new Map(FEED.posts.map(p=>[p.id,p])),newIds=light.filter(p=>!known.has(p.id)).map(p=>p.id);
  let full=[];
  if(newIds.length){const r=await supabaseClient.from('feed_posts').select('id, user_id, image, caption, music, created_at').in('id',newIds);full=r.data||[]}
  const fm=new Map(full.map(p=>[p.id,p])),next=light.map(p=>known.get(p.id)||fm.get(p.id)).filter(Boolean);
  const ids=next.map(p=>p.id),listChg=ids.join()!==FEED.posts.map(p=>p.id).join();
  let lk={data:[]},cm={data:[]};
  if(ids.length){[lk,cm]=await Promise.all([
   supabaseClient.from('feed_likes').select('post_id, user_id').in('post_id',ids),
   supabaseClient.from('feed_comments').select('id, post_id, user_id, body, created_at').in('post_id',ids).order('created_at',{ascending:true}).limit(500)])}
  if((FEED.lk||0)!==stamp)return;
  await feedProfiles([...next.map(p=>p.user_id),...(cm.data||[]).map(c=>c.user_id)]);
  const clm=await feedClFetch(cm.data||[]);
  if((FEED.lk||0)!==stamp)return;
  const nl={},nc={};ids.forEach(id=>{nl[id]={n:0,me:0};nc[id]=[]});
  (lk.data||[]).forEach(r=>{const L=nl[r.post_id];if(L){L.n++;if(r.user_id===uid)L.me=1}});
  (cm.data||[]).forEach(c=>{if(nc[c.post_id])nc[c.post_id].push(c)});
  const dl=[],dc=[];
  ids.forEach(id=>{
   const ol=FEED.likes[id],oc=FEED.cm[id]||[];
   if(!ol||ol.n!==nl[id].n||ol.me!==nl[id].me)dl.push(id);
   if(oc.map(c=>c.id).join()!==nc[id].map(c=>c.id).join())dc.push(id)});
  const chp=feedClApply(clm,cm.data||[]);chp.forEach(p=>{if(!dc.includes(p))dc.push(p)});
  FEED.posts=next;ids.forEach(id=>{FEED.likes[id]=nl[id];FEED.cm[id]=nc[id]});
  FEED.t=Date.now();
  if(listChg)feedPaint();else{dl.forEach(feedLikeRefresh);dc.forEach(feedCmRefresh)}
 }catch(e){console.warn(e)}
 finally{FEED.syn=0}}

/* tim ở tường cập nhật trực tiếp */
async function wallSync(){
 const els=[...document.querySelectorAll('[id^="wh-"]')];if(!els.length||typeof currentUser==='undefined'||!currentUser)return;
 const ids=els.map(e=>+e.id.slice(3));
 try{
  const {data,error}=await supabaseClient.from('wall_reactions').select('message_id, user_id, reaction').in('message_id',ids);
  if(error)return;
  const nw={};ids.forEach(i=>nw[i]={n:0,me:0});
  (data||[]).forEach(r=>{const L=nw[r.message_id];if(L&&(r.reaction==='heart'||r.reaction==='like')){L.n++;if(r.user_id===currentUser.id)L.me=1}});
  ids.forEach(i=>{const o=WALLRX[i]||{n:-1,me:-1};if(o.n!==nw[i].n||o.me!==nw[i].me){WALLRX[i]=nw[i];wallHeartPaint(i)}})
 }catch(e){}}

/* kênh realtime của Supabase + dự phòng thăm dò định kỳ */
let NXRT=null,NXRT2=null,NXRU=null,NXT=0;
function nxChange(tb){
 clearTimeout(NXT);
 NXT=setTimeout(()=>{
  if(/^feed_/.test(tb))feedSync();
  if(tb=='wall_reactions')wallSync();
  NX.check()},350)}
function nxRtStart(){
 try{
  if(typeof currentUser==='undefined'||!currentUser||typeof supabaseClient==='undefined'||!supabaseClient||NXRU===currentUser.id)return;
  if(NXRT)supabaseClient.removeChannel(NXRT);
  if(NXRT2)supabaseClient.removeChannel(NXRT2);NXRT2=null;
  const c=supabaseClient.channel('jas-live-'+currentUser.id);
  ['feed_posts','feed_likes','feed_comments','wall_messages','wall_reactions'].forEach(tb=>
   c.on('postgres_changes',{event:'*',schema:'public',table:tb},()=>nxChange(tb)));
  c.subscribe();NXRT=c;NXRU=currentUser.id;
  /* kênh riêng cho bảng tim bình luận: nếu bảng chưa tạo thì chỉ kênh này lỗi, các kênh khác vẫn chạy */
  try{const c2=supabaseClient.channel('jas-live-cl-'+currentUser.id);
   c2.on('postgres_changes',{event:'*',schema:'public',table:'feed_comment_likes'},()=>nxChange('feed_comment_likes'));
   c2.subscribe();NXRT2=c2}catch(e){console.warn(e)}
 }catch(e){console.warn(e)}}
setInterval(nxRtStart,3000);
setInterval(()=>{if(!document.hidden){feedSync();wallSync()}},8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){feedSync();wallSync();NX.check()}});
</script>

<style>

<script>
/* ===== V40: nội thất bố trí hợp lý, offline bao lâu, đăng bảng tin trực tiếp ===== */

(()=>{

 const L={

const UPC={},UPL={},UPB={};
function upostCard(p,c,own){
 const L=c.l[p.id]||0,M=c.m[p.id]||0;
 const img=feedImgOk(p.image)?`<img class=fpimg src="${p.image}" alt="Ảnh bài đăng" loading=lazy>`:'';
 return `<div class="card fpost"><div class=fph><div class=fpn><small class=mut>${feedTime(p.created_at)}</small></div>${own?`<button class="s fcx" onclick="upostDel(${p.id})" aria-label="Xóa bài đăng">🗑</button>`:''}</div>${p.caption?`<p class=fpcap>${esc(p.caption)}</p>`:''}${img}<div class=fpa><span class=chip>❤️ ${L}</span><span class=chip>💬 ${M}</span><button class=s style="margin-left:auto" onclick="upostOpen(${p.id})">Xem &amp; bình luận</button></div></div>`}
function upostHtml(uid){
 const c=UPC[uid];
 setTimeout(()=>upostLoad(uid),0);
 return `<div id="upost-box" data-u="${uid}">${c?c.html:'<div class=card><p class=mut style="margin:0">Đang tải bài đăng...</p></div>'}</div>`}
async function upostLoad(uid,force){
 const box=document.getElementById('upost-box');
 if(!box||box.dataset.u!==uid||UPB[uid])return;
 const c=UPC[uid];if(c&&!force&&Date.now()-c.t<20000)return;
 UPB[uid]=1;
 try{
  const own=!!(currentUser&&uid===currentUser.id),lim=UPL[uid]||10;
  const {data:ps,error}=await supabaseClient.from('feed_posts').select('id, user_id, image, caption, created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(lim+1);
  let html;
  if(error){
   html=feedMissing(error)
    ?'<div class=fsetup><b>Bảng tin chưa được bật</b><p class=mut style="margin:4px 0 0">Cần chạy file justaseed-feed.sql một lần trong Supabase.</p></div>'
    :`<div class=fsetup><b>Không tải được bài đăng</b><p class=mut style="margin:4px 0 0">${esc(error.message||'')}</p></div>`}
  else{
   const all=ps||[],more=all.length>lim,list=all.slice(0,lim),ids=list.map(p=>p.id),cn={l:{},m:{}};
   if(ids.length){
    const [lk,cm]=await Promise.all([
     supabaseClient.from('feed_likes').select('post_id').in('post_id',ids),
     supabaseClient.from('feed_comments').select('post_id').in('post_id',ids)]);
    (lk.data||[]).forEach(r=>cn.l[r.post_id]=(cn.l[r.post_id]||0)+1);
    (cm.data||[]).forEach(r=>cn.m[r.post_id]=(cn.m[r.post_id]||0)+1)}
   html=list.length
    ?list.map(p=>upostCard(p,cn,own)).join('')+(more?`<button class=s style="width:100%;margin:6px 0" onclick="upostMore('${uid}')">Xem thêm</button>`:'')
    :`<div class=card><p class=mut style="margin:0">${own?'Bạn chưa đăng bài nào lên bảng tin. Hãy viết gì đó ở tab Bảng tin.':'Người này chưa đăng bài nào lên bảng tin.'}</p></div>`}
  UPC[uid]={t:Date.now(),html};
  const b2=document.getElementById('upost-box');
  if(b2&&b2.dataset.u===uid)b2.innerHTML=html;
 }catch(e){console.warn(e)}
 finally{UPB[uid]=0}}
function upostMore(uid){UPL[uid]=(UPL[uid]||10)+10;upostLoad(uid,true)}
function upostOpen(pid){try{mdl()}catch(e){}nxGo({k:'feed',pid})}
async function upostDel(pid){
 if(!confirm('Xóa bài đăng này?'))return;
 const oi=await feedImgOf(pid);
 const {error}=await supabaseClient.from('feed_posts').delete().eq('id',pid);
 if(error)return toast('Lỗi: '+error.message);
 feedRm(oi);
 FEED.posts=FEED.posts.filter(p=>p.id!==pid);
 toast('Đã xóa bài đăng');
 if(currentUser){delete UPC[currentUser.id];upostLoad(currentUser.id,true)}}

/* tab "Bài đăng" trong hồ sơ của mình */

const doneG=g=>g.claimed||g.claimed_at||g.used||g.done||g.status=='claimed';
const grantsH=()=>`<div class=card><div class=strip2><button class=s onclick="AD.grantAll()">🎁 Tặng tiền cho tất cả</button></div></div>`+(A.grants==null?LOAD:(A.grants.map(g=>`<div class=card><div class=row style="margin:0">${nameBtn(g.user_id,A.names[g.user_id])}<b style="flex:1;text-align:right">${fm(g.money)}₫</b><button class=s onclick="AD.delGrant(${+g.id})" aria-label="Thu hồi">🗑</button></div><div class=mut>${doneG(g)?'✅ Đã nhận':'⏳ Chờ nhận'}${g.created_at?' · '+ago(g.created_at):''}${g.note?' · '+E(g.note):''}</div></div>`).join('')||EMPTY('Chưa có lệnh tặng tiền.')));

const adminsH=()=>`<div class=card><h3>Thêm quản trị viên</h3><div class=row style="margin:0"><input id=adnew placeholder="Dán User ID..." style="flex:1;width:auto;min-width:0"><button class=p onclick="AD.addAdmin(document.getElementById('adnew').value)">Thêm</button></div></div>`+(A.admins==null?LOAD:(A.admins.map(a=>`<div class=card><div class=row style="margin:0">${nameBtn(a.user_id,A.names[a.user_id])}${me()&&a.user_id==me().id?'<span class=tag>Bạn</span>':'<button class=s onclick="AD.delAdmin(\''+a.user_id+'\')">Gỡ</button>'}</div><div class=mut style="word-break:break-all">${E(a.user_id)}</div></div>`).join('')||EMPTY('Không có.')));

const viewH=()=>{const p=A.sel,me_=me()&&p.id===me().id;return `<div class=card><div class=row style="margin:0"><b>${nmOf(p)}</b>${p.ban?'<span class=tag style="background:#d9534f">Đã khóa</span>':''}${p.admin?'<span class=tag>Admin</span>':''}<button class=s onclick="AD.back()">← Quay lại</button></div><div class=mut>@${E(p.username||'—')}</div><div class=mut style="word-break:break-all">ID: ${E(p.id)}</div><div class=mut>${gs(p)}</div>${p.ban&&p.reason?'<div class=mut>Lý do khóa: '+E(p.reason)+'</div>':''}<div class=strip2 style="margin-top:8px"><button class=s onclick="AD.grant('${p.id}')">💰 Tặng tiền</button><button class=s onclick="AD.ban('${p.id}')">${p.ban?'🔓 Mở khóa':'🚫 Khóa tài khoản'}</button>${me_?'':`<button class=s onclick="${p.admin?`AD.delAdmin('${p.id}')`:`AD.addAdmin('${p.id}')`}">${p.admin?'Gỡ admin':'🛡 Cấp admin'}</button>`}</div></div><div class=card><h3>Bài đăng bảng tin</h3>${rowsH(A.posts,r=>r.caption||'(chỉ có ảnh)','AD.delPost')}</div><div class=card><h3>Bình luận</h3>${rowsH(A.cmts,r=>(r.body||'').replace(/^↩\d+\|/,'').replace(/\u27e6A:[^\u27e7]*\u27e7/g,' [đính kèm]'),'AD.delCmt')}</div><div class=card><h3>Ký tường đã gửi</h3>${rowsH(A.msgs,r=>r.message||'','AD.delMsg')}</div>`};

const rin=(id,val,ph,t)=>`<input id="${id}" ${t?'type='+t+' ':''}value="${E(val)}" placeholder="${ph}" style="width:100%;margin:2px 0">`;
const EFX=[['none','Màu đơn'],['gradient','Chuyển màu'],['shimmer','Chuyển màu động'],['holo','Holographic (cầu vồng)'],['glow','Phát sáng']];
const rsty=(k,it)=>`<div class=row style="margin:2px 0"><label class=mut>Màu 1 <input type=color id="${k}c" value="${E(it.color||'#99aab5')}" style="width:44px;height:30px;padding:0"></label><label class=mut>Màu 2 <input type=color id="${k}c2" value="${E(it.color2||it.color||'#99aab5')}" style="width:44px;height:30px;padding:0"></label></div><select id="${k}e" style="width:100%;margin:2px 0">${EFX.map(x=>`<option value="${x[0]}" ${(it.effect||'none')==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
const rolesH=()=>`<div class=card><h3>➕ Thêm role bán</h3>${A.groles?`<select id="rl-pick" onchange="AD.rolePick(this.value)" style="width:100%;margin:2px 0"><option value="">— Chọn role có sẵn trong server —</option>${A.groles.map(g=>{const sold=(A.roles||[]).some(x=>x.role_id==g.role_id),ok=g.assignable&&!sold;return `<option value="${E(g.role_id)}" ${ok?'':'disabled'}>${E(g.name)}${sold?' (đã bán)':g.assignable?'':' (bot chưa gắn được)'}</option>`}).join('')}</select><p class=mut style="font-size:.78rem;margin:0 0 4px">${!A.groles.length?'⚠️ Bot chưa đồng bộ role nào. Hãy chạy bản bot mới (kèm guild_roles.sql) và chờ log [guild_roles], rồi bấm ↻.':!A.groles.some(g=>g.assignable)?'⚠️ Bot chưa gắn được role nào: vào Cài đặt server, mục Vai trò, kéo role của bot lên cao hơn các role cần bán, rồi chờ vài phút và bấm ↻.':'Role mờ là role bot không gắn được (role của bot/tích hợp hoặc nằm cao hơn role của bot).'}</p>`:'<p class=mut style="font-size:.78rem">Chưa tải được danh sách role từ bot, hãy nhập ID thủ công.</p>'}${rin('rl-id','','ID role Discord (dãy số)')}${rin('rl-n','','Tên hiển thị')}${rin('rl-p','','Giá (tiền trong game)','number')}${rin('rl-d','','Mô tả (không bắt buộc)')}${rin('rl-s',0,'Thứ tự','number')}${rsty('rl-',{})}<button class=p style="width:100%;margin-top:6px" onclick="AD.roleAdd()">Thêm</button></div>`+(A.roles==null?LOAD:(A.roles.map(it=>{const k='rr'+it.role_id+'-',q=`'${E(it.role_id)}'`;return `<div class=card><div class=row style="margin:0">${window.ROLEFX?ROLEFX.pill(it):'<b>'+E(it.name)+'</b>'}<span class="${it.active?'ok':'mut'}">${it.active?'Đang bán':'Đã tắt'}</span></div><div class=mut style="font-size:.72rem">ID ${E(it.role_id)}</div>${A.groles&&!A.groles.some(g=>g.role_id==it.role_id)?'<div class=bad style="font-size:.78rem">⚠️ Role này không còn trên Discord, hãy tắt bán hoặc xóa.</div>':''}${rin(k+'n',it.name,'Tên')}${rin(k+'p',it.price,'Giá','number')}${rin(k+'d',it.description,'Mô tả')}${rin(k+'s',it.sort,'Thứ tự','number')}${rsty(k,it)}<div class=row><button class=p onclick="AD.roleSave(${q})">Lưu</button><button class=s onclick="AD.roleToggle(${q})">${it.active?'Tắt bán':'Bật bán'}</button><button class=s onclick="AD.roleDel(${q})">Xóa</button></div></div>`}).join('')||EMPTY('Chưa có role nào.')));
const VIEWS=[['home','📊 Tổng quan',homeH],['players','👥 Người chơi',playersH],['content','🧹 Nội dung',contentH],['banned','🚫 Đã khóa',bannedH],['grants','🎁 Quà tặng',grantsH],['roles','🛒 Shop roles',rolesH],['admins','🛡 Quản trị viên',adminsH]];
V.adm=()=>{
 if(!A.ok)return EMPTY('Bạn không có quyền quản trị.');
 if(A.need){A.need=0;setTimeout(()=>AD.go(A.v),0)}
 const cur=VIEWS.find(x=>x[0]==A.v)||VIEWS[0];
 return `<div class=card><div class=row style="margin:0"><h3 style="margin:0;flex:1">🛡 Quản trị</h3><button class=s onclick="AD.go(AD.cur())" aria-label="Làm mới">↻</button></div>${bar(VIEWS.map(x=>chip(A.v==x[0]&&!A.sel,x[1],`AD.go('${x[0]}')`)).join(''))}</div>${A.sel?viewH():cur[2]()}`};

window.AD={
 cur:()=>A.v,
 async go(v){A.v=v;A.sel=null;A.busy=1;redraw();
  try{
   if(v=='home')await this._stats();
   else if(v=='players')await this._players();
   else if(v=='content')await this._content();
   else if(v=='banned')await this._banned();
   else if(v=='grants')await this._grants();
   else if(v=='roles')await this._roles();
   else if(v=='admins')await this._admins();
  }catch(er){fail(er)}
  A.busy=0;redraw()},
 async _stats(){const s=sb(),since=new Date(Date.now()-864e5).toISOString();
  const c=(t,col,f)=>{let r=s.from(t).select(col,{count:'exact',head:true});if(f)r=f(r);return r.then(x=>x.error?'?':x.count)};
  const [pl,sv,act,bn,fp,fc,wm,gr,ad]=await Promise.all([c('profiles','id'),c('game_saves','user_id'),c('game_saves','user_id',r=>r.gte('updated_at',since)),c('banned_users','user_id'),c('feed_posts','id'),c('feed_comments','id'),c('wall_messages','id',r=>r.not('message','like','JSGIFT1:%')),c('admin_grants','user_id'),c('admins','user_id')]);
  A.stats={pl,sv,act,bn,fp,fc,wm,gr,ad}},
 find(q){const e=document.getElementById('adq');A.q=String(q==null?(e?e.value:A.q):q).trim();return this.go('players')},
 mode(m){A.mode=m;A.q='';return this.go('players')},
 async _players(){const s=sb(),q=A.q;let prof,gm={};
  if(!q&&A.mode!='recent'){
   const g=await s.from('game_saves').select('user_id,xp,day,money,updated_at').order(A.mode,{ascending:false}).limit(30);if(g.error)throw g.error;
   g.data.forEach(x=>gm[x.user_id]=x);const ids=g.data.map(x=>x.user_id);
   const p=ids.length?await s.from('profiles').select('id,username,display_name').in('id',ids):{data:[]};if(p.error)throw p.error;
   const pm={};p.data.forEach(x=>pm[x.id]=x);prof=ids.map(i=>pm[i]).filter(Boolean)}
  else{
   let r=s.from('profiles').select('id,username,display_name').order('updated_at',{ascending:false}).limit(30);
   if(q){if(/^[0-9a-f-]{36}$/i.test(q))r=r.eq('id',q);else{const t=q.replace(/[%,().*]/g,'');if(t)r=r.or(`username.ilike.*${t}*,display_name.ilike.*${t}*`)}}
   const x=await r;if(x.error)throw x.error;prof=x.data;const ids=prof.map(p=>p.id);
   if(ids.length){const g=await s.from('game_saves').select('user_id,xp,day,money,updated_at').in('user_id',ids);(g.data||[]).forEach(r=>gm[r.user_id]=r)}}
  const ids=prof.map(p=>p.id),b={};
  if(ids.length){const y=await s.from('banned_users').select('user_id').in('user_id',ids);(y.data||[]).forEach(r=>b[r.user_id]=1)}
  A.list=prof.map(p=>({...p,g:gm[p.id]||null,ban:!!b[p.id]}))},
 ctype(k){A.ct=k;A.content=null;return this.go('content')},
 async _content(){const s=sb(),k=A.ct;let r,uk='user_id';
  if(k=='posts')r=await s.from('feed_posts').select('id,caption,user_id,created_at').order('created_at',{ascending:false}).limit(30);
  else if(k=='cmts')r=await s.from('feed_comments').select('id,body,user_id,created_at').order('created_at',{ascending:false}).limit(30);
  else{uk='from_user';r=await s.from('wall_messages').select('id,message,from_user,created_at').not('message','like','JSGIFT1:%').order('created_at',{ascending:false}).limit(30)}
  if(r.error)throw r.error;A.names=await namesOf(r.data.map(x=>x[uk]));A.content=r.data.map(x=>({...x,uid:x[uk]}))},
 async _banned(){const r=await sb().from('banned_users').select('*');if(r.error)throw r.error;
  A.names=await namesOf(r.data.map(x=>x.user_id));A.banned=r.data.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))},
 async _grants(){let r=await sb().from('admin_grants').select('*').order('created_at',{ascending:false}).limit(50);
  if(r.error)r=await sb().from('admin_grants').select('*').limit(50);if(r.error)throw r.error;
  A.names=await namesOf(r.data.map(x=>x.user_id));A.grants=r.data},
 async _roles(){const r=await sb().from('shop_roles').select('*').order('sort');if(r.error)throw r.error;A.roles=r.data||[];const g=await sb().from('guild_roles').select('*').order('position',{ascending:false});A.groles=g.error?null:(g.data||[])},
 rolePick(id){const g=(A.groles||[]).find(x=>x.role_id==id);if(!g)return;const set=(i,v)=>{const e=document.getElementById(i);if(e&&v!=null)e.value=v};set('rl-id',g.role_id);set('rl-n',g.name);{const f=window.ROLEFX&&ROLEFX.dc?ROLEFX.dc(g):null;if(f){set('rl-c',f.color);set('rl-c2',f.color2);set('rl-e',f.effect)}else if(g.color){set('rl-c',g.color);set('rl-c2',g.color)}const ks=Object.keys(g);if(!ks.some(k=>/secondary|tertiary|colors|color2|style|holo/i.test(k)))toast('Bot chưa lưu màu phụ/phong cách vào guild_roles. Cột hiện có: '+ks.join(', '))}},
 _rf(pre){const g=i=>{const e=document.getElementById(pre+i);return e?e.value:''},name=g('n').trim().slice(0,60),price=Math.floor(Number(g('p'))),d=g('d').trim().slice(0,120),sort=Math.floor(Number(g('s')))||0;if(!name){toast('Nhập tên role');return null}if(!(price>0)){toast('Giá phải lớn hơn 0');return null}const hx=/^#[0-9a-fA-F]{6}$/,c=g('c')||'#99aab5',c2=g('c2')||c,e=g('e')||'none';if(!hx.test(c)||!hx.test(c2))return toast('Màu không hợp lệ'),null;return{name,price,description:d||null,sort,color:c,color2:c2,effect:e}},
 async _rdone(r,m){if(r.error)throw r.error;toast(m);try{if(window.ROLES)ROLES.stale()}catch(e){}await AD.go('roles')},
 async roleAdd(){const id=String((document.getElementById('rl-id')||{}).value||'').trim();if(!/^\d{5,25}$/.test(id))return toast('ID role không đúng (dãy số lấy từ Discord)');const f=this._rf('rl-');if(!f)return;try{await this._rdone(await sb().from('shop_roles').insert({role_id:id,...f,active:true}),'Đã thêm role')}catch(er){fail(er)}},
 async roleSave(id){const f=this._rf('rr'+id+'-');if(!f)return;try{await this._rdone(await sb().from('shop_roles').update(f).eq('role_id',id),'Đã lưu role')}catch(er){fail(er)}},
 async roleToggle(id){const it=(A.roles||[]).find(x=>x.role_id==id);if(!it)return;try{await this._rdone(await sb().from('shop_roles').update({active:!it.active}).eq('role_id',id),it.active?'Đã tắt bán':'Đã bật bán')}catch(er){fail(er)}},
 async roleDel(id){if(!confirm('Xóa role này khỏi cửa hàng? Nếu đã có người mua thì hãy chọn Tắt bán.'))return;try{const r=await sb().from('shop_roles').delete().eq('role_id',id);if(r.error&&/foreign key|violates/i.test(r.error.message))return toast('Role đã có người mua, hãy chọn Tắt bán thay vì xóa');await this._rdone(r,'Đã xóa role')}catch(er){fail(er)}},
 async _admins(){const r=await sb().from('admins').select('*');if(r.error)throw r.error;
  A.names=await namesOf(r.data.map(x=>x.user_id));A.admins=r.data},
 async open(id){
  try{let p=(A.list||[]).find(x=>x.id==id);
   if(!p){const [a,g]=await Promise.all([sb().from('profiles').select('id,username,display_name').eq('id',id).maybeSingle(),sb().from('game_saves').select('user_id,xp,day,money,updated_at').eq('user_id',id).maybeSingle()]);
    p={...(a.data||{id,display_name:'Người chơi'}),g:g.data||null}}
   A.sel=p;A.posts=A.cmts=A.msgs=null;redraw();
   const s=sb(),[a,c,m,bn,ad]=await Promise.all([
    s.from('feed_posts').select('id,caption,created_at').eq('user_id',id).order('created_at',{ascending:false}).limit(20),
    s.from('feed_comments').select('id,body,created_at').eq('user_id',id).order('created_at',{ascending:false}).limit(20),
    s.from('wall_messages').select('id,message,created_at').eq('from_user',id).not('message','like','JSGIFT1:%').order('created_at',{ascending:false}).limit(20),
    s.from('banned_users').select('reason').eq('user_id',id).maybeSingle(),
    s.from('admins').select('user_id').eq('user_id',id).maybeSingle()]);
   if(!A.sel||A.sel.id!=id)return;
   A.posts=a.data||[];A.cmts=c.data||[];A.msgs=m.data||[];A.sel.ban=!!bn.data;A.sel.reason=bn.data&&bn.data.reason;A.sel.admin=!!ad.data}
  catch(er){A.posts=A.posts||[];A.cmts=A.cmts||[];A.msgs=A.msgs||[];fail(er)}
  redraw()},
 back(){A.sel=null;redraw()},
 async del(tb,id,label){
  if(!confirm('Xóa '+label+' này? Không hoàn tác được.'))return;
  try{const r=await sb().from(tb).delete().eq('id',id).select('id');if(r.error)throw r.error;
   if(!r.data||!r.data.length)return toast('Không xóa được, hãy kiểm tra đã chạy file SQL quản trị');
   toast('Đã xóa');if(A.sel)AD.open(A.sel.id);else AD.go(A.v)}catch(er){fail(er)}},
 delPost(id){AD.del('feed_posts',id,'bài đăng')},
 delCmt(id){AD.del('feed_comments',id,'bình luận')},
 delMsg(id){AD.del('wall_messages',id,'ký tường')},
 delGrant(id){AD.del('admin_grants',id,'lệnh tặng tiền (nếu người chơi chưa nhận sẽ không còn nhận được)')},
 async grant(id){
  const v=Math.floor(Number(String(prompt('Số tiền tặng (tối đa 100000000):','100000')||'').replace(/[^0-9]/g,'')));
  if(!v||v<1||v>1e8)return toast('Số tiền không hợp lệ');
  const note=String(prompt('Lời nhắn (có thể bỏ trống):','')||'').slice(0,100);
  try{const r=await sb().from('admin_grants').insert({user_id:id,money:v,note});if(r.error)throw r.error;toast('Đã tạo lệnh tặng '+fm(v)+'₫, người chơi nhận khi mở game')}catch(er){fail(er)}},
 async grantAll(){
  const v=Math.floor(Number(String(prompt('Tặng cho TẤT CẢ người chơi. Số tiền mỗi người (tối đa 10000000):','10000')||'').replace(/[^0-9]/g,'')));
  if(!v||v<1||v>1e7)return toast('Số tiền không hợp lệ');
  const note=String(prompt('Lời nhắn (có thể bỏ trống):','')||'').slice(0,100);
  try{const p=await sb().from('profiles').select('id').limit(5000);if(p.error)throw p.error;
   if(!confirm('Tặng '+fm(v)+'₫ cho '+fm(p.data.length)+' người chơi?'))return;
   for(let i=0;i<p.data.length;i+=200){const r=await sb().from('admin_grants').insert(p.data.slice(i,i+200).map(x=>({user_id:x.id,money:v,note})));if(r.error)throw r.error}
   toast('Đã tạo lệnh tặng cho '+fm(p.data.length)+' người');AD.go('grants')}catch(er){fail(er)}},
 async ban(id){
  const p=A.sel;if(!p)return;
  if(me()&&id===me().id)return toast('Không thể tự khóa chính mình');
  try{if(p.ban){const r=await sb().from('banned_users').delete().eq('user_id',id);if(r.error)throw r.error;p.ban=false;p.reason=null;toast('Đã mở khóa')}
   else{const rs=prompt('Lý do khóa (người chơi sẽ thấy):','Vi phạm quy định');if(rs===null)return;const r=await sb().from('banned_users').insert({user_id:id,reason:String(rs).slice(0,120)});if(r.error)throw r.error;p.ban=true;p.reason=String(rs).slice(0,120);toast('Đã khóa tài khoản')}
   if(A.list){const x=A.list.find(q=>q.id==id);if(x)x.ban=p.ban}
   redraw()}catch(er){fail(er)}},
 async unban(id){if(!confirm('Mở khóa tài khoản này?'))return;
  try{const r=await sb().from('banned_users').delete().eq('user_id',id);if(r.error)throw r.error;toast('Đã mở khóa');AD.go('banned')}catch(er){fail(er)}},
 async addAdmin(id){id=String(id||'').trim();
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))return toast('User ID không hợp lệ');
  if(!confirm('Cấp quyền quản trị cho tài khoản này?'))return;
  try{const r=await sb().from('admins').insert({user_id:id});if(r.error)throw r.error;toast('Đã cấp quyền admin');if(A.sel&&A.sel.id==id){A.sel.admin=true;redraw()}else AD.go('admins')}catch(er){fail(er)}},
 async delAdmin(id){
  if(me()&&id===me().id)return toast('Không thể tự gỡ quyền của chính mình');
  if(!confirm('Gỡ quyền quản trị của tài khoản này?'))return;
  try{const r=await sb().from('admins').delete().eq('user_id',id).select('user_id');if(r.error)throw r.error;
   if(!r.data||!r.data.length)return toast('Không gỡ được, hãy kiểm tra file SQL quản trị');
   toast('Đã gỡ quyền admin');if(A.sel&&A.sel.id==id){A.sel.admin=false;redraw()}else AD.go('admins')}catch(er){fail(er)}}
};
})();

(function(){

   const j=sub.toJSON(),q=await supabaseClient.from('push_subs').upsert({user_id:currentUser.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:navigator.userAgent.slice(0,120)},{onConflict:'endpoint'});
   if(q&&q.error)throw q.error;PUSHOK=1;return true}catch(e){window.__pe=String((e&&(e.name||e.code))||'')+' '+String((e&&e.message)||e);return false}}
 async function enable(){if(!sup()){toast('Trình duyệt chưa hỗ trợ thông báo. Trên iPhone hãy thêm game vào Màn hình chính trước');return false}

 async function disable(){try{localStorage.setItem(LS,'0')}catch(e){}PUSHOK=0;
  try{const r=await reg(),sub=r&&r.pushManager&&await r.pushManager.getSubscription();if(sub){const ep=sub.endpoint;await sub.unsubscribe();try{await supabaseClient.from('push_subs').delete().eq('endpoint',ep)}catch(e){}}}catch(e){}
  try{if(typeof currentUser!='undefined'&&currentUser)await supabaseClient.from('push_jobs').delete().eq('user_id',currentUser.id).like('ref','ws-%')}catch(e){}
  toast('Đã tắt thông báo')}
 /* hẹn giờ push khi workshop xong (máy chủ gửi, kể cả khi đã đóng game) */
 let ST=0;const sync=()=>{clearTimeout(ST);ST=setTimeout(doSync,1500)};
 async function doSync(){if(!PUSHOK||typeof s=='undefined'||!s||typeof currentUser=='undefined'||!currentUser)return;
  try{const by={};(s.wq||[]).forEach(j=>{const b=by[j.t]=by[j.t]||{n:0,en:0,nm:''};b.n++;if(j.en>=b.en){b.en=j.en;b.nm=(j.it&&j.it.n)||''}});
   const keys=Object.keys(by),rows=keys.map(t=>({user_id:currentUser.id,ref:'ws-'+t,fire_at:new Date(by[t].en).toISOString(),title:'🎓 Workshop xong rồi',body:by[t].n>1?by[t].n+' món đã hoàn thành, vào nhận nào':'“'+by[t].nm+'” đã hoàn thành',sent:false}));
   if(rows.length)await supabaseClient.from('push_jobs').upsert(rows,{onConflict:'user_id,ref'});
   let q=supabaseClient.from('push_jobs').delete().eq('user_id',currentUser.id).like('ref','ws-%');if(keys.length)q=q.not('ref','in','('+keys.map(t=>'ws-'+t).join(',')+')');await q}catch(e){}}
 /* thông báo trong game -> thông báo hệ thống khi game ở nền */
 const SEEN=new Set();let init=0;const key=n=>n.type+'|'+n.id+'|'+n.time;

  if(!init){s.notifs.forEach(n=>SEEN.add(key(n)));init=1;return}

 setTimeout(async()=>{if(!on())return;if(!(await subscribe())){}else sync()},4000);

<script>
/* ===== v59: Gemini cho đàm phán + đánh giá (có giới hạn quota) ===== */
(function(){
/* ---- CẤU HÌNH: mỗi người chơi tự nhập khóa Gemini của mình ở Cài đặt > AI Gemini. Khóa chỉ lưu trên thiết bị (localStorage), không nằm trong mã lưu/QR. ---- */
const CFG={
 model:'gemini-2.5-flash',
 dayMax:150,          /* số lần gọi tối đa mỗi ngày trên thiết bị này (bảo vệ quota khóa của chính người chơi) */
 gapMs:4500,          /* khoảng cách tối thiểu giữa 2 lần gọi */
 negRate:.5,          /* tỉ lệ khách mặc cả được Gemini viết lời thoại */
 rvRate:{5:.15,4:.15,3:.3,2:.5,1:.6} /* tỉ lệ khách chịu viết đánh giá, theo số sao; khách không viết vẫn tính vào uy tín */
};
const LSK='jsGemKey',LSO='jsGemOn',LSA='jsGemAcc',LSM='jsGemModel',LSAOFF='jsGemAccOff';
const lget=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},lset=(k,v)=>{try{v==null||v===''?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const LSP='jsGemKeys',MAXK=10;
/* nhiều khóa: lưu dạng danh sách [{k,n,d,cd,bad}] (n/d = số lượt hôm nay, cd = nghỉ tới lúc, bad = khóa bị Google từ chối); dùng lần lượt từ trên xuống */
const pget=()=>{try{const j=JSON.parse(lget(LSP)||'[]');return Array.isArray(j)?j.filter(x=>x&&typeof x.k=='string'&&x.k):[]}catch(e){return[]}};
const pset=a=>{try{a&&a.length?localStorage.setItem(LSP,JSON.stringify(a)):localStorage.removeItem(LSP)}catch(e){}};
const pool=()=>{let a=pget();if(!a.length&&lget(LSP)===''){const o=lget(LSK);if(o){a=[{k:o}];pset(a);lset(LSK,'')}}return a};
const keysOf=a=>a.map(e=>e.k);
const isOn=()=>lget(LSO)=='1'&&pool().length>0,model=()=>lget(LSM)||CFG.model;
const usable=e=>!e.bad&&Date.now()>(e.cd||0)&&(e.d!=day()||(e.n||0)<CFG.dayMax);
const cur=()=>pool().find(usable);
/* xoay vòng: mỗi lần gọi lấy khóa kế tiếp còn dùng được (bỏ qua khóa nghỉ/lỗi/hết lượt ngày); 1 khóa thì như cũ */
let rr=0;
const nextKey=()=>{const a=pool(),n=a.length;for(let i=0;i<n;i++){const j=(rr+i)%n;if(usable(a[j])){rr=(j+1)%n;return a[j]}}return null};
/* nhiều khóa thì giãn cách ngắn hơn (mỗi khóa vẫn cách nhau >= gapMs khi có <=3 khóa), tối thiểu 1200ms */
const gapNow=()=>{const n=pool().filter(usable).length;return n>1?Math.max(1200,Math.round(CFG.gapMs/n)):CFG.gapMs};
const mut=(k,f)=>{const a=pool(),e=a.find(x=>x.k==k);if(e){f(e);pset(a)}};

/* ---- tiện ích ---- */
const E=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cl=(x,n)=>String(x==null?'':x).replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,n||160);
const pb=x=>Math.max(.05,Math.min(.95,x));
const day=()=>new Date().toLocaleDateString('en-CA'),QK='jsGemQ';
const qget=()=>({d:day(),n:pool().reduce((t,e)=>t+(e.d==day()?(e.n||0):0),0)});
let coolUntil=0,fails=0,last=0,chain=Promise.resolve(),pend=0;
const ready=()=>isOn()&&Date.now()>coolUntil&&!!cur();
const bad=()=>{if(++fails>=3){coolUntil=Date.now()+3e5;fails=0}};

/* ---- kiểm tra khóa: gọi thẳng (không qua hàng đợi), phân biệt sai khóa / hết hạn mức / lỗi mạng / model không có; tự thử model dự phòng ---- */
const MODELS=['gemini-2.5-flash','gemini-flash-latest','gemini-2.5-flash-lite'];
async function probe(k){
 let last={s:'other'};
 for(const m of [model()].concat(MODELS.filter(x=>x!==model()))){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
  try{
   const gc={maxOutputTokens:20};if(/2\.5/.test(m))gc.thinkingConfig={thinkingBudget:0};
   const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({contents:[{parts:[{text:'Say OK'}]}],generationConfig:gc}),signal:ac.signal});
   if(r.ok){lset(LSM,m==CFG.model?'':m);return{s:'ok',m}}
   let msg='';try{const j=await r.json();msg=String((j&&j.error&&j.error.message)||'')}catch(e){}
   console.warn('[gemini] kiểm tra khóa',m,r.status,msg);
   if(r.status==429)return{s:'quota',st:429,msg};
   if(r.status==401||r.status==403||(r.status==400&&/api.?key/i.test(msg)))return{s:'invalid',st:r.status,msg};
   last={s:'other',st:r.status,msg}
  }catch(e){return{s:'net',msg:String(e&&e.message||e)}}
  finally{clearTimeout(tm)}
 }
 return last}

/* ---- gọi Gemini: xếp hàng, giãn cách, giới hạn ngày, tự nghỉ khi lỗi/429, hết giờ thì bỏ ---- */
function call(prompt,max){
 if(!ready()||pend>=4)return Promise.resolve(null);
 pend++;
 const run=async()=>{try{
  for(let t=0;t<12;t++){
   if(!ready())return null;
   const w=last+gapNow()-Date.now();if(w>0)await new Promise(r=>setTimeout(r,w));
   const ke=nextKey();if(!ke)return null;const k=ke.k;
   last=Date.now();mut(k,x=>{if(x.d!=day()){x.d=day();x.n=0}x.n=(x.n||0)+1});
   const gc={temperature:1,maxOutputTokens:max||400,responseMimeType:'application/json'};
   if(/2\.5/.test(model()))gc.thinkingConfig={thinkingBudget:0};
   const body={contents:[{parts:[{text:prompt}]}],generationConfig:gc},ac=new AbortController(),tm=setTimeout(()=>ac.abort(),9000);
   let r;
   try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model())+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify(body),signal:ac.signal})}
   finally{clearTimeout(tm)}
   if(!r.ok){
    let msg='';try{msg=String(((await r.json()).error||{}).message||'')}catch(x){}
    /* hết hạn mức: cho khóa này nghỉ rồi thử ngay khóa kế tiếp */
    if(r.status==429){const dl=/PerDay|per day|daily/i.test(msg);mut(k,x=>{x.cd=Date.now()+(dl?72e5:6e5)});last=0;continue}
    /* khóa bị từ chối: đánh dấu lỗi rồi thử khóa kế tiếp */
    if(r.status==401||r.status==403||(r.status==400&&/api.?key/i.test(msg))){mut(k,x=>{x.bad=1});last=0;continue}
    console.warn('[gemini] HTTP',r.status,msg);bad();return null}
   const j=await r.json(),p=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
   const tx=(p||[]).map(x=>x.text||'').join('');fails=0;
   return JSON.parse(tx.replace(/```json|```/g,'').trim())
  }
  return null
 }catch(e){bad();return null}finally{pend--}};
 const p=chain.then(run);chain=p.then(()=>{},()=>{});return p}

const lang=()=>(typeof s!='undefined'&&s&&s.lang=='en')?' Write in English.':' Viết bằng tiếng Việt.';
const wxT=()=>{const w=typeof s!='undefined'&&s&&s.wx;return w=='rain'?'trời mưa':w=='sun'?'trời nắng':'thời tiết bình thường'};

/* ================= ĐÀM PHÁN ================= */
const SIT=['sắp đi họp phụ huynh','tặng cô giáo','xin lỗi người yêu vì quên kỷ niệm','mua đặt góc làm việc','đi thăm bạn đang ốm','mừng bạn mới khai trương','chụp ảnh kỷ yếu','chuẩn bị tỏ tình','mua cho sếp mới','đang cạn ngân sách cuối tháng','mua mừng sinh nhật bà','khách du lịch ghé ngang','khách quen lâu năm','đang vội bắt xe','hay so giá với shop bên cạnh','thích mặc cả cho vui','mua giúp đồng nghiệp','dự đám cưới bạn thân'];
const STY=['nhẹ nhàng lịch sự','hài hước','hơi nài nỉ','tự tin thẳng thắn','ngại ngùng','kiểu Gen Z','giọng người lớn tuổi','giọng miền Nam','giọng miền Bắc'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fill=(c,t,html)=>{t=cl(t,200);if(html)return E(t).replace(/\{p\}/g,'<b>'+$(c.offer)+'</b>');return t.replace(/\{p\}/g,$(c.offer))};
const hasP=t=>typeof t=='string'&&/\{p\}/.test(t);
const monOn=()=>typeof monA=='function'&&monA();

function gemNeg(c){
 if(!c||c.hd||c.big||monOn()||Math.random()>=CFG.negRate||!ready())return;
 const L0=live;c.line='<span class=mut>…</span>';
 const prompt='Bạn viết lời thoại cho một khách mặc cả trong game shop hoa Việt Nam.\n'
  +'Khách tên '+cl(c.nm||'Khách',30)+(c.vip?' (khách VIP sang trọng)':'')+'. Muốn mua bó '+cl(nm(c.f),40)+' size '+cl(c.z,10)+'. Giá niêm yết '+c.pr+'đ, khách muốn trả '+c.offer+'đ. '+wxT()+'.\n'
  +'Tình huống: '+pick(SIT)+'. Phong cách nói: '+pick(STY)+'.\n'
  +'Trả về JSON đúng dạng {"open":"","mid":"","firm":"","bye":"","mood":""}:\n'

  +'- mid: câu khi shop đưa giá giữa nhưng khách vẫn đòi bớt thêm, phải chứa {p}.\n'
  +'- firm: câu khi khách khăng khăng giữ giá, phải chứa {p}.\n'
  +'- bye: câu khi khách bỏ đi vì không hợp giá, không chứa {p}.\n'
  +'- mood: soft (dễ tính), normal, hoặc hard (khó tính), hợp với tính cách trong lời thoại.\n'
  +'Mỗi câu tối đa 22 từ, đời thường, tối đa 1 emoji, không dùng ký tự < >.'+lang();
 call(prompt,450).then(j=>{
  if(L0!==live||!live.cs.includes(c))return;
  if(j&&hasP(j.open)){c.g={open:j.open,mid:hasP(j.mid)?j.mid:'',firm:hasP(j.firm)?j.firm:'',bye:cl(j.bye,100),mood:/^(soft|hard)$/.test(j.mood)?j.mood:'normal'};c.line=fill(c,j.open,1)}
  else c.line=null;
  if(typeof RE=='undefined'||RE==null)R()}).catch(()=>{c.line=null})}

{const o=spawn;spawn=function(){const n=live.cs.length;o.apply(this,arguments);try{live.cs.slice(n).forEach(gemNeg)}catch(e){}}}

/* hg: giữ nguyên luật cũ, thêm tính cách (mood) và lời thoại từ Gemini nếu có */
let WHY=0;
hg=function(id,a){const c=live.cs.find(x=>x.id==id);if(!c)return;const g=c.g||{},md=g.mood=='soft'?.15:g.mood=='hard'?-.2:0;
 if(a=='ok'){c.pr=c.offer;c.hd=1}
 else if(a=='gift'){if(Math.random()<pb(.8+md/2)){c.ask=1;c.hd=1;toast('Khách vui vẻ nhận quà thay vì giảm giá')}else{c.say=g.firm?fill(c,g.firm,0):'Không, mình vẫn muốn giá '+$(c.offer)+' cơ.';c.firm=1;R();return}}
 else{const mid=Math.max(cost(c.f,c.z),Math.round((c.pr+c.offer)/2000)*1000);
  if(!c.firm&&Math.random()<pb((a=='mid'?.7:.5)+md)){if(a=='mid')c.pr=mid;c.hd=1;toast('Khách chấp nhận')}
  else if(!c.rd&&!c.firm&&a=='mid'&&Math.random()<.5){c.rd=1;c.offer=Math.max(cost(c.f,c.z),Math.round((mid+c.offer)/2000)*1000);c.say=g.mid?fill(c,g.mid,0):'Hmm, thêm chút nữa nhé: '+$(c.offer)+' thôi!';R();return}
  else{WHY=1;review(2,c.look);WHY=0;live.lost++;rm(id);toast(g.bye?'Khách bỏ đi: “'+g.bye+'”':'Khách bỏ đi vì không hợp giá');R();return}}

<script>

}

 node.classList.remove('dn','intro','done','sleeve','outro','empty');

 void node.offsetWidth;
 if(c){c.style.animation='';c.style.transform=''}

 else if((MS.rst|0)!==rst){

(()=>{
let holdT=0,drag=null,moved=0,sx=0,sy=0,pid=0;
const E=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thOf=t=>t&&(t.th||t.img||(t.id?('https://i.ytimg.com/vi/'+t.id+'/mqdefault.jpg'):''));
function rowIndex(row){
  const box=row.parentElement;if(!box)return -1;
  return [...box.querySelectorAll('.mtr.qpl')].indexOf(row);
}
function clearHot(){document.querySelectorAll('.ttslot.dq-hot').forEach(el=>el.classList.remove('dq-hot'))}
function hitSlot(x,y){
  const slot=document.querySelector('.ttslot');
  if(!slot)return null;
  const r=slot.getBoundingClientRect();
  /* vùng nhận rộng hơn một chút cho dễ thả trên mobile */
  const pad=18;
  if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad)return slot;
  return null;
}
function ghostAt(x,y){
  if(!drag||!drag.g)return;
  drag.g.style.left=x+'px';drag.g.style.top=y+'px';
}
function endDrag(play){
  clearTimeout(holdT);holdT=0;
  const d=drag;drag=null;moved=0;pid=0;
  document.body.classList.remove('dq-on');
  clearHot();
  document.querySelectorAll('.mtr.qpl.dq-src').forEach(el=>el.classList.remove('dq-src'));
  if(d&&d.g)try{d.g.remove()}catch(e){}
  if(play&&d&&typeof MS!=='undefined'&&MS.q&&MS.q[d.i]&&MS.q[d.i].id===d.id){
    try{
      if(typeof MU!=='undefined'&&MU.jump)MU.jump(d.i);
      else{
        const t=MS.q.splice(d.i,1)[0];
        if(t){if(MS.now){MS.hist.push(MS.now);if(MS.hist.length>30)MS.hist.shift()}go(t)}
      }
      try{window.TT&&TT.hardIntro&&TT.hardIntro(MS.now)}catch(e){}
      try{toast('Đã đặt đĩa: '+(d.name||'bài hát'))}catch(e){}
    }catch(e){try{toast('Không phát được bài này')}catch(x){}}
  }
  /* chặn click jump ngay sau khi kéo */
  if(d){window.__dqBlock=Date.now()}
}
function startDrag(row,i,t,x,y){
  if(drag)return;
  if(typeof MS==='undefined'||MS.qv==='f')return;
  if(!t||!MS.q||!MS.q[i]||MS.q[i].id!==t.id)return;
  drag={i,id:t.id,name:t.name||'',g:null};
  moved=1;
  document.body.classList.add('dq-on');
  row.classList.add('dq-src');
  const g=document.createElement('div');
  g.id='dqGhost';
  const src=thOf(t);
  g.innerHTML='<div class="dqd">'+(src?'<img src="'+E(src)+'" alt="">':'')+'</div><div class="dql">'+E(t.name||'Bài hát')+'</div>';
  document.body.appendChild(g);
  drag.g=g;
  ghostAt(x,y);
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
}
function onDown(e){
  if(e.button!=null&&e.button!==0)return;
  const row=e.target.closest&&e.target.closest('#mq .mtr.qpl');
  if(!row)return;
  if(e.target.closest('button,.mbt,a,input'))return;
  if(typeof MS==='undefined'||MS.qv==='f'||!MS.qo)return;
  const i=rowIndex(row);if(i<0||!MS.q[i])return;
  const t=MS.q[i];
  const pt=e.touches&&e.touches[0]?e.touches[0]:e;
  sx=pt.clientX;sy=pt.clientY;pid=e.pointerId||1;moved=0;
  clearTimeout(holdT);
  holdT=setTimeout(()=>startDrag(row,i,t,sx,sy),380);
  try{if(e.target.setPointerCapture&&e.pointerId!=null)e.target.setPointerCapture(e.pointerId)}catch(x){}
}
function onMove(e){
  const pt=e.touches&&e.touches[0]?e.touches[0]:e;
  if(holdT&&!drag){
    if(Math.abs(pt.clientX-sx)>12||Math.abs(pt.clientY-sy)>12){clearTimeout(holdT);holdT=0}
    return;
  }
  if(!drag)return;
  if(e.cancelable)e.preventDefault();
  ghostAt(pt.clientX,pt.clientY);
  clearHot();
  const slot=hitSlot(pt.clientX,pt.clientY);
  if(slot)slot.classList.add('dq-hot');
}
function onUp(e){
  const pt=(e.changedTouches&&e.changedTouches[0])||e;
  clearTimeout(holdT);holdT=0;
  if(!drag)return;
  if(e.cancelable)e.preventDefault();
  const slot=hitSlot(pt.clientX||sx,pt.clientY||sy);
  endDrag(!!slot);
}
function onClickCapture(e){
  if(window.__dqBlock&&Date.now()-window.__dqBlock<500){
    const row=e.target.closest&&e.target.closest('#mq .mtr.qpl');
    if(row){e.stopPropagation();e.preventDefault()}
  }
}
document.addEventListener('pointerdown',onDown,true);
document.addEventListener('pointermove',onMove,{capture:true,passive:false});
document.addEventListener('pointerup',onUp,true);
document.addEventListener('pointercancel',onUp,true);
document.addEventListener('touchmove',onMove,{capture:true,passive:false});
document.addEventListener('click',onClickCapture,true);
/* chặn jump qua onclick inline nếu vừa kéo */
const _jump=()=>{try{return window.MU&&MU.jump}catch(e){return null}};
const patch=()=>{
  try{
    if(!window.MU||MU._dqJump)return;
    const orig=MU.jump;
    if(typeof orig!=='function')return;
    MU.jump=function(i){
      if(window.__dqBlock&&Date.now()-window.__dqBlock<500)return;
      return orig.apply(this,arguments);
    };
    MU._dqJump=1;
  }catch(e){}
};
setInterval(patch,1000);patch();
})();
</script>


<script>
/* ===== v61: TIỆM VÀNG KIM NGÂN trong ngăn Cộng đồng =====
   - Bảng giá: giavang.now (miễn phí, có CORS), quy đổi 50đ thật = 1đ game
   - Chủ tiệm do Gemini điều hành (tư vấn, mặc cả có giới hạn, bản tin/ưu đãi mỗi ngày, vẽ mẫu)
   - Gia công theo yêu cầu: mô tả + ảnh mẫu -> Gemini vẽ ảnh vật phẩm theo style icon của game -> báo giá -> đặt cọc -> nhận hàng
   - Người chơi là KHÁCH: mua, đặt làm, bán lại. Mọi số tiền do code tính, AI chỉ nói chuyện và vẽ. */
(function(){
'use strict';
const SC=1,CHI=10; /* giá game = giá thật */
const E=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cl=(x,n)=>String(x==null?'':x).replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,n||200);
const lg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},ls=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rn=(v,u)=>{u=u||100;return Math.round(v/u)*u};
const fw2=w=>(Math.round(w*100)/100).toString().replace('.',',')+' chỉ';
const tr=v=>(v/1e6).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tr';
const X=()=>window.GEM&&window.GEM.X;
const aiOn=()=>{try{return !!(X()&&X().on())}catch(e){return false}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- trạng thái lưu cùng bản lưu của game ---------- */
const G0=()=>{if(!s.gd||typeof s.gd!='object')s.gd={};const g=s.gd;g.items=g.items||[];g.orders=g.orders||[];g.chat=g.chat||[];g.spent=g.spent||0;g.n=g.n||0;return g};
/* ---------- trạng thái giao diện (không lưu) ---------- */
const GD={t:'price',hs:'SJL1L10',hd:7,busy:'',msg:'',cf:'',f:{type:'ring',k:18,tone:'y',w:1,gem:'none',desc:''},ref:null,rv:{},inp:'',hl:'',hb:0};

/* ================= GIÁ VÀNG (giavang.now) ================= */
const NAMES={SJL1L10:'SJC 9999 (miếng)',SJ9999:'Nhẫn SJC trơn',PQHN24NTT:'PNJ 24K',PQHNVM:'PNJ Hà Nội',DOHNL:'DOJI Hà Nội',DOHCML:'DOJI HCM',DOJINHTV:'DOJI nữ trang',BT9999NTT:'Bảo Tín 9999',BTSJC:'Bảo Tín SJC',XAUUSD:'Vàng thế giới'};
const SHOWN=['SJL1L10','SJ9999','PQHN24NTT','DOHNL','DOJINHTV','BT9999NTT','XAUUSD'];
const DEF={SJL1L10:[150e6,152e6],SJ9999:[149.5e6,152e6],PQHN24NTT:[148e6,151e6],DOHNL:[149.5e6,152e6],DOJINHTV:[147e6,152e6],BT9999NTT:[149.5e6,152e6],XAUUSD:[4200,4202]};
const PR={d:{},t:0,live:0,loading:0,err:'',tryAt:0,H:{}};
try{const j=JSON.parse(lg('jsGoldP')||'null');if(j&&j.d){PR.d=j.d;PR.t=0;PR.saved=j.t||0}}catch(e){}
const gq=c=>PR.d[c]||{buy:DEF[c][0],sell:DEF[c][1],cb:0,cs:0,t:0,def:1};
const ui=()=>{try{const b=document.querySelector('#sdtabs button.on');if(!b||!/'gold'/.test(b.getAttribute('onclick')||''))return;const ae=document.activeElement,bd=document.getElementById('sdbody');if(ae&&bd&&bd.contains(ae)&&/INPUT|TEXTAREA/.test(ae.tagName))return;SD.open('gold')}catch(e){}};
function extract(j){const out={};const walk=(v,key,dp)=>{if(!v||typeof v!='object'||dp>5)return;
 if(!Array.isArray(v)&&(v.buy!=null||v.sell!=null)){const c=v.type_code||v.code||v.type||key;if(c&&typeof c=='string')out[c]=v;return}
 if(Array.isArray(v))v.forEach(x=>walk(x,x&&(x.type_code||x.code||x.type),dp+1));else Object.keys(v).forEach(k=>walk(v[k],k,dp+1))};walk(j,'',0);return out}
function norm(x,c){let b=+x.buy,sl=+x.sell,cb=+x.change_buy||0,cs=+x.change_sell||0;if(!(b>0)&&!(sl>0))return null;if(!(b>0))b=sl;if(!(sl>0))sl=b;
 if(c!='XAUUSD'){const f=Math.max(b,sl)<5e6?1000:1;b*=f;sl*=f;cb*=f;cs*=f}
 return{buy:b,sell:sl,cb,cs,t:+x.update_time||0}}
async function loadP(force){
 if(PR.loading)return;if(!force&&PR.live&&Date.now()-PR.t<3e5)return;
 PR.loading=1;PR.tryAt=Date.now();ui();
 try{
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
  const r=await fetch('https://giavang.now/api/prices',{signal:ac.signal,cache:'no-store'});clearTimeout(tm);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json(),ex=extract(j);let n=0;
  Object.keys(ex).forEach(c=>{const v=norm(ex[c],c);if(v){PR.d[c]=v;n++}});
  if(!n)throw new Error('Không đọc được giá. Phản hồi: '+cl(JSON.stringify(j),90));
  PR.live=1;PR.t=Date.now();PR.err='';ls('jsGoldP',JSON.stringify({t:Date.now(),d:PR.d}));snap()
 }catch(e){PR.live=0;PR.err=cl(e&&e.message||e,80)||'Lỗi mạng'}
 PR.loading=0;ui()}
function snap(){try{const a=JSON.parse(lg('jsGoldS')||'[]'),c=PR.d[GD.hs];if(!c)return;const last=a[a.length-1];if(!last||Date.now()-last.t>6e5)a.push({c:GD.hs,t:Date.now(),v:c.sell});ls('jsGoldS',JSON.stringify(a.slice(-120)))}catch(e){}}
async function loadH(code,days){
 const k=code+'|'+days,h=PR.H[k];if(h&&(h.loading||Date.now()-h.t<6e5))return;
 PR.H[k]={loading:1,t:Date.now(),pts:h?h.pts:null};
 try{
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
  const r=await fetch('https://giavang.now/api/prices?type='+encodeURIComponent(code)+'&days='+days,{signal:ac.signal});clearTimeout(tm);
  const j=await r.json();let arr=Array.isArray(j)?j:(j&&(j.data||j.history||j.prices))||[];
  if(arr&&!Array.isArray(arr)&&Array.isArray(arr.history))arr=arr.history;
  const pts=(arr||[]).map(x=>{let t=+x.update_time||+x.time||+x.timestamp||Date.parse(x.date||x.created_at||'')/1e3;if(t>1e12)t/=1e3;const f=code=='XAUUSD'?1:(Math.max(+x.buy||0,+x.sell||0)<5e6?1000:1);return{t,v:(+x.sell||+x.buy)*f}}).filter(p=>p.t>0&&p.v>0).sort((a,b)=>a.t-b.t);
  PR.H[k]={loading:0,t:Date.now(),pts:pts.length>=2?pts:null}
 }catch(e){PR.H[k]={loading:0,t:Date.now(),pts:null}}
 ui()}
/* giá tham chiếu cho tiệm: đơn vị đồng GAME trên 1 chỉ vàng 24K */
const chiG=v=>v/CHI/SC;
function ref(kind){const code=kind=='bar'?'SJL1L10':kind=='ring'?'SJ9999':(PR.d.PQHN24NTT?'PQHN24NTT':PR.d.DOJINHTV?'DOJINHTV':'SJ9999'),q=gq(code);return{buy:chiG(q.buy),sell:chiG(q.sell),code}}

/* ================= BẢNG GIÁ CỦA TIỆM ================= */
const RATIO={24:1,18:.75,14:.585,10:.417},KL={24:'24K · 9999',18:'18K · 750',14:'14K · 585',10:'10K · 416'};
const TONE={y:'Vàng vàng',r:'Vàng hồng',w:'Vàng trắng'},TONEEN={y:'yellow gold',r:'rose gold',w:'white gold'};
const TY={ring:['Nhẫn',1,.3,5,.1,400e3,'ring'],necklace:['Dây chuyền',2,.5,10,.1,600e3,'necklace with a small pendant'],bracelet:['Lắc tay',2,.5,8,.1,700e3,'bracelet'],earrings:['Bông tai',.6,.2,3,.1,450e3,'pair of earrings'],pendant:['Mặt dây',.5,.1,4,.1,500e3,'pendant with a small bail'],bangle:['Vòng tay',5,1,15,.5,900e3,'bangle bracelet'],charm:['Charm',.3,.1,2,.1,300e3,'small charm']};
const GEMS={none:['Không đá',0,'no gemstone'],cz:['Đá CZ',40e3,'small sparkling clear cubic zirconia stones'],moi:['Moissanite',350e3,'a clear moissanite stone'],rb:['Ruby',900e3,'a red ruby'],sp:['Sapphire',900e3,'a blue sapphire'],pe:['Ngọc trai',600e3,'a white pearl']};
const perkPct=()=>{const p=G0().perk;return p&&p.day==s.day?p.pct:0};
const promoPct=()=>{const b=G0().bul;return b&&b.day==s.day?(b.promo||0):0};
const discPct=()=>Math.max(perkPct(),promoPct());
const maxDisc=()=>{const sp=G0().spent;return sp>=250e6?30:sp>=100e6?20:sp>=25e6?15:10};
/* o: {kind,type,k,w,gem,cx,custom}; trả về các khoản theo đồng game */
function price(o){
 const w=+o.w||0,kind=o.kind||'jew';
 if(kind=='bar'||kind=='ring'){const r=ref(kind),t=rn(w*r.sell);return{gold:t,labor:0,design:0,gem:0,disc:0,total:t,buy:rn(w*r.buy),gp:r.sell}}
 const r=ref('jew'),rat=RATIO[o.k]||1,cx=o.cx||1,gold=rn(w*r.sell*rat),wf=1+Math.min(w,10)*.04,cf=[1,1.6,2.4][cx-1]||1;
 const labor=rn((TY[o.type]?TY[o.type][5]:150e3)*cf*wf/SC),design=o.custom?rn(200e3*cx/SC):0,gem=rn((GEMS[o.gem||'none'][1])*[1,2,4][cx-1]/SC),pc=o.nodisc?0:discPct(),disc=rn((labor+design)*pc/100);
 return{gold,labor,design,gem,disc,pc,total:gold+labor+design+gem-disc,buy:rn(w*r.buy*rat*.92),gp:r.sell}}
const val=it=>{const w=+it.w||0;if(it.kind=='bar'||it.kind=='ring')return rn(w*ref(it.kind).buy);return rn(w*ref('jew').buy*(RATIO[it.k]||1)*.92)};

/* ================= ẢNH: lưu trong IndexedDB, hiển thị bằng blob URL ================= */
let DB=null;const IMG={},PURL={};
const idb=()=>new Promise(res=>{try{const r=indexedDB.open('jsGoldImg',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});

function setImg(id,blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>{IMG[id]={blob,url:String(r.result)};res()};r.onerror=()=>res();r.readAsDataURL(blob)})}
async function putImg(id,blob){await setImg(id,blob);if(DB)try{DB.transaction('i','readwrite').objectStore('i').put(blob,id)}catch(e){}}

(async()=>{DB=await idb();if(!DB)return;try{await new Promise(res=>{const rq=DB.transaction('i').objectStore('i').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){if(c.value instanceof Blob)setImg(c.key,c.value).then(ui);c.continue()}else res()};rq.onerror=()=>res()})}catch(e){}ui()})();

/* ---------- vẽ trang sức bằng SVG (dự phòng khi chưa có ảnh Gemini, và cho hàng có sẵn) ---------- */
const TC={y:['#fff6bd','#ffd54a','#e3a000','#a86a00'],r:['#ffe6d8','#f6b595','#d9855f','#955036'],w:['#ffffff','#eceff2','#b8c0c9','#76808b']};
function gemSvg(cx,cy,r,g){
 if(g=='pe')return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#pe)" stroke="#c9bfc4" stroke-width="1"/><circle cx="${cx-r*.35}" cy="${cy-r*.35}" r="${r*.28}" fill="#fff" opacity=".9"/>`;
 const c={cz:['#ffffff','#a9d8ff'],moi:['#f4fbff','#7fc8ff'],rb:['#ff8aa8','#c4194a'],sp:['#86a8ff','#2748b8']}[g]||['#fff','#bde'];
 const p=[[-1,-.55],[-.55,-1],[.55,-1],[1,-.55],[0,1]].map(a=>(cx+a[0]*r).toFixed(1)+','+(cy+a[1]*r).toFixed(1)).join(' ');
 return `<polygon points="${p}" fill="${c[1]}" stroke="#5a4a2a" stroke-width="1.2" stroke-linejoin="round"/><polygon points="${cx-r*.55},${cy-r} ${cx+r*.55},${cy-r} ${cx+r*.3},${cy-r*.2} ${cx-r*.3},${cy-r*.2}" fill="${c[0]}" opacity=".85"/><path d="M${cx-r} ${cy-r*.55}L${cx} ${cy+r}L${cx+r} ${cy-r*.55}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".8"/>`}
function jsvg(o){
 const t=o.tone||'y',c=TC[t],g=o.gem||'none',ty=o.type,hasG=g!='none',gm=hasG?1:0;
 const defs=`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset=".35" stop-color="${c[1]}"/><stop offset=".75" stop-color="${c[2]}"/><stop offset="1" stop-color="${c[3]}"/></linearGradient><radialGradient id="pe" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8d8e4"/></radialGradient></defs>`;
 const gold=(sw)=>`stroke="url(#g)" stroke-width="${sw}"`;
 let b='';
 if(ty=='bar'){const lab=o.lab||'9999';
  b=`<path d="M14 20H50L57 32H7Z" fill="${c[0]}" stroke="${c[3]}" stroke-width="2" stroke-linejoin="round"/><path d="M7 32H57V46Q57 49 54 49H10Q7 49 7 46Z" fill="url(#g)" stroke="${c[3]}" stroke-width="2" stroke-linejoin="round"/><text x="32" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="9" fill="${c[3]}">${E(lab)}</text><path d="M12 36H52" stroke="#fff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>`}
 else if(ty=='ring'){const cy=gm?42:38;
  b=`<circle cx="32" cy="${cy}" r="15" fill="none" stroke="${c[3]}" stroke-width="10"/><circle cx="32" cy="${cy}" r="15" fill="none" ${gold(7)}/><path d="M19.5 ${cy-3}A13 13 0 0 1 28 ${cy-13}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/>${hasG?`<path d="M25 25H39L36 31H28Z" fill="url(#g)" stroke="${c[3]}" stroke-width="1.5"/>${gemSvg(32,19,8,g)}`:`<circle cx="32" cy="${cy+15}" r="1.2" fill="${c[3]}" opacity=".5"/>`}`}
 else if(ty=='necklace'){
  b=`<path d="M10 8C13 46 51 46 54 8" fill="none" stroke="${c[3]}" stroke-width="5" stroke-linecap="round"/><path d="M10 8C13 46 51 46 54 8" fill="none" ${gold(3)} stroke-dasharray="3.4 1.4" stroke-linecap="round"/>${hasG?gemSvg(32,45,7,g):`<path d="M32 36C23 43 25 54 32 57C39 54 41 43 32 36Z" fill="url(#g)" stroke="${c[3]}" stroke-width="1.8" stroke-linejoin="round"/><path d="M28 44Q27 49 30 52" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>`}`}
 else if(ty=='bracelet'){

 while(st.length){const i=st.pop(),px=i%W,py=(i/W)|0;if(px>0)push(i-1);if(px<W-1)push(i+1);if(py>0)push(i-W);if(py<H-1)push(i+W)}
 for(let i=0;i<W*H;i++){if(seen[i]||!white(i)||d[i*4]<248||d[i*4+1]<248||d[i*4+2]<248)continue;

function localBrief(f,desc){
 const cx=Math.max(1,Math.min(3,(desc.length>60?3:desc.length>8?2:1)+(f.refB&&desc.length<=8?1:0)));
 return{name:(TY[f.type][0]+' '+TONE[f.tone].toLowerCase()+(f.gem!='none'?' '+GEMS[f.gem][0].toLowerCase():'')).slice(0,40),note:'Thợ đã ghi nhận yêu cầu, sẽ làm theo mô tả của con.',design:desc||'simple classic design',cx,feasible:true}}
function normBrief(j,f,desc){
 const l=localBrief(f,desc);if(!j||typeof j!='object')return l;
 if(j.feasible===false)return{feasible:false,reason:cl(j.reason||j.note,200)||'Món này tiệm không làm được con ơi.'};
 return{name:cl(j.name,40)||l.name,note:cl(j.note,220)||l.note,design:cl(j.design,320)||l.design,cx:Math.max(1,Math.min(3,Math.round(+j.complexity||l.cx))),feasible:true}}

   m.insertAdjacentHTML('beforeend','<div class=card style="margin-top:8px"><b>📰 Đăng lên bảng tin</b><textarea id=wpc maxlength=300 rows=2 placeholder="Viết vài dòng cho bài đăng (không bắt buộc)..." style="width:100%;resize:vertical;margin:6px 0" oninput="XB.wpc(this.value)"></textarea><button class=p style="width:100%" id=wpb onclick="XB.wpost()">📰 Đăng ảnh này</button><button class=s style="width:100%;margin-top:6px" id=gdb onclick="GOLD.gdisc()">💬 Gửi lên Discord</button></div>')}

 if(GDB)return;const i=G0().items.find(x=>x.id==GPI);if(!i)return toast('Không tìm thấy món này');
 if(typeof SHC=='undefined'||!SHC)return toast('Chưa có ảnh để gửi');
 if(typeof dcSend!='function')return toast('Chưa dùng được tính năng Discord');

 try{const f=gInfo(i),ta=document.getElementById('wpc'),cap=String(ta?ta.value:'').replace(/[ \t]+/g,' ').trim().slice(0,300);
  const ok=await dcSend('gold',SHC.toDataURL('image/png'),{name:String(i.name||'').slice(0,60),type:f.loai,emoji:'💍',weight:fw2(i.w),karat:f.kl,gem:f.gem,tone:f.tone,custom:i.custom?1:0,value:val(i)|0,paid:(i.paid||0)|0,shop_name:String(s.name||'Tiệm hoa').slice(0,60),caption:cap},true);
  if(ok)toast('Đã gửi yêu cầu. Bot sẽ đăng lên Discord trong giây lát!')
 }catch(e){toast('Không gửi được: '+(e&&e.message||e))}
 GDB=0;const b2=document.getElementById('gdb');if(b2){b2.disabled=false;b2.textContent='💬 Gửi lên Discord'}};

GOLD.px=()=>{try{const c=PR.d&&PR.d.SJ9999;return c&&+c.sell>0?{v:Math.round(+c.sell),live:!!PR.live}:null}catch(e){return null}};
V.gold=function(){
 const g=G0();
 if(!PR.loading&&Date.now()-PR.tryAt>(PR.live?3e5:6e4)){PR.tryAt=Date.now();setTimeout(()=>{loadP(true);loadH(GD.hs,GD.hd)},0)}
 else if(!PR.H[GD.hs+'|'+GD.hd]){setTimeout(()=>loadH(GD.hs,GD.hd),0)}
 if(!(g.bul&&g.bul.day==s.day)&&GD.hb!=s.day)setTimeout(ensureBul,0);
 const body=GD.t=='price'?vPrice():GD.t=='shop'?vShop():GD.t=='order'?vOrder():vChat();
 return hdr()+`<div class=gsub>${tabs.map(t=>`<button class="s ${GD.t==t[0]?'on2':''}" onclick="GOLD.tab('${t[0]}')">${t[1]}${t[0]=='order'&&readyCount()?' •':''}</button>`).join('')}</div>`+body};
{const ob=V.bag;V.bag=function(){return ob.apply(this,arguments)+boxCard(vRec())}}
try{SDX.TS.splice(2,0,['gold','gem','Tiệm vàng'])}catch(e){}
/* thông báo khi đơn gia công xong */
setInterval(()=>{try{const g=G0();let ch=0;g.orders.forEach(o=>{if(o.st=='making'&&s.day>=o.due&&!o.nt){o.nt=1;ch=1;s.notifs=s.notifs||[];s.notifs.unshift({type:'gold',id:o.id,text:'💍 Đơn "'+o.br.name+'" ở '+SHOP+' đã xong, đến nhận hàng nhé!',time:new Date().toISOString(),read:false});toast('Đơn gia công đã xong!')}});if(ch){save();ui()}}catch(e){}},4000);
})();
