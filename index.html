<!-- ===== v59: Đọc sách (Wikipedia) + Cộng đồng toàn màn hình + sửa chữ đè nhau trên ảnh khoe ===== -->
<!-- Dán nguyên khối này vào ngay trước </body> -->
<style id="jas-v59">
/* Cộng đồng: toàn màn hình */
#sd{width:100vw!important;max-width:none!important;border-radius:0!important;box-shadow:none!important}
#sdo{display:none!important}
/* Đọc sách */
.rds{display:flex;gap:6px;margin:4px 0 8px}
.rds input{flex:1;min-width:0;width:auto}
.rdi{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--ln);border-radius:16px;background:var(--card);color:var(--ink);padding:10px;margin:0 0 8px;font:inherit;cursor:pointer}
.rdi img,.rdi .rdn{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--g);display:grid;place-items:center}
.rdi b{display:block;font-family:'Baloo 2',sans-serif;line-height:1.2}
.rdi span.rdx{display:block;color:var(--mut);font-size:.85rem;line-height:1.35;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.rdt{line-height:1.7;overflow-wrap:anywhere}
.rdt h4{font-family:'Baloo 2',sans-serif;margin:18px 0 4px;color:var(--g3)}
.rdt h5{font-family:'Baloo 2',sans-serif;margin:12px 0 2px}
.rdt p{margin:0 0 10px}
.rdbar{position:sticky;top:0;z-index:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;background:var(--bg)}
</style>
<script>
(function(){
 const E=id=>document.getElementById(id);
 const LSK='jsRead';
 const RD={lang:'vi',fs:17,q:'',res:null,title:'',busy:0,err:'',art:null,shown:0,bm:[],mode:''};
 try{const j=JSON.parse(localStorage.getItem(LSK)||'{}');if(j.lang)RD.lang=j.lang=='en'?'en':'vi';if(j.fs>=13&&j.fs<=26)RD.fs=j.fs;if(Array.isArray(j.bm))RD.bm=j.bm.filter(b=>b&&b.t).slice(0,50)}catch(e){}
 const sv=()=>{try{localStorage.setItem(LSK,JSON.stringify({lang:RD.lang,fs:RD.fs,bm:RD.bm}))}catch(e){}};
 const STOP=/^(Tham khảo|Chú thích|Liên kết ngoài|Xem thêm|Đọc thêm|Ghi chú|Thư mục|References|External links|See also|Notes|Further reading|Bibliography|Footnotes)$/i;
 const STEP=30;

 async function api(p){
  const u=new URL('https://'+RD.lang+'.wikipedia.org/w/api.php');
  Object.entries(Object.assign({format:'json',origin:'*',formatversion:'2'},p)).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);if(!r.ok)throw new Error('Wikipedia trả lỗi '+r.status);return r.json()}
 const thumb=u=>typeof u=='string'&&u.startsWith('https://upload.wikimedia.org/')?u:'';
 const LISTP={prop:'extracts|pageimages',exintro:1,explaintext:1,exlimit:'max',exsentences:2,piprop:'thumbnail',pithumbsize:96};

 function paint(keep){
  const el=E('sdbody');if(!el||!E('rdroot'))return SD.go('read');
  if(!keep)return SD.go('read');
  const y=el.scrollTop;el.innerHTML=V.read();el.scrollTop=y}
 async function run(fn){RD.busy=1;RD.err='';paint();try{await fn()}catch(e){RD.err=(e&&e.message)||'Không kết nối được Wikipedia'}RD.busy=0;paint()}

 const RDR=window.RDR={
  q(v){RD.q=v},
  lang(l){RD.lang=l;RD.res=null;RD.art=null;RD.mode='';sv();SD.go('read')},
  fs(d){RD.fs=Math.max(13,Math.min(26,RD.fs+d));sv();const t=E('rdtext');if(t)t.style.fontSize=RD.fs+'px';else paint(1)},
  search(v){
   const q=String(v==null?RD.q:v).trim();RD.q=q;if(!q)return toast('Nhập từ khóa để tìm');
   RD.art=null;RD.title='Kết quả cho “'+q+'”';RD.mode='s';
   run(async()=>{const j=await api(Object.assign({action:'query',generator:'search',gsrsearch:q,gsrlimit:15},LISTP));
    RD.res=((j.query&&j.query.pages)||[]).sort((a,b)=>(a.index||0)-(b.index||0))})},
  random(){
   RD.art=null;RD.title='Bài ngẫu nhiên';RD.mode='r';
   run(async()=>{const j=await api(Object.assign({action:'query',generator:'random',grnnamespace:0,grnlimit:12},LISTP));
    RD.res=(j.query&&j.query.pages)||[]})},
  saved(){RD.art=null;RD.title='Đã lưu';RD.mode='b';RD.res=null;paint()},
  open(i){const p=RD.res&&RD.res[i];if(p)RDR.read(p.title)},
  openBm(i){const b=RD.bm[i];if(!b)return;if(b.l!=RD.lang){RD.lang=b.l;sv()}RDR.read(b.t)},
  read(title){
   RD.art=null;RD.mode='a';
   run(async()=>{
    const j=await api({action:'query',prop:'extracts',titles:title,explaintext:1,redirects:1}),p=j.query&&j.query.pages&&j.query.pages[0];
    if(!p||p.missing||!p.extract)throw new Error('Không tìm thấy nội dung bài này');
    const blocks=[];let stop=0;
    p.extract.split('\n').forEach(l=>{if(stop)return;l=l.trim();if(!l)return;
     const m=l.match(/^(=+)\s*(.+?)\s*=+$/);
     if(m){if(STOP.test(m[2])){stop=1;return}blocks.push({h:Math.min(m[1].length,3),t:m[2]})}else blocks.push({t:l})});
    RD.art={title:p.title,blocks};RD.shown=STEP;
    const el=E('sdbody');if(el)el.scrollTop=0})},
  more(){if(!RD.art)return;RD.shown+=STEP;paint(1)},
  back(){RD.art=null;paint()},
  toggleBm(){const a=RD.art;if(!a)return;const i=RD.bm.findIndex(b=>b.t==a.title&&b.l==RD.lang);
   if(i>=0){RD.bm.splice(i,1);toast('Đã bỏ lưu')}else{RD.bm.unshift({t:a.title,l:RD.lang});RD.bm=RD.bm.slice(0,50);toast('Đã lưu bài này')}sv();paint(1)},
  delBm(i){RD.bm.splice(i,1);sv();paint(1)}
 };

 const item=(p,i)=>{const th=thumb(p.thumbnail&&p.thumbnail.source);
  return `<button class=rdi onclick="RDR.open(${i})">${th?`<img src="${esc(th)}" alt="" loading=lazy>`:'<span class=rdn>📖</span>'}<span style="min-width:0"><b>${esc(p.title)}</b><span class=rdx>${esc(p.extract||'')}</span></span></button>`};

 function reader(){
  const a=RD.art,saved=RD.bm.some(b=>b.t==a.title&&b.l==RD.lang),sh=a.blocks.slice(0,RD.shown);
  const url='https://'+RD.lang+'.wikipedia.org/wiki/'+encodeURIComponent(a.title.replace(/ /g,'_'));
  return `<div class=rdbar><button class=s onclick="RDR.back()">← Quay lại</button><span style="flex:1"></span><button class=s onclick="RDR.fs(-1)" aria-label="Chữ nhỏ lại">A−</button><button class=s onclick="RDR.fs(1)" aria-label="Chữ to lên">A+</button><button class="s ${saved?'on2':''}" onclick="RDR.toggleBm()">${saved?'★ Đã lưu':'☆ Lưu'}</button></div>
  <div class=card><h2 style="margin:0 0 8px">${esc(a.title)}</h2><div class=rdt id=rdtext style="font-size:${RD.fs}px">${sh.map(b=>b.h?`<${b.h==1?'h4':'h5'}>${esc(b.t)}</${b.h==1?'h4':'h5'}>`:`<p>${esc(b.t)}</p>`).join('')}</div>
  ${a.blocks.length>RD.shown?`<button class=p style="width:100%;margin-top:6px" onclick="RDR.more()">Đọc tiếp (${Math.round(RD.shown/a.blocks.length*100)}%)</button>`:'<p class=mut style="text-align:center;margin:8px 0 0">— Hết bài —</p>'}
  <p class=mut style="font-size:.78rem;margin:10px 0 0">Nguồn: <a href="${esc(url)}" target=_blank rel=noopener style="color:inherit">Wikipedia</a> (CC BY-SA)</p></div>`}

 V.read=function(){
  let h=`<div id=rdroot></div>`;
  if(RD.art)return h+reader();
  h+=`<div class=card><div class=row style="margin:0 0 6px"><h3 style="margin:0">📚 Đọc sách</h3><span><button class="s ${RD.lang=='vi'?'on2':''}" onclick="RDR.lang('vi')">VI</button> <button class="s ${RD.lang=='en'?'on2':''}" onclick="RDR.lang('en')">EN</button></span></div>
  <div class=rds><input id=rdq value="${esc(RD.q)}" placeholder="Tìm bài trên Wikipedia..." oninput="RDR.q(this.value)" onkeydown="if(event.key=='Enter')RDR.search(this.value)" enterkeyhint=search><button class=p onclick="RDR.search(E_rdq())">Tìm</button></div>
  <div class=row style="justify-content:flex-start;margin:0"><button class=s onclick="RDR.random()">🎲 Ngẫu nhiên</button><button class="s ${RD.mode=='b'?'on2':''}" onclick="RDR.saved()">★ Đã lưu (${RD.bm.length})</button></div></div>`;
  if(RD.busy)return h+'<div class=card><p class=mut style="margin:0">Đang tải từ Wikipedia...</p></div>';
  if(RD.err)return h+`<div class=card><p class=bad style="margin:0">${esc(RD.err)}</p></div>`;
  if(RD.mode=='b')return h+(RD.bm.length?RD.bm.map((b,i)=>`<div class=rdi style="align-items:center" onclick="RDR.openBm(${i})"><span class=rdn>📖</span><span style="flex:1;min-width:0"><b>${esc(b.t)}</b><span class=rdx>Wikipedia ${b.l.toUpperCase()}</span></span><button class=s onclick="event.stopPropagation();RDR.delBm(${i})" aria-label="Bỏ lưu">✕</button></div>`).join(''):'<div class=card><p class=mut style="margin:0">Chưa lưu bài nào. Mở một bài rồi bấm ☆ Lưu.</p></div>');
  if(RD.res){
   if(!RD.res.length)return h+'<div class=card><p class=mut style="margin:0">Không tìm thấy kết quả. Thử từ khóa khác.</p></div>';
   return h+`<p class=mut style="margin:0 2px 6px">${esc(RD.title)}</p>`+RD.res.map(item).join('')}
  return h+'<div class=card><p class=mut style="margin:0">Gõ tên một chủ đề (ví dụ: <i>Hoa hồng</i>, <i>Hà Nội</i>, <i>Vũ trụ</i>) hoặc bấm Ngẫu nhiên để khám phá bài mới. Nội dung lấy từ Wikipedia qua API chính thức.</p></div>'};
 window.E_rdq=()=>{const i=E('rdq');return i?i.value:RD.q};

 /* thêm tab vào ngăn Cộng đồng */
 const add=()=>{try{if(!window.SDX)return false;const T=SDX.TS;if(!T.some(t=>t[0]=='read')){const i=T.findIndex(t=>t[0]=='adm');T.splice(i<0?T.length:i,0,['read','book','Đọc sách']);SDX.refresh()}return true}catch(e){return false}};
 if(!add()){const k=setInterval(()=>{if(add())clearInterval(k)},500)}
 try{if(typeof ENL!='undefined'){ENL.push(['Đọc sách','Reading']);ENL.sort((a,b)=>b[0].length-a[0].length)}}catch(e){}
})();

/* ===== Ảnh khoe workshop: dòng "Làm bởi X · 🎁 quà từ Y" tách thành 2 dòng (giữ nguyên cách vẽ chữ ban đầu) ===== */
(function(){
 const proto=CanvasRenderingContext2D.prototype,old=proto.fillText;
 proto.fillText=function(t,x,y,mw){
  t=String(t);
  if(/^Làm bởi /.test(t)&&t.indexOf(' · ')>0){
   const k=t.indexOf(' · '),a=t.slice(0,k),b=t.slice(k+3),px=parseFloat((this.font.match(/([\d.]+)px/)||[0,30])[1]),lh=Math.round(px*1.3);
   old.call(this,a,x,y,mw);old.call(this,b,x,y+lh,mw);
   this.__jsTwo=lh;return}
  if(t==='Justaseed · Workshop'&&this.__jsTwo){
   const lh=this.__jsTwo;this.__jsTwo=0;
   if(y>900)y+=lh}   /* ảnh dọc: đẩy chữ cuối xuống để không chạm dòng thứ 2 */
  return old.call(this,t,x,y,mw)};
})();
</script>
