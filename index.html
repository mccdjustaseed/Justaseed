<script>
const $=n=>Math.round(n).toLocaleString('vi-VN')+'đ',esc=t=>String(t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const I={home:'M3 11l9-8 9 8M5 10v10h14V10',cart:'M3 4h3l2 11h10l2-8H7M9 20h.01M17 20h.01',tag:'M3 12V3h9l9 9-9 9z',shop:'M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6',star:'M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3 1.3-6.2L3 9.5l6.3-.7z',quest:'M6 3v18M6 4h12l-3 4 3 4H6',up:'M12 20V5M5 11l7-7 7 7',book:'M4 5h7a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-7a2 2 0 00-2 2',save:'M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-6h8v6',moon:'M20 14a8 8 0 11-10-10 7 7 0 0010 10z',sun:'M12 8a4 4 0 100 8 4 4 0 000-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',music:'M9 18V6l10-2v12M9 18a3 3 0 11-6 0 3 3 0 016 0M19 16a3 3 0 11-6 0 3 3 0 016 0',mute:'M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6',undo:'M4 9h11a5 5 0 010 10H8M4 9l4-4M4 9l4 4',bill:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',spk:'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2'};

// ===== SUPABASE + DISCORD FRIENDS =====
const SUPABASE_URL = 'https://dpxldincujnnheeesgcu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_G64piJDVZnrJgxHeBRA30w_U-aNjFHM';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

async function upsertProfile(user) {
  if (!user) return;
  const meta = user.user_metadata || {};
  const username = meta.preferred_username || meta.full_name || meta.name || user.email || 'player';
  await supabaseClient.from('profiles').upsert({
    id: user.id,
    username: username.toLowerCase(),
    display_name: meta.full_name || meta.name || username,
    avatar_url: meta.avatar_url || null
  }, { onConflict: 'id' });
}

async function initAuth() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    currentUser = session?.user || null;
    if (currentUser) await upsertProfile(currentUser);
  } catch(e) {}
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session?.user || null;
    if (currentUser) await upsertProfile(currentUser);
    if (typeof R === 'function') R();
  });
}

async function loginDiscord() {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'discord',
    options: { redirectTo: window.location.href.split('#')[0].split('?')[0] }
  });
  if (error) toast('Lỗi đăng nhập: ' + error.message);
}

async function logoutDiscord() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  toast('Đã đăng xuất');
  if (typeof R === 'function') R();
}

initAuth();

async function sendFriendByName() {
  const input = document.getElementById('friend-search');
  if (!input || !currentUser) return;
  const name = (input.value || '').trim().toLowerCase();
  if (!name) return toast('Nhập username Discord');
  const { data: profiles, error } = await supabaseClient
    .from('profiles')
    .select('id, username, display_name')
    .eq('username', name)
    .limit(1);
  if (error || !profiles || !profiles.length) return toast('Không tìm thấy người chơi');
  const target = profiles[0];
  if (target.id === currentUser.id) return toast('Không thể kết bạn với chính mình');
  const { error: err2 } = await supabaseClient.from('friends').insert({
    user_id: currentUser.id,
    friend_id: target.id,
    status: 'pending'
  });
  if (err2) {
    if (err2.code === '23505') toast('Đã gửi lời mời hoặc đã là bạn');
    else toast('Lỗi: ' + err2.message);
  } else {
    toast('Đã gửi lời mời đến ' + (target.display_name || target.username));
    input.value = '';
    loadFriendsUI();
  }
}

async function acceptFriend(id) {
  const { error } = await supabaseClient
    .from('friends')
    .update({ status: 'accepted' })
    .eq('id', id);
  if (error) toast('Lỗi: ' + error.message);
  else { toast('Đã chấp nhận'); loadFriendsUI(); }
}

async function removeFriend(id) {
  const { error } = await supabaseClient.from('friends').delete().eq('id', id);
  if (error) toast('Lỗi: ' + error.message);
  else { toast('Đã xóa'); loadFriendsUI(); }
}

async function loadFriendsUI() {
  const el = document.getElementById('friend-content');
  if (!el || !currentUser) return;
  const uid = currentUser.id;
  const { data: rows, error } = await supabaseClient
    .from('friends')
    .select('id, user_id, friend_id, status, created_at')
    .or(`user_id.eq.${uid},friend_id.eq.${uid}`);
  if (error) { el.innerHTML = '<p class=bad>Lỗi tải dữ liệu</p>'; return; }
  const ids = [...new Set(rows.flatMap(r => [r.user_id, r.friend_id]))];
  let profiles = {};
  if (ids.length) {
    const { data: ps } = await supabaseClient.from('profiles').select('id, username, display_name').in('id', ids);
    (ps || []).forEach(p => profiles[p.id] = p);
  }
  const accepted = [], incoming = [], outgoing = [];
  rows.forEach(r => {
    const otherId = r.user_id === uid ? r.friend_id : r.user_id;
    const other = profiles[otherId] || { display_name: 'Người chơi', username: '?' };
    const item = { ...r, other };
    if (r.status === 'accepted') accepted.push(item);
    else if (r.friend_id === uid) incoming.push(item);
    else outgoing.push(item);
  });
  let html = '';
  if (incoming.length) {
    html += '<h3>Lời mời nhận được</h3>';
    incoming.forEach(x => {
      html += `<div class=row><span><b>${esc(x.other.display_name)}</b> <span class=mut>@${esc(x.other.username)}</span></span>
        <span><button class=p onclick="acceptFriend(${x.id})">Chấp nhận</button> <button class=s onclick="removeFriend(${x.id})">Từ chối</button></span></div>`;
    });
  }
  if (outgoing.length) {
    html += '<h3>Đã gửi</h3>';
    outgoing.forEach(x => {
      html += `<div class=row><span><b>${esc(x.other.display_name)}</b> <span class=mut>@${esc(x.other.username)}</span></span>
        <button class=s onclick="removeFriend(${x.id})">Hủy</button></div>`;
    });
  }

<script>
/* ===== NHẠC YOUTUBE ===== */
(()=>{
const LS='jsMusic',$e=id=>document.getElementById(id);

const MS=window.MS={key:KEY,mc:0,msg:'',fav:[],qo:1,fo:1,q:[],now:null,hist:[],rep:0,res:[],qry:'',busy:0,err:'',playing:0,pos:0,dur:0,evT:0,want:0,show:0,seeking:0};

if(MS.now&&!IDRE.test(MS.now.id))MS.now=null;
const sv=()=>{try{localStorage.setItem(LS,JSON.stringify({q:MS.q,now:MS.now,hist:MS.hist.slice(-30),rep:MS.rep,fav:MS.fav,qo:MS.qo,fo:MS.fo,mc:MS.mc}))}catch(e){}};
const fm=ms=>{ms=Math.max(0,Math.round((ms||0)/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')};

/* ---------- icon + tab ---------- */
I.music='M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM21 16a3 3 0 11-6 0 3 3 0 016 0z';
{const i=TABS.findIndex(t=>t[0]=='up');TABS.splice(i<0?TABS.length:i,0,['music','music','Nhạc'])}
if(typeof ENL!=='undefined'){ENL.push(['Nhạc','Music'],['Hàng đợi','Queue'],['Kết nối YouTube','Connect YouTube']);ENL.sort((a,b)=>b[0].length-a[0].length)}
const IC={
play:'<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',

x:'<path d="M6 6l12 12M18 6L6 18"/>',
shuf:'<path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/>',
rep:'<path d="M17 3l3 3-3 3M4 11V9a3 3 0 013-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 01-3 3H4"/>',
rep1:'<path d="M17 3l3 3-3 3M4 11V9a3 3 0 013-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 01-3 3H4M11 10l1.5-1v6"/>',
frame:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15h18"/>',
heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',
heartf:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z" fill="currentColor"/>',
chev:'<path d="M6 9l6 6 6-6"/>'};
const sg=(n,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- YouTube: lấy thông tin & tìm kiếm ---------- */
const LRE=/(?:youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i;
const dec=h=>{const t=document.createElement('textarea');t.innerHTML=h||'';return t.value};
const cov=id=>'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
const artist=c=>dec(c).replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').trim();
const dur=iso=>{const m=/^P(?:\d+D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso||'');return m?((+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0))*1000:0};
async function yt(path,params){
 let r;
 try{r=await fetch('https://www.googleapis.com/youtube/v3/'+path+'?'+new URLSearchParams(Object.assign({key:MS.key},params)))}
 catch(e){throw new Error('Không kết nối được tới YouTube (mạng hoặc trình duyệt chặn)')}
 if(!r.ok){
  let why='';try{const j=await r.json();why=(j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||''}catch(e){}
  if(why=='quotaExceeded')throw new Error('Khóa YouTube đã hết hạn mức hôm nay (khoảng 100 lượt tìm/ngày). Hãy dán link YouTube hoặc thử lại ngày mai.');
  if(why=='keyInvalid'||r.status==400)throw new Error('Khóa YouTube API chưa đúng. Hãy kiểm tra lại khóa.');
  if(r.status==403)throw new Error('YouTube từ chối khóa này (403). Hãy bật "YouTube Data API v3" cho khóa, và kiểm tra giới hạn tên miền của khóa.');
  throw new Error('YouTube API lỗi '+r.status)}
 return r.json()}
const fromVideo=v=>({id:v.id,name:dec(v.snippet.title),ar:artist(v.snippet.channelTitle),img:cov(v.id),th:cov(v.id),dur:dur(v.contentDetails&&v.contentDetails.duration)});
async function getVideo(id){
 if(MS.key){try{const j=await yt('videos',{part:'snippet,contentDetails',id});if(j.items&&j.items[0])return fromVideo(j.items[0])}catch(e){}}
 try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
  if(r.ok){const j=await r.json();return{id,name:dec(j.title)||'Video YouTube',ar:artist(j.author_name||''),img:cov(id),th:cov(id),dur:0}}}catch(e){}
 return{id,name:'Video YouTube',ar:'',img:cov(id),th:cov(id),dur:0}}
async function search(raw){
  const q=raw.replace(/\s+[-–—]\s+/g,' ');
 const base={part:'snippet',type:'video',videoEmbeddable:'true',maxResults:'12',q};
 let j=await yt('search',Object.assign({videoCategoryId:'10'},base));
 if(!j.items||!j.items.length)j=await yt('search',base);
 const ids=(j.items||[]).map(x=>x.id&&x.id.videoId).filter(Boolean);
 if(!ids.length)return[];
 const d=await yt('videos',{part:'snippet,contentDetails',id:ids.join(',')});
 return(d.items||[]).map(fromVideo)}

/* ---------- trình phát (YouTube IFrame Player API) ---------- */
let ctl=null,ctlP=null,apiP=null,loaded='',kid=0,ending=0,dk=-1,miniSig='';
function loadApi(){
 if(apiP)return apiP;
 apiP=new Promise((res,rej)=>{
  if(window.YT&&window.YT.Player)return res(window.YT);
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{try{prev&&prev()}catch(e){}res(window.YT)};
  const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;
  sc.onerror=()=>{apiP=null;rej(new Error('Không tải được trình phát YouTube (kiểm tra mạng hoặc tiện ích chặn quảng cáo)'))};
  document.head.appendChild(sc);
  setTimeout(()=>{if(!ctl&&!(window.YT&&window.YT.Player)){apiP=null;rej(new Error('Trình phát YouTube tải quá lâu'))}},15000)});
 return apiP}
function ensureCtl(id,auto){
 if(ctl)return Promise.resolve(ctl);if(ctlP)return ctlP;
 ctlP=loadApi().then(Y=>new Promise(res=>{
  const p=new Y.Player('spEl',{width:'100%',height:'100%',videoId:id,
   playerVars:{playsinline:1,rel:0,modestbranding:1,autoplay:auto?1:0},
   events:{onReady:()=>{ctl=p;loaded=id;res(p)},onStateChange:onSt,onError:onErr}})
 })).catch(e=>{ctlP=null;throw e});
 return ctlP}
const est=()=>MS.playing?Math.min(MS.pos+(Date.now()-MS.evT),MS.dur||1e9):MS.pos;
function kick(c){
 const k=++kid;let n=0;
 const f=()=>{if(k!==kid||!MS.want||MS.playing)return;
  try{c.playVideo()}catch(e){}
  n++;if(n<6)setTimeout(f,n<3?700:1500);
  else{MS.show=1;ui();toast('Trình duyệt chặn tự phát — hãy bấm Play trong khung YouTube')}};
 setTimeout(f,250)}
function go(t){
 MS.now=t;MS.ended=0;MS.pos=0;MS.dur=t.dur||0;MS.playing=0;MS.want=1;MS.evT=Date.now();ending=0;
 sv();ui();
 const fin=c=>{if(loaded!==t.id){loaded=t.id;try{c.loadVideoById(t.id)}catch(e){}}kick(c)};
 if(ctl)fin(ctl);else ensureCtl(t.id,1).then(fin).catch(e=>{MS.want=0;ui();toast(e.message||'Không phát được')})}
function onSt(e){
 const st=e&&e.data;
 if(st===1){
  MS.playing=MS.now?1:0;MS.want=1;MS.evT=Date.now();MS.show=0;
  try{MS.pos=ctl.getCurrentTime()*1000;const d=ctl.getDuration();if(d)MS.dur=d*1000}catch(x){}
  ui();duck()}
 else if(st===2){
  if(MS.playing){try{MS.pos=ctl.getCurrentTime()*1000}catch(x){}MS.evT=Date.now();MS.playing=0;MS.want=0;kid++;ui();duck()}}
 else if(st===0){end()}}
function onErr(e){
 const c=e&&e.data;
 toast(c==101||c==150?'Video này không cho phép phát nhúng — thử bài khác':'Không phát được video này');
 MS.playing=0;MS.want=0;kid++;
 if(MS.q.length)next(1);else{ui();duck()}}
function end(){
 if(ending)return;ending=1;setTimeout(()=>{ending=0},2500);
 if(MS.rep&&MS.now){MS.pos=0;MS.want=1;try{ctl.seekTo(0,true);ctl.playVideo()}catch(e){}kick(ctl);return}
 if(MS.q.length)next(1);
 else{MS.playing=0;MS.want=0;MS.pos=0;MS.ended=1;kid++;try{ctl.pauseVideo()}catch(e){}ui();duck();toast('Đã hết hàng đợi')}}
function next(auto){
 if(!MS.q.length)return auto?0:toast('Hàng đợi đang trống — hãy thêm bài hát');
 const t=MS.q.shift();if(MS.now){MS.hist.push(MS.now);if(MS.hist.length>30)MS.hist.shift()}go(t)}
function prev(){
 if(MS.pos>3000||!MS.hist.length){
  if(!MS.now)return;MS.pos=0;MS.evT=Date.now();
  if(ctl&&loaded===MS.now.id){try{ctl.seekTo(0,true)}catch(e){}if(!MS.playing){MS.want=1;kick(ctl)}}else go(MS.now);
  return tickUI(0)}
 const t=MS.hist.pop();if(MS.now)MS.q.unshift(MS.now);go(t)}
function tog(){
 const t=MS.now;
 if(!t){if(MS.q.length)return next();return toast('Chưa có bài nào — hãy tìm và thêm bài hát')}
 if(!ctl||loaded!==t.id){go(t);return}
 if(MS.playing){MS.pos=est();MS.evT=Date.now();MS.want=0;kid++;MS.playing=0;try{ctl.pauseVideo()}catch(e){}ui();duck()}
 else{MS.want=1;try{ctl.playVideo()}catch(e){}kick(ctl)}}
function duck(){
 const p=MS.playing?1:0;if(p===dk)return;dk=p;
 try{if(p)clearInterval(MT);else if(s.mus&&scr=='game')music()}catch(e){}}
{const o=music;music=function(){o();if(MS.playing)clearInterval(MT)}}
function sk(v,drag){
 const d=MS.dur||(MS.now&&MS.now.dur)||0,p=v/1000*d;
 if(drag){MS.seeking=1;const a=$e('mtl');if(a)a.textContent=fm(p);return}
 MS.seeking=0;if(!ctl||!d)return;
 try{ctl.seekTo(p/1000,true)}catch(e){}MS.pos=p;MS.evT=Date.now();tickUI(p)}

/* ---------- hàng đợi ---------- */
function qui(){sv();const q=$e('mq');if(q)q.innerHTML=qH();const x=$e('mnx');if(x)x.innerHTML=nxH()}
function addRes(i,m){

function jump(i){const t=MS.q.splice(i,1)[0];if(!t)return;if(MS.now){MS.hist.push(MS.now);if(MS.hist.length>30)MS.hist.shift()}go(t);qui()}
function up(i){if(i<1)return;const a=MS.q;[a[i-1],a[i]]=[a[i],a[i-1]];qui()}
function rm(i){MS.q.splice(i,1);qui()}

function shuf(){const a=MS.q;for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}qui();toast('Đã xáo trộn hàng đợi')}

/* ---------- tìm kiếm ---------- */
async function doSearch(){
 const inp=$e('msq'),q=((inp?inp.value:MS.qry)||'').trim();MS.qry=q;if(!q||MS.busy)return;
 MS.err='';MS.msg='';MS.busy=1;resUI();
 try{
  const m=q.match(LRE);let t;
  if(m)t=await getVideo(m[1]);
  else if(/^https?:\/\//i.test(q))throw new Error('Link chưa đúng dạng. Hãy dùng link video dạng youtube.com/watch?v=… hoặc youtu.be/… (link playlist/kênh chưa hỗ trợ).');
  else{const r=await search(q);if(!r.length)throw new Error('Không tìm thấy kết quả. Thử đổi cách gõ, ví dụ "bài - ca sĩ".');t=r[0]}
  MS.res=[t];
  if(MS.now&&!MS.ended)addRes(0,2);else addRes(0,0);
  MS.res=[];if(inp)inp.value='';MS.qry=''
 }catch(e){MS.res=[];MS.err=(e&&e.message)||'Có lỗi khi tìm kiếm'}
 MS.busy=0;resUI()}

const row=(t,btns,cur)=>`<div class="mtr ${cur?'cur':''}">${t.th?`<img class="mth" src="${esc(t.th)}" alt="">`:'<div class="mth"></div>'}<div class="mti"><b><em class="mqi">${esc(t.name)}</em></b><span>${esc(t.ar||'YouTube')}${t.dur?' · '+fm(t.dur):''}</span></div><div class="mbt">${btns}</div></div>`;

 return `<div class="mnr"><div class="mcv ${MS.playing?'on':''}">${t&&t.img?`<img src="${esc(t.img)}" alt="Ảnh bìa ${esc(t.name)}">`:'<span class="ph">♪</span>'}</div>
<div class="mni">${t?`<p class="mnx" id="mnx">${nxH()}</p>`:''}<p class="mnm">${t?'<em class="mqi">'+esc(t.name)+'</em>':'Chưa có bài nào đang phát'}</p>
<p class="mar mut">${t?esc(t.ar||'YouTube'):'Tìm bài hát hoặc dán link YouTube bên dưới'}</p></div></div>
