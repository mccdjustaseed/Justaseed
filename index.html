<script>
/* ===== v43: Góc giải trí (gói hoa nhanh, chậu hoa, lật thẻ, hộp quà, đoán giá vàng, xếp hạng bạn bè) ===== */
(function(){
const FN={tab:'bq',bq:null,mt:null,html:null,lw:0,lb:{g:'bq',data:null,err:'',busy:0,t:0,gk:'',ids:null,it:0},synced:0,ggT:0};
const FUN=window.FUN={};
const E=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIM={bq:5,mt:3,hv:6},BQ_T=9000,BQ_N=5,POT_N=10;
const dk=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const st=()=>{if(!s.fn||typeof s.fn!='object')s.fn={};const f=s.fn;
 if(f.d!==dk()){f.d=dk();f.bq=0;f.mt=0;f.box=0;f.hv=0;f.prize=null}
 if(!f.best||typeof f.best!='object')f.best={};
 if(!f.gg||typeof f.gg!='object')f.gg={st:0,bs:0};
 return f};
const pool=n=>{let a=F.filter(f=>{try{return fOK(f)}catch(e){return false}});if(a.length<n)a=a.concat(F.filter(f=>!a.includes(f)));return a.slice(0,n)};
const fa=id=>{try{return art(id)}catch(e){return '🌸'}};
const fnm=id=>{const f=F.find(x=>x.id==id);return f?f.n:id};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const give=(id,q)=>{s.st[id]=(s.st[id]||0)+q};
const rw=(id,q)=>`<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle">${fa(id)} <b>${E(fnm(id))}</b> ×${q}</span>`;
const GN={bq:['Gói hoa nhanh','điểm'],mt:['Lật thẻ','điểm'],gg:['Đoán giá vàng','chuỗi thắng']};
const money=n=>Math.round(+n||0).toLocaleString('vi-VN')+'đ';

/* ---------- gửi / đọc điểm ---------- */
async function submit(g,score){try{
 if(typeof currentUser=='undefined'||!currentUser||typeof supabaseClient=='undefined'||!score)return;
 await supabaseClient.from('minigame_scores').upsert({user_id:currentUser.id,game:g,score:score|0,updated_at:new Date().toISOString()},{onConflict:'user_id,game'});
 FN.lb.t=0}catch(e){}}

/* ---------- 1. GÓI HOA NHANH ---------- */
function bqNew(){const b=FN.bq;b.seq=[0,1,2].map(()=>rnd(b.pool).id);b.pos=0;b.t0=Date.now()}
FUN.bqStart=()=>{const f=st();if(f.bq>=LIM.bq)return toast('Hết lượt hôm nay, mai chơi tiếp nhé');
 f.bq++;save();FN.bq={on:1,i:0,ok:0,score:0,pool:pool(6),res:null};bqNew();ui()};
FUN.bqTap=id=>{const b=FN.bq;if(!b||!b.on)return;
 if(id==b.seq[b.pos]){b.pos++;beep(700);
  if(b.pos>=3){b.score+=10+Math.max(0,Math.ceil((BQ_T-(Date.now()-b.t0))/1000));b.ok++;bqNext()}else bqPaint()}
 else{beep(220);toast('Sai rồi!');bqNext()}};
function bqNext(){const b=FN.bq;b.i++;if(b.i>=BQ_N)return bqEnd();bqNew();bqPaint()}
function bqEnd(){const b=FN.bq,f=st();b.on=0;
 const q=b.ok>=5?3:b.ok>=3?2:b.ok>=1?1:0,id=rnd(b.pool).id;
 if(q)give(id,q);if(b.ok)xp(b.ok*2);
 b.res={q,id};if(b.score>(f.best.bq||0)){f.best.bq=b.score;submit('bq',b.score)}
 save();ui()}
function bqBody(){const b=FN.bq;if(!b)return '';
 const sl=b.seq.map((id,i)=>`<div class="fnc ${i<b.pos?'dn':'on'}">${i<b.pos?'<span style="font-size:1.6rem">✓</span>':fa(id)}<span>${i<b.pos?'xong':E(fnm(id))}</span></div>`).join('');
 const e=Date.now()-b.t0;
 return `<div class=row><span class=mut>Khách ${Math.min(b.i+1,BQ_N)}/${BQ_N}</span><b>${b.score} điểm</b></div><p class=mut style="margin:2px 0 6px">Khách muốn bó này, chạm đúng thứ tự từ trái sang phải:</p><div class="fng fng3">${sl}</div><div class=fnbar style="margin-top:8px"><i id=fnbar style="width:${Math.max(0,100-e/BQ_T*100)}%"></i></div>`}
function bqPaint(){const el=document.getElementById('fnbq');if(el)el.innerHTML=bqBody()}
setInterval(()=>{const b=FN.bq;if(!b||!b.on)return;const e=Date.now()-b.t0,bar=document.getElementById('fnbar');
 if(bar)bar.style.width=Math.max(0,100-e/BQ_T*100)+'%';
 if(e>BQ_T){toast('Hết giờ!');bqNext()}},150);
function vBq(){const f=st(),b=FN.bq;
 if(b&&b.on)return `<div class=card><div id=fnbq>${bqBody()}</div></div><div class="fng fng3">${b.pool.map(x=>`<button class=fnc onclick="FUN.bqTap('${x.id}')">${fa(x.id)}<span>${E(x.n)}</span></button>`).join('')}</div>`;
 let r='';
 if(b&&b.res)r=`<div class=card style="border-color:var(--g2)"><b>Kết quả: ${b.ok}/${BQ_N} bó đúng · ${b.score} điểm</b><p style="margin:6px 0 0">${b.res.q?'Thưởng: '+rw(b.res.id,b.res.q):'Lần này chưa có thưởng, thử lại nhé!'}</p><div class=row style="margin-top:6px;justify-content:flex-start;gap:6px"><button class=s onclick="FUN.share('bq')">📸 Khoe điểm</button></div></div>`;
 return r+`<div class=card><b>🌼 Gói hoa nhanh</b><p class=mut style="margin:4px 0 6px">${BQ_N} khách, mỗi khách một bó 3 bông. Chạm đúng thứ tự trong ${BQ_T/1000} giây. Đúng nhiều thì thưởng nhiều hoa.</p><div class=row><span class=mut>Lượt hôm nay: ${f.bq}/${LIM.bq} · Điểm cao nhất: ${f.best.bq||0}</span><button class=p ${f.bq>=LIM.bq?'disabled':''} onclick="FUN.bqStart()">${b&&b.res?'Chơi lại':'Bắt đầu'}</button></div></div>`}

/* ---------- 2. CHẬU HOA ---------- */
const STG=['🌰','🌱','🌿','🌸'];
FUN.plant=id=>{const f=st();if(f.pot)return;f.pot={id,w:0};save();ui()};
FUN.water=()=>{const f=st();if(!f.pot||f.pot.w>=POT_N)return;const n=Date.now();if(n-FN.lw<1200)return;FN.lw=n;f.pot.w++;beep(520);save();potPaint()};
FUN.harvest=()=>{const f=st();if(!f.pot||f.pot.w<POT_N)return;if(f.hv>=LIM.hv)return toast('Hôm nay đã hái đủ '+LIM.hv+' chậu, mai hái tiếp nhé');
 const id=f.pot.id;f.hv++;give(id,2);xp(3);f.pot=null;f.pm={id,q:2};save();toast('Đã hái 2 bông '+fnm(id));ui()};
function potBody(){const f=st(),p=f.pot;if(!p)return '';
 const stg=p.w>=POT_N?3:p.w>=5?2:p.w>=1?1:0;
 return `<div class=fnbig>${p.w>=POT_N?fa(p.id):STG[stg]}</div><p style="text-align:center;margin:4px 0"><b>${E(fnm(p.id))}</b> · ${p.w>=POT_N?'Đã nở, hái được rồi!':'Tưới '+p.w+'/'+POT_N}</p><div class=fnbar><i style="width:${Math.min(100,p.w/POT_N*100)}%"></i></div>`}
function potPaint(){const el=document.getElementById('fnpot');if(el)el.innerHTML=potBody();
 const b=document.getElementById('fnwb'),p=st().pot;if(b&&p&&p.w>=POT_N)ui()}
function vPt(){const f=st(),p=f.pot,pm=f.pm;
 if(!p)return (pm?`<div class=card style="border-color:var(--g2)"><b>Vừa hái xong!</b><p style="margin:4px 0 0">Thưởng: ${rw(pm.id,pm.q)}</p></div>`:'')+`<div class=card><b>🪴 Chậu hoa</b><p class=mut style="margin:4px 0 6px">Chọn một hạt giống rồi chạm "Tưới" ${POT_N} lần cho hoa nở. Hái được 2 bông (tối đa ${LIM.hv} chậu mỗi ngày, hôm nay đã hái ${f.hv}).</p><div class="fng fng3">${pool(6).map(x=>`<button class=fnc onclick="FUN.plant('${x.id}')">${fa(x.id)}<span>${E(x.n)}</span></button>`).join('')}</div></div>`;
 const ready=p.w>=POT_N;
 return `<div class=card><div id=fnpot>${potBody()}</div><div class=row style="margin-top:8px;justify-content:center">${ready?`<button class=p id=fnwb onclick="FUN.harvest()">✂️ Hái hoa</button>`:`<button class=p id=fnwb onclick="FUN.water()">💧 Tưới</button>`}</div><p class=mut style="margin:6px 0 0;text-align:center;font-size:.78rem">Hôm nay đã hái ${f.hv}/${LIM.hv} chậu</p></div>`}

/* ---------- 3. LẬT THẺ ---------- */
FUN.mtStart=()=>{const f=st();if(f.mt>=LIM.mt)return toast('Hết lượt hôm nay, mai chơi tiếp nhé');
 f.mt++;save();const p=pool(8),c=[];p.forEach(x=>c.push(x.id,x.id));
 for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}
 FN.mt={cards:c,open:[],done:{},moves:0,lock:0,pool:p,res:null};ui()};
FUN.mtFlip=i=>{const m=FN.mt;if(!m||m.res||m.lock||m.done[i]||m.open.includes(i))return;
 m.open.push(i);beep(500);
 if(m.open.length==2){m.moves++;const a=m.open[0],b=m.open[1];
  if(m.cards[a]==m.cards[b]){m.done[a]=m.done[b]=1;m.open=[];beep(800);if(Object.keys(m.done).length>=16)return mtEnd();mtPaint()}
  else{m.lock=1;mtPaint();setTimeout(()=>{m.open=[];m.lock=0;mtPaint()},650)}}
 else mtPaint()};
function mtEnd(){const m=FN.mt,f=st();
 const sc=Math.max(10,100-(m.moves-8)*6),q=m.moves<=12?3:m.moves<=16?2:1,id=rnd(m.pool).id;
 give(id,q);xp(6);m.res={sc,q,id};
 if(sc>(f.best.mt||0)){f.best.mt=sc;submit('mt',sc)}
 save();ui()}
function mtBody(){const m=FN.mt;if(!m)return '';
 return `<div class=row><span class=mut>Số lượt lật: ${m.moves}</span><span class=mut>Đã ghép ${Object.keys(m.done).length/2}/8</span></div><div class="fng fng4" style="margin-top:6px">${m.cards.map((id,i)=>{const up=m.done[i]||m.open.includes(i);return `<button class="fnc ${m.done[i]?'dn':''}" onclick="FUN.mtFlip(${i})" style="min-height:70px">${up?fa(id):'<span style="font-size:1.6rem">❓</span>'}</button>`}).join('')}</div>`}
function mtPaint(){const el=document.getElementById('fnmt');if(el)el.innerHTML=mtBody()}
function vMt(){const f=st(),m=FN.mt;
 if(m&&!m.res)return `<div class=card><div id=fnmt>${mtBody()}</div></div>`;
 let r='';
 if(m&&m.res)r=`<div class=card style="border-color:var(--g2)"><b>Xong sau ${m.moves} lượt lật · ${m.res.sc} điểm</b><p style="margin:6px 0 0">Thưởng: ${rw(m.res.id,m.res.q)}</p><div class=row style="margin-top:6px;justify-content:flex-start"><button class=s onclick="FUN.share('mt')">📸 Khoe điểm</button></div></div>`;
 return r+`<div class=card><b>🃏 Lật thẻ ghép hoa</b><p class=mut style="margin:4px 0 6px">Bảng 4×4 có 8 cặp hoa. Ghép hết càng ít lượt càng nhiều điểm và thưởng.</p><div class=row><span class=mut>Lượt hôm nay: ${f.mt}/${LIM.mt} · Điểm cao nhất: ${f.best.mt||0}</span><button class=p ${f.mt>=LIM.mt?'disabled':''} onclick="FUN.mtStart()">${m&&m.res?'Chơi lại':'Bắt đầu'}</button></div></div>`}

/* ---------- 4. HỘP QUÀ HẰNG NGÀY ---------- */
FUN.box=i=>{const f=st();if(f.box)return;f.box=1;f.pick=i;
 const r=Math.random(),p=pool(6);let pr;
 if(r<.45){const id=rnd(p).id;give(id,3);pr={t:'f',id,q:3}}
 else if(r<.75){xp(8);pr={t:'x',q:8}}
 else if(r<.93){s.money+=20000;L('in','Giải trí','Hộp quà',1,20000);pr={t:'m',q:20000}}
 else if(r<.98){const id=rnd(p).id;give(id,6);pr={t:'f',id,q:6}}
 else{s.money+=100000;L('in','Giải trí','Hộp quà may mắn',1,100000);pr={t:'m',q:100000}}
 f.prize=pr;save();beep(900);ui()};
function vBx(){const f=st();
 if(!f.box)return `<div class=card><b>🎁 Hộp quà hằng ngày</b><p class=mut style="margin:4px 0 6px">Mỗi ngày được mở 1 hộp. Có thể ra hoa, kinh nghiệm hoặc ít tiền. Chọn một hộp nào:</p><div class="fng fng3">${[0,1,2].map(i=>`<button class=fnc onclick="FUN.box(${i})" style="min-height:96px"><span style="font-size:2.4rem">🎁</span></button>`).join('')}</div></div>`;
 const p=f.prize||{},t=p.t=='f'?'Nhận '+rw(p.id,p.q):p.t=='x'?'Nhận '+p.q+' kinh nghiệm':p.t=='m'?'Nhận '+money(p.q):'';
 return `<div class=card style="border-color:var(--g2)"><b>🎁 Hộp quà hôm nay</b><div class=fnbig>🎉</div><p style="text-align:center;margin:4px 0">${t}</p><p class=mut style="text-align:center;margin:0">Mai quay lại để mở hộp mới nhé.</p></div>`}

/* ---------- 5. ĐOÁN GIÁ VÀNG ---------- */
const px=()=>{try{return window.GOLD&&GOLD.px?GOLD.px():null}catch(e){return null}};
function ggCheck(){const f=st(),g=f.gg;if(!g.p0)return false;
 const p=px(),age=Date.now()-g.t0;if(!p||age<3*36e5)return false;
 const res=p.v>g.p0?1:p.v<g.p0?-1:0;if(res==0&&age<24*36e5)return false;
 const win=(res>0&&g.d=='u')||(res<0&&g.d=='d');
 g.last={p0:g.p0,p1:p.v,d:g.d,r:res==0?'draw':win?'win':'lose'};
 if(res!=0){if(win){g.st=(g.st||0)+1;g.bs=Math.max(g.bs||0,g.st);const id=rnd(pool(6)).id;give(id,2);xp(5);g.last.id=id;
   if(g.bs>(f.best.gg||0)){f.best.gg=g.bs;submit('gg',g.bs)}}else g.st=0}
 g.p0=0;g.t0=0;g.d='';save();return true}
FUN.ggPick=d=>{const f=st(),g=f.gg;if(g.p0)return;const p=px();
 if(!p){try{GOLD.refresh()}catch(e){}return toast('Chưa có giá vàng, thử lại sau vài giây')}
 g.p0=p.v;g.t0=Date.now();g.d=d;g.last=null;save();ui()};
setInterval(()=>{try{if(st().gg.p0&&ggCheck()){toast('Đã có kết quả đoán giá vàng!');ui()}}catch(e){}},30000);
function vGg(){const f=st(),g=f.gg;ggCheck();const p=px();
 if(!p&&!FN.ggT){FN.ggT=1;setTimeout(()=>{FN.ggT=0},20000);try{GOLD.refresh()}catch(e){}}
 let r='';
 if(g.last){const l=g.last,t=l.r=='win'?'Đoán đúng! '+(l.id?'Thưởng: '+rw(l.id,2)+' và 5 kinh nghiệm':''):l.r=='lose'?'Chưa đúng lần này, chuỗi thắng về 0.':'Giá không đổi, hoà và không mất lượt.';
  r=`<div class=card style="border-color:${l.r=='win'?'var(--g2)':'var(--ln)'}"><b>Kết quả lần trước</b><p style="margin:4px 0 0">${money(l.p0)} → ${money(l.p1)}<br>${t}</p>${l.r=='win'?'<div class=row style="margin-top:6px;justify-content:flex-start"><button class=s onclick="FUN.share(\'gg\')">📸 Khoe chuỗi thắng</button></div>':''}</div>`}
 const body=g.p0?`<p style="margin:6px 0 0">Bạn đã đoán giá vàng nhẫn 9999 sẽ <b>${g.d=='u'?'tăng':'giảm'}</b> so với <b>${money(g.p0)}</b>. Kết quả có sau ít nhất 3 giờ, quay lại xem nhé.</p>`
  :`<p style="margin:6px 0 4px">Giá hiện tại: <b>${p?money(p.v):'đang tải…'}</b></p><div class=row style="gap:8px"><button class=p style="flex:1" ${p?'':'disabled'} onclick="FUN.ggPick('u')">📈 Sẽ tăng</button><button class=p style="flex:1" ${p?'':'disabled'} onclick="FUN.ggPick('d')">📉 Sẽ giảm</button></div>`;
 return r+`<div class=card><b>🪙 Đoán giá vàng</b><p class=mut style="margin:4px 0 0">Đoán giá vàng thị trường (nhẫn 9999) tăng hay giảm. Đúng thì được 2 bông hoa và kinh nghiệm, chuỗi thắng của bạn lên bảng xếp hạng.</p>${body}<p class=mut style="margin:6px 0 0;font-size:.78rem">Chuỗi thắng: ${g.st||0} · Kỷ lục: ${g.bs||0}</p></div>`}

/* ---------- 6. XẾP HẠNG BẠN BÈ ---------- */
async function lbLoad(force){const B=FN.lb;if(B.busy)return;
 if(typeof currentUser=='undefined'||!currentUser||typeof supabaseClient=='undefined'){B.err='login';return}
 if(!force&&B.data&&B.gk==B.g&&Date.now()-B.t<45000)return;

<script>
/* ===== Mua role Discord (bot gắn role sau khi mua) ===== */
(function(){
const RL={items:[],mine:[],loaded:0,busy:0,err:''};
const sb=()=>typeof supabaseClient!='undefined'?supabaseClient:null;
const logged=()=>typeof currentUser!='undefined'&&!!currentUser&&!!window.DISCORD_OK&&!!sb();
const HEX=/^#[0-9a-fA-F]{6}$/;
function pill(it){const c=HEX.test(it.color||'')?it.color:'#99aab5',c2=HEX.test(it.color2||'')?it.color2:c,e=['gradient','shimmer','holo','glow'].includes(it.effect)?it.effect:'none';
  const lm=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255},lt=e=='none'||e=='glow'||e=='gradient'||e=='shimmer'?Math.min(lm(c),lm(c2))<.3:false;
  return '<span class="rp rp-'+e+(lt?' rp-lt':'')+'" style="--c:'+c+';--c2:'+c2+'"><i></i><span class=rnm>'+esc(it.name)+'</span></span>'}
/* Lấy màu + hiệu ứng thật từ role Discord (bảng guild_roles). Chịu được nhiều kiểu cột: hex, số nguyên, JSON colors */
function dcHex(v){if(v==null||v==='')return '';if(typeof v==='number'){return v>0?'#'+v.toString(16).padStart(6,'0').slice(-6):''}v=String(v).trim();if(/^\d+$/.test(v)){const n=Number(v);return n>0?'#'+n.toString(16).padStart(6,'0').slice(-6):''}if(/^#?[0-9a-fA-F]{6}$/.test(v))return (v[0]=='#'?v:'#'+v).toLowerCase();return ''}
function dcFx(g){
  if(!g)return null;
  let cs=g.colors;if(typeof cs=='string'){try{cs=JSON.parse(cs)}catch(e){cs=null}}cs=cs||{};
  const c1=dcHex(cs.primary_color??cs.primaryColor??g.primary_color??g.color),
        c2=dcHex(cs.secondary_color??cs.secondaryColor??g.secondary_color??g.color2??g.color_secondary),
        c3=dcHex(cs.tertiary_color??cs.tertiaryColor??g.tertiary_color??g.color3??g.color_tertiary),
        holo=!!c3||/holo/i.test(String(g.style||g.effect||''))||g.holographic===true;
  if(!c1&&!c2&&!c3)return null;
  const base=c1||c2||c3;
  return {color:base,color2:c2||base,effect:holo?'holo':(c2&&c2!==base?'gradient':'none')}}
window.ROLEFX={pill,dc:dcFx};
{const st=document.createElement('style');st.textContent='.rp{display:inline-flex;align-items:center;gap:6px;font-weight:700;max-width:100%;min-width:0;line-height:1.4;vertical-align:middle;background:#2b2d31;padding:4px 12px 4px 9px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.3)}.rp.rp-lt{background:#f2f3f5;box-shadow:0 1px 4px rgba(0,0,0,.2)}.rp>i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}.rp .rnm{color:var(--c);display:inline-block;min-width:0;line-height:1.4;padding:.08em .12em;overflow-wrap:anywhere}'
+'.rp-gradient .rnm,.rp-shimmer .rnm{background:linear-gradient(90deg,var(--c),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}'
+'.rp-shimmer .rnm{background-size:200% 100%;animation:rpm 2.2s ease-in-out infinite alternate}'
+'.rp-holo>i{background:linear-gradient(135deg,#ff8aa8,#ffd166,#7cffb2,#6ec6ff,#c39bff)}.rp-holo .rnm{background:linear-gradient(90deg,#ff8aa8,#ffd166,#7cffb2,#6ec6ff,#c39bff,#ff8aa8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rpm 3s linear infinite alternate}'
+'.rp-glow .rnm{text-shadow:0 0 8px var(--c),0 0 2px var(--c)}.rp-glow>i{box-shadow:0 0 8px var(--c)}'
+'@keyframes rpm{from{background-position:0 0}to{background-position:100% 0}}@media(prefers-reduced-motion:reduce){.rp .rnm{animation:none!important}}'
;document.head.appendChild(st)}
const owned=id=>RL.mine.some(x=>x.role_id==id&&x.status!='failed');
async function load(){
  if(RL.busy||!logged())return;RL.busy=1;RL.err='';
  try{
    let a=await sb().from('shop_roles').select('role_id,name,price,description,color,color2,effect').eq('active',true).order('sort');
    if(a.error)a=await sb().from('shop_roles').select('role_id,name,price,description').eq('active',true).order('sort');
    if(a.error)throw a.error;

    // Lấy màu thật từ Discord (bảng guild_roles)
    const ids=(a.data||[]).map(x=>x.role_id);
    let colorMap={};
    if(ids.length){
      const g=await sb().from('guild_roles').select('*').in('role_id',ids);
      if(!g.error&&g.data){
        g.data.forEach(r=>{ const f=dcFx(r); if(f) colorMap[r.role_id]=f; });
      }
    }

    RL.items=(a.data||[]).map(it=>{
      const dc=colorMap[it.role_id];
      // Màu và hiệu ứng lấy theo role trên Discord; không có dữ liệu Discord thì dùng cấu hình trong shop_roles
      return dc?{...it,color:dc.color,color2:dc.color2,effect:dc.effect}
              :{...it,color:it.color||'#99aab5',color2:it.color2||it.color||'#99aab5',effect:it.effect||'none'};
    });

    const b=await sb().from('role_purchases').select('id,role_id,status,refunded,price').eq('user_id',currentUser.id);
    if(b.error)throw b.error;
    RL.mine=b.data||[];RL.loaded=1;
    for(const r of RL.mine.filter(x=>x.status=='failed'&&!x.refunded)){
      const u=await sb().from('role_purchases').update({refunded:true}).eq('id',r.id).eq('refunded',false).select('id');
      if(!u.error&&u.data&&u.data.length){const m=Number(r.price)||0;s.money+=m;L('in','Hoàn tiền','Hoàn tiền role Discord',1,m);r.refunded=true;toast('Đã hoàn tiền một đơn role không gắn được');try{save()}catch(e){}}
    }
  }catch(e){RL.err=String(e&&e.message||e)}
  RL.busy=0;try{if(window.SD){const on=document.querySelector('#sdtabs button.on');if(on&&/'roles'/.test(on.getAttribute('onclick')||''))R()}}catch(e){}}
async function buy(id){
  const it=RL.items.find(x=>x.role_id==id);if(!it||RL.busy)return;
  if(owned(id))return toast('Bạn đã mua role này rồi');
  const price=Number(it.price);if(s.money<price)return toast('Không đủ tiền');
  if(!confirm('Mua role "'+it.name+'" với giá '+$(price)+'?'))return;
  RL.busy=1;
  if(!(await dcGate())){RL.busy=0;return}
  const r=await sb().from('role_purchases').insert({user_id:currentUser.id,discord_id:String(dcMyId()),role_id:id,price}).select('id,role_id,status,refunded,price').single();
  RL.busy=0;
  if(r.error){toast(/duplicate|unique/i.test(r.error.message)?'Bạn đã mua role này rồi':'Không mua được: '+r.error.message);return}
  s.money-=price;L('out','Role Discord','Role '+it.name,1,price);RL.mine.push(r.data);try{save()}catch(e){}
  toast('Đã đặt mua. Bot sẽ gắn role trong giây lát!');R();setTimeout(()=>{if(!RL.busy)load()},8000)}
window.ROLES={buy,reload(){RL.loaded=0;RL.err='';R()},stale(){RL.loaded=0}};
V.roles=()=>{
  const hd='<h3>🛒 Shop roles</h3>';
  if(!logged()||!window.DC_MEM)return '<div class=card>'+hd+'<p class=mut>Đăng nhập Discord và tham gia server của bot để mua role.</p></div>';
  if(RL.err)return '<div class=card>'+hd+'<p class=mut>Không tải được danh sách role: '+esc(RL.err)+'</p><button class=s onclick="ROLES.reload()">Thử lại</button></div>';

  return '<div class=card>'+hd+'<p class=mut>Mua bằng tiền trong game, bot sẽ gắn role cho bạn trên server Discord. Mỗi role mua một lần.</p></div>'+RL.items.map(it=>{
    const m=RL.mine.find(x=>x.role_id==it.role_id&&x.status!='failed'),p=Number(it.price);

    return '<div class=card><div class=row><span>'+pill(it)+''+(it.description?'<br><span class=mut>'+esc(it.description)+'</span>':'')+'</span>'+btn+'</div></div>'}).join('')};

function syncTab(){try{

<script>
/* ===== v63: HÓA ĐƠN CỦA TÔI + GIẤY TỜ VÀNG + ĐĂNG BILL LÊN BẢNG TIN / DISCORD =====
   - Hồ sơ > Hóa đơn: 2 phần "Của khách" (cũ) và "Của tôi" (mới)
   - Mọi khoản chi qua sổ thu chi L('out',...) tự thành 1 hóa đơn (gộp theo từng lần bấm mua)
   - Tiệm vàng: mua / đặt cọc / nhận hàng / bán lại / hủy đơn đều có hóa đơn, món vàng có giấy tờ (mã số, tuổi vàng, khối lượng...)
   - Món vàng mua từ trước được cấp lại hóa đơn khi mở tab
   - Ảnh bill (khách + của tôi) có nút đăng bảng tin / gửi Discord */
(function(){
const E=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SHOP='Tiệm vàng Kim Ngân';
let SEG='k',FLT='a',LIM=30,CTX=null,DB=0;

/* ---------- dữ liệu: s.inv (hóa đơn) + s.invT (tổng cộng dồn, không mất khi dọn bớt) ---------- */
const lst=()=>{if(!Array.isArray(s.inv))s.inv=[];if(!s.invT||typeof s.invT!='object')s.invT={n:0,out:0,in:0};return s.inv};
const tally=()=>{lst();return s.invT};
const nowT=()=>{try{return typeof live!='undefined'&&live&&typeof clk=='function'?clk():''}catch(e){return ''}};
const fw=w=>(Math.round((+w||0)*100)/100).toString().replace('.',',')+' chỉ';
const items=()=>((s.gd&&Array.isArray(s.gd.items))?s.gd.items:[]);
const orders=()=>((s.gd&&Array.isArray(s.gd.orders))?s.gd.orders:[]);

function add(r){
 const T=tally(),A=lst();
 T.n=(T.n||0)+1;r.q=T.n;r.no='HĐ-'+String(T.n).padStart(4,'0');
 r.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 r.d=r.d||s.day;if(r.t==null)r.t=nowT();
 r.tot=Math.max(0,Math.round(r.tot||0));
 T[r.k]=(T[r.k]||0)+r.tot;
 A.unshift(r);
 /* hóa đơn vàng giữ vĩnh viễn (là giấy tờ); các khoản khác giữ 300 hóa đơn gần nhất */
 if(A.length>360){for(let i=A.length-1;i>=0&&A.length>300;i--){if(!A[i].gold)A.splice(i,1)}}
 return r}

/* ---------- nhóm / nhãn ---------- */
const VEN={'Nhập hoa':'Chợ nhập hoa','Giấy gói':'Chợ nhập hoa','Quà tặng':'Chợ nhập hoa','Nâng cấp':'Nâng cấp shop','Mèo':'Cửa hàng thú cưng','Thú cưng':'Cửa hàng thú cưng','Nội thất':'Cửa hàng nội thất','Thuế':'Cơ quan thuế','Thuế & phí':'Thuế & phí mặt bằng','Workshop':'Xưởng thủ công','Nhân viên':'Thuê nhân viên','Diễn đàn':'Diễn đàn mua bán','Role Discord':'Shop role Discord','Tưới hoa':'Tưới hoa','Nhiệm vụ':'Nhiệm vụ'};

const grpOf=r=>(r.gold||r.cat=='Tiệm vàng')?'g':(r.cat=='Nhập hoa'||r.cat=='Giấy gói'||r.cat=='Quà tặng'?'s':'o');

/* ---------- bắt mọi khoản chi qua sổ thu chi, gộp theo từng lần bấm ---------- */
const oL=L;let pend=[],sch=0;
L=function(k,cat,name,q,amt,d){
 const r=oL.apply(this,arguments);
 try{if(k=='out'&&amt>0){pend.push([String(cat||'Chi khác'),String(name||''),q||1,amt,d||s.day]);if(!sch){sch=1;Promise.resolve().then(flush)}}}catch(e){}
 return r};
function flush(){
 sch=0;const P=pend;pend=[];if(!P.length||typeof s=='undefined'||!s)return;
 const by={};P.forEach(p=>{(by[p[4]]=by[p[4]]||[]).push(p)});
 Object.keys(by).forEach(d=>{
  const g=by[d],cats=[...new Set(g.map(x=>x[0]))];
  const ls=g.map(x=>[x[1],Math.round(x[3]/(x[2]||1)),x[2]||1,x[3]]),tot=g.reduce((a,x)=>a+x[3],0);
  add({k:'out',d:+d,t:(+d==s.day?nowT():''),cat:cats[0],ttl:cats.length>1?'Chi tiêu tổng hợp':(g.length==1?g[0][1]:cats[0]),vendor:cats.length>1?'Nhiều khoản chi':vendorOf(cats[0]),ls,tot})});
 try{save()}catch(e){}}

/* ---------- giấy tờ vàng ---------- */
function goldBlock(it,extra){
 let f={loai:'Vàng',kl:'',gem:'',tone:''};try{f=GOLD.info(it)}catch(e){}
 return Object.assign({id:it.id,sn:it.sn||it.id,name:it.name,loai:f.loai,kl:f.kl,gem:f.gem,tone:f.tone,w:it.w,custom:it.custom?1:0,paid:it.paid||0,day:it.day},extra||{})}
const goldLine=(g,p)=>[g.name,p,1,p];
const certRows=g=>[['Mã số',g.sn],['Loại',g.loai+(g.custom?' · Đặt riêng':'')],['Tuổi vàng',g.kl],['Khối lượng',fw(g.w)]].concat(g.tone?[['Màu vàng',g.tone]]:[],g.gem?[['Đá',g.gem]]:[],[['Ngày mua','Ngày '+g.day],['Cấp bởi',SHOP]]);
const certHtml=g=>`<div class=inq><div class=row style="margin:0"><b>📜 Giấy tờ vàng</b><span class="chip${g.sold?'':' gold'}">${g.sold?'Hết hiệu lực':'Chính hãng'}</span></div>${certRows(g).map(x=>`<div class=row style="margin:2px 0"><span class=mut>${E(x[0])}</span><b>${E(x[1])}</b></div>`).join('')}</div>`;

function pick(id){
 const it=items().find(x=>x.id==id),od=orders().find(x=>x.id==id);
 return{money:s.money,ids:items().map(x=>x.id),it:it?Object.assign({},it):null,od:od?{st:od.st,name:od.br&&od.br.name}:null}}
function wrapG(name,fn){
 const o=window.GOLD&&GOLD[name];if(typeof o!='function')return;
 GOLD[name]=function(a){const pre=pick(a);const r=o.apply(this,arguments);try{fn(pre,a)}catch(e){console.warn('[hóa đơn vàng]',e)}return r}}

wrapG('buy',p=>{
 const it=items().find(x=>!p.ids.includes(x.id));if(!it)return;
 const paid=Math.max(0,p.money-s.money)||it.paid||0,g=goldBlock(it,{paid});
 oL('out','Tiệm vàng','Mua '+it.name,1,paid);
 add({k:'out',cat:'Tiệm vàng',ttl:'Mua '+it.name,vendor:SHOP,ls:[goldLine(g,paid)],tot:paid,gold:g,gk:'buy',foot:'Giữ giấy tờ này để bán lại cho tiệm. Cảm ơn quý khách!'});
 try{save()}catch(e){}});

wrapG('accept',(p,id)=>{
 const od=orders().find(x=>x.id==id);if(!od||od.st!='making'||!p.od||p.od.st!='quote')return;
 const dep=Math.max(0,p.money-s.money);if(!dep)return;
 const nm=(od.br&&od.br.name)||'Đơn gia công';
 oL('out','Tiệm vàng','Đặt cọc '+nm,1,dep);
 add({k:'out',cat:'Tiệm vàng',ttl:'Đặt cọc '+nm,vendor:SHOP,ls:[[nm+' (cọc 50%)',dep,1,dep]],tot:dep,gk:'dep',foot:'Hẹn lấy hàng ngày '+od.due+'. Mang hóa đơn này khi nhận hàng.'});
 try{save()}catch(e){}});

wrapG('collect',(p,id)=>{
 const it=items().find(x=>x.id==id);if(!it||p.ids.includes(id))return;
 const bal=p.money-s.money,total=it.paid||0,dep=Math.max(0,total-bal),g=goldBlock(it),k=bal<0?'in':'out',amt=Math.abs(bal);
 if(amt)oL(k,'Tiệm vàng',(bal<0?'Tiệm hoàn lại ':'Nhận hàng ')+it.name,1,amt);
 add({k,cat:'Tiệm vàng',ttl:'Nhận hàng '+it.name,vendor:SHOP,ls:[goldLine(g,total)],adj:[['Đã đặt cọc trước','−'+$(dep)]],tot:amt,gold:g,gk:'buy',foot:'Cân thực tế '+fw(it.w)+'. Giữ giấy tờ này để bán lại cho tiệm.'});
 try{save()}catch(e){}});

wrapG('sell',(p,id)=>{
 if(!p.it||items().some(x=>x.id==id))return;
 const v=Math.max(0,s.money-p.money);
 oL('in','Tiệm vàng','Bán lại '+p.it.name,1,v);
 const g=goldBlock(p.it,{sold:1});
 add({k:'in',cat:'Tiệm vàng',ttl:'Bán lại '+p.it.name,vendor:SHOP,ls:[goldLine(g,v)],tot:v,gold:g,gk:'sell',foot:'Tiệm đã thu mua lại. Giấy tờ của món này hết hiệu lực.'});
 try{save()}catch(e){}});

wrapG('cancel',(p,id)=>{
 if(!p.od||p.od.st!='making'||orders().some(x=>x.id==id))return;
 const r=s.money-p.money;if(r<=0)return;
 const nm=p.od.name||'Đơn gia công';
 oL('in','Tiệm vàng','Hoàn cọc '+nm,1,r);
 add({k:'in',cat:'Tiệm vàng',ttl:'Hủy đơn, hoàn cọc',vendor:SHOP,ls:[[nm+' (hoàn 70% cọc)',r,1,r]],tot:r,gk:'cancel',foot:'Tiệm giữ lại 30% tiền cọc theo quy định.'});
 try{save()}catch(e){}});

/* cấp lại hóa đơn cho vàng đã mua trước khi có sổ hóa đơn */
function backfill(){
 if(!(window.GOLD&&GOLD.info))return;
 const A=lst();let ch=0;
 items().forEach(it=>{
  if(A.some(r=>r.gold&&r.gold.id==it.id&&r.gk=='buy'))return;
  const g=goldBlock(it),paid=it.paid||0;
  add({k:'out',d:it.day||s.day,t:'',cat:'Tiệm vàng',ttl:'Mua '+it.name,vendor:SHOP,ls:[goldLine(g,paid)],tot:paid,gold:g,gk:'buy',bf:1,foot:'Hóa đơn cấp lại cho món đã mua trước khi có sổ hóa đơn.'});ch=1});
 if(ch){try{save()}catch(e){}}}

/* ---------- giao diện: Hồ sơ > Hóa đơn ---------- */
const ob=V.bills;
V.bills=function(){
 const nk=(typeof billN=='function')?billN():0,nmine=tally().n||lst().length;
 const seg=`<div class=card style="padding:6px"><div class=row style="justify-content:flex-start;gap:6px;margin:0"><button class="s ${SEG=='k'?'on2':''}" onclick="INV.seg('k')">👥 Của khách (${nk})</button><button class="s ${SEG=='m'?'on2':''}" onclick="INV.seg('m')">🧾 Của tôi (${nmine})</button></div></div>`;
 return seg+(SEG=='k'?ob():mine())};

function mine(){
 backfill();
 const T=tally(),A=lst().slice().sort((a,b)=>(b.d-a.d)||(b.q-a.q)),F=A.filter(r=>FLT=='a'||grpOf(r)==FLT),sh=F.slice(0,LIM);
 const chips=[['a','Tất cả'],['g','💍 Vàng'],['s','🛒 Nhập hàng'],['o','🧾 Khác']].map(c=>`<button class="s ${FLT==c[0]?'on2':''}" onclick="INV.flt('${c[0]}')">${c[1]}</button>`).join(' ');
 const rows=sh.map(r=>`<div class=row><span style="display:flex;gap:8px;align-items:center"><span style="font-size:1.5rem">${icoOf(r)}</span><span><b>${E(r.ttl)}</b><br><span class=mut>Ngày ${r.d}${r.t?' · '+E(r.t):''} · ${E(r.cat)}${r.gold&&r.gk!='sell'?' · có giấy tờ':''}</span></span></span><span><b class="${r.k=='in'?'ok':'bad'}">${r.k=='in'?'+':'−'}${$(r.tot)}</b> <button class=s onclick="INV.view('${r.id}')">Xem bill</button></span></div>`).join('');
 return `<div class=card><div class=row><b>Sổ chi tiêu của tôi</b></div><div class=row><span>Tổng chi đã ghi</span><b class=bad>${$(T.out||0)}</b></div><div class=row><span>Tổng thu (bán lại, hoàn cọc)</span><b class=ok>${$(T.in||0)}</b></div><p class=mut style="margin:6px 0">${T.n||0} hóa đơn. Hóa đơn vàng được giữ mãi vì là giấy tờ; các khoản khác lưu 300 hóa đơn gần nhất, tổng tiền vẫn được cộng dồn.</p><div class=row style="justify-content:flex-start;gap:6px">${chips}</div></div><div class=card>${rows||'<p class=mut>Chưa có khoản chi nào. Từ giờ mọi khoản chi sẽ được ghi lại ở đây.</p>'}${F.length>LIM?`<div class=row style="justify-content:center"><button class=s onclick="INV.more()">Xem thêm</button></div>`:''}</div>`}

const lnH=(t,v,c)=>`<div class=row style="margin:2px 0"><span>${t}</span><b class="${c||''}">${v}</b></div>`;
function tbl(ls){
 if(typeof ivt=='function')return ivt(ls);
 return ls.map(l=>`<div class=row><span>${E(l[0])} × ${l[2]}</span><b>${$(l[3])}</b></div>`).join('')}

function myBill(id){
 const r=lst().find(x=>x.id==id);if(!r)return;const out=r.k!='in';
 $q('modal').innerHTML=`<div class=mb onclick="if(event.target==this)mdl()"><div class=ms><div class=row><h2>Hóa đơn</h2><button class=s onclick=mdl()>✕</button></div><div class=card style="border-style:dashed"><div style="text-align:center"><b class=hand>${E(s.name)}</b><br><span class=mut>Ngày ${r.d}${r.t?' · '+E(r.t):''} · ${E(r.no)}</span></div><div class=inq>${out?'Mua tại':'Nhận từ'}: <b>${E(r.vendor)}</b></div><div class=inq>${tbl(r.ls)}</div>${r.gold?certHtml(r.gold):''}<div class=inq>${(r.adj||[]).map(a=>lnH(E(a[0]),E(a[1]))).join('')}${lnH(out?'Tổng cộng':'Tổng nhận',$(r.tot),out?'bad':'ok')}</div><p class=mut style="text-align:center;margin:6px 0 0">${E(r.foot||'Cảm ơn quý khách')}</p></div><div class=row><button class=p onclick="INV.img('${r.id}')">🖼 Lưu / chia sẻ ảnh bill</button></div></div></div>`}

/* ---------- ảnh bill (cùng kiểu với ảnh bill khách) ---------- */
function myBillCv(r){
 const out=r.k!='in',ls=r.ls,adj=r.adj||[],g=r.gold,rows=g?certRows(g):[],gH=g?68+40*rows.length:0;
 const W=720,[c,x]=billPaper(W,540+rowsH(ls)+adj.length*50+gH);
 x.fillText(`${out?'HÓA ĐƠN MUA':'PHIẾU THU'} · Ngày ${r.d}${r.t?' · '+r.t:''}`,W/2,160);dashL(x,190,W);
 x.textAlign='left';x.fillStyle='#244033';x.font='600 30px Onest,sans-serif';x.fillText((out?'Mua tại: ':'Nhận từ: ')+r.vendor,80,240,430);
 x.font='600 22px Onest,sans-serif';x.fillStyle='#678a73';x.textAlign='right';x.fillText(r.no,W-80,240);
 x.fillText('Giá',420,292);x.textAlign='left';x.fillText('Sản phẩm',80,292);x.textAlign='center';x.fillText('SL',466,292);x.textAlign='right';x.fillText('Thành tiền',W-80,292);hdrLn(x);
 let y=338;x.font='26px Onest,sans-serif';x.fillStyle='#244033';
 y=rowsDraw(x,ls,y,W);
 dashL(x,y-16,W);y+=30;
 adj.forEach(a=>{x.textAlign='left';x.fillText(a[0],80,y);x.textAlign='right';x.fillText(a[1],W-80,y);y+=50});
 if(g){
  x.textAlign='left';x.fillStyle='#678a73';x.font='600 24px Onest,sans-serif';x.fillText('📜 Giấy tờ vàng · '+(g.sold?'hết hiệu lực':'chính hãng'),80,y,560);y+=16;
  rows.forEach(rw=>{y+=40;x.textAlign='left';x.fillStyle='#678a73';x.font='24px Onest,sans-serif';x.fillText(rw[0],80,y);x.textAlign='right';x.fillStyle='#244033';x.font='600 24px Onest,sans-serif';x.fillText(String(rw[1]),W-80,y,380)});
  dashL(x,y+12,W);y+=52}
 x.font='700 40px "Baloo 2",sans-serif';x.textAlign='left';x.fillStyle='#244033';x.fillText(out?'Tổng cộng':'Tổng nhận',80,y+10);
 x.textAlign='right';x.fillStyle=out?'#d9534f':'#388a55';x.fillText($(r.tot),W-80,y+10);y+=75;
 x.textAlign='center';x.fillStyle='#678a73';x.font='26px Onest,sans-serif';x.fillText(r.foot||'Cảm ơn quý khách',W/2,y,560);
 billReset();return c}

/* thêm ô chú thích + nút đăng bảng tin / Discord dưới ảnh bill */
function shExtra(ctx){
 CTX=ctx;
 try{
  const rw=[...document.querySelectorAll('#modal .ms > .row')].pop();if(!rw)return;
  rw.insertAdjacentHTML('beforebegin',`<div class=sec>Chú thích khi đăng (không bắt buộc)</div><div class=row><input maxlength=200 placeholder="Viết vài dòng cho bài đăng..." value="${E(typeof FEEDCAP!='undefined'?FEEDCAP:'')}" oninput="FEEDCAP=this.value" style="width:100%"></div>`);
  rw.insertAdjacentHTML('beforeend','<button class=p onclick="postDayToFeed()">📌 Đăng lên bảng tin</button><button class=p onclick="INV.disc()">💬 Chia sẻ lên Discord</button>')
 }catch(e){console.error(e)}}

async function img(id){
 const r=lst().find(x=>x.id==id);if(!r)return;
 await fontsOK2();shOpen(myBillCv(r),'justaseed-hoadon-'+r.no+'.png','Ảnh hóa đơn');shExtra({t:'m',id})}

/* ảnh bill của khách cũng có nút đăng */
imgBill=async function(id){
 const b=(s.bills||[]).find(x=>x.id==id);if(!b)return;
 await fontsOK2();shOpen(billCv(b),'justaseed-bill-'+b.id+'.png','Ảnh hóa đơn');shExtra({t:'c',id})};

async function disc(){
 if(DB)return;
 if(!CTX||typeof SHC=='undefined'||!SHC)return toast('Chưa có ảnh để gửi');
 if(typeof dcSend!='function')return toast('Chưa dùng được tính năng Discord');
 DB=1;
 try{
  const cap=String(typeof FEEDCAP!='undefined'?FEEDCAP:'').replace(/[ \t]+/g,' ').trim().slice(0,200),shop=String(s.name||'Tiệm hoa').slice(0,60);
  let kind='bill',pl;
  if(CTX.t=='c'){
   const b=(s.bills||[]).find(x=>x.id==CTX.id);if(!b)throw new Error('Không tìm thấy hóa đơn');
   pl={bill_type:'customer',customer:String(b.nm||'').slice(0,40),vip:b.vip?1:0,total:b.run?0:(b.pr+b.xp+b.tip),stars:b.st|0,run:b.run?1:0,day:b.d,shop_name:shop,caption:cap}
  }else{
   const r=lst().find(x=>x.id==CTX.id);if(!r)throw new Error('Không tìm thấy hóa đơn');
   if(r.gold&&window.GOLD&&GOLD.val){
    const g=r.gold,it=items().find(x=>x.id==g.id);kind='gold';
    pl={name:String(g.name||'').slice(0,60),type:g.loai,emoji:'🧾',weight:fw(g.w),karat:g.kl,gem:g.gem,tone:g.tone,custom:g.custom?1:0,value:it?(GOLD.val(it)|0):0,paid:g.paid|0,invoice:1,invoice_no:r.no,shop_name:shop,caption:cap}
   }else pl={bill_type:'mine',title:String(r.ttl||'').slice(0,80),category:r.cat,vendor:r.vendor,direction:r.k,total:r.tot,day:r.d,invoice_no:r.no,shop_name:shop,caption:cap}}
  const ok=await dcSend(kind,SHC.toDataURL('image/png'),pl,true);
  if(ok)toast('Đã gửi yêu cầu. Bot sẽ đăng lên Discord trong giây lát!')
 }catch(e){toast('Không gửi được: '+(e&&e.message||e))}
 DB=0}

window.INV={
 seg(v){SEG=v;R()},flt(v){FLT=v;LIM=30;R()},more(){LIM+=30;R()},
 view:myBill,img,disc,
 gold(id){backfill();const r=lst().find(x=>x.gold&&x.gold.id==id&&x.gk=='buy');if(!r)return toast('Chưa có hóa đơn cho món này');myBill(r.id)}};

/* nút Discord chỉ hiện khi đã là thành viên server (cùng cơ chế các nút Discord khác) */
document.head.insertAdjacentHTML('beforeend','<style>html:not(.dcok) button[onclick*="INV.disc"]{display:none!important}</style>');
})();
</script>

<script>
(function(){
/* Máy tính: kéo-thả bằng chuột hoặc lăn chuột để lướt ngang các thanh (giấy gói, hoa văn, khách, tab...) */
const NO='input,textarea,select,canvas,[contenteditable],[data-nodrag]';
const hs=el=>{for(let n=el;n&&n!==document.body;n=n.parentElement){
 if(n.matches&&n.matches('nav.fx'))return null;
 const o=getComputedStyle(n).overflowX;if((o=='auto'||o=='scroll')&&n.scrollWidth>n.clientWidth+2)return n}return null};
let d=null,sup=0;
document.addEventListener('pointerdown',e=>{
 if(e.pointerType!=='mouse'||e.button||(e.target.closest&&e.target.closest(NO)))return;
 const n=hs(e.target);if(n)d={n,x:e.clientX,l:n.scrollLeft,m:0}},true);
document.addEventListener('pointermove',e=>{
 if(!d)return;const dx=e.clientX-d.x;
 if(!d.m&&Math.abs(dx)>5){d.m=1;document.body.classList.add('hdrag')}
 if(d.m){d.n.scrollLeft=d.l-dx;e.preventDefault()}},true);
const end=()=>{if(d){sup=d.m;d=null;document.body.classList.remove('hdrag');if(sup)setTimeout(()=>sup=0,60)}};
addEventListener('pointerup',end,true);addEventListener('pointercancel',end,true);
/* kéo xong thì không tính là bấm nhầm vào nút bên dưới */
document.addEventListener('click',e=>{if(sup){e.stopPropagation();e.preventDefault();sup=0}},true);
/* lăn chuột dọc -> lướt ngang khi đang trỏ vào thanh ngang */
document.addEventListener('wheel',e=>{
 if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
 const n=hs(e.target);if(!n)return;
 const max=n.scrollWidth-n.clientWidth,nx=Math.max(0,Math.min(max,n.scrollLeft+e.deltaY));
 if(nx!==n.scrollLeft){n.scrollLeft=nx;e.preventDefault()}},{passive:false});
})();
</script>
<style>

.cpb{background:var(--card);color:var(--ink);border-radius:22px;padding:14px;max-width:100%;width:fit-content}

.cpb canvas.rd{border-radius:50%}.cpb input[type=range]{width:100%;padding:0;border:0}
.stl{position:relative;margin:16px 0 10px}
.sta{position:absolute;left:-4px;top:-8px;width:56px;height:56px;border-radius:50%;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sta .fr{position:absolute;inset:0;border-radius:50%}
.sta .sai{position:absolute;inset:4px;border-radius:50%;background:var(--g) center/cover;color:var(--g3);display:grid;place-items:center;font:700 1.3rem 'Baloo 2';overflow:hidden}
.stn{margin:0 0 4px 56px;font:700 1.05rem 'Baloo 2';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stb{display:grid;grid-template-columns:1fr 50px;gap:6px 8px;padding:8px;background:color-mix(in srgb,var(--g) 38%,var(--card));border-radius:16px;align-items:center}

.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;grid-column:1}
.stt{aspect-ratio:1;border-radius:12px;background:var(--card);border:2px solid var(--ln);display:grid;place-items:center;position:relative;overflow:hidden}

<script>
(()=>{
const Q=i=>document.getElementById(i),H=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ok=()=>!!(typeof currentUser!=='undefined'&&currentUser&&window.DISCORD_OK&&typeof supabaseClient!=='undefined'&&supabaseClient);
const sb=()=>supabaseClient,uid=()=>currentUser.id;
const names=()=>{const m={};[...fl(),...P,...G].forEach(x=>m[x.id]=x.n);return m};
const money=n=>(typeof $==='function'?$(n):Number(n).toLocaleString('vi-VN')+'đ');

/* ===== 1. CẮT & CHỈNH ẢNH (avatar + bìa) ===== */
function crop(file,w,h,round,done){
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onerror=()=>toast('Không đọc được ảnh');im.onload=()=>{
  const W=Math.min(320,innerWidth-64),Hh=Math.round(W*h/w);let z=1,rot=0,ox=0,oy=0;
  const m=document.createElement('div');m.className='cpm';
  m.innerHTML=`<div class=cpb><h3>${round?'Cắt ảnh đại diện':'Cắt ảnh bìa'}</h3><canvas id=cpc class="${round?'rd':''}" width=${W} height=${Hh}></canvas><label class=mut>Phóng to<input id=cpz type=range min=1 max=4 step=.01 value=1></label><p class=mut style="margin:4px 0">Kéo ảnh để chỉnh vị trí.</p><div class=row><button class=s id=cpr>↻ Xoay</button><span><button class=s id=cpx>Hủy</button> <button class=p id=cpo>Lưu ảnh</button></span></div></div>`;
  document.body.appendChild(m);const cv=Q('cpc');
  const dims=()=>{const sw=rot%2;const iw=sw?im.height:im.width,ih=sw?im.width:im.height;return[iw,ih,Math.max(W/iw,Hh/ih)*z]};
  const clamp=()=>{const[iw,ih,k]=dims(),mx=Math.max(0,(iw*k-W)/2),my=Math.max(0,(ih*k-Hh)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))};
  const draw=(c,f)=>{clamp();const k=dims()[2];c.setTransform(f,0,0,f,0,0);c.fillStyle='#fff';c.fillRect(0,0,W,Hh);c.translate(W/2+ox,Hh/2+oy);c.rotate(rot*Math.PI/2);c.scale(k,k);c.drawImage(im,-im.width/2,-im.height/2)};
  const paint=()=>draw(cv.getContext('2d'),1);paint();
  let d=null;cv.onpointerdown=e=>{d=[e.clientX,e.clientY,ox,oy];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
  cv.onpointermove=e=>{if(!d)return;ox=d[2]+e.clientX-d[0];oy=d[3]+e.clientY-d[1];paint()};
  cv.onpointerup=cv.onpointercancel=()=>{d=null;cv.style.cursor='grab'};
  Q('cpz').oninput=e=>{z=+e.target.value;paint()};
  Q('cpr').onclick=()=>{rot=(rot+1)%4;ox=oy=0;paint()};
  Q('cpx').onclick=()=>m.remove();
  Q('cpo').onclick=()=>{const o=document.createElement('canvas');o.width=w;o.height=h;draw(o.getContext('2d'),w/W);m.remove();done(o)};
 };im.src=r.result};r.readAsDataURL(file)}
avUp=function(i){const f=i.files&&i.files[0];i.value='';if(f)crop(f,256,256,1,c=>{s.pf.av=c.toDataURL('image/jpeg',.85);save();if(scr=='game')R();pfm()})};
coverUp=function(i){const f=i.files&&i.files[0];i.value='';if(f)crop(f,720,270,0,c=>cvSet(c))};

/* ===== 2. MUA – BÁN (chỉ người đã đăng nhập Discord) ===== */
const MK={mode:'feed',stalls:null,mine:null,load:0,err:''};
const call=async(fn,a)=>{const{data,error}=await sb().rpc(fn,a);if(error){toast('Lỗi: '+error.message);return null}if(data&&data.ok===false){toast(data.msg||'Không thực hiện được');return null}return data};
async function load(){
 MK.load=1;
 try{
  const{data,error}=await sb().from('stalls').select('user_id,name,intro,avatar,items,updated_at').order('updated_at',{ascending:false}).limit(40);
  if(error)throw error;
  MK.stalls=data||[];MK.mine=MK.stalls.find(x=>x.user_id==uid())||null;
  if(!MK.mine){const r=await sb().from('stalls').select('user_id,name,intro,avatar,items').eq('user_id',uid()).maybeSingle();MK.mine=r.data;if(r.data)MK.stalls.unshift(r.data)}
  if(MK.mine){const key=frCur()+'|'+((s.pf&&s.pf.av)||'').length;
   if(MK.sk!==key&&(AVP(MK.mine.avatar).fr!==frCur()||(s.pf&&s.pf.av&&AVP(MK.mine.avatar).src!==s.pf.av))){MK.sk=key;
    const want=avWith((s.pf&&s.pf.av)||AVP(MK.mine.avatar).src||null);
    try{const r2=await sb().rpc('stall_open',{p_name:MK.mine.name,p_intro:MK.mine.intro||'',p_avatar:want});if(!r2.error)MK.mine.avatar=want}catch(e){}}}
  const c=await sb().from('stall_orders').update({claimed:true}).eq('seller',uid()).eq('claimed',false).select('qty,total');
  if(c.data&&c.data.length){const sum=c.data.reduce((a,x)=>a+x.total,0);s.money+=sum;save();toast('🧺 Sạp vừa bán được '+money(sum));}
  MK.err='';
 }catch(e){MK.err=e.message||'Lỗi tải dữ liệu';MK.stalls=MK.stalls||[]}
 MK.load=0;if(tab=='forum'&&MK.mode=='mk')R();
}
/* khung avatar sạp: lưu kèm trong trường avatar dạng ~f<số>~<ảnh> (không cần đổi database) */
const FR=()=>typeof FRM!='undefined'?FRM:[{n:'Chủ đề',c:'background:var(--g2)'}];
const AVP=a=>{const m=/^~f(\d)~/.exec(a||'');return{fr:m?+m[1]:0,src:m?a.slice(m[0].length):(a||'')}};
const frCur=()=>{const p=s.pf||{},f=p.fr||0,F=FR()[f];return F&&!(F.a&&!p.afr)?f:0};
const avWith=a=>{const f=frCur();return f>0?'~f'+f+'~'+(a||''):a};
function avHtml(x,st){let p=AVP(x.avatar);try{if(x.user_id==uid())p={fr:frCur(),src:(s.pf&&s.pf.av)||p.src}}catch(e){}const f=FR()[p.fr]||FR()[0];return `<div class=sta style="${st||''}"><span class="fr ${f.a?'frA':''}" style="${f.c||''}"></span><span class=sai style="${p.src?`background-image:url('${H(p.src)}')`:''}">${p.src?'':H((x.name||'?')[0].toUpperCase())}</span></div>`}
/* món workshop trên sạp: id = 'w:' + snapshot mã hóa */
const PMX={fa:4e5,pf:5e5,br:2e5,ca:25e4,po:35e4,sh:4e5,ar:45e4};
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const WC={};
const wsOf=id=>{if(typeof id!='string'||id.slice(0,2)!='w:')return null;if(id in WC)return WC[id];let r=null;
 try{let b=id.slice(2).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const o=JSON.parse(decodeURIComponent(escape(atob(b))));r=XB.att.clean(o);if(r)r.p=Math.max(1000,Math.min(PMX[r.t]||1e5,Math.round(+o.p)||r.vl||1000))}catch(e){r=null}return WC[id]=r};
const ART=id=>{const w=wsOf(id);return w?WSI.icon(w,30):art(id)};
async function wsPack(x){const sn=XB.att.snap(x);if(!sn)return null;let u=x.u||'';
 if(!u&&x.im&&(x.t=='sh'||x.t=='ar')){try{const j=await feedJpeg('data:'+x.im),up=await feedUp(j),pf=FEEDPFX();if(typeof up=='string'&&up.startsWith(pf))u=up.slice(pf.length)}catch(e){}}
 const o={k:'w',t:sn.t,n:sn.n,q:sn.q,vl:sn.vl,p:x.p,cl:sn.cl,v:sn.v,ex:sn.ex,sc:sn.sc,mt:(sn.mt||'').slice(0,60),cr:sn.cr,gf:0};if(u)o.u=u;return o}
function stallCard(x,i){
 const it=(x.items||[]).filter(t=>t.qty>0),t4=it.slice(0,4);
 let g=t4.map(t=>`<div class=stt>${ART(t.id)}<small>${t.qty}</small></div>`).join('');for(let k=t4.length;k<4;k++)g+='<div class="stt e"></div>';
 return `<div class=stl>${avHtml(x)}<div class=stn>${H(x.name)}</div><div class=stb><div class=sti>${H(x.intro||'Sạp chưa có lời giới thiệu.')}</div><div class=stg>${g}</div><button class=sto onclick="MKT.view('${x.user_id}')" aria-label="Xem đầy đủ sạp ${H(x.name)}">${ic('shop',24)}</button></div></div>`}
function mkView(){
 if(MK.stalls===null&&!MK.load)load();
 const mine=MK.mine;
 let h=`<div class=card><div class=row><h3>🧺 Chợ người chơi</h3>${mine?`<button class=p onclick="MKT.manage()">Sạp của tôi</button>`:`<button class=p onclick="MKT.reg()">Mở sạp</button>`}</div><p class=mut style="margin:0">Mỗi người một sạp. Bạn bán được mọi thứ đang có trong Túi đồ.</p></div>`;
 if(MK.err)h+=`<div class=card><p class=bad>${H(MK.err)}</p><p class=mut>Nếu đây là lần đầu, hãy chạy file stall_setup.sql trong Supabase.</p></div>`;
 if(MK.stalls===null)return h+'<p class=mut style="text-align:center">Đang tải các sạp…</p>';
 const list=MK.stalls.filter(x=>x.user_id!=uid());
 h+=`<div class=card style="padding:10px 12px 4px">${mine?stallCard(mine,0):''}${list.map(stallCard).join('')||(mine?'':'<p class=mut>Chưa có sạp nào. Hãy là người mở sạp đầu tiên!</p>')}</div>`;
 return h}
const modal=h=>{Q('modal').innerHTML=`<div class=mb onclick="if(event.target==this)mdl()"><div class=ms>${h}</div></div>`};
const find=u=>MK.stalls&&MK.stalls.find(x=>x.user_id==u);
window.MKT={
 mode(m){MK.mode=m;if(m=='mk')MK.stalls=null;R()},
 async reg(){const nm=(s.name||'Sạp của tôi').slice(0,40);const av=avWith(s.pf&&s.pf.av||(currentUser.user_metadata&&currentUser.user_metadata.avatar_url)||null);
  if(await call('stall_open',{p_name:nm,p_intro:'',p_avatar:av})===null)return;await load();toast('Đã mở sạp!');MKT.manage()},
 async info(){const av=avWith(s.pf&&s.pf.av||AVP(MK.mine.avatar).src||null);
  if(await call('stall_open',{p_name:Q('mn').value.trim()||'Sạp',p_intro:Q('mi').value.trim(),p_avatar:av})===null)return;await load();toast('Đã lưu thông tin sạp');MKT.manage()},
 manage(){const m=MK.mine;if(!m)return;const N=names(),on=(m.items||[]).filter(t=>t.qty>0),bag=Object.keys(s.st).filter(k=>N[k]&&(s.st[k]||0)>0);
  modal(`<div class=row><h2>Sạp của tôi</h2><button class=s onclick="mdl()" aria-label="Đóng">✕</button></div>
  <div class=card><input id=mn value="${H(m.name)}" maxlength=40 placeholder="Tên sạp" style="width:100%"><textarea id=mi maxlength=200 rows=2 placeholder="Giới thiệu sạp" style="width:100%;margin:6px 0">${H(m.intro)}</textarea><button class=p onclick="MKT.info()">Lưu thông tin</button></div>
  <div class=card><h3>Đang bán</h3>${on.map(t=>`<div class=mkr><span class=nm>${ART(t.id)}<b>${H(t.n)}</b></span><span class=mut>${t.qty} × ${money(t.price)}</span><button class=s onclick="MKT.unlist('${t.id}')">Rút về túi</button></div>`).join('')||'<p class=mut>Chưa đưa món nào lên sạp.</p>'}</div>
  <div class=card><h3>🎓 Túi đồ workshop</h3>${(s.shelf||[]).slice().reverse().slice(0,40).map((x,i)=>{const sn=XB.att.snap(x)||{};return `<div class=mkr><span class=nm>${WSI.icon(x,34)}<b>${H(x.n)}</b></span><span class=mut>CL ${x.q}/100</span><input id=wp${i} type=number min=1 value=${sn.vl||''} placeholder="Giá" aria-label="Giá bán"><button class=p onclick="MKT.lw('${x.id}',${i})">Bán</button></div>`}).join('')||'<p class=mut>Túi workshop trống. Hãy làm sản phẩm ở các bàn workshop.</p>'}</div>
  <div class=card><h3>Trong Túi đồ</h3>${bag.map((k,i)=>`<div class=mkr><span class=nm>${art(k)}<b>${H(N[k])}</b></span><span class=mut>có ${s.st[k]}</span><input id=lq${i} type=number min=1 max=${s.st[k]} value=${s.st[k]} aria-label="Số lượng"><input id=lp${i} type=number min=1 placeholder="Giá/cái" aria-label="Giá mỗi cái"><button class=p onclick="MKT.list('${k}',${i})">Bán</button></div>`).join('')||'<p class=mut>Túi đồ đang trống.</p>'}</div>`)},
 async list(k,i){const N=names(),q=Math.min(s.st[k]||0,parseInt(Q('lq'+i).value)||0),p=parseInt(Q('lp'+i).value)||0;
  if(q<1)return toast('Nhập số lượng');if(p<1)return toast('Nhập giá bán');
  if(await call('stall_list',{p_item:k,p_n:N[k],p_qty:q,p_price:p})===null)return;
  s.st[k]-=q;save();await load();MKT.manage();toast('Đã đưa '+q+' '+N[k]+' lên sạp')},
 addW(w){s.shelf=s.shelf||[];s.shelf.push({id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),t:w.t,n:w.n,q:w.q,p:w.p,on:0,cl:w.cl||[],v:w.v,ex:w.ex,sc:w.sc,mt:w.mt,im:'',u:w.u||'',cr:w.cr,crd:'',gfd:'',gf:'',gm:''})},
 async lw(id,i){const x=(s.shelf||[]).find(y=>y.id==id);if(!x)return;const p=parseInt(Q('wp'+i).value)||0;if(p<1)return toast('Nhập giá bán');
  toast('Đang đưa lên sạp…');const o=await wsPack(x);if(!o)return toast('Không đưa được món này lên sạp');
  const pid='w:'+b64e(o);if(pid.length>1500)return toast('Món quá nặng để bán trên sạp');
  if(await call('stall_list',{p_item:pid,p_n:String(x.n).slice(0,40),p_qty:1,p_price:p})===null)return;
  const j=s.shelf.findIndex(y=>y.id==id);if(j>=0)s.shelf.splice(j,1);save();await load();MKT.manage();toast('Đã đưa '+x.n+' lên sạp')},
 async unlist(k){const r=await call('stall_unlist',{p_item:k,p_qty:999999});if(r===null)return;
  const w=wsOf(k);if(w){for(let n=0;n<(r.qty|0);n++)MKT.addW(w);save();await load();MKT.manage();return toast(r.qty>0?'Đã rút '+r.qty+' món về túi workshop':'Món đã được bán')}
  s.st[k]=(s.st[k]||0)+r.qty;save();await load();MKT.manage();toast('Đã rút '+r.qty+' về túi')},
 view(u){const x=find(u);if(!x)return;const it=(x.items||[]).filter(t=>t.qty>0),me=u==uid();
  modal(`<div class=row><h2>${H(x.name)}</h2><button class=s onclick="mdl()" aria-label="Đóng">✕</button></div><div class=card><div style="display:flex;gap:10px;align-items:center">${avHtml(x,'position:relative;left:0;top:0;flex:none')}<span>${H(x.intro||'Sạp chưa có lời giới thiệu.')}</span></div></div>
  <div class=card>${it.map((t,i)=>`<div class=mkr><span class=nm>${ART(t.id)}<b>${H(t.n)}</b></span><span class=mut>còn ${t.qty} · ${money(t.price)}</span>${me?'':`<input id=bq${i} type=number min=1 max=${t.qty} value=1 aria-label="Số lượng"><button class=p onclick="MKT.buy('${u}',${i})">Mua</button>`}</div>`).join('')||'<p class=mut>Sạp đang trống.</p>'}</div>`)},
 async buy(u,i){const x=find(u),t=x&&(x.items||[]).filter(t=>t.qty>0)[i];if(!t)return;
  const q=Math.max(1,Math.min(t.qty,parseInt(Q('bq'+i).value)||1));
  if(s.money<q*t.price&&!s.dev)return toast('Không đủ tiền');
  const r=await call('stall_buy',{p_seller:u,p_item:t.id,p_qty:q});if(r===null){await load();return MKT.view(u)}
  if(!s.dev)s.money-=r.total;const bw=wsOf(t.id);if(bw){for(let n=0;n<q;n++)MKT.addW(bw)}else s.st[t.id]=(s.st[t.id]||0)+q;try{L('out','Sạp '+x.name,'Mua '+t.n,q,r.total)}catch(e){}
  save();toast('Đã mua '+q+' '+t.n);await load();MKT.view(u)}
};

const baseF=V.forum;
V.forum=function(){
 if(!ok()){MK.mode='feed';return baseF()}
 const b=m=>`class="s ${MK.mode==m?'on2':''}" onclick="MKT.mode('${m}')"`;
 return `<div class=row style="justify-content:flex-start;gap:6px"><button ${b('feed')}>💬 Diễn đàn</button><button ${b('mk')}>🧺 Mua – bán</button></div>`+(MK.mode=='mk'?mkView():baseF());
};
})();
</script>
<style>
/* ===== Xem video dạng cửa sổ nổi (kiểu Picture-in-Picture): kéo thả, hít vào góc, chụm để đổi cỡ ===== */

#spEmb.movie #spCt{display:flex}
#spEmb.movie.ctl #spCt{opacity:1}
#spCt button{pointer-events:none;position:absolute;border:0;padding:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;line-height:1;font-family:inherit}
#spEmb.movie.ctl #spCt button{pointer-events:auto}
#spPp{width:44px;height:44px;font-size:1.15rem;left:50%;top:42%;transform:translate(-50%,-50%)}
#spB10,#spF10{width:40px;height:32px;font-size:.78rem;font-weight:700;border-radius:10px;top:42%;transform:translateY(-50%)}
#spB10{left:12%}
#spF10{right:12%}
#spSz{width:30px;height:30px;right:6px;top:6px;bottom:auto;font-size:.95rem}
#spProg{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:6px;pointer-events:none}
#spEmb.movie.ctl #spProg{pointer-events:auto}
#spProg span{font-size:.68rem;font-weight:700;color:#fff;min-width:2.2em;text-shadow:0 1px 2px #000}
#spProg input[type=range]{flex:1;min-width:0;margin:0;padding:0;height:18px;accent-color:#7bd88f;background:transparent}
#spEmb.movie:not(.ctl) #spX{opacity:0;pointer-events:none}
#spEmb.movie #spX{z-index:3;transition:opacity .18s}
@media(prefers-reduced-motion:reduce){#spEmb.movie.pin{animation:none}}
</style>
<script>
(()=>{
const em=document.getElementById('spEmb');if(!em)return;
em.insertAdjacentHTML('beforeend','<div id="spDr"></div><div id="spCt"><button id="spB10" aria-label="Tua lùi 10 giây">−10</button><button id="spPp" aria-label="Phát / tạm dừng"></button><button id="spF10" aria-label="Tua tới 10 giây">+10</button><button id="spSz" aria-label="Đổi cỡ cửa sổ">⤢</button><div id="spProg"><span id="spT0">0:00</span><input id="spSk" type="range" min="0" max="1000" value="0" aria-label="Tua video"><span id="spT1">0:00</span></div></div>');
const dr=document.getElementById('spDr'),pp=document.getElementById('spPp'),sz=document.getElementById('spSz');
const b10=document.getElementById('spB10'),f10=document.getElementById('spF10'),sk=document.getElementById('spSk'),t0=document.getElementById('spT0'),t1=document.getElementById('spT1');
const fmMs=ms=>{ms=Math.max(0,Math.round((ms||0)/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')};
let seeking=0;
function paintProg(){
  try{
    if(!window.MS||!MS.now){if(sk)sk.value=0;if(t0)t0.textContent='0:00';if(t1)t1.textContent='0:00';return}
    const d=MS.dur||MS.now.dur||0;
    let e;try{e=(typeof est==='function')?est():MS.pos||0}catch(x){e=MS.pos||0}
    if(t1)t1.textContent=fmMs(d);
    if(!seeking){if(t0)t0.textContent=fmMs(e);if(sk&&d)sk.value=Math.round(Math.min(1,e/d)*1000);else if(sk)sk.value=0}
    if(pp)pp.textContent=(MS.playing)?'⏸':'▶';
  }catch(x){}
}
setInterval(paintProg,400);
const pb=document.createElement('div');pb.style.cssText='position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';document.body.appendChild(pb);
const ins=()=>{const c=getComputedStyle(pb);return{t:parseFloat(c.paddingTop)||0,b:parseFloat(c.paddingBottom)||0}};
const M=10,RES=140,MINW=176;
const maxW=()=>Math.max(MINW,Math.min(440,innerWidth-2*M));
const defW=()=>Math.max(MINW,Math.min(230,Math.round(innerWidth*.58)));
const st={c:'br',w:0,on:0,x:0,y:0,ct:0,tm:0};
const H=w=>Math.round(w*9/16);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function corner(c,w){const h=H(w),i=ins();
 const bot=Math.max(i.t+M,innerHeight-h-i.b-RES);
 return{x:c[1]=='l'?M:innerWidth-w-M,y:c[0]=='t'?i.t+M:bot}}
function put(x,y,w,anim){
 em.style.transition=anim?'left .3s cubic-bezier(.2,.9,.3,1),top .3s cubic-bezier(.2,.9,.3,1),width .22s ease,height .22s ease':'none';
 em.style.width=w+'px';em.style.height=H(w)+'px';em.style.left=x+'px';em.style.top=y+'px';st.x=x;st.y=y}
function snap(anim){
 const w=st.w,h=H(w),cx=st.x+w/2,cy=st.y+h/2;
 st.c=(cy<innerHeight/2?'t':'b')+(cx<innerWidth/2?'l':'r');
 const p=corner(st.c,w);put(p.x,p.y,w,anim)}
function ctl(on){
 clearTimeout(st.tm);st.ct=on?1:0;em.classList.toggle('ctl',!!on);
 if(on){pp.textContent=(window.MS&&MS.playing)?'⏸':'▶';st.tm=setTimeout(()=>ctl(0),3200)}}
function toggleSize(){
 const mx=maxW(),df=defW();st.w=st.w<(mx+df)/2?mx:df;
 const w=st.w,p=corner(st.c,w);put(p.x,p.y,w,1)}
const P=new Map();let g=null;
dr.addEventListener('pointerdown',e=>{
 try{dr.setPointerCapture(e.pointerId)}catch(_){}
 P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(P.size==1)g={sx:e.clientX,sy:e.clientY,ox:st.x,oy:st.y,moved:0};
 else if(P.size==2){const a=[...P.values()];g=g||{};g.pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);g.pw=st.w;g.pinch=1;g.moved=1;ctl(0)}
 e.preventDefault()});
dr.addEventListener('pointermove',e=>{
 if(!P.has(e.pointerId)||!g)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(g.pinch&&P.size>=2){const a=[...P.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  const w=Math.round(cl(g.pw*d/(g.pd||1),MINW,maxW())),cx=st.x+st.w/2,cy=st.y+H(st.w)/2;st.w=w;
  put(cx-w/2,cy-H(w)/2,w,0);return}
 if(P.size==1&&!g.pinch){const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
  if(!g.moved&&Math.hypot(dx,dy)<6)return;
  if(!g.moved){g.moved=1;ctl(0)}
  const i=ins();put(cl(g.ox+dx,0,innerWidth-st.w),cl(g.oy+dy,i.t,innerHeight-H(st.w)-i.b),st.w,0)}});
function end(e){
 if(!P.has(e.pointerId))return;P.delete(e.pointerId);
 try{dr.releasePointerCapture(e.pointerId)}catch(_){}
 if(!g||P.size>0)return;
 const gg=g;g=null;
 if(!gg.moved){
  const n=Date.now();
  if(st.lt&&n-st.lt<320){st.lt=0;toggleSize();ctl(0)}else{st.lt=n;ctl(!st.ct)}
  return}
 snap(1)}
dr.addEventListener('pointerup',end);dr.addEventListener('pointercancel',end);
pp.addEventListener('click',e=>{e.stopPropagation();try{MU.tog()}catch(_){};setTimeout(()=>{pp.textContent=(window.MS&&MS.playing)?'⏸':'▶'},250);clearTimeout(st.tm);st.tm=setTimeout(()=>ctl(0),3200)});
sz.addEventListener('click',e=>{e.stopPropagation();toggleSize();clearTimeout(st.tm);st.tm=setTimeout(()=>ctl(0),3200)});
if(b10)b10.addEventListener('click',e=>{e.stopPropagation();try{MU.seekBy(-10)}catch(x){}paintProg();clearTimeout(st.tm);st.tm=setTimeout(()=>ctl(0),3200)});
if(f10)f10.addEventListener('click',e=>{e.stopPropagation();try{MU.seekBy(10)}catch(x){}paintProg();clearTimeout(st.tm);st.tm=setTimeout(()=>ctl(0),3200)});
if(sk){
  sk.addEventListener('pointerdown',e=>e.stopPropagation());
  sk.addEventListener('click',e=>e.stopPropagation());
  sk.addEventListener('input',e=>{e.stopPropagation();seeking=1;const d=(MS&&MS.dur)||0;const p=(+sk.value/1000)*d;if(t0)t0.textContent=fmMs(p);clearTimeout(st.tm);st.tm=setTimeout(()=>ctl(0),4000)});
  sk.addEventListener('change',e=>{e.stopPropagation();seeking=0;const d=(MS&&MS.dur)||0;const p=(+sk.value/1000)*d;try{MU.sk(sk.value)}catch(x){try{if(typeof seekMs==='function')seekMs(p)}catch(y){}}paintProg();clearTimeout(st.tm);st.tm=setTimeout(()=>ctl(0),3200)});
}
function clear(){['width','height','left','top','transition'].forEach(k=>em.style[k]='');st.on=0;ctl(0)}
function sync(){
 const mv=em.classList.contains('movie')&&em.classList.contains('show');
 if(mv&&!st.on){st.on=1;if(!st.w)st.w=defW();st.w=cl(st.w,MINW,maxW());const p=corner(st.c,st.w);put(p.x,p.y,st.w,0);em.classList.add('pin');setTimeout(()=>em.classList.remove('pin'),300)}
 else if(!mv&&st.on)clear()}
try{new MutationObserver(sync).observe(em,{attributes:true,attributeFilter:['class']})}catch(e){}
addEventListener('resize',()=>{if(!st.on)return;st.w=cl(st.w,MINW,maxW());snap(0)});
sync();
})();
</script>
</body></html>
