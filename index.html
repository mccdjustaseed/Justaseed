async function upsertProfile(user, onlyIfChanged) {
  if (!user) return;
  const meta = user.user_metadata || {};
  const dn = discordNames(user), username = dn.username;
  const sig = dn.display + '|' + username + '|' + (meta.avatar_url || '');
  if (onlyIfChanged && sig === LASTPROF) return;
  try {
    const { error } = await supabaseClient.from('profiles').upsert({
      id: user.id,
      username: username,
      display_name: dn.display,
      avatar_url: meta.avatar_url || null
    }, { onConflict: 'id' });
    if (!error) LASTPROF = sig;
    if (error) {
      toast('Lỗi lưu profile: ' + error.message);
      console.error(error);
    } else {
      try {
        const k = 'jsProfSaved:' + user.id;
        if (!localStorage.getItem(k)) { localStorage.setItem(k, '1'); toast('Đã lưu profile: ' + username); }
      } catch (e) {}
    }
    if (typeof s !== 'undefined') {
      await supabaseClient.from('shop_public').upsert({
        user_id: user.id,
        shop_name: s.name || 'Tiệm hoa',
        day: s.day || 1,
        money: s.money || 0,
        level: typeof lvOf === 'function' ? lvOf(s.xp||0) : 1,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
    }
  } catch (e) {
    toast('Lỗi: ' + e.message);
  }
}

async function initAuth() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    currentUser = session?.user || null;
    if (currentUser) await upsertProfile(currentUser);
  } catch(e) {}
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    currentUser = session?.user || null;
    // Không gọi Supabase ngay trong callback (gây treo khóa đăng nhập) — đẩy ra sau
    setTimeout(async () => {
      try { if (currentUser) await upsertProfile(currentUser); } catch (e) {}
      if (typeof R === 'function') R();
    }, 0);
  });
}

async function sendFriendByName() {

  const { data: profiles, error } = await supabaseClient
    .from('profiles')
    .select('id, username, display_name')
    .eq('username', name)
    .limit(1);
  if (error || !profiles || !profiles.length) return toast('Không tìm thấy người chơi');
  const target = profiles[0];
  if (target.id === currentUser.id) return toast('Không thể kết bạn với chính mình');
  const { error: err2 } = await supabaseClient.from('friends').insert({
    user_id: currentUser.id,

    status: 'pending'
  });

async function uploadCardToWall() {
  if (!currentUser) return toast('Hãy liên kết Discord');
  const img = document.getElementById('cpv');
  if (!img || !img.src) return toast('Chưa có card. Hãy tạo card visit trước');
  toast('Đang đăng...');
  try {
    // Convert displayed image to base64
    const b64 = img.src.startsWith('data:') ? img.src : await new Promise((res, rej) => {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      const i = new Image();
      i.crossOrigin = 'anonymous';
      i.onload = () => {
        c.width = i.width; c.height = i.height;
        ctx.drawImage(i, 0, 0);
        res(c.toDataURL('image/png'));
      };
      i.onerror = rej;
      i.src = img.src;
    });
    const { error } = await supabaseClient.from('shop_public').upsert({
      user_id: currentUser.id,
      card_image: b64,
      shop_name: s.name || 'Tiệm hoa',
      game_avatar: buildGav(),

      level: typeof lvOf === 'function' ? lvOf(s.xp||0) : 1,

  } catch (e) {
    toast('Lỗi: ' + (e.message || e));

const WALLRX = {};

async function wallHeart(mid) {
  if (!currentUser) return toast('Hãy liên kết Discord');
  const L = WALLRX[mid] || (WALLRX[mid] = { n: 0, me: 0 }), was = L.me;
  L.me = was ? 0 : 1; L.n = Math.max(0, L.n + (was ? -1 : 1)); wallHeartPaint(mid);
  const t = supabaseClient.from('wall_reactions');
  const r = was
    ? await t.delete().eq('message_id', mid).eq('user_id', currentUser.id)
    : await t.upsert({ message_id: mid, user_id: currentUser.id, reaction: 'heart' }, { onConflict: 'message_id,user_id' });
  if (r.error) {
    L.me = was; L.n = Math.max(0, L.n + (was ? 1 : -1)); wallHeartPaint(mid);
    toast('Lỗi: ' + r.error.message);
  }
}

// ---- Wall threads: lời nhắn gốc + các phản hồi lồng bên dưới ----
async function loadWallThread(ownerId, limit) {
  const { data: roots } = await supabaseClient.from('wall_messages')
    .select('id, message, created_at, from_user, parent_id')
    .eq('to_user', ownerId)
    .is('parent_id', null)
    .order('created_at', { ascending: false })
    .limit(limit);
  const ids = (roots || []).map(m => m.id);
  let replies = [];
  if (ids.length) {
    const { data } = await supabaseClient.from('wall_messages')
      .select('id, message, created_at, from_user, parent_id')
      .in('parent_id', ids)
      .order('created_at', { ascending: true });
    replies = data || [];
  }
  const allIds = [...ids, ...replies.map(r => r.id)];
  allIds.forEach(id => { WALLRX[id] = { n: 0, me: 0 }; });
  if (allIds.length) {
    try {
      const { data: rx } = await supabaseClient.from('wall_reactions')
        .select('message_id, user_id, reaction').in('message_id', allIds);
      (rx || []).forEach(r => {
        const L = WALLRX[r.message_id];
        if (L && (r.reaction === 'heart' || r.reaction === 'like')) {
          L.n++; if (currentUser && r.user_id === currentUser.id) L.me = 1;
        }
      });
    } catch (e) { console.warn(e); }
  }
  const uids = [...new Set([...(roots || []), ...replies].map(m => m.from_user))];
  const pmap = {};
  if (uids.length) {
    const { data: ps } = await supabaseClient.from('profiles')
      .select('id, display_name, username, avatar_url').in('id', uids);
    (ps || []).forEach(p => pmap[p.id] = p);
    try {
      const { data: sps } = await supabaseClient.from('shop_public').select('user_id, game_avatar').in('user_id', uids);
      (sps || []).forEach(r => {
        const d = parseGav(r.game_avatar);
        const p = pmap[r.user_id] || (pmap[r.user_id] = { id: r.user_id });
        p.gav = 'gav:' + JSON.stringify({ av: d.av || null, pre: d.pre || null, fr: d.fr || 0, afr: d.afr ? 1 : 0 });
      });
    } catch (e) { console.warn(e); }
  }
  return { roots: roots || [], replies, pmap };
}

function wallBubbleHtml(m, pmap, ownerId, rootId, isReply, withReact) {
  const p = pmap[m.from_user];
  const own = !!(currentUser && m.from_user === currentUser.id);
  const dn = own ? discordNames(currentUser) : null;
  const display = dn ? dn.display : (p?.display_name || p?.username || 'Bạn');
  const uname = dn ? dn.username : (p?.username || '');
  const whoHtml = uname && uname !== display
    ? `<b>${esc(display)}</b> <span class="mut" style="opacity:.65;font-size:.85em">@${esc(uname)}</span>`
    : `<b>${esc(display)}</b>`;
  const av = `<span style="display:inline-block;vertical-align:middle;margin-right:6px;line-height:0">${own ? avH(28) : friendAvTap(p?.gav, 28, m.from_user)}</span>`;
  const react = `<button class="s wh ${(WALLRX[m.id] || {}).me ? 'liked' : ''}" id="wh-${m.id}" onclick="wallHeart(${m.id})" aria-label="Thả tim">${wallHeartInner(m.id)}</button>`;
  const wrapStyle = isReply ? 'style="margin:6px 0 0 14px;padding-left:8px;border-left:2px solid #d5ebd3"' : '';
  return `<div class="bub" id="wm-${m.id}" ${wrapStyle}>
      ${av}${whoHtml} <span class=mut>${new Date(m.created_at).toLocaleString('vi-VN')}</span><br>
      ${esc(m.message)}
      <div style="margin-top:4px">${react}${isReply ? '' : `
        <button class=s onclick="toggleReplyBox(${rootId})">↩ Trả lời</button>`}
      </div>
    </div>`;
}

function wallThreadsHtml(t, ownerId) {
  let html = '';
  for (const m of t.roots) {
    const kids = t.replies.filter(r => r.parent_id === m.id);
    html += `<div style="margin-bottom:10px">${wallBubbleHtml(m, t.pmap, ownerId, m.id, false, true)}`;
    for (const r of kids) html += wallBubbleHtml(r, t.pmap, ownerId, m.id, true, false);
    html += `<div id="rb-${m.id}" class="row" style="display:none;margin:6px 0 0 14px;gap:6px">
        <input id="ri-${m.id}" placeholder="Viết trả lời..." style="flex:1;width:auto" onkeydown="if(event.key==='Enter')sendWallReply(${m.id}, '${ownerId}')">
        <button class=p onclick="sendWallReply(${m.id}, '${ownerId}')">Gửi</button>
      </div></div>`;
  }
  return html;
}

function toggleReplyBox(rootId) {
  const box = document.getElementById('rb-' + rootId);
  if (!box) return;
  const show = box.style.display === 'none';
  box.style.display = show ? 'flex' : 'none';
  if (show) { const i = document.getElementById('ri-' + rootId); if (i) i.focus(); }
}

async function sendWallReply(rootId, ownerId) {
  if (!currentUser) return toast('Hãy liên kết Discord');
  const input = document.getElementById('ri-' + rootId);
  const text = input ? input.value.trim() : '';
  if (!text) return toast('Nhập nội dung');
  const { error } = await supabaseClient.from('wall_messages').insert({
    from_user: currentUser.id,
    to_user: ownerId,
    message: text,
    parent_id: rootId
  });
  if (error) return toast('Lỗi: ' + error.message);
  toast('Đã trả lời');
  if (ownerId === currentUser.id) viewMyWall(); else visitFriend(ownerId);
}

async function viewMyWall() {

  const t = await loadWallThread(currentUser.id, 20);

function parseGav(raw) {
  if (!raw) return {};
  if (typeof raw === 'string' && raw.startsWith('gav:')) { try { return JSON.parse(raw.slice(4)) || {}; } catch (e) { return {}; } }
  return { av: raw };
}
function friendAvH(raw, z) {
  const d = parseGav(raw);
  const f = FRM[Math.min(d.fr || 0, 5)], lock = f.a && !d.afr ? FRM[0] : f;
  let i;
  if (d.av) i = `<img src="${d.av}" alt="" style="width:100%;height:100%;object-fit:cover">`;
  else if (d.pre && typeof FH !== 'undefined' && FH[d.pre]) i = fw(d.pre, z * .7);
  else if (d.pre && PEM[d.pre]) i = `<span style="font-size:${Math.round(z * .55)}px;line-height:1">${PEM[d.pre]}</span>`;
  else i = `<span style="font-size:${Math.round(z * .55)}px;line-height:1">👤</span>`;
  return `<span style="position:relative;display:inline-block;width:${z}px;height:${z}px;vertical-align:middle;flex:0 0 auto"><span class="${lock.a ? 'frA' : ''}" style="position:absolute;inset:0;border-radius:50%;${lock.c}"></span><span style="position:absolute;inset:${Math.max(3, Math.round(z * .06))}px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--g)">${i}</span></span>`;
}

const CardMu = (function () {

  // đồng bộ đĩa than NGAY khi trạng thái đổi (không chờ vòng lặp 400ms) để đĩa không bao giờ quay trễ hơn nhạc
  function emit() { try { vinylNow(); } catch (e) {} }
  function setPend(v) { clearTimeout(pendT); pend = v ? 1 : 0; if (v) pendT = setTimeout(() => { pend = 0; emit(); }, 7000); emit(); }
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
    if (loadYT.p) return loadYT.p;
    loadYT.p = new Promise((res, rej) => {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { try { prev && prev(); } catch (e) {} res(window.YT); };
      if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
        const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.async = true;
        sc.onerror = () => { loadYT.p = null; rej(new Error('yt')); };
        document.head.appendChild(sc);
      }
      setTimeout(() => { if (!(window.YT && window.YT.Player)) { loadYT.p = null; rej(new Error('yt')); } }, 15000);
    });
    return loadYT.p;
  }
  function wrap() {
    let w = document.getElementById('pvWrap');
    if (!w) {
      w = document.createElement('div'); w.id = 'pvWrap';
      w.style.cssText = 'position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden';
      w.innerHTML = '<div id="pvEl"></div>';
      document.body.appendChild(w);
    }
    return w;
  }
  function ensure(id) {
    if (pl) return Promise.resolve(pl);
    if (plP) return plP;
    wrap();
    plP = loadYT().then(Y => new Promise(res => {
      const p = new Y.Player('pvEl', {
        width: '200', height: '200', videoId: id,
        playerVars: { playsinline: 1, rel: 0, controls: 0 },
        events: {
          onReady: () => { pl = p; cued = id; res(p); },
          onStateChange: e => {
            const st = e && e.data;
            if (st === 1) {
              // Nếu nhạc người chơi đang phát (không do mình tạm dừng) thì dừng ngay đĩa than
              if (MS.playing) { try { p.pauseVideo(); } catch (x) {} playing = 0; setPend(0); return; }
              playing = 1; setPend(0);
            } else if (st === 2 || st === 0) {
              playing = 0; setPend(0);
              if (st === 0) giveBack();
            }
          },
          onError: () => { playing = 0; setPend(0); giveBack(); }
        }
      });
    })).catch(e => { plP = null; throw e; });
    return plP;
  }
  // Trả nhạc lại cho người chơi nếu mình đã tạm dừng nó để nghe đĩa than
  function giveBack() {
    if (resumeMain) { resumeMain = 0; try { if (!MS.playing && MS.now) MU.tog(); } catch (e) {} }
  }
  // phát cả bài, hoặc chỉ đoạn người chơi đã chọn (st/en, giây)
  function playIt(p) {
    const a = Math.floor(+(mu && mu.st)), b = Math.floor(+(mu && mu.en));
    if (a >= 0 && b > a && b - a <= 60) p.loadVideoById({ videoId: mu.id, startSeconds: a, endSeconds: b });
    else p.playVideo();
  }
  function load(id) {
    return ensure(id).then(p => {
      if (cued !== id) { cued = id; try { p.cueVideoById(id); } catch (e) {} }
      return p;
    });
  }
  return {
    // Chuẩn bị đĩa than; chỉ tự phát khi người chơi KHÔNG đang nghe gì
    prep(m, auto) {
      if (!m || !/^[\w-]{11}$/.test(m.id)) return;
      mu = m; want = m.id;
      load(m.id).then(p => {
        if (want !== m.id) return;
        if (auto && !MS.playing) { try { playIt(p); } catch (e) {} }
      }).catch(() => {});
    },
    tap() {
      if (!mu) return;
      if (playing) { try { pl.pauseVideo(); } catch (e) {} playing = 0; setPend(0); giveBack(); return; }
      // Người chơi chủ động bấm đĩa than: tạm dừng nhạc của họ, hết đĩa than sẽ tự phát tiếp
      if (MS.playing) { resumeMain = 1; try { MU.tog(); } catch (e) {} }
      setPend(1); // đĩa bắt đầu quay ngay khi chạm, nhạc lên sau
      load(mu.id).then(p => { try { playIt(p); } catch (e) { setPend(0); } }).catch(() => { setPend(0); toast('Không phát được nhạc của card'); giveBack(); });
    },
    // rời card / người chơi bật nhạc riêng -> dừng đĩa than; keepMain=true thì không bật lại nhạc chính
    stop(keepMain) {
      if (pl && playing) { try { pl.pauseVideo(); } catch (e) {} }
      playing = 0; want = ''; setPend(0);
      if (keepMain) resumeMain = 0; else giveBack();
    },
    playing() { return !!playing; },
    spinning() { return !!(playing || pend); }
  };
})();

function vinylNow() {

function vinylSync() {
  clearInterval(VMT);
  const f = () => {
    const v = document.getElementById('vinyl');
    if (!v || !VMU) { clearInterval(VMT); CardMu.stop(); return; }
    // Người chơi tự bật nhạc của mình trong lúc nghe đĩa than -> nhường nhạc của họ
    if (CardMu.playing() && MS.playing) CardMu.stop(true);

  };
  f(); VMT = setInterval(f, 150);
}

async function loadFriendsUI() {

  const uid = currentUser.id;
  const { data: rows, error } = await supabaseClient
    .from('friends')

  if (error) { el.innerHTML = '<p class=bad>Lỗi tải dữ liệu</p>'; return; }
  const ids = [...new Set(rows.flatMap(r => [r.user_id, r.friend_id]))];

  if (ids.length) {
    const { data: ps } = await supabaseClient.from('profiles').select('id, username, display_name').in('id', ids);

  }
  const accepted = [], incoming = [], outgoing = [];
  rows.forEach(r => {

    const other = profiles[otherId] || { display_name: 'Người chơi', username: '?' };

      const { data: sp } = await supabaseClient.from('shop_public').select('user_id, game_avatar').in('user_id', fids);
      (sp || []).forEach(r => avMap[r.user_id] = r.game_avatar);

  if (!accepted.length) html += '<p class=mut>Chưa có bạn bè nào.</p>';
  else accepted.sort((a, b) => (((s.fav||{})[b.user_id === uid ? b.friend_id : b.user_id]) ? 1 : 0) - (((s.fav||{})[a.user_id === uid ? a.friend_id : a.user_id]) ? 1 : 0)).forEach(x => {
    const fid = x.user_id === uid ? x.friend_id : x.user_id;

async function sendQrToDiscord() {
  if (!currentUser) return toast('Hãy liên kết Discord trước');
  if (!(await dcGate())) return;
  if (!QCV) return toast('Chưa có ảnh QR');
  toast('Đang gửi...');
  try {
    const blob = await new Promise(r => QCV.toBlob(r, 'image/png'));
    const reader = new FileReader();
    const b64 = await new Promise((res, rej) => {
      reader.onload = () => res(reader.result);
      reader.onerror = rej;
      reader.readAsDataURL(blob);
    });
    const code = await qrPayload().then(p => p.txt).catch(() => '');
    const discordId = currentUser.user_metadata?.provider_id 
                   || (currentUser.identities && currentUser.identities[0] && currentUser.identities[0].id)
                   || currentUser.user_metadata?.sub 
                   || null;
    const { error } = await supabaseClient.from('qr_requests').upsert({
      user_id: currentUser.id,
      discord_id: discordId,
      qr_image: b64,
      restore_code: code,
      created_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    if (error) throw error;
    toast('Đã gửi yêu cầu. Vào Discord gõ /qr để nhận.');
  } catch (e) {
    toast('Lỗi gửi: ' + (e.message || e));
    console.error(e);
  }
}

<script>['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});let _lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-_lt<300)e.preventDefault();_lt=n},{passive:false});</script>
<style>
/* v11: vòng tiến trình quanh đĩa than mini */
.mvw{position:relative;padding:5px;display:block}
.mvr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none;z-index:3}

.vnl{position:absolute;left:3.8%;top:3%;width:11.8%;cursor:pointer;z-index:2}
.vnl.vr{left:auto;right:2.9%;top:5.2%;width:8.3%}

.vdisc i{position:absolute;width:6%;height:6%;border-radius:50%;background:#f4f4f4}
.vnl.spin .vdisc{animation-play-state:running}
@keyframes vnlspin{to{transform:rotate(360deg)}}

<script>
/* ===== V29: 2 chế độ - Chơi ngay (local) / Discord (tự động lưu) ===== */
(function(){
  const MODE_KEY = 'jsMode';
  const INTENT_KEY = 'jsAuthIntent';
  window.DISCORD_OK = false;

  function setMode(m){ try{ localStorage.setItem(MODE_KEY, m); }catch(e){} }
  function getMode(){ try{ return localStorage.getItem(MODE_KEY) || 'guest'; }catch(e){ return 'guest'; } }

  async function hasAccount(uid){
    try{
      const r = await supabaseClient.from('game_saves').select('user_id').eq('user_id', uid).maybeSingle();
      if (r && r.error) {
        const m = (r.error.message || '') + (r.error.code || '');
        if (!window.__gsErrShown) {
          window.__gsErrShown = true;
          if (/42P01|PGRST205|schema cache|does not exist/i.test(m)) toast('Supabase chưa có bảng game_saves. Hãy chạy file justaseed-game-saves.sql.');
          else if (/42501|permission denied|row-level security/i.test(m)) toast('Bảng game_saves thiếu quyền truy cập. Hãy chạy lại file justaseed-game-saves.sql.');
          else toast('Không kiểm tra được tài khoản: ' + (r.error.message || m));
        }
        return null; // lỗi: không chắc, KHÔNG được coi là chưa đăng ký
      }
      return !!(r && r.data);
    }catch(e){ return null; }
  }

  // Đăng xuất an toàn: không chờ quá 1,5 giây, luôn xóa token cục bộ
  function safeSignOut(){
    return Promise.race([
      Promise.resolve().then(function(){ return supabaseClient.auth.signOut({ scope: 'local' }); }).catch(function(){}),
      new Promise(function(r){ setTimeout(r, 1500); })
    ]).then(function(){
      try{ Object.keys(localStorage).forEach(function(k){ if (/^sb-.*-auth-token/i.test(k)) localStorage.removeItem(k); }); }catch(e){}
    });
  }

  window.playNow = function(){
    window.DISCORD_OK = false;
    setMode('guest');
    const go = function(){ currentUser = null; if (typeof play === 'function') play(); };
    if (typeof currentUser !== 'undefined' && currentUser) {
      safeSignOut().then(go, go);
    } else go();
  };

  window.loginWithDiscord = function(){
    try{ localStorage.setItem(INTENT_KEY, 'login'); }catch(e){}
    if (typeof loginDiscord === 'function') loginDiscord();
  };

  window.registerWithDiscord = function(){
    try{ localStorage.setItem(INTENT_KEY, 'register'); }catch(e){}
    if (typeof loginDiscord === 'function') loginDiscord();
  };

  window.logoutToMenu = async function(){
    if (window.__loggingOut) return;
    window.__loggingOut = true;
    // 1. Lưu tiến trình hiện tại (máy + tài khoản) trước khi đăng xuất
    try{ save(); }catch(e){}
    if (window.DISCORD_OK && window.CLOUD && typeof window.CLOUD.flush === 'function') {
      toast('Đang lưu tiến trình...');
      let saved = false;
      try{ saved = await Promise.race([window.CLOUD.flush(), new Promise(function(r){ setTimeout(function(){ r(false); }, 8000); })]); }catch(e){}
      if (!saved && !confirm('Chưa lưu được tiến trình lên tài khoản (có thể do mất mạng). Đăng xuất sẽ xóa tiến trình trên máy này. Vẫn đăng xuất?')) {
        window.__loggingOut = false;
        return;
      }
    }
    try{ await safeSignOut(); }catch(e){}
    currentUser = null;
    window.DISCORD_OK = false;
    setMode('guest');
    try{ if (typeof live !== 'undefined' && live && live.iv) clearInterval(live.iv); }catch(e){}
    try{ live = null; cur = null; CART = {}; pop = ''; }catch(e){}
    try{ s = def(); }catch(e){}
    try{
      Object.keys(localStorage).forEach(function(k){
        if (!/^sb-|supabase|jsMode|jsAuthIntent/i.test(k)) localStorage.removeItem(k);
      });
    }catch(e){}
    // 2. Về ngay trang chủ, rồi tải lại để khởi tạo sạch
    try{ scr = 'menu'; document.body.classList.add('m'); mdl(); renderMenu(); }catch(e){}
    toast('Đã lưu tiến trình và đăng xuất. Đăng nhập lại để chơi tiếp.');
    setTimeout(function(){ location.reload(); }, 600);
  };

  // Menu 2 chế độ
  renderMenu = function(){
    { const fn = document.getElementById('floatNotif'); if (fn) fn.remove(); }
    const p = hasProg();
    const logged = (typeof currentUser !== 'undefined' && currentUser && window.DISCORD_OK);
    const nm = logged ? (currentUser.user_metadata?.preferred_username || currentUser.user_metadata?.name || currentUser.email || 'Discord') : '';
    const waiting = !logged && !window.AUTH_READY && getMode() === 'discord';
    const status = waiting
      ? '<p class=mut style="margin:6px 0 2px">⏳ Đang kiểm tra tài khoản...</p>'
      : logged
      ? '<p class=mut style="margin:6px 0 2px">☁️ Đã đăng nhập <b>@'+esc(nm)+'</b><br>Tiến trình tự động lưu lên Discord</p>'
      : '<p class=mut style="margin:6px 0 2px">Chế độ <b>Chơi ngay</b> · chỉ lưu trên máy này<br>Khôi phục thủ công bằng <b>mã</b> hoặc <b>QR</b></p>';

    const buttons = waiting ? '' : logged
      ? '<button class="p big" onclick="play()">'+ic('play',20)+' Chơi'+(p?' tiếp':'')+'</button>'
        +(p?'<span class=mut>Ngày '+s.day+'</span>':'')
        +'<button class="s big" onclick="logoutToMenu()">Đăng xuất Discord</button>'
      : '<button class="p big" onclick="playNow()">'+ic('play',20)+' Chơi ngay</button>'
        +'<button class="s big" onclick="loginWithDiscord()">Đăng nhập Discord</button>'
        +'<p class=mut style="font-size:.78rem;margin:4px 0 0;line-height:1.35">Chưa có tài khoản? <a href="#" onclick="registerWithDiscord();return false" style="color:inherit;font-weight:700;text-decoration:underline">Ấn vào đây</a> để đăng ký.</p>';

    const restoreBtn = '<button class="s" style="width:100%;margin-top:6px" onclick="mdl(\'r\')">'+ic('save',18)+' Khôi phục bằng mã / QR</button>';

    document.getElementById('menu').innerHTML =
      '<svg class=mbg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice"><circle cx=320 cy=110 r=70 style="fill:var(--sun)" opacity=.35 /><circle cx=320 cy=110 r=24 style="fill:var(--sun)"/><g class=cl><ellipse cx=80 cy=120 rx=44 ry=15 fill=#fff opacity=.85 /><ellipse cx=110 cy=108 rx=28 ry=14 fill=#fff opacity=.85 /></g><g class="cl d2"><ellipse cx=250 cy=200 rx=36 ry=12 fill=#fff opacity=.7 /><ellipse cx=272 cy=191 rx=22 ry=11 fill=#fff opacity=.7 /></g><path d="M0 620Q100 560 210 610T400 590V800H0z" style="fill:var(--h1);opacity:.7"/><path d="M0 690Q120 650 230 690T400 675V800H0z" style="fill:var(--h1)"/><path d="M0 740Q140 710 260 745T400 730V800H0z" style="fill:color-mix(in srgb,var(--h1) 78%,#1b4a2a)"/><rect x=40 y=640 width=8 height=50 fill="#8a5a30"/><circle cx=44 cy=625 r=28 fill="#6cc07a"/><rect x=352 y=630 width=8 height=60 fill="#8a5a30"/><circle cx=356 cy=612 r=32 fill="#58ad69"/></svg>'
      +'<div class=mtop><button class="s" onclick="mdl(\'g\')" aria-label="Hướng dẫn" title="Hướng dẫn">'+ic('book',22)+'</button><button class="s" onclick="mdl(\'s\')" aria-label="Cài đặt" title="Cài đặt">'+ic('gear',22)+'</button></div>'
      +'<div class=mc>'
      +'<div class=bq><span onclick=petCat()>'+catSVG(s.cat,'full',84)+'</span>'+['tul','hong','hd','cuc','oai'].map((id,i)=>'<span class=sway style="animation-delay:'+(i*.4)+'s">'+fw(id,i==2?68:52)+'</span>').join('')+'</div>'
      +'<h1>Justaseed</h1>'
      +(p?'<span class=balp>'+$(s.money)+'</span>':'')
      +'<p class=hand style="margin:0">Tiệm hoa nhỏ, giấc mơ lớn</p>'
      +status
      +buttons
      +restoreBtn
      +(MSO?'<div class=card style="width:100%;margin:0"><div class=row><span>Âm thanh</span><button class="s '+(s.snd?'on2':'')+'" onclick="tgS(\'snd\')">'+(s.snd?'Bật':'Tắt')+'</button></div><div class=row><span>Nhạc nền</span><button class="s '+(s.mus?'on2':'')+'" onclick="tgS(\'mus\')">'+(s.mus?'Bật':'Tắt')+'</button></div><div class=row><span>Chế độ tối</span><button class="s '+(s.dark?'on2':'')+'" onclick="tgS(\'dark\',event)">'+(s.dark?'Bật':'Tắt')+'</button></div>'+langUI()+bgUI()+'</div>':'')
      +'</div>';
  };

  // Nút Đăng xuất nằm trong Cài đặt
  {
    const om = mdl;
    mdl = function(k){
      om.apply(this, arguments);
      if (k !== 's') return;
      setTimeout(function(){
        const ms = document.querySelector('#modal .ms');
        if (!ms || ms.querySelector('#logout-card')) return;
        if (!(typeof currentUser !== 'undefined' && currentUser && window.DISCORD_OK)) return;
        const nm = currentUser.user_metadata?.preferred_username || currentUser.user_metadata?.name || currentUser.email || 'Discord';
        const c = document.createElement('div');
        c.className = 'card'; c.id = 'logout-card';
        c.innerHTML = '<h3>Tài khoản</h3><p class=mut style="margin:0 0 8px">Đã đăng nhập <b>@' + esc(nm) + '</b></p><button class="s" onclick="logoutToMenu()">Đăng xuất</button>';
        ms.appendChild(c);
      }, 120);
    };
  }

  // Hiện ngay menu mới, không chờ 1 giây như trước
  window.AUTH_READY = false;
  if (typeof scr === 'undefined' || scr !== 'game') renderMenu();
  setTimeout(function(){
    if (window.AUTH_READY) return;
    window.AUTH_READY = true;
    if (typeof scr === 'undefined' || scr !== 'game') renderMenu();
  }, 4000);

  // Xử lý sau khi Discord OAuth trả về
  let _sessBusy = null;
  function onSession(user){
    if (!user) { window.DISCORD_OK = false; return Promise.resolve(); }
    if (_sessBusy && _sessBusy.id === user.id) return _sessBusy.p;
    const p = onSessionRun(user).finally(function(){ if (_sessBusy && _sessBusy.p === p) _sessBusy = null; });
    _sessBusy = { id: user.id, p: p };
    return p;
  }
  async function onSessionRun(user){
    currentUser = user;
    let intent = null;
    try{ intent = localStorage.getItem(INTENT_KEY); localStorage.removeItem(INTENT_KEY); }catch(e){}

    const exists = await hasAccount(user.id);
    window.AUTH_READY = true;

    if (intent === 'register') {
      try{ await upsertProfile(user); }catch(e){}
      if (exists === false) {
        try{ await supabaseClient.from('game_saves').upsert({ user_id: user.id, data: '', xp: 0, day: 1, money: 0, updated_at: new Date().toISOString() }, { onConflict: 'user_id' }); }catch(e){}
      }
      window.DISCORD_OK = true;
      setMode('discord');
      toast(exists ? 'Tài khoản đã tồn tại, đã đăng nhập.' : 'Đã tạo tài khoản Discord. Tiến trình sẽ được lưu tự động.');
      if (typeof scr !== 'undefined' && scr === 'game' && typeof R === 'function') R();
      else if (typeof renderMenu === 'function') renderMenu();
      // Kích hoạt đồng bộ đám mây
      setTimeout(function(){ try{ if (window.CLOUD && !window.CLOUD.off) window.CLOUD.ready = 0; }catch(e){} }, 500);
      return;
    }

    // Đăng nhập hoặc phiên cũ
    if (exists === false && (intent === 'login' || getMode() !== 'discord')) {
      try{ await supabaseClient.auth.signOut({ scope: 'local' }); }catch(e){}
      currentUser = null;
      window.DISCORD_OK = false;
      setMode('guest');
      toast('Tài khoản Discord này chưa đăng ký trong game. Hãy chọn "Đăng ký bằng Discord".');
      if (typeof renderMenu === 'function') renderMenu();
      return;
    }

    window.DISCORD_OK = true;
    setMode('discord');
    if (typeof scr !== 'undefined' && scr !== 'game' && typeof renderMenu === 'function') renderMenu();
  }

  // Lắng nghe thay đổi phiên
  try{
    supabaseClient.auth.onAuthStateChange(function(_e, session){
      const user = session && session.user;
      setTimeout(async function(){
        if (user) { try{ await onSession(user); }catch(e){ window.AUTH_READY = true; } }
        else {
          window.DISCORD_OK = false;
          if (!window.AUTH_READY) {
            window.AUTH_READY = true;
            if (typeof scr === 'undefined' || scr !== 'game') renderMenu();
          }
        }
      }, 0);
    });
  }catch(e){}

  // Kiểm tra phiên hiện tại khi tải trang
  setTimeout(async function(){
    if (typeof currentUser !== 'undefined' && currentUser) await onSession(currentUser);
    else if (getMode() !== 'discord') {
      window.AUTH_READY = true;
      if (typeof renderMenu === 'function' && typeof scr !== 'undefined' && scr !== 'game') renderMenu();
    }
  }, 1000);
})();
</script>

<script>
/* ===== V21 FEATURES ===== */
(() => {
  // Init flags
  if (typeof s === 'undefined') return;
  s.dev = s.dev || false;
  s.forum = s.forum || [];
  s.notifs = s.notifs || [];
  s.lastFriendCheck = s.lastFriendCheck || 0;
  s.lastWallCheck = s.lastWallCheck || 0;
  s.devClicks = 0;

  // ----- DEV MODE UNLOCK (7 clicks on "Cài đặt" title in settings modal) -----
  const origMdl = window.mdl;
  window.mdl = function(k) {
    origMdl(k);
    if (k === 's') {
      setTimeout(() => {
        const h2 = document.querySelector('#modal h2');
        if (h2 && h2.textContent.trim() === 'Cài đặt') {
          h2.style.cursor = 'pointer';
          h2.onclick = () => {
            s.devClicks = (s.devClicks || 0) + 1;
            if (s.devClicks >= 7) {
              s.devClicks = 0;
              showDevPanel();
            } else if (s.devClicks >= 4) {
              toast('... ' + s.devClicks + '/7');
            }
          };
        }
      }, 50);
    }
  };

  function showDevPanel() {
    const panel = document.createElement('div');
    panel.id = 'dev-panel';
    panel.innerHTML = `
      <div class="ms">
        <h3>Chế độ ẩn</h3>
        <p class="mut">Nhập mật khẩu để mở khóa Dev Mode</p>
        <input id="dev-pass" type="password" placeholder="Mật khẩu..." style="width:100%;margin:8px 0">
        <div class="row">
          <button class="s" onclick="document.getElementById('dev-panel').remove()">Hủy</button>
          <button class="p" onclick="checkDevPass()">Xác nhận</button>
        </div>
      </div>`;
    document.body.appendChild(panel);
    document.getElementById('dev-pass').focus();
  }
  window.checkDevPass = function() {
    const v = document.getElementById('dev-pass').value.trim();
    if (v === 'mthuan@1501') {
      s.dev = true;
      s.money = Math.max(s.money, 999999999);
      // Full level
      s.xp = 100000; // high level (~25+)
      s.up = 5; // max shop upgrade
      // Unlock all flowers
      if (typeof F !== 'undefined') {
        F.forEach(f => { if (f.u) s.un[f.id] = 1; });
      }
      save();
      document.getElementById('dev-panel').remove();
      toast('Đã mở khóa Dev Mode! Full level, toàn bộ tính năng & tiền vô hạn.');
      if (typeof R === 'function') R();
    } else {
      toast('Sai mật khẩu');
    }
  };

  // Auto refill money in dev mode
  const origR = window.R;
  window.R = function() {
    if (s.dev) {
      if (s.money < 100000000) s.money = 999999999;
      if ((s.xp||0) < 50000) s.xp = 100000;
      if ((s.up||0) < 5) s.up = 5;
      if (typeof F !== 'undefined') {
        F.forEach(f => { if (f.u && !s.un[f.id]) s.un[f.id] = 1; });
      }
    }
    return origR.apply(this, arguments);
  };

  // ----- VIRTUAL FORUM -----
  const FORUM_NAMES = ['Chị Hương', 'Anh Tuấn', 'Cô Mai', 'Chú Bình', 'Em Lan', 'Bác Khoa', 'Chị Vy', 'Anh Nam', 'Cô Thảo', 'Chú Phúc'];
  const RARE_FLOWERS = ['lan', 'mdon', 'sen', 'lily', 'cth'];

  function marketPrice(id) {
    return C[id] || 5000;
  }

  function generateForumPost() {
    const now = Date.now();
    // Clean expired
    s.forum = s.forum.filter(p => p.expire > now && p.status === 'active');

    const isRare = Math.random() < 0.25;
    const isExpensive = !isRare && Math.random() < 0.4;
    const isCheap = !isRare && !isExpensive;

    let flowerId, qty, priceMult, type, expireMin;

    if (isRare) {
      flowerId = RARE_FLOWERS[Math.floor(Math.random() * RARE_FLOWERS.length)];
      qty = Math.floor(Math.random() * 3) + 1; // 1-3
      priceMult = 0.7 + Math.random() * 0.5; // slightly varied
      type = 'rare';
      expireMin = 1 + Math.random() * 3; // short time
    } else if (isExpensive) {
      flowerId = F[Math.floor(Math.random() * Math.min(6, F.length))].id;
      qty = Math.floor(Math.random() * 15) + 5;
      priceMult = 1.3 + Math.random() * 0.6;
      type = 'expensive';
      expireMin = 4 + Math.random() * 8;
    } else {
      flowerId = F[Math.floor(Math.random() * Math.min(6, F.length))].id;
      qty = Math.floor(Math.random() * 20) + 8;
      priceMult = 0.55 + Math.random() * 0.25;
      type = 'cheap';
      expireMin = 5 + Math.random() * 10;
    }

    const base = marketPrice(flowerId);
    const unitPrice = Math.round(base * priceMult / 100) * 100;
    const total = unitPrice * qty;
    const scam = Math.random() < 0.06; // ~6% scam chance

    const post = {
      id: now + Math.random().toString(36).slice(2, 6),
      seller: FORUM_NAMES[Math.floor(Math.random() * FORUM_NAMES.length)],
      flowerId,
      qty,
      unitPrice,
      total,
      type,
      expire: now + expireMin * 60 * 1000,
      scam,
      status: 'active',
      negotiated: false,
      created: now
    };
    s.forum.unshift(post);
    if (s.forum.length > 30) s.forum.pop();
    // Notification for new forum post
    s.notifs = s.notifs || [];
    s.notifs.unshift({
      type: 'forum',
      id: post.id,
      text: post.seller + ' vừa đăng bán ' + nm(post.flowerId) + ' trên Diễn đàn',
      time: new Date().toISOString(),
      read: false
    });
    if (s.notifs.length > 50) s.notifs = s.notifs.slice(0, 50);
    save();
    if (tab === 'forum') R();
    else toast('Có người đăng bán hàng mới trên Diễn đàn!');
  }

  function scheduleForum() {
    const delay = (2 + Math.random() * 13) * 60 * 1000; // 2-15 min
    setTimeout(() => {
      generateForumPost();
      scheduleForum();
    }, delay);
  }
  // Start after a short delay so page loads
  setTimeout(scheduleForum, 8000);

  // Forum UI
  V.forum = function() {
    const now = Date.now();
    s.forum = s.forum.filter(p => p.expire > now && p.status === 'active');
    const posts = s.forum;
    let html = `<div class="card"><div class="row"><h3>💬 Diễn đàn ảo</h3><span class="mut">${posts.length} bài đăng</span></div>
      <p class="mut">Người bán xuất hiện ngẫu nhiên mỗi 2–15 phút.</p></div>`;
    if (!posts.length) {
      html += `<div class="card"><p class="mut">Chưa có ai đăng bán. Hãy chờ một lúc...</p></div>`;
    } else {
      posts.forEach(p => {
        const leftMin = Math.max(0, Math.round((p.expire - now) / 60000));
        const fName = nm(p.flowerId);
        const market = marketPrice(p.flowerId);
        const pct = Math.round((p.unitPrice / market - 1) * 100);
        const typeLabel = p.type === 'rare' ? '💎 Hiếm' : p.type === 'expensive' ? '📈 Cao hơn TT' : '📉 Rẻ hơn TT';
        html += `<div class="card forum-post ${p.type}">
          <div class="row"><b>${esc(p.seller)}</b><span class="chip">${typeLabel}</span></div>
          <div class="row"><span>${art(p.flowerId)} <b>${fName}</b> × ${p.qty}</span><b>${$(p.unitPrice)}/bông</b></div>
          <p class="mut">Tổng: <b>${$(p.total)}</b> · Giá TT ~${$(market)} (${pct >= 0 ? '+' : ''}${pct}%) · Còn ~${leftMin} phút</p>
          <div class="row">
            <button class="p" onclick="forumBuy('${p.id}')">Mua ngay</button>
            ${p.type === 'expensive' && !p.negotiated ? `<button class="s" onclick="forumNegotiate('${p.id}')">Đàm phán</button>` : ''}
          </div>
        </div>`;
      });
    }
    return html;
  };

  window.forumBuy = function(id) {
    const p = s.forum.find(x => x.id === id);
    if (!p) return;
    if (s.money < p.total && !s.dev) return toast('Không đủ tiền');
    if (!s.dev) s.money -= p.total;
    if (p.scam) {
      toast('⚠️ NPC đã lấy tiền rồi bỏ trốn! Bạn bị lừa.');
      L('out', 'Diễn đàn', 'Bị lừa đảo', 1, p.total);
    } else {
      s.st[p.flowerId] = (s.st[p.flowerId] || 0) + p.qty;
      L('out', 'Diễn đàn', 'Mua ' + nm(p.flowerId), p.qty, p.total);
      toast('Đã mua thành công ' + p.qty + ' bông ' + nm(p.flowerId));
    }
    p.status = 'sold';
    save();
    R();
  };

  const NEGO_LINES = [
    'Giá này hơi cao, bớt cho tôi còn {p} được không?',
    'Tôi mua nhiều, giảm một chút đi ạ.',
    'Hàng đẹp nhưng giá trên thị trường thấp hơn, cân nhắc lại nhé.',
    'Nếu bán {p} thì tôi lấy liền.',
    'Mặc cả tí, tôi là khách quen mà.'
  ];
  window.forumNegotiate = function(id) {
    const p = s.forum.find(x => x.id === id);
    if (!p || p.negotiated) return;
    p.negotiated = true;
    const offer = Math.round(p.unitPrice * (0.75 + Math.random() * 0.15) / 100) * 100;
    const line = NEGO_LINES[Math.floor(Math.random() * NEGO_LINES.length)].replace('{p}', $(offer));
    const accept = Math.random() < 0.55;
    setTimeout(() => {
      if (accept) {
        p.unitPrice = offer;
        p.total = offer * p.qty;
        toast(p.seller + ' đồng ý giảm giá còn ' + $(offer) + '/bông!');
      } else {
        toast(p.seller + ' từ chối: "Giá này đã cố định rồi, không bớt nữa."');
      }
      save();
      if (tab === 'forum') R();
    }, 600);
    toast('Bạn: "' + line + '"');
  };

  // ----- TÌM HOA CHỦ ĐỘNG: mỗi loại hoa chỉ tìm 1 lần / ngày -----
  let FSEL = null;
  function fsrState() {
    const d = s.day || 1;
    if (!s.fsr || s.fsr.d !== d) s.fsr = { d, done: {}, cache: {}, cur: null };
    if (!s.fsr.cache) s.fsr.cache = {};
    return s.fsr;
  }
  /* chỉ những loại hoa đã mở khóa ở phần Nâng cấp mới tìm được */
  const fsrList = () => F.filter(f => !f.u || (s.un && s.un[f.id]));
  function fsrBar(st) {
    const FL = fsrList();
    if (!FSEL || st.done[FSEL] || !FL.some(f => f.id === FSEL)) FSEL = (FL.find(f => !st.done[f.id]) || {}).id || null;
    const all = FL.every(f => st.done[f.id]);
    const pend = FL.filter(f => !st.done[f.id]);
    const lv = typeof lvOf === 'function' ? lvOf(s.xp || 0) : 1;
    const buyAll = lv >= 10
      ? `<button class="s" onclick="forumBuyAll()" ${pend.length ? '' : 'disabled'}>🛒 Mua hết (${pend.length} loại)</button>`
      : `<button class="s" disabled title="Đạt level 10 để mở khóa">🔒 Mua hết · Lv 10</button>`;
    const opts = FL.map(f => `<option value="${f.id}" ${st.done[f.id] ? 'disabled' : ''} ${f.id === FSEL ? 'selected' : ''}>${esc(f.n)}${st.done[f.id] ? ' (đã mua)' : ''}</option>`).join('');
    const doneNames = F.filter(f => st.done[f.id]).map(f => esc(f.n)).join(', ');
    return `<div class="card"><h3>🔎 Tìm hoa cần mua</h3>
      <p class="mut">Chọn loại hoa để xem những người đang bán với nhiều mức giá khác nhau. Mỗi loại hoa chỉ được mua qua tìm kiếm 1 lần mỗi ngày: sau khi mua, loại hoa đó bị khóa đến hết ngày (Ngày ${st.d}).</p>
      <div class="row"><select id="fsel" onchange="forumPick(this.value)" style="flex:1;width:auto" ${all ? 'disabled' : ''}>${opts}</select>
      <button class="p" onclick="forumSearch()" ${all ? 'disabled' : ''}>Tìm</button></div>
      <div class="row">${buyAll}</div>
      <p class="mut">Loại hoa chưa mở khóa ở tab Nâng cấp sẽ không tìm được.</p>
      ${doneNames ? `<p class="mut">🔒 Đã mua hôm nay: ${doneNames}</p>` : ''}
      ${all ? '<p class="mut">Hôm nay bạn đã mua hết mọi loại hoa qua tìm kiếm. Hãy quay lại vào ngày mai!</p>' : ''}</div>`;
  }

  function genSearchListings(fid) {
    const base = marketPrice(fid), rare = RARE_FLOWERS.includes(fid);
    const bands = [[0.5, 0.68], [0.72, 0.9], [0.92, 1.1], [1.15, 1.45], [1.5, 2.0]];
    const names = FORUM_NAMES.slice().sort(() => Math.random() - 0.5);
    const list = bands.map((b, i) => {
      const mult = b[0] + Math.random() * (b[1] - b[0]);
      const qty = rare ? 1 + Math.floor(Math.random() * 4) : 4 + Math.floor(Math.random() * 17);
      const unitPrice = Math.max(100, Math.round(base * mult / 100) * 100);
      const rating = 1 + Math.floor(Math.random() * 5);
      let scamP = rating <= 2 ? 0.35 : rating === 3 ? 0.08 : 0.01;
      if (mult < 0.68) scamP += 0.1;
      return { seller: names[i], rating, qty, unitPrice, total: unitPrice * qty, scam: Math.random() < scamP, sold: false };
    });
    return list.sort((a, b) => a.unitPrice - b.unitPrice);
  }

  function fsrResults(st) {
    const c = st.cur, market = marketPrice(c.fid);
    let html = fsrBar(st) + `<div class="card"><div class="row"><h3>${art(c.fid)} ${esc(nm(c.fid))}</h3><button class="s bk" onclick="forumHome()">← Về trang chủ Diễn đàn</button></div>
      <p class="mut">${c.list.length} người đang bán · Giá thị trường ~${$(market)}/bông. Sau khi bạn mua, nếu rời trang này hoặc tìm loại khác thì hoa này sẽ bị khóa đến hết ngày.</p></div>`;
    c.list.forEach((p, i) => {
      const pct = Math.round((p.unitPrice / market - 1) * 100);
      const tag = pct <= -25 ? '📉 Rất rẻ' : pct < 0 ? '📉 Rẻ hơn TT' : pct <= 20 ? '⚖️ Gần giá TT' : '📈 Cao hơn TT';
      html += `<div class="card forum-post ${pct < 0 ? 'cheap' : 'expensive'}" ${p.sold ? 'style="opacity:.6"' : ''}>
        <div class="row"><b>${esc(p.seller)}</b><span class="chip">${tag}</span></div>
        <div class="row"><span class="mut">Uy tín ${'★'.repeat(p.rating)}${'☆'.repeat(5 - p.rating)}</span><span>${p.qty} bông</span></div>
        <div class="row"><b>${$(p.unitPrice)}/bông <span class="mut">(${pct >= 0 ? '+' : ''}${pct}%)</span></b><b>Tổng ${$(p.total)}</b></div>
        <div class="row"><button class="p" ${p.sold ? 'disabled' : ''} onclick="forumBuyFound(${i})">${p.sold ? 'Đã mua' : 'Mua'}</button></div>
      </div>`;
    });
    return html;
  }

  window.forumPick = function (v) { FSEL = v; };
  window.forumSearch = function () {
    const st = fsrState();
    const sel = document.getElementById('fsel');
    const fid = (sel && sel.value) || FSEL;
    if (!fid || !fsrList().some(f => f.id === fid)) return toast('Hãy chọn loại hoa (loại chưa mở khóa ở Nâng cấp sẽ không tìm được)');
    if (st.done[fid]) return toast('Hôm nay bạn đã mua ' + nm(fid) + ' qua tìm kiếm rồi, mai hãy thử lại');
    // Chưa mua thì chưa khóa; tìm lại sẽ thấy đúng danh sách cũ (không đổi giá bằng cách tìm lại)
    if (!st.cache[fid]) st.cache[fid] = genSearchListings(fid);
    st.cur = { fid, list: st.cache[fid] };
    FSEL = null;
    save();
    try { document.activeElement && document.activeElement.blur(); } catch (e) {}
    R();
  };
  window.forumBuyAll = function () {
    if ((typeof lvOf === 'function' ? lvOf(s.xp || 0) : 1) < 10) return toast('Cần đạt level 10 để dùng Mua hết');
    const st = fsrState();
    const pend = fsrList().filter(f => !st.done[f.id]);
    if (!pend.length) return toast('Hôm nay bạn đã mua hết mọi loại hoa qua tìm kiếm');
    const plan = pend.map(f => {
      if (!st.cache[f.id]) st.cache[f.id] = genSearchListings(f.id);
      const l = st.cache[f.id].filter(p => !p.sold);          // đã sắp xếp theo giá tăng dần
      const safe = l.filter(p => p.rating >= 3);
      const pick = (safe.length ? safe : l)[0];
      return pick ? { f, pick } : null;
    }).filter(Boolean);
    if (!plan.length) return;
    const tot = plan.reduce((a, x) => a + x.pick.total, 0);
    if (!confirm('Mua hết ' + plan.length + ' loại hoa: mỗi loại chọn người bán rẻ nhất có uy tín từ 3★ trở lên.\nTổng khoảng ' + $(tot) + '. Mỗi loại sẽ bị khóa đến hết ngày. Tiếp tục?')) { save(); return; }
    let ok = 0, scam = 0, skip = 0, spent = 0;
    plan.forEach(({ f, pick }) => {
      if (!s.dev && s.money < pick.total) { skip++; return; }
      if (!s.dev) s.money -= pick.total;
      if (pick.scam) { scam++; L('out', 'Diễn đàn', 'Bị lừa đảo', 1, pick.total); }
      else { s.st[f.id] = (s.st[f.id] || 0) + pick.qty; L('out', 'Diễn đàn', 'Mua ' + nm(f.id), pick.qty, pick.total); ok++; }
      spent += pick.total; pick.sold = true; st.done[f.id] = 1;
    });
    st.cur = null;
    save();
    toast('🛒 Đã mua ' + ok + ' loại' + (scam ? ', bị lừa ' + scam : '') + (skip ? ', thiếu tiền bỏ qua ' + skip : '') + ' · chi ' + $(s.dev ? 0 : spent));
    R();
  };
  window.forumHome = function () {
    const st = fsrState();
    st.cur = null;
    save();
    R();
  };
  window.forumBuyFound = function (i) {
    const st = fsrState(), c = st.cur;
    if (!c) return;
    const p = c.list[i];
    if (!p || p.sold) return;
    if (s.money < p.total && !s.dev) return toast('Không đủ tiền');
    if (!s.dev) s.money -= p.total;
    if (p.scam) {
      toast('⚠️ ' + p.seller + ' đã lấy tiền rồi bỏ trốn! Bạn bị lừa.');
      L('out', 'Diễn đàn', 'Bị lừa đảo', 1, p.total);
    } else {
      s.st[c.fid] = (s.st[c.fid] || 0) + p.qty;
      L('out', 'Diễn đàn', 'Mua ' + nm(c.fid), p.qty, p.total);
      toast('Đã mua ' + p.qty + ' bông ' + nm(c.fid) + ' của ' + p.seller);
    }
    p.sold = true;
    st.done[c.fid] = 1; // đã mua: loại hoa này khóa, sẽ không tìm lại được khi rời trang kết quả
    save();
    R();
  };
  const forumFeedV = V.forum;
  V.forum = function () {
    const st = fsrState();
    return st.cur ? fsrResults(st) : fsrBar(st) + forumFeedV();
  };

  // Add forum tab
  if (!TABS.find(t => t[0] === 'forum')) {
    TABS.push(['forum', 'star', 'Diễn đàn']);
  }

  // ----- MORE NEGOTIATION TEXTS FOR SHOP -----
  if (typeof HG !== 'undefined' && Array.isArray(HG)) {
    HG.push(
      'Bớt chút đi shop ơi, em mua tặng bạn gái.',
      'Giá này đắt quá, shop xem lại giúp em với.',
      'Em chỉ có đủ {p}, shop thương em đi.',
      'Mua nhiều lần rồi, ưu đãi tí được không?',
      'Hoa đẹp nhưng túi em mỏng, bớt nha.'
    );
  }

  // ----- NOTIFICATIONS -----
  async function checkNotifications() {
    if (!currentUser) return;
    const now = Date.now();
    // Friend requests
    if (now - (s.lastFriendCheck || 0) > 20000) {
      try {
        const { data: rows } = await supabaseClient.from('friends')
          .select('id, user_id, friend_id, status, created_at')
          .eq('friend_id', currentUser.id)
          .eq('status', 'pending');
        if (rows && rows.length) {
          rows.forEach(r => {
            if (!s.notifs.find(n => n.type === 'friend' && n.id === r.id)) {
              s.notifs.unshift({
                type: 'friend',
                id: r.id,
                text: 'Có lời mời kết bạn mới',
                time: r.created_at || new Date().toISOString(),
                read: false
              });
            }
          });
        }
        s.lastFriendCheck = now;
      } catch (e) {}
    }
    // Tường / tim / bảng tin: engine thông báo mới (V39)
    try { if (window.__nx) await window.__nx.check(); } catch (e) {}
    if (s.notifs.length > 50) s.notifs = s.notifs.slice(0, 50);
    save();
  }
  setInterval(checkNotifications, 15000);
  setTimeout(checkNotifications, 3000);

  V.notif = function() {
    const unread = s.notifs.filter(n => !n.read).length;
    let html = `<div class="card"><div class="row"><h3>🔔 Thông báo</h3><span class="mut">${unread} chưa đọc</span></div>
      <button class="s" onclick="s.notifs.forEach(n=>n.read=true);save();R()">Đánh dấu tất cả đã đọc</button></div>`;
    if (!s.notifs.length) {
      html += `<div class="card"><p class="mut">Chưa có thông báo nào.</p></div>`;
    } else {
      s.notifs.forEach((n, i) => {
        html += `<div class="notif-item ${n.read ? '' : 'unread'}">
          <b>${n.type === 'fav' ? '⭐ Bạn yêu thích' : n.type === 'friend' ? '👥 Kết bạn' : n.type === 'forum' ? '💬 Diễn đàn' : '📝 Tường'}</b> · ${new Date(n.time).toLocaleString('vi-VN')}<br>
          ${esc(n.text)}
          ${!n.read ? `<button class="s" style="margin-top:4px" onclick="s.notifs[${i}].read=true;save();R()">Đã xem</button>` : ''}
        </div>`;
      });
    }
    return html;
  };

  if (!TABS.find(t => t[0] === 'notif')) {
    TABS.push(['notif', 'star', 'Thông báo']);
  }

  // Initial render if in game
  if (typeof R === 'function' && scr === 'game') setTimeout(R, 100);
})();
</script>

})();

.nc i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.nc.ok{background:var(--g2);color:#fff;border-color:var(--g3)}
.nc.x{background:var(--bad);color:#fff;border-color:var(--bad)}
.nbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.nbtns button{min-height:44px;font-size:.95rem}
.nbtns .p{grid-column:1/-1;font-size:1.05rem}
.tk .bub{margin:8px 0 0;font-size:.95rem}
.stabs{display:flex;gap:6px;margin:0 0 6px;overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:1 0 auto;white-space:nowrap;min-height:40px;padding:4px 8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.sgrid.big{grid-template-columns:repeat(3,1fr)}
.stl{position:relative}
.tile{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:2px solid var(--g);border-radius:14px;background:var(--card);color:var(--ink);padding:5px 2px;min-height:70px;font-size:.62rem;line-height:1.15;text-align:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .08s}
.tile:active:not(:disabled){transform:scale(.93)}
.tile b{font:600 .68rem Onest,sans-serif;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{color:var(--mut);font-size:.64rem}
.tile.sel{background:var(--g);border-color:var(--g2)}
.tile.need{border-color:var(--wc);box-shadow:0 0 0 3px color-mix(in srgb,var(--wc) 40%,transparent)}
.tile:disabled{opacity:.4}
.tile .qn{position:absolute;top:3px;left:4px;min-width:20px;height:20px;border-radius:10px;background:var(--g2);color:#fff;font:700 .72rem Onest,sans-serif;display:grid;place-items:center;padding:0 5px}
.stl .mn{position:absolute;top:-7px;right:-5px;width:28px;height:28px;min-height:0;border:0;border-radius:50%;background:var(--bad);color:#fff;font-size:1.15rem;line-height:1;padding:0;display:grid;place-items:center;z-index:1}
.tile.pap{min-height:78px;font-size:.74rem}
.sbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(616px,calc(100% - 24px));z-index:5;display:flex;gap:8px;align-items:center;padding:8px;transition:bottom .3s;background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:2px solid var(--g2);border-radius:18px;box-shadow:0 6px 18px rgba(20,70,40,.22)}
.sbar:empty{display:none}
.sbar .s{min-height:46px;padding:2px 12px;white-space:nowrap}
.sbar .go{flex:1;min-height:46px;font-size:1.05rem;padding:8px 12px;border-radius:14px;white-space:nowrap}
.sbar .go.rdy{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 var(--g3),0 0 0 5px color-mix(in srgb,var(--g2) 35%,transparent)}}
.sempty{text-align:center;padding:18px 10px}
@media(prefers-reduced-motion:reduce){.sbar .go.rdy{animation:none}.pbar i{transition:none}}
@media(min-width:520px){.sgrid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}}
</style>
<script>
(function(){
/* ===== V26 ===== */
const E=id=>document.getElementById(id);
const unreadN=()=>(s.notifs||[]).filter(n=>!n.read).length;

/* ---------- chuông thông báo (header) ---------- */
function bellSync(){
 const b=E('nbell');if(!b)return;
 const n=unreadN();
 b.classList.toggle('has',n>0);
 b.setAttribute('aria-label',n?'Thông báo ('+n+' mới)':'Thông báo');
}
let NTO=0,NTF=new Set(),NTS='';
const ago=t=>{
 const d=Date.now()-new Date(t).getTime();
 if(!isFinite(d))return '';
 if(d<60000)return 'Vừa xong';
 if(d<3600000)return Math.floor(d/60000)+' phút trước';
 if(d<86400000)return Math.floor(d/3600000)+' giờ trước';
 return new Date(t).toLocaleDateString('vi-VN');
};
const NI={fav:['⭐','Bạn yêu thích online'],friend:['👥','Lời mời kết bạn'],forum:['💬','Diễn đàn'],wall:['📝','Tường'],heart:['❤️','Thả tim'],feed:['📰','Bảng tin']};
function ntSig(){const a=s.notifs||[];return a.length+':'+(a[0]?a[0].time:'')}
function ntHTML(){
 const a=s.notifs||[];
 const list=a.length?a.map((n,i)=>{
  const f=NTF.has(n),m=NI[n.type]||NI.wall;
  return `<button class="ni ${f?'new':''}" onclick="ntGo(${i})"><span class=ico>${m[0]}</span><span class=bd2><b>${m[1]}</b><span>${esc(n.text||'')}</span><small>${ago(n.time)}</small></span>${f?'<i class=nd></i>':''}</button>`;
 }).join(''):'<div class=card><p class=mut style="margin:0">Chưa có thông báo nào.</p></div>';
 return `<div class=mb onclick="if(event.target==this)mdl()"><div class=ms id=ntsheet><div class=row><h2>${ic('bell',22)} Thông báo</h2><button class=s onclick=mdl() aria-label="Đóng">✕</button></div><div class=nts>${list}</div></div></div>`;
}
function ntRender(){
 /* thông báo đang hiện trong ngăn coi như đã xem */
 (s.notifs||[]).forEach(n=>{if(!n.read){NTF.add(n);n.read=true}});
 save();bellSync();
 const m=E('modal');if(!m)return;
 const sc=m.querySelector('.ms');const y=sc?sc.scrollTop:0;
 m.innerHTML=ntHTML();
 const sc2=m.querySelector('.ms');if(sc2)sc2.scrollTop=y;
 NTS=ntSig();
}
function ntm(){
 if(scr!='game')return;
 NTF=new Set();NTO=1;ntRender();
}
function ntGo(i){
 const n=(s.notifs||[])[i];if(!n)return;
 mdl();NTO=0;
 if(n.tgt&&window.nxGo){window.nxGo(n.tgt);return}
 try{SD.open(n.type=='forum'?'forum':'friends')}catch(e){}
}
window.ntm=ntm;window.ntGo=ntGo;
setInterval(()=>{
 bellSync();
 if(NTO){
  if(!E('ntsheet')){NTO=0;return}
  if(ntSig()!==NTS||unreadN())ntRender();
 }
},1000);

/* ---------- bán hàng ---------- */
const sellingNow=()=>scr=='game'&&tab=='shop'&&s.ph=='open'&&!!live&&!live.paused;
const curC=()=>live&&live.cs.find(x=>x.id==cur);
const needOf=c=>c.mx||{[c.f]:K[c.z]};
const xrOf=c=>c.xt&&!c.xm;
const selSum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const flowersDone=c=>{const nd=needOf(c);return Object.keys(nd).every(k=>bd.fl[k]==nd[k])&&Object.keys(bd.fl).every(k=>nd[k])};
const mood=x=>{const r=x.pat/x.max;return r>.6?0:r>.3?1:2};
function ensureCur(){
 let c=curC();
 if(!c&&live&&live.cs.length){c=live.cs[0];cur=c.id;bd=nb();PT='f'}
 return c;
}
function advance(c){
 if(PT=='f'&&flowersDone(c))PT='p';
 else if(PT=='p'&&bd.size==c.z&&(!c.ps||bd.ps==c.ps)){
  if(c.ask&&!gc2())PT='g';
  else if(xrOf(c)&&!(bd.gift[c.xt]>0))PT='x';
 }
}
const chip=(done,dot,txt,act)=>`<button class="nc ${done?'ok':''}" tabindex=-1 aria-disabled=true style="pointer-events:none;cursor:default"><i style="background:${dot}"></i>${done?'✓ ':''}${txt}</button>`;
const hudHTML=()=>{
 const w=WX[s.wx]||WX.sun;
 return `<div class=hud><b class=clk id=clk>${clk()+(brk()?' ☕ Nghỉ':'')}</b><span class=wx title="${w.n}">${w.i} ${SE[season()].i}</span><b class=rev>${$(live.rev)}</b><span class=sp></span><button class=pzb onclick="togglePause()" aria-label="Tạm dừng" title="Tạm dừng"><i></i><i></i></button>${monS()?`<button class=s onclick="monToggle()" aria-label="${monP()?'Gọi nhân viên đi làm lại':'Cho nhân viên nghỉ phép'}" title="${monP()?'Gọi nhân viên đi làm lại':'Cho nhân viên nghỉ phép'}">${monP()?'👩‍🌾':'🏖️'}</button>`:''}<button class=s onclick="SL.menu()">📋 Menu</button><button class=s onclick="closeEarly()">Đóng sớm</button></div>`;
};
const stripHTML=()=>{
 if(!live.cs.length)return '';
 return live.cs.map(x=>{
  const r=x.pat/x.max,nd=needOf(x);
  const lab=x.big?'👑 Đại gia':Object.keys(nd).map(k=>nm(k)+' ×'+nd[k]).join(' + ')+' · '+x.z;
  return `<div class="sc ${x.id==cur?'sel':''} ${x.hd?'':'nofill'}" onclick="SL.pick(${x.id})" role=button><span class=av>${cu(x.look,mood(x),x.vip)}</span><div class=cn>${esc(x.nm||'')}</div><div class=co>${esc(lab)}</div><div class=bar><i id="pb${x.id}" style="width:${x.big?100:r*100}%"></i></div></div>`;
 }).join('');
};
function ticketHTML(c){
 if(!c)return live.cs.length?'':`<div class="card sempty"><div style="font-size:2rem">🌷</div><b>Chưa có khách</b><p class=mut style="margin:2px 0 0">Chờ một chút, khách sắp ghé quầy.</p></div>`;
 if(c.big)return bigCard(c);
 const nd=needOf(c),ks=Object.keys(nd),xr=xrOf(c);
 const stockOk=ks.every(k=>(s.st[k]||0)>=nd[k])&&(s.st[c.z]||0)>=1;
 const r=c.pat/c.max;
 const head=`<div class=tk-h><span class=av>${cu(c.look,mood(c),c.vip)}</span><div class=tk-n><b>${esc(c.nm||'Khách')}</b>${c.vip?' <span class=tag style="background:#d98a0b">VIP</span>':''}<div class="pbar ${r<.35?'low':''}"><i id=tpb style="width:${r*100}%"></i></div></div><div class=tk-p>${$(c.pr)}${xr&&c.xp?`<small>+${$(c.xp)} ${esc(nm(c.xt))}</small>`:''}</div></div>`;
 if(!stockOk){
  const miss=ks.filter(k=>(s.st[k]||0)<nd[k]).map(k=>`${nm(k)} ${s.st[k]||0}/${nd[k]}`);
  if((s.st[c.z]||0)<1)miss.push('Giấy '+c.z+' 0/1');
  return `<div class="tk neg">${head}<div class=bub>Shop không đủ hàng cho đơn này: <b>${esc(miss.join(', '))}</b>. Hãy từ chối khéo để khách thông cảm.</div><div class=nbtns><button class=p onclick="decline(${c.id})">Từ chối khéo</button></div></div>`;
 }
 if(!c.hd){
  const g=Object.keys(s.st).some(k=>GI[k]&&s.st[k]>0);
  const line=c.say?esc(c.say):(c.line=c.line||rnd(NG[c.nt]||HG).replace('{p}','<b>'+$(c.offer)+'</b>'));
  const pl=(dot,txt)=>`<span class=nc style="cursor:default"><i style="background:${dot}"></i>${txt}</span>`;
  const readonly=`<div class=need>${ks.map(k=>pl(FC[k],`${nm(k)} ×${nd[k]}`)).join('')}${pl(PC[c.z],'Giấy '+c.z)}${c.ps?pl(PS[c.ps].b,PS[c.ps].n+(PX[c.ps]?' (+'+$(PX[c.ps])+')':'')):''}${c.ask?pl('#7cc78f','Tặng quà'):''}${xr?pl('#5aa9e6',esc(nm(c.xt))):''}</div>`;
  return `<div class="tk neg">${head}<div class=bub>${line}${c.firm?' (khách chỉ trả giá này)':''}</div><div class=mut style="margin:6px 2px 0">Niêm yết ${$(c.pr)} · khách trả ${$(c.offer)} (lời ${$(c.offer-cost(c.f,c.z))})</div><div class=nbtns><button class=p onclick="hg(${c.id},'ok')">Đồng ý ${$(c.offer)}</button><button class=s onclick="hg(${c.id},'no')">Giữ giá niêm yết</button><button class=s onclick="hg(${c.id},'mid')">Đưa giá giữa</button>${g?`<button class=s style="grid-column:1/-1" onclick="hg(${c.id},'gift')">Tặng quà thay giảm giá</button>`:''}</div>${readonly}</div>`;
 }
 /* đơn đang làm: mỗi chip là một bước, chạm để điền */
 const parts=[];
 ks.forEach(k=>parts.push(chip(bd.fl[k]==nd[k],FC[k],`${nm(k)} ${bd.fl[k]||0}/${nd[k]}`,`SL.fill('${k}')`)));
 Object.keys(bd.fl).filter(k=>!nd[k]).forEach(k=>parts.push(`<button class="nc x" onclick="SL.clr('${k}')">✗ ${esc(nm(k))} ×${bd.fl[k]}</button>`));
 parts.push(bd.size&&bd.size!=c.z?`<button class="nc x" onclick="SL.size('${bd.size}')">✗ Giấy ${bd.size}</button>`:'');
 parts.push(chip(bd.size==c.z,PC[c.z],'Giấy '+c.z,`SL.size('${c.z}')`));
 if(c.ps)parts.push(chip(bd.ps==c.ps,PS[c.ps].b,PS[c.ps].n+(PX[c.ps]?' (+'+$(PX[c.ps])+')':''),`SL.pat('${c.ps}')`));
 if(c.ask)parts.push(chip(gc2()>0,'#7cc78f','Tặng quà',"SL.tab('g')"));
 if(xr)parts.push(chip(bd.gift[c.xt]>0,'#5aa9e6',esc(nm(c.xt)),`SL.ext('${c.xt}')`));
 return `<div class=tk>${head}<div class=need>${parts.join('')}</div></div>`;
}
const tl=(ico,lab,have,q,add,sub,col)=>`<div class=stl><button class="tile ${col?'need':''} ${q?'sel':''}" ${col?`style="--wc:${col}"`:''} ${have>q?'':'disabled'} onpointerup="${add}" onclick="if(!event.detail){${add}}">${q?`<span class=qn>${q}</span>`:''}${ico}<b>${esc(lab)}</b><small>${q}/${have}</small></button>${q?`<button class=mn onpointerup="${sub}" onclick="if(!event.detail){${sub}}" aria-label="Bớt">−</button>`:''}</div>`;
function pickerHTML(c){
 if(!c||c.big||!c.hd)return '';
 const nd=needOf(c),xr=xrOf(c);
 if(!((s.st[c.z]||0)>=1)||!Object.keys(nd).every(k=>(s.st[k]||0)>=nd[k]))return '';
 const hasW=c.xt||W.some(w=>(s.st[w]||0)>0);
 const tabs=[['f','🌸 Hoa',selSum(bd.fl)],['p','📜 Giấy',bd.size?1:0],['g','🎁 Quà',gc2()]].concat(hasW?[['x','☔ Mưa',(bd.gift.amua||0)+(bd.gift.du||0)]]:[]);
 if(!tabs.some(t=>t[0]==PT))PT='f';
 let pn='';
 if(PT=='f'){
  const L=F.filter(f=>(s.st[f.id]||0)>0).sort((a,b)=>(nd[b.id]?1:0)-(nd[a.id]?1:0));
  pn=L.length?`<div class=sgrid>${L.map(f=>tl(fw(f.id,34),f.n,s.st[f.id],bd.fl[f.id]||0,`SL.add('${f.id}')`,`SL.sub('${f.id}')`,nd[f.id]?FC[f.id]:'')).join('')}</div>`:'<p class=mut>Hết hoa.</p>';
 }else if(PT=='p'){
  pn=`<div class="sgrid big">${P.map(p=>`<div class=stl><button class="tile pap ${bd.size==p.id?'sel':''} ${p.id==c.z?'need':''}" ${p.id==c.z?`style="--wc:${PC[p.id]}"`:''} ${s.st[p.id]?'':'disabled'} onclick="SL.size('${p.id}')">${wr(p.id,bd.ps)}<b>Giấy ${p.id}</b><small>${K[p.id]} bông · kho ${s.st[p.id]||0}</small></button></div>`).join('')}</div><div class=sec>Hoa văn</div><div class=sstrip style="padding-bottom:2px">${Object.keys(PS).map(k=>`<button class="s ${bd.ps==k?'on2':''}${c.ps==k?' wp':''}" ${c.ps==k?`style="--wc:${PS[k].b};white-space:nowrap"`:'style="white-space:nowrap"'} onclick="SL.pat('${k}')">${wr('M',k)} ${PS[k].n}</button>`).join('')}</div>`;
 }else{
  const L=G.filter(g=>PT=='x'?g.w:!g.w).filter(g=>(s.st[g.id]||0)>0);
  pn=L.length?`<div class=sgrid>${L.map(g=>tl(gi(g.id,34),g.n,s.st[g.id],bd.gift[g.id]||0,`SL.addG('${g.id}')`,`SL.subG('${g.id}')`,PT=='x'?(c.xt==g.id?'#5aa9e6':''):(c.ask?'#7cc78f':''))).join('')}</div>`:'<p class=mut>Kho trống.</p>';
 }
 return `<div class=stabs>${tabs.map(t=>`<button class="s ${PT==t[0]?'on2':''}" onclick="SL.tab('${t[0]}')">${t[1]}${t[2]?' <b>('+t[2]+')</b>':''}</button>`).join('')}</div>${pn}`;
}
function barHTML(c){
 if(!c||c.big||!c.hd)return '';
 const nd=needOf(c),xr=xrOf(c);
 if(!((s.st[c.z]||0)>=1)||!Object.keys(nd).every(k=>(s.st[k]||0)>=nd[k]))return '';
 const rdy=flowersDone(c)&&bd.size==c.z&&(!c.ps||bd.ps==c.ps)&&(!c.ask||gc2()>0)&&(!xr||bd.gift[c.xt]>0);
 return `<button class=s onclick="SL.reset()" aria-label="Làm lại" title="Làm lại">${ic('undo')}</button><button class=s ${(live&&live.qk||0)>=3?'disabled':''} onclick="SL.quick()" title="Tự điền đúng theo đơn (tối đa 3 lần mỗi lần mở gian hàng)">⚡ Điền nhanh (${Math.max(0,3-(live&&live.qk||0))})</button><button class="p go ${rdy?'rdy':''}" onclick="give(${c.id})">${ic('bill')} Giao hàng</button>`;
}
function sellHTML(){
 const c=ensureCur();
 return `<div id=sell>${live.run?runCard():''}${hudHTML()}<div id=sstrip class=sstrip>${stripHTML()}</div><div id=stk>${ticketHTML(c)}</div><div id=spk>${pickerHTML(c)}</div><div id=sbar class=sbar>${barHTML(c)}</div></div>`;
}
/* cập nhật cục bộ: không dựng lại cả trang, không lưu lại toàn bộ trạng thái */
function selR(withStrip){
 if(!sellingNow()||!E('sell')){R();return}
 const c=ensureCur();
 if(withStrip){const st=E('sstrip'),x=st.scrollLeft;st.innerHTML=stripHTML();st.scrollLeft=x}
 E('stk').innerHTML=ticketHTML(c);
 E('spk').innerHTML=pickerHTML(c);
 E('sbar').innerHTML=barHTML(c);
}
const SL=window.SL={
 pick(id){if(!sellingNow()||!E('sell')){cur=id;bd=nb();R();return}cur=id;bd=nb();PT='f';selR(true)},
 tab(t){PT=t;selR()},
 add(k){if((s.st[k]||0)>(bd.fl[k]||0)){bd.fl[k]=(bd.fl[k]||0)+1;beep(600)}const c=curC();if(c)advance(c);selR()},
 sub(k){if(bd.fl[k]){bd.fl[k]--;if(!bd.fl[k])delete bd.fl[k]}selR()},
 clr(k){delete bd.fl[k];selR()},
 fill(k){const c=curC();if(!c)return;const nd=needOf(c);if(nd[k]==null)return;const n=Math.min(nd[k],s.st[k]||0);if(n)bd.fl[k]=n;else delete bd.fl[k];beep(600);advance(c);selR()},
 size(z){bd.size=bd.size==z?null:z;beep(600);const c=curC();if(c)advance(c);selR()},
 pat(k){bd.ps=bd.ps==k?null:k;beep(600);const c=curC();if(c)advance(c);selR()},
 addG(id){if((s.st[id]||0)>(bd.gift[id]||0)){bd.gift[id]=(bd.gift[id]||0)+1;beep(600)}selR()},
 subG(id){if(bd.gift[id]){bd.gift[id]--;if(!bd.gift[id])delete bd.gift[id]}selR()},
 ext(id){if((s.st[id]||0)>0){bd.gift[id]=bd.gift[id]>0?0:1;if(!bd.gift[id])delete bd.gift[id];beep(600)}selR()},
 reset(){bd=nb();PT='f';selR()},
 /* điền đúng theo đơn: hoa, giấy, hoa văn, đồ khách mua thêm, và 1 quà rẻ nhất nếu khách xin */
 quick(){
  const c=curC();if(!c||c.big||!c.hd)return;
  if(!live)return;if((live.qk||0)>=3){toast('Điền nhanh chỉ dùng tối đa 3 lần mỗi lần mở gian hàng');return}live.qk=(live.qk||0)+1;
  const nd=needOf(c);bd=nb();
  Object.keys(nd).forEach(k=>{const n=Math.min(nd[k],s.st[k]||0);if(n)bd.fl[k]=n});
  if((s.st[c.z]||0)>0)bd.size=c.z;
  if(c.ps)bd.ps=c.ps;
  if(xrOf(c)&&(s.st[c.xt]||0)>0)bd.gift[c.xt]=1;
  if(c.ask){const g=G.filter(g=>!g.w&&(s.st[g.id]||0)>0).sort((a,b)=>a.c-b.c)[0];if(g)bd.gift[g.id]=1}
  beep(700);PT='p';selR();
 },
 menu(){
  const m=menu();

const enc=async str=>{const u=new TextEncoder().encode(str);try{if(!window.CompressionStream)throw 0;return 'JSA1:'+QRB.enc(await qrPipe(u,CompressionStream,'deflate-raw'))}catch(e){return 'JSA0:'+QRB.enc(u)}};
const warn=m=>{if(!CS.warned){CS.warned=1;toast(m)}};
const bad=e=>e&&(e.code=='42P01'||e.code=='PGRST205'||/game_saves|schema cache/i.test(e.message||''));
async function up(force){
 if(!window.DISCORD_OK||!currentUser||!CS.ready||CS.busy||CS.off||CS.uid!=currentUser.id)return;
 const j=cj();if(!force&&j===CS.last)return;
 CS.busy=1;
 try{const code=await enc(j),r=await supabaseClient.from('game_saves').upsert({user_id:currentUser.id,data:code,xp:Math.round(s.xp||0),day:s.day||1,money:Math.round(s.money||0),updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(r&&r.error){if(bad(r.error)){CS.off=1;warn('Chưa bật lưu đám mây: kiểm tra bảng game_saves trên Supabase (chạy justaseed-game-saves.sql)')}}else{CS.last=j;CS.t=Date.now()}}catch(e){}
 CS.busy=0}
async function sync(){
 if(!window.DISCORD_OK||!currentUser)return;const uid=currentUser.id;CS.uid=uid;CS.ready=0;
 let row=null;
 try{const r=await supabaseClient.from('game_saves').select('data,xp,day,money').eq('user_id',uid).maybeSingle();
  if(r.error){if(bad(r.error)){CS.off=1;warn('Chưa bật lưu đám mây: kiểm tra bảng game_saves trên Supabase (chạy justaseed-game-saves.sql)')}else{CS.uid=null;CS.retry=Date.now()}return}
  row=r.data}catch(e){CS.uid=null;CS.retry=Date.now();return}
 if(!currentUser||currentUser.id!=uid)return;
 if(row&&row.data){
  const lx=s.xp||0,ld=s.day||1,cx=row.xp||0,cd=row.day||1;
  if(cx>lx||(cx==lx&&cd>ld)){
   try{const o=await qrParse(row.data);try{localStorage.setItem('jas2_bak',JSON.stringify(s))}catch(e){}
    QRO=o;qrDo();save();CS.last=cj();CS.ready=1;CS.t=Date.now();toast('☁️ Đã khôi phục tiến trình từ tài khoản Discord');return}
   catch(e){CS.off=1;warn('Không đọc được bản lưu đám mây, vẫn giữ tiến trình trong máy');return}
  }
 }
 CS.ready=1;await up(true);if(!row)toast('☁️ Đã bật lưu tiến trình lên tài khoản Discord')}
setInterval(()=>{
 if(!window.DISCORD_OK||!currentUser){CS.uid=null;CS.ready=0;CS.off=0;return}
 if(CS.off)return;
 if(CS.uid!=currentUser.id&&!CS.syncing&&Date.now()-CS.retry>15000){CS.syncing=1;sync().finally(()=>CS.syncing=0);return}
 if(CS.ready&&Date.now()-CS.t>20000)up()},3000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden'){try{save()}catch(e){}up()}});
addEventListener('pagehide',()=>{up()});
CS.flush=async function(){
 if(!window.DISCORD_OK||!currentUser||CS.off||!CS.ready||CS.uid!=currentUser.id)return false;
 for(let i=0;i<25&&CS.busy;i++)await new Promise(r=>setTimeout(r,120));
 if(CS.busy)return false;
 await up(true);
 return CS.last===cj()};
window.CLOUD=CS;
})();
</script>

window.PRES=(function(){
 let ch=null,uid=null,me=0,on=new Set(),seen=null,lastN={};
 function favChk(nw){if(typeof s==='undefined'||!s)return;const f=s.fav||{};if(seen){nw.forEach(id=>{if(seen.has(id)||id===uid||!f[id])return;const now=Date.now();if(now-(lastN[id]||0)<60000)return;lastN[id]=now;const nm=f[id]||'Bạn bè';s.notifs=s.notifs||[];s.notifs.unshift({type:'fav',id:'fav'+id+now,text:nm+' vừa online',time:new Date().toISOString(),read:false});s.notifs=s.notifs.slice(0,50);try{toast('⭐ '+nm+' vừa online')}catch(e){}try{save()}catch(e){}})}seen=new Set(nw)}
 const meHtml=()=>`<i class="pdi ${me?'on':''}"></i>${me?'Online':'Offline'}`;
 function paint(){try{
  document.querySelectorAll('[data-pres]').forEach(e=>e.classList.toggle('on',on.has(e.getAttribute('data-pres'))));
  document.querySelectorAll('[data-pt]').forEach(e=>{const o=on.has(e.getAttribute('data-pt'));e.textContent=o?'Online':(window.lsText?lsText(e.getAttribute('data-pt')):'Offline');e.classList.toggle('ptxt-on',o)});
  document.querySelectorAll('.me-pres').forEach(e=>{e.innerHTML=meHtml()})}catch(x){}}
 function stop(){if(ch){try{supabaseClient.removeChannel(ch)}catch(e){}}ch=null;uid=null;me=0;on=new Set();seen=null;paint()}
 function start(){
  if(!(window.DISCORD_OK&&typeof currentUser!=='undefined'&&currentUser)){if(ch)stop();return}
  if(ch&&uid===currentUser.id)return;
  stop();uid=currentUser.id;
  try{
   const c=supabaseClient.channel('jas-online',{config:{presence:{key:uid}}});ch=c;
   c.on('presence',{event:'sync'},()=>{try{const nw=new Set(Object.keys(c.presenceState()));try{favChk(nw)}catch(e){}on=nw;me=on.has(uid)?1:0;paint()}catch(e){}});
   c.subscribe(async st=>{
    if(st==='SUBSCRIBED'){try{if(document.visibilityState!=='hidden')await c.track({at:Date.now()})}catch(e){}}
    else if(st==='CLOSED'||st==='CHANNEL_ERROR'||st==='TIMED_OUT'){me=0;paint()}});
  }catch(e){ch=null;uid=null}}
 document.addEventListener('visibilitychange',()=>{if(!ch)return;try{if(document.visibilityState==='hidden')ch.untrack();else ch.track({at:Date.now()})}catch(e){}});
 addEventListener('pagehide',()=>{try{ch&&ch.untrack()}catch(e){}});
 setInterval(start,3000);setTimeout(start,1500);

<script>
/* ===== Bổ sung Justaseed theo yêu cầu ===== */
(function(){
  /* Vá giấy gói: TẮT. Trước đây khối này không bao giờ chạy (lỗi tham chiếu nowH). Đặt window.JAS_PAPER_PATCH=1 trước đoạn này nếu muốn bật. */
  if(!window.JAS_PAPER_PATCH)return;
  // Cho phép mua giấy gói không giới hạn theo suất nhà cung cấp.
  const isPaper=id=>['S','M','L'].includes(String(id));
  const oldChg=chg;
  chg=function(si,id,d){
    if(!isPaper(id))return oldChg(si,id,d);
    if(s.ph!=='prep')return;
    const k=si+id,q=CART[k]||0,p=pc(id,SP[si].m);
    if(d>0){
      if(cartTotal()+p>s.money){toast('Không đủ tiền cho giỏ hàng');return}
      CART[k]=q+1;
    }else if(q>0){CART[k]=q-1;if(!CART[k])delete CART[k]}
    R();
  };
  const oldSetQ=setQ;
  setQ=function(si,id,v){
    if(!isPaper(id))return oldSetQ(si,id,v);
    const p=pc(id,SP[si].m),k=si+id,cur=CART[k]||0,other=cartTotal()-cur*p;
    const n=Math.max(0,Math.min(Math.floor((s.money-other)/p),Math.floor(+v||0)));
    if(n)CART[k]=n;else delete CART[k];R();
  };
  const oldBuyAll=buyAll;
  buyAll=function(si,id){
    if(!isPaper(id))return oldBuyAll(si,id);
    const p=pc(id,SP[si].m),k=si+id,n=Math.floor((s.money-cartTotal())/p);
    if(n>0)CART[k]=(CART[k]||0)+n;else toast('Không đủ tiền để nhập thêm');R();
  };
  // Giá áo mưa/dù luôn được cộng vào đơn khi khách chọn mua; phần xử lý gốc
  // đã cộng XP[id] vào giá bán và ghi nhận doanh thu theo c.xt/c.xp.
})();
</script>

<script>

const CLIPID=/^[\w-]{11}$/;

function clipNorm(g){
 if(!g||!CLIPID.test(String(g.id||'')))return null;
 const st=Math.max(0,Math.min(86400,Math.floor(+g.st||0)));
 const en=Math.max(st+3,Math.min(st+60,Math.floor(+g.en||0)||st+20));
 return {id:g.id,st,en,name:String(g.name||'Bài hát').slice(0,80),ar:String(g.ar||'').slice(0,50)};

function clipChip(g0){

 return `<div class="clipchip" data-clipui data-clipbtn data-id="${g.id}" data-st="${g.st}" data-en="${g.en}" role="button" tabindex="0" onclick="ClipMu.tap(this)" onkeydown="if(event.key=='Enter')ClipMu.tap(this)"><span class="cpd"><img src="https://i.ytimg.com/vi/${g.id}/mqdefault.jpg" alt=""></span><div class="cpx"><b><em class="mqi">${esc(g.name)}</em></b><small>${esc(g.ar||'YouTube')} · ${clipFmt(g.st)}–${clipFmt(g.en)}</small></div><span class="cpl" data-clipico>▶</span></div>`;
}

/* ---- trình phát đoạn nhạc riêng (phát từ giây A đến giây B) ---- */
const ClipMu=(function(){
 let pl=null,plP=null,cur=null,resume=0,iv=0,tmr=0,t0=0;
 function wrap(){let w=document.getElementById('clipWrap');if(!w){w=document.createElement('div');w.id='clipWrap';w.style.cssText='position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden';w.innerHTML='<div id="clipEl"></div>';document.body.appendChild(w)}return w}
 function ytReady(){return new Promise((res,rej)=>{
  if(window.YT&&window.YT.Player)return res();
  if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;document.head.appendChild(sc)}
  let n=0;const k=setInterval(()=>{if(window.YT&&window.YT.Player){clearInterval(k);res()}else if(++n>75){clearInterval(k);rej(new Error('yt'))}},200)})}
 function giveBack(){if(resume){resume=0;try{if(!MS.playing&&MS.now)MU.tog()}catch(e){}}}
 function arm(ms){clearTimeout(tmr);tmr=setTimeout(()=>stop(),ms)}
 function ensure(){
  if(pl)return Promise.resolve(pl);if(plP)return plP;wrap();
  plP=ytReady().then(()=>new Promise(res=>{
   const p=new YT.Player('clipEl',{width:'200',height:'200',playerVars:{playsinline:1,rel:0,controls:0},events:{
    onReady:()=>{pl=p;res(p)},
    onStateChange:e=>{const st=e&&e.data;
     if(st===1){if(!cur){try{p.pauseVideo()}catch(x){}return}arm((cur.en-cur.st)*1000+1500);ui()}
     else if(st===0){stop()}
     else if(st===2&&cur&&Date.now()-t0>1200){stop()}},
    onError:()=>{toast('Không phát được đoạn nhạc');stop()}}});
  })).catch(e=>{plP=null;throw e});
  return plP}
 function tick(){
  if(!cur){clearInterval(iv);iv=0;return}
  if(!document.querySelector('[data-clipui]')){stop();return}            // rời khỏi hồ sơ -> dừng
  if(Date.now()-t0>2500&&MS.playing){stop(true)}                          // người chơi tự bật nhạc -> nhường
 }
 function ui(){document.querySelectorAll('[data-clipbtn]').forEach(el=>{
  const on=!!cur&&cur.key===el.dataset.id+':'+el.dataset.st+':'+el.dataset.en;

 function stop(keep){
  const had=!!cur;cur=null;clearTimeout(tmr);clearInterval(iv);iv=0;
  if(had&&pl){try{pl.pauseVideo()}catch(e){}}
  if(keep)resume=0;else giveBack();
  ui()}
 function play(m){
  try{CardMu.stop(true)}catch(e){}
  if(!cur&&MS.playing){resume=1;try{MU.tog()}catch(e){}}               // tạm dừng nhạc của người chơi, hết đoạn sẽ bật lại

async function feedLoad(more){

 try{
  const uid=currentUser.id;
  if(!more){
   const {data:fr}=await supabaseClient.from('friends').select('user_id, friend_id, status').eq('status','accepted').or(`user_id.eq.${uid},friend_id.eq.${uid}`);
   FEED.ids=[uid,...new Set((fr||[]).map(r=>r.user_id===uid?r.friend_id:r.user_id))]}
  let q=supabaseClient.from('feed_posts').select('id, user_id, image, caption, music, created_at').in('user_id',FEED.ids).order('created_at',{ascending:false}).limit(FEED_PAGE);
  if(more&&FEED.posts.length)q=q.lt('created_at',FEED.posts[FEED.posts.length-1].created_at);
  const {data:ps,error}=await q;
  if(error){FEED.err=error.message||'Lỗi';if(!more)FEED.posts=[];return}
  const got=ps||[];
  FEED.more=got.length>=FEED_PAGE;
  FEED.posts=more?FEED.posts.concat(got.filter(x=>!FEED.posts.some(y=>y.id===x.id))):got;
  const ids=got.map(p=>p.id);
  if(ids.length){
   const [lk,cm]=await Promise.all([
    supabaseClient.from('feed_likes').select('post_id, user_id').in('post_id',ids),
    supabaseClient.from('feed_comments').select('id, post_id, user_id, body, created_at').in('post_id',ids).order('created_at',{ascending:true}).limit(500)]);
   ids.forEach(id=>{FEED.likes[id]={n:0,me:0};FEED.cm[id]=[]});
   (lk.data||[]).forEach(r=>{const L=FEED.likes[r.post_id];if(L){L.n++;if(r.user_id===uid)L.me=1}});
   (cm.data||[]).forEach(c=>{if(FEED.cm[c.post_id])FEED.cm[c.post_id].push(c)});
   await feedProfiles([...got.map(p=>p.user_id),...(cm.data||[]).map(c=>c.user_id)]);
   await feedClLoad(cm.data||[])}
  FEED.t=Date.now();
 }catch(e){FEED.err=(e&&e.message)||String(e)}
 finally{FEED.busy=0;feedPaint()}}

function feedJpeg(src){

  const i=new Image();i.crossOrigin='anonymous';
  i.onload=()=>{
   let w=Math.min(720,i.naturalWidth||i.width),q=.82,out='';
   for(let k=0;k<4;k++){
    const h=Math.round(w*(i.naturalHeight||i.height)/(i.naturalWidth||i.width)),c=document.createElement('canvas');
    c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(i,0,0,w,h);
    out=c.toDataURL('image/jpeg',q);
    if(out.length<600000)break;w=Math.round(w*.8);q=Math.max(.5,q-.1)}
   res(out)};
  i.onerror=rej;i.src=src})}

@keyframes nglowc{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--g2) 18%,transparent),0 0 6px 1px color-mix(in srgb,var(--g2) 30%,transparent)}
 50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--g2) 30%,transparent),0 0 9px 3px color-mix(in srgb,var(--g2) 50%,transparent)}}
.fcl .fcm{position:relative}

.fcm .fcat:active{transform:scale(.98)}

.fcm .fcat .fct2{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;line-height:1.25;text-align:left}
.fcm .fcat .fct2 b{display:block;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcm .fcat .fct2 small{font-size:.7rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
