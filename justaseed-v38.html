<script>
const $=n=>Math.round(n).toLocaleString('vi-VN')+'đ',esc=t=>String(t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const I={home:'M3 11l9-8 9 8M5 10v10h14V10',cart:'M3 4h3l2 11h10l2-8H7M9 20h.01M17 20h.01',tag:'M3 12V3h9l9 9-9 9z',shop:'M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6',star:'M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3 1.3-6.2L3 9.5l6.3-.7z',quest:'M6 3v18M6 4h12l-3 4 3 4H6',up:'M12 20V5M5 11l7-7 7 7',book:'M4 5h7a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-7a2 2 0 00-2 2',save:'M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-6h8v6',moon:'M20 14a8 8 0 11-10-10 7 7 0 0010 10z',sun:'M12 8a4 4 0 100 8 4 4 0 000-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',music:'M9 18V6l10-2v12M9 18a3 3 0 11-6 0 3 3 0 016 0M19 16a3 3 0 11-6 0 3 3 0 016 0',mute:'M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6',undo:'M4 9h11a5 5 0 010 10H8M4 9l4-4M4 9l4 4',bill:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',spk:'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2'};

// ===== SUPABASE + DISCORD FRIENDS =====
const SUPABASE_URL = 'https://dpxldincujnnheeesgcu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_G64piJDVZnrJgxHeBRA30w_U-aNjFHM';

const supabaseClient = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } })
  : (function(){
      // Không tải được thư viện Supabase (offline/bị chặn): dùng bản giả để game vẫn chạy
      const res={data:null,error:null};
      const chain=new Proxy(function(){},{get:(t,k)=>k==='then'?(r=>r(res)):chain,apply:()=>chain});
      const offErr={message:'Không kết nối được máy chủ (đang offline)'};
      return {
        auth:{
          getSession:async()=>({data:{session:null},error:null}),
          onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),
          signInWithOAuth:async()=>({data:null,error:offErr}),
          signOut:async()=>({error:null})
        },
        from:()=>chain, channel:()=>chain, removeChannel:()=>{}
      };
    })();

let currentUser = null;
let LASTPROF = '';

// Tên hiển thị (display name) và username của Discord
function discordNames(user) {
  const meta = (user && user.user_metadata) || {};
  const idn = ((user && user.identities) || []).find(i => i.provider === 'discord');
  const idd = (idn && idn.identity_data) || {};
  const cc = meta.custom_claims || idd.custom_claims || {};
  const username = (meta.preferred_username || idd.preferred_username || meta.full_name || idd.full_name || meta.name || idd.name || (user && user.email) || 'player').toLowerCase();
  const display = cc.global_name || meta.global_name || idd.global_name || meta.full_name || idd.full_name || meta.name || idd.name || username;
  return { username, display };
}

async function upsertProfile(user, onlyIfChanged) {
  if (!user) return;
  const meta = user.user_metadata || {};
  const dn = discordNames(user), username = dn.username;
  const sig = dn.display + '|' + username + '|' + (meta.avatar_url || '');
  if (onlyIfChanged && sig === LASTPROF) return;
  try {
    const { error } = await supabaseClient.from('profiles').upsert({
      id: user.id,
      username: username,
      display_name: dn.display,
      avatar_url: meta.avatar_url || null
    }, { onConflict: 'id' });
    if (!error) LASTPROF = sig;
    if (error) {
      toast('Lỗi lưu profile: ' + error.message);
      console.error(error);
    } else {
      try {
        const k = 'jsProfSaved:' + user.id;
        if (!localStorage.getItem(k)) { localStorage.setItem(k, '1'); toast('Đã lưu profile: ' + username); }
      } catch (e) {}
    }
    if (typeof s !== 'undefined') {
      await supabaseClient.from('shop_public').upsert({
        user_id: user.id,
        shop_name: s.pf?.nm || s.name || 'Tiệm hoa',
        day: s.day || 1,
        money: s.money || 0,
        level: typeof lvOf === 'function' ? lvOf(s.xp||0) : 1,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
    }
  } catch (e) {
    toast('Lỗi: ' + e.message);
  }
}

async function initAuth() {
  try {

// ---- Wall threads: lời nhắn gốc + các phản hồi lồng bên dưới ----
async function loadWallThread(ownerId, limit) {
  const { data: roots } = await supabaseClient.from('wall_messages')
    .select('id, message, created_at, from_user, parent_id')
    .eq('to_user', ownerId)
    .is('parent_id', null)
    .order('created_at', { ascending: false })
    .limit(limit);
  const ids = (roots || []).map(m => m.id);
  let replies = [];
  if (ids.length) {
    const { data } = await supabaseClient.from('wall_messages')
      .select('id, message, created_at, from_user, parent_id')
      .in('parent_id', ids)
      .order('created_at', { ascending: true });
    replies = data || [];
  }
  const uids = [...new Set([...(roots || []), ...replies].map(m => m.from_user))];
  const pmap = {};
  if (uids.length) {
    const { data: ps } = await supabaseClient.from('profiles')
      .select('id, display_name, username, avatar_url').in('id', uids);
    (ps || []).forEach(p => pmap[p.id] = p);
    try {
      const { data: sps } = await supabaseClient.from('shop_public').select('user_id, game_avatar').in('user_id', uids);
      (sps || []).forEach(r => {
        const d = parseGav(r.game_avatar);
        const p = pmap[r.user_id] || (pmap[r.user_id] = { id: r.user_id });
        p.gav = 'gav:' + JSON.stringify({ av: d.av || null, pre: d.pre || null, fr: d.fr || 0, afr: d.afr ? 1 : 0 });
      });
    } catch (e) { console.warn(e); }
  }
  return { roots: roots || [], replies, pmap };
}

function wallThreadsHtml(t, ownerId) {
  let html = '';

    for (const r of kids) html += wallBubbleHtml(r, t.pmap, ownerId, m.id, true, false);
    html += `<div id="rb-${m.id}" class="row" style="display:none;margin:6px 0 0 14px;gap:6px">

function friendAvH(raw, z) {

/* ---- Trình phát nhạc riêng cho card (không đụng tới nhạc/hàng đợi của người chơi) ---- */
const CardMu = (function () {
  let pl = null, plP = null, want = '', cued = '', playing = 0, resumeMain = 0, mu = null;
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
    if (loadYT.p) return loadYT.p;
    loadYT.p = new Promise((res, rej) => {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { try { prev && prev(); } catch (e) {} res(window.YT); };
      if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
        const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.async = true;
        sc.onerror = () => { loadYT.p = null; rej(new Error('yt')); };
        document.head.appendChild(sc);
      }
      setTimeout(() => { if (!(window.YT && window.YT.Player)) { loadYT.p = null; rej(new Error('yt')); } }, 15000);
    });
    return loadYT.p;
  }
  function wrap() {
    let w = document.getElementById('pvWrap');
    if (!w) {
      w = document.createElement('div'); w.id = 'pvWrap';
      w.style.cssText = 'position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden';
      w.innerHTML = '<div id="pvEl"></div>';
      document.body.appendChild(w);
    }
    return w;
  }
  function ensure(id) {
    if (pl) return Promise.resolve(pl);
    if (plP) return plP;
    wrap();
    plP = loadYT().then(Y => new Promise(res => {
      const p = new Y.Player('pvEl', {
        width: '200', height: '200', videoId: id,
        playerVars: { playsinline: 1, rel: 0, controls: 0 },
        events: {
          onReady: () => { pl = p; cued = id; res(p); },
          onStateChange: e => {
            const st = e && e.data;
            if (st === 1) {
              // Nếu nhạc người chơi đang phát (không do mình tạm dừng) thì dừng ngay đĩa than
              if (MS.playing) { try { p.pauseVideo(); } catch (x) {} playing = 0; return; }
              playing = 1;
            } else if (st === 2 || st === 0) {
              playing = 0;
              if (st === 0) giveBack();
            }
          },
          onError: () => { playing = 0; giveBack(); }
        }
      });
    })).catch(e => { plP = null; throw e; });
    return plP;
  }
  // Trả nhạc lại cho người chơi nếu mình đã tạm dừng nó để nghe đĩa than
  function giveBack() {
    if (resumeMain) { resumeMain = 0; try { if (!MS.playing && MS.now) MU.tog(); } catch (e) {} }
  }
  // phát cả bài, hoặc chỉ đoạn người chơi đã chọn (st/en, giây)
  function playIt(p) {
    const a = Math.floor(+(mu && mu.st)), b = Math.floor(+(mu && mu.en));
    if (a >= 0 && b > a && b - a <= 60) p.loadVideoById({ videoId: mu.id, startSeconds: a, endSeconds: b });
    else p.playVideo();
  }
  function load(id) {
    return ensure(id).then(p => {
      if (cued !== id) { cued = id; try { p.cueVideoById(id); } catch (e) {} }
      return p;
    });
  }
  return {
    // Chuẩn bị đĩa than; chỉ tự phát khi người chơi KHÔNG đang nghe gì
    prep(m, auto) {
      if (!m || !/^[\w-]{11}$/.test(m.id)) return;
      mu = m; want = m.id;
      load(m.id).then(p => {
        if (want !== m.id) return;
        if (auto && !MS.playing) { try { playIt(p); } catch (e) {} }
      }).catch(() => {});
    },
    tap() {
      if (!mu) return;
      if (playing) { try { pl.pauseVideo(); } catch (e) {} playing = 0; giveBack(); return; }
      // Người chơi chủ động bấm đĩa than: tạm dừng nhạc của họ, hết đĩa than sẽ tự phát tiếp
      if (MS.playing) { resumeMain = 1; try { MU.tog(); } catch (e) {} }
      load(mu.id).then(p => { try { playIt(p); } catch (e) {} }).catch(() => { toast('Không phát được nhạc của card'); giveBack(); });
    },
    // rời card / người chơi bật nhạc riêng -> dừng đĩa than; keepMain=true thì không bật lại nhạc chính
    stop(keepMain) {
      if (pl && playing) { try { pl.pauseVideo(); } catch (e) {} }
      playing = 0; want = '';
      if (keepMain) resumeMain = 0; else giveBack();
    },
    playing() { return !!playing; }
  };
})();

function vinylSync() {
  clearInterval(VMT);
  const f = () => {
    const v = document.getElementById('vinyl');
    if (!v || !VMU) { clearInterval(VMT); CardMu.stop(); return; }
    // Người chơi tự bật nhạc của mình trong lúc nghe đĩa than -> nhường nhạc của họ
    if (CardMu.playing() && MS.playing) CardMu.stop(true);
    v.classList.toggle('spin', CardMu.playing());
  };
  f(); VMT = setInterval(f, 400);
}

let VLP = 0, VLF = 0, VX = 0, VY = 0;
function vinylDown(e) {
  VLF = 0; clearTimeout(VLP); VX = e.clientX; VY = e.clientY;
  VLP = setTimeout(() => { VLF = 1; try { navigator.vibrate && navigator.vibrate(15); } catch (x) {} vinylInfo(); }, 450);
}
function vinylMove(e) { if (Math.abs(e.clientX - VX) > 12 || Math.abs(e.clientY - VY) > 12) clearTimeout(VLP); }
function vinylUp() { clearTimeout(VLP); }
function vinylInfoRender() {
  const m = VMU, box = document.getElementById('modal');

  box.innerHTML = `<div class=mb onclick="if(event.target==this)mdl()"><div class=ms id="vinfo">

  </div></div>`;
}
function vinylInfo() {
  if (!VMU) return;
  const m = VMU;
  vinylInfoRender();
  if (!m.name) {
    fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + m.id))
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        if (!j || VMU !== m) return;
        m.name = j.title || m.name;
        m.ar = (j.author_name || '').replace(/ - Topic$/, '') || m.ar;
        if (document.getElementById('vinfo')) vinylInfoRender();

  }
}

async function visitFriend(friendId) {
  if (!currentUser) return toast('Hãy liên kết Discord');
  const { data: shop } = await supabaseClient.from('shop_public').select('*').eq('user_id', friendId).maybeSingle();
  const { data: profile } = await supabaseClient.from('profiles').select('display_name, username').eq('id', friendId).maybeSingle();
  const wt = await loadWallThread(friendId, 15);
  const name = shop?.shop_name || profile?.display_name || 'Tiệm hoa';
  const dname = profile?.display_name || profile?.username || shop?.shop_name || 'Tiệm hoa';
  const cardHtml = shop?.card_image 
    ? `<div style="position:relative;margin:8px 0"><img src="${shop.card_image}" style="width:100%;border-radius:16px;display:block" alt="Danh thiếp">${vinylHtml(parseGav(shop.game_avatar).mu)}</div>`
    : `<canvas id="visit-card" width="360" height="200" style="width:100%;border-radius:16px;margin:8px 0;background:#fff"></canvas>`;
  const avHtml = friendAvTap(shop?.game_avatar, 40, friendId);
  let html = `<div class=card>
    <div class=row><h3 style="display:flex;align-items:center;gap:8px"><span style="position:relative;display:inline-block;line-height:0">${avHtml}<i class="pdot" data-pres="${friendId}"></i></span> <span>${esc(dname)}<br><small class="mut ptxt" data-pt="${friendId}" style="font-weight:400">Offline</small></span></h3><button class="s bk" onclick="tab='friends';R()">← Quay lại</button></div>
    ${cardHtml}
    <p class=mut>Ngày ${shop?.day || '?'} · Tiền ${$(shop?.money || 0)} · Cấp ${shop?.level || '?'}</p>
    <div class=row style="margin-top:8px">
      <input id="wall-input" placeholder="Viết lời nhắn cho bạn..." style="flex:1;width:auto">
      <button class=p onclick="postWall('${friendId}')">Ký tường</button>
    </div>
    <h4 style="margin-top:12px">📝 Tường nhà</h4>
    <div id="wall-list">`;
  if (!wt.roots.length) html += '<p class=mut>Chưa có ai ký tường.</p>';
  else html += wallThreadsHtml(wt, friendId);
  html += '</div></div>';
  const el = document.getElementById('friend-content');
  if (el) el.innerHTML = html;
  try { window.PRES && PRES.paint(); } catch (e) {}
  const mu = parseGav(shop?.game_avatar).mu;
  if (mu && mu.id) { CardMu.prep(mu, true); vinylSync(); }

  // Draw shop card on canvas
  setTimeout(() => {
    const c = document.getElementById('visit-card');
    if (!c) return;
    const ctx = c.getContext('2d');
    const w = c.width, h = c.height;
    // Background
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0, '#e3f5de');
    g.addColorStop(1, '#fffdf7');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
    // Border
    ctx.strokeStyle = '#d5ebd3';
    ctx.lineWidth = 4;
    ctx.strokeRect(2,2,w-4,h-4);
    // Text
    ctx.fillStyle = '#244033';
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px "Baloo 2", sans-serif';
    ctx.fillText(name, w/2, 60);
    ctx.font = '18px Onest, sans-serif';
    ctx.fillStyle = '#678a73';
    ctx.fillText('Ngày ' + (shop?.day||'?') + ' · Cấp ' + (shop?.level||'?'), w/2, 100);
    ctx.font = 'bold 32px "Baloo 2", sans-serif';
    ctx.fillStyle = '#388a55';
    ctx.fillText($(shop?.money||0), w/2, 145);
    ctx.font = '14px Onest, sans-serif';
    ctx.fillStyle = '#678a73';
    ctx.fillText('Justaseed · Tiệm hoa nhỏ', w/2, 175);
  }, 100);

}

async function postWall(toUser) {
  const input = document.getElementById('wall-input');
  if (!input || !currentUser) return;
  const msg = input.value.trim();
  if (!msg) return toast('Nhập nội dung');
  const { error } = await supabaseClient.from('wall_messages').insert({
    from_user: currentUser.id,
    to_user: toUser,
    message: msg
  });
  if (error) return toast('Lỗi: ' + error.message);
  toast('Đã ký tường');
  input.value = '';
  visitFriend(toUser);
}

async function loadFriendsUI() {
  const el = document.getElementById('friend-content');
  if (!el || !currentUser) return;
  const uid = currentUser.id;
  const { data: rows, error } = await supabaseClient
    .from('friends')
    .select('id, user_id, friend_id, status, created_at')
    .or(`user_id.eq.${uid},friend_id.eq.${uid}`);
  if (error) { el.innerHTML = '<p class=bad>Lỗi tải dữ liệu</p>'; return; }
  const ids = [...new Set(rows.flatMap(r => [r.user_id, r.friend_id]))];
  let profiles = {};
  if (ids.length) {
    const { data: ps } = await supabaseClient.from('profiles').select('id, username, display_name').in('id', ids);
    (ps || []).forEach(p => profiles[p.id] = p);
  }
  const accepted = [], incoming = [], outgoing = [];
  rows.forEach(r => {
    const otherId = r.user_id === uid ? r.friend_id : r.user_id;
    const other = profiles[otherId] || { display_name: 'Người chơi', username: '?' };
    const item = { ...r, other };
    if (r.status === 'accepted') accepted.push(item);
    else if (r.friend_id === uid) incoming.push(item);
    else outgoing.push(item);
  });
  let html = '';
  if (incoming.length) {
    html += '<h3>Lời mời nhận được</h3>';
    incoming.forEach(x => {
      html += `<div class=row><span><b>${esc(x.other.display_name)}</b> <span class=mut>@${esc(x.other.username)}</span></span>
        <span><button class=p onclick="acceptFriend(${x.id})">Chấp nhận</button> <button class=s onclick="removeFriend(${x.id})">Từ chối</button></span></div>`;
    });
  }
  if (outgoing.length) {
    html += '<h3>Đã gửi</h3>';
    outgoing.forEach(x => {
      html += `<div class=row><span><b>${esc(x.other.display_name)}</b> <span class=mut>@${esc(x.other.username)}</span></span>
        <button class=s onclick="removeFriend(${x.id})">Hủy</button></div>`;
    });
  }
  const avMap = {};
  try {
    const fids = accepted.map(x => x.user_id === uid ? x.friend_id : x.user_id);
    if (fids.length) {
      const { data: sp } = await supabaseClient.from('shop_public').select('user_id, game_avatar').in('user_id', fids);
      (sp || []).forEach(r => avMap[r.user_id] = r.game_avatar);
    }
  } catch (e) { console.warn(e); }
  html += '<h3>Bạn bè</h3>';
  if (!accepted.length) html += '<p class=mut>Chưa có bạn bè nào.</p>';
  else accepted.sort((a, b) => (((s.fav||{})[b.user_id === uid ? b.friend_id : b.user_id]) ? 1 : 0) - (((s.fav||{})[a.user_id === uid ? a.friend_id : a.user_id]) ? 1 : 0)).forEach(x => {
    const fid = x.user_id === uid ? x.friend_id : x.user_id;
    html += `<div class=row><span style="display:flex;align-items:center;gap:8px"><span style="position:relative;display:inline-block;line-height:0">${friendAvTap(avMap[fid], 34, fid)}<i class="pdot" data-pres="${fid}"></i></span><span><b>${esc(x.other.display_name)}</b> <span class=mut>@${esc(x.other.username)}</span><br><small class="mut ptxt" data-pt="${fid}">Offline</small></span></span>
      <span><button class="s ${(s.fav||{})[fid]?'on2':''}" onclick="favFriend('${fid}','${encodeURIComponent(x.other.display_name||x.other.username||'Bạn bè')}')" aria-label="Yêu thích">${(s.fav||{})[fid]?'⭐':'☆'}</button> <button class=p onclick="visitFriend('${fid}')">Thăm</button> <button class=s onclick="removeFriend(${x.id})">Xóa bạn</button></span></div>`;
  });
  el.innerHTML = html;
  try { window.PRES && PRES.paint(); } catch (e) {}
}

stat(){const sd=sdNow(),ci={d:sd,w:Math.ceil(sd/7),m:Math.ceil(sd/30)}[SPT];if(SO==null||SO>ci)SO=ci;
const len={d:1,w:7,m:30}[SPT],a=(SO-1)*len+1,b=SO*len,e=s.led.filter(x=>x.d>=a&&x.d<=b),sm=k=>e.filter(x=>x.k==k).reduce((t,x)=>t+x.amt,0),inc=sm('in'),out=sm('out'),loss=sm('loss');
const grp=k=>{const g={};e.filter(x=>x.k==k).forEach(x=>{const c=g[x.cat]=g[x.cat]||{amt:0,it:{}};c.amt+=x.amt;const i=c.it[x.name]=c.it[x.name]||{q:0,amt:0};i.q+=x.q;i.amt+=x.amt});return g};
const blk=(k,tot)=>{const g=grp(k),ks=Object.keys(g).sort((x,y)=>g[y].amt-g[x].amt);return ks.length?ks.map(c=>`<div class=inq><div class=row><b>${esc(c)}</b><b>${$(g[c].amt)}</b></div><div class=bar><i style="width:${tot?g[c].amt/tot*100:0}%"></i></div>${Object.keys(g[c].it).map(n=>{const i=g[c].it[n];return `<div class=row><span class=mut>${esc(n)}${i.q>1?' × '+i.q:''}</span><span class=mut>${$(i.amt)}</span></div>`}).join('')}</div>`).join(''):'<p class=mut>Chưa có khoản nào.</p>'};
const lb=SPT=='d'?'Ngày '+SO:(SPT=='w'?'Tuần ':'Tháng ')+SO+` (ngày ${a}–${b})`,net=inc-out;
let days='';if(SPT!='d'){const r=[];for(let d=a;d<=Math.min(b,sd);d++){const i=e.filter(x=>x.d==d&&x.k=='in').reduce((t,x)=>t+x.amt,0),o=e.filter(x=>x.d==d&&x.k=='out').reduce((t,x)=>t+x.amt,0);r.push(`<div class=row><span>Ngày ${d}</span><span class=mut>thu ${$(i)} · chi ${$(o)}</span><b class="${i-o>=0?'ok':'bad'}">${$(i-o)}</b></div>`)}days=`<div class=card><h3>Theo từng ngày</h3>${r.join('')||'<p class=mut>Chưa có dữ liệu.</p>'}</div>`}
return `<div class=card><div class=row><span><button class="s ${SPT=='d'?'on2':''}" onclick="setPT('d')">Ngày</button> <button class="s ${SPT=='w'?'on2':''}" onclick="setPT('w')">Tuần</button> <button class="s ${SPT=='m'?'on2':''}" onclick="setPT('m')">Tháng</button></span></div><div class=row><button class=s ${SO<=1?'disabled':''} onclick="navSO(-1)">‹</button><b>${lb}</b><button class=s ${SO>=ci?'disabled':''} onclick="navSO(1)">›</button></div><p class=mut>1 tuần = 7 ngày, 1 tháng = 30 ngày trong game.</p></div>
<div class=card><h3>Tổng quan</h3><div class=row><span>Tổng thu</span><b class=ok>${$(inc)}</b></div><div class=row><span>Tổng chi</span><b class=bad>${$(out)}</b></div><div class=row><b>Lãi / lỗ ròng</b><b class="${net>=0?'ok':'bad'}">${$(net)}</b></div><div class=row><span class=mut>Số dư hiện tại</span><span class=mut>${$(s.money)}</span></div></div>
<div class=card><h3>Các khoản chi</h3>${blk('out',out)}</div><div class=card><h3>Các khoản thu</h3>${blk('in',inc)}</div>${days}
<div class=card><h3>Hao hụt (không tính vào chi)</h3><p class=mut>Giá trị hàng hỏng hoặc bỏ đi, vốn đã nằm trong chi phí nhập hàng. Tổng: <b>${$(loss)}</b></p>${blk('loss',loss)}</div>`},
quest(){return `<div class=card>${Q.map((q,i)=>{const d=q[1](s),c=s.cl[i];return `<div class=row><span>${q[0]}<br><span class=mut>Thưởng ${$(q[2])}</span></span><button class=p ${d&&!c?'':'disabled'} onclick="claimQ(${i})">${c?'Đã nhận':d?'Nhận':'Chưa xong'}</button></div>`}).join('')}</div>`},
up(){const c=250000*(s.up+1);return `<div class=card><div class=row><span>Quầy xịn cấp ${s.up}/5<br><span class=mut>+8 giây kiên nhẫn, thêm khách</span></span><button class=p ${s.up<5&&s.money>=c?'':'disabled'} onclick="buyUp(${c})">${s.up<5?$(c):'Tối đa'}</button></div></div><div class=card><h3>Mở khóa hoa mới</h3><p class=mut>Hoa càng hiếm thì giá vốn càng cao, bù lại bán được giá tốt hơn.</p>${F.filter(f=>f.u).map(f=>`<div class=row><span style="display:flex;gap:8px;align-items:center">${fw(f.id,34)}<span><b>${f.n}</b><br><span class=mut>vốn ${$(f.c)}/bông</span></span></span><button class=p ${s.un[f.id]||s.money<f.u?'disabled':''} onclick="unlock('${f.id}')">${s.un[f.id]?'Đã mở':$(f.u)}</button></div>`).join('')}</div>`},

guide(){return `<div class=card><h3>🌱 Bắt đầu nhanh</h3><p class=mut style="margin:0 0 6px">Mỗi ngày gồm 2 giai đoạn: <b>chuẩn bị</b> (nhập hàng, chỉnh giá) rồi <b>mở cửa</b> (bán hàng cho khách). Hết ngày bạn nhận kết quả, trả chi phí cố định và bắt đầu ngày mới.</p><ol><li>Vào <b>Nhập hàng</b> mua nguyên liệu.</li><li>Vào <b>Giá bán</b> kiểm tra giá.</li><li>Mở cửa, sang <b>Quầy</b> phục vụ khách.</li><li>Xem <b>Đánh giá</b>, <b>Thống kê</b>, làm <b>Nhiệm vụ</b> rồi <b>Nâng cấp</b> tiệm.</li></ol></div>
<div class=card><h3>🛒 Nhập hàng &amp; Giá bán</h3><ul><li><b>Nhập hàng:</b> chọn nhà cung cấp, thêm hoa, giấy, quà vào giỏ. Kiểm tra danh sách, số lượng và số tiền rồi bấm "Xác nhận mua" thì tiền mới bị trừ. Suất có hạn.</li><li>Hoa dư không bán hết sẽ hỏng dần (khoảng 60% hỏng qua đêm), nên đừng nhập quá nhiều.</li><li><b>Giá bán:</b> mặc định = vốn + 215%. Bạn chỉnh được từng size, xem vốn và lời ngay bên cạnh. Giá cao lời nhiều nhưng khách dễ mặc cả hoặc bỏ đi.</li></ul></div>
<div class=card><h3>💐 Phục vụ khách ở Quầy</h3><ol><li>Khách đến theo từng đợt (1–3 người) trong ngày từ 9:00 đến 22:00. Bạn có thể chọn ngày dài 4 hoặc 8 phút.</li><li>Chạm vào khách để xem yêu cầu, rồi mặc cả nếu cần.</li><li>Chọn theo thứ tự: <span class="tag tf">hoa</span> → <span class="tag tp">giấy gói</span> → <span class="tag tg">quà</span>. Món khách cần được viền màu. Quà tặng bao nhiêu loại, bao nhiêu cái cũng được.</li><li>Một số khách yêu cầu giấy gói theo hoa văn riêng.</li></ol><p class=mut style="margin:6px 0 0"><b>Lưu ý:</b> sai loại hoa, size giấy hoặc số bông thì nguyên liệu bị bỏ, bạn phải làm lại và bị trừ điểm. Khách hết kiên nhẫn sẽ bỏ đi. Khách VIP boa 5–20%.</p></div>
<div class=card><h3>🎒 Túi đồ, Pet &amp; Nội thất</h3><ul><li><b>Túi đồ:</b> xem tồn kho và hạn dùng của từng nguyên liệu.</li><li><b>Pet:</b> vuốt ve, cho ăn, mua và mặc phụ kiện cho thú cưng của tiệm. Bạn cũng có thể chạm vào mèo ở màn hình chính.</li><li><b>Nội thất:</b> mua và sắp xếp đồ trang trí để tiệm thêm đẹp.</li><li><b>Gian hàng:</b> tùy chỉnh diện mạo gian hàng của bạn, bạn bè sẽ thấy khi ghé thăm.</li></ul></div>
<div class=card><h3>⭐ Đánh giá, Hóa đơn &amp; Thống kê</h3><ul><li><b>Đánh giá:</b> chia 2 kênh Google Map và Fanpage. Bạn tự viết phản hồi cho từng đánh giá.</li><li><b>Hóa đơn:</b> lịch sử thu chi từng khoản, chỉ lưu 7 ngày gần nhất (số lần mua của khách vẫn được giữ lại).</li><li><b>Thống kê:</b> xem thu chi chi tiết theo ngày, tuần, tháng.</li><li><b>Chi phí cố định mỗi ngày:</b> thuê mặt bằng ${$(RENT)} + điện nước ${$(UTIL)}. Hãy đảm bảo doanh thu đủ bù khoản này.</li></ul></div>
<div class=card><h3>🏆 Nhiệm vụ, Thành tích &amp; Nâng cấp</h3><ul><li><b>Nhiệm vụ:</b> hoàn thành mục tiêu (phục vụ khách, đạt 5 sao, doanh thu tích lũy...) rồi bấm nhận thưởng tiền.</li><li><b>Thành tích:</b> huy hiệu mở khóa khi bạn đạt các cột mốc.</li><li><b>Nâng cấp:</b> nâng cấp quầy (tối đa cấp 5) và mở khóa loại hoa mới bằng tiền để bán được nhiều loại hơn.</li></ul></div>
<div class=card><h3>👥 Hồ sơ, Bạn bè &amp; Lưu tiến trình</h3><ul><li><b>Hồ sơ:</b> bấm avatar trên thanh đầu để đổi ảnh, tên, màu chủ đề, làm card visit và xem level. Bạn có thể viết <b>suy nghĩ</b> hiện trên avatar và gắn một <b>đoạn nhạc</b> đang nghe (tối đa 30 giây) vào hồ sơ để bạn bè xem.</li><li><b>Bạn bè:</b> đăng nhập Discord để kết bạn bằng username, xem hồ sơ và gian hàng của nhau.</li><li><b>Chơi ngay:</b> tiến trình chỉ lưu trên máy này. Bạn có thể sao lưu bằng <b>mã</b> hoặc <b>QR</b> rồi khôi phục bằng "Khôi phục bằng mã / QR" ở màn hình chính.</li><li><b>Đăng nhập Discord:</b> tiến trình tự động lưu lên tài khoản và khôi phục khi bạn đăng nhập lại ở thiết bị khác. Chưa có tài khoản thì bấm "Ấn vào đây" để đăng ký.</li><li>Đăng xuất sẽ xóa dữ liệu trên máy, nên hãy đảm bảo tiến trình đã được lưu.</li></ul></div>
<div class=card><h3>💡 Mẹo</h3><ul><li>Nhập vừa đủ để hạn chế hoa hỏng, nhất là khi chưa biết lượng khách.</li><li>Xem kỹ yêu cầu khách trước khi chọn nguyên liệu để tránh bị trừ điểm.</li><li>Trả lời đánh giá đều đặn để giữ tiệm có tiếng tốt.</li><li>Đổi ngôn ngữ và chế độ tối trong <b>Cài đặt</b>.</li></ul>${document.body.classList.contains('m')?'':'<button class=p onclick="startTut()">Xem lại hướng dẫn từng bước</button>'}</div>`},

const sg=(n,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- YouTube: lấy thông tin & tìm kiếm ---------- */
const LRE=/(?:youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i;
const dec=h=>{const t=document.createElement('textarea');t.innerHTML=h||'';return t.value};
const cov=id=>'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
const artist=c=>dec(c).replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').trim();
const dur=iso=>{const m=/^P(?:\d+D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso||'');return m?((+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0))*1000:0};
async function yt(path,params){
 let r;
 try{r=await fetch('https://www.googleapis.com/youtube/v3/'+path+'?'+new URLSearchParams(Object.assign({key:MS.key},params)))}
 catch(e){throw new Error('Không kết nối được tới YouTube (mạng hoặc trình duyệt chặn)')}
 if(!r.ok){
  let why='';try{const j=await r.json();why=(j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||''}catch(e){}
  if(why=='quotaExceeded')throw new Error('Khóa YouTube đã hết hạn mức hôm nay (khoảng 100 lượt tìm/ngày). Hãy dán link YouTube hoặc thử lại ngày mai.');
  if(why=='keyInvalid'||r.status==400)throw new Error('Khóa YouTube API chưa đúng. Hãy kiểm tra lại khóa.');
  if(r.status==403)throw new Error('YouTube từ chối khóa này (403). Hãy bật "YouTube Data API v3" cho khóa, và kiểm tra giới hạn tên miền của khóa.');
  throw new Error('YouTube API lỗi '+r.status)}
 return r.json()}
const fromVideo=v=>({id:v.id,name:dec(v.snippet.title),ar:artist(v.snippet.channelTitle),img:cov(v.id),th:cov(v.id),dur:dur(v.contentDetails&&v.contentDetails.duration)});
async function getVideo(id){
 if(MS.key){try{const j=await yt('videos',{part:'snippet,contentDetails',id});if(j.items&&j.items[0])return fromVideo(j.items[0])}catch(e){}}
 try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
  if(r.ok){const j=await r.json();return{id,name:dec(j.title)||'Video YouTube',ar:artist(j.author_name||''),img:cov(id),th:cov(id),dur:0}}}catch(e){}
 return{id,name:'Video YouTube',ar:'',img:cov(id),th:cov(id),dur:0}}
async function search(raw){
  const q=raw.replace(/\s+[-–—]\s+/g,' ');
 const base={part:'snippet',type:'video',videoEmbeddable:'true',maxResults:'12',q};
 let j=await yt('search',Object.assign({videoCategoryId:'10'},base));
 if(!j.items||!j.items.length)j=await yt('search',base);
 const ids=(j.items||[]).map(x=>x.id&&x.id.videoId).filter(Boolean);
 if(!ids.length)return[];
 const d=await yt('videos',{part:'snippet,contentDetails',id:ids.join(',')});
 return(d.items||[]).map(fromVideo)}

/* ---------- trình phát (YouTube IFrame Player API) ---------- */
let ctl=null,ctlP=null,apiP=null,loaded='',kid=0,ending=0,dk=-1,miniSig='';
let hidT=0,errN=0,aut=0,dtT=0,dtS=0,msId='',sil=null,silUrl='';
function loadApi(){
 if(apiP)return apiP;
 apiP=new Promise((res,rej)=>{
  if(window.YT&&window.YT.Player)return res(window.YT);
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{try{prev&&prev()}catch(e){}res(window.YT)};
  const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;
  sc.onerror=()=>{apiP=null;rej(new Error('Không tải được trình phát YouTube (kiểm tra mạng hoặc tiện ích chặn quảng cáo)'))};
  document.head.appendChild(sc);
  setTimeout(()=>{if(!ctl&&!(window.YT&&window.YT.Player)){apiP=null;rej(new Error('Trình phát YouTube tải quá lâu'))}},15000)});
 return apiP}
function ensureCtl(id,auto){
 if(ctl)return Promise.resolve(ctl);if(ctlP)return ctlP;
 ctlP=loadApi().then(Y=>new Promise(res=>{
  const p=new Y.Player('spEl',{width:'100%',height:'100%',videoId:id,
   playerVars:{playsinline:1,rel:0,modestbranding:1,autoplay:auto?1:0},
   events:{onReady:()=>{ctl=p;loaded=id;res(p)},onStateChange:onSt,onError:onErr}})
 })).catch(e=>{ctlP=null;throw e});
 return ctlP}
const est=()=>MS.playing?Math.min(MS.pos+(Date.now()-MS.evT)*(MS.rate||1),MS.dur||1e9):MS.pos;

 const k=++kid;let n=0;
 const f=()=>{if(k!==kid||!MS.want||MS.playing)return;
  try{c.playVideo()}catch(e){}

  else if(!document.hidden){MS.show=1;ui();toast('Trình duyệt chặn tự phát — hãy bấm Play trong khung YouTube')}};

  if(MS.playing){try{MS.pos=ctl.getCurrentTime()*1000}catch(x){}MS.evT=Date.now();MS.playing=0;
   /* trang bị ẩn (tắt màn hình / thoát web) mà không phải do mình bấm tạm dừng -> thử phát lại */

function shuf(){const a=MS.q;for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}qui();toast('Đã xáo trộn hàng đợi')}

/* ---------- tìm kiếm ---------- */
async function doSearch(){
 const inp=$e('msq'),q=((inp?inp.value:MS.qry)||'').trim();MS.qry=q;if(!q||MS.busy)return;
 MS.err='';MS.msg='';MS.busy=1;resUI();
 try{
  const m=q.match(LRE);let t;
  if(m)t=await getVideo(m[1]);
  else if(/^https?:\/\//i.test(q))throw new Error('Link chưa đúng dạng. Hãy dùng link video dạng youtube.com/watch?v=… hoặc youtu.be/… (link playlist/kênh chưa hỗ trợ).');

function mkSilence(){

const QRB={enc:u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},dec:q=>{q=q.replace(/-/g,'+').replace(/_/g,'/');while(q.length%4)q+='=';const b=atob(q),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}};
const qrPipe=async(u,C,f)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new C(f))).arrayBuffer());
function qrJson(lv,keepPf){lv=lv||0;const DROP=['led','bills','rv','notifs','forum','cam','prev','lastWallCheck','lastFriendCheck','devClicks','seenCust','qseen'].concat(s.ph=='end'?[]:['rpt']);
 return JSON.stringify(s,function(k,v){if(this===s&&DROP.includes(k))return undefined;if(typeof v=='string'&&v.slice(0,5)=='data:'&&!(keepPf&&this===s.pf))return undefined;
  if(lv>=2&&v&&typeof v=='object'&&!Array.isArray(v)&&k!='pr'&&k!=''){const o={};for(const q in v){if(v[q]!==0&&v[q]!==false&&v[q]!==null)o[q]=v[q]}return o}
  return v})}
async function qrPayload(){const enc=async u=>{try{if(!window.CompressionStream)throw 0;return 'JSA1:'+QRB.enc(await qrPipe(u,CompressionStream,'deflate-raw'))}catch(e){return 'JSA0:'+QRB.enc(u)}};
 let last;for(const [lv,ec] of [[0,'M'],[0,'L'],[2,'L']]){try{const txt=await enc(new TextEncoder().encode(qrJson(lv)));return{txt,q:QRG.make(Uint8Array.from(txt,c=>c.charCodeAt(0)),ec)}}catch(e){last=e}}
 throw last}
async function qrParse(txt){txt=(txt||'').trim();const tg=txt.slice(0,5);if(tg!='JSA1:'&&tg!='JSA0:')throw new Error('fmt');let u=QRB.dec(txt.slice(5));
 if(tg=='JSA1:'){if(!window.DecompressionStream)throw new Error('nodec');u=await qrPipe(u,DecompressionStream,'deflate-raw')}
 const o=JSON.parse(new TextDecoder().decode(u));if(!o||typeof o!='object'||typeof o.day!='number'||typeof o.money!='number'||!o.st||typeof o.st!='object')throw new Error('bad');return o}

async function sendQrToDiscord() {
  if (!currentUser) return toast('Hãy liên kết Discord trước');
  if (!QCV) return toast('Chưa có ảnh QR');
  toast('Đang gửi...');
  try {
    const blob = await new Promise(r => QCV.toBlob(r, 'image/png'));
    const reader = new FileReader();
    const b64 = await new Promise((res, rej) => {
      reader.onload = () => res(reader.result);
      reader.onerror = rej;
      reader.readAsDataURL(blob);
    });
    const code = await qrPayload().then(p => p.txt).catch(() => '');
    const discordId = currentUser.user_metadata?.provider_id 
                   || (currentUser.identities && currentUser.identities[0] && currentUser.identities[0].id)
                   || currentUser.user_metadata?.sub 
                   || null;
    const { error } = await supabaseClient.from('qr_requests').upsert({
      user_id: currentUser.id,
      discord_id: discordId,
      qr_image: b64,
      restore_code: code,
      created_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    if (error) throw error;
    toast('Đã gửi yêu cầu. Vào Discord gõ /qr để nhận.');
  } catch (e) {
    toast('Lỗi gửi: ' + (e.message || e));
    console.error(e);
  }
}

const txt=e.dataset.t!=null?e.dataset.t:(e.dataset.t=e.textContent);
const k=txt+'|'+p.clientWidth;if(e.dataset.k===k)return;e.dataset.k=k;
e.classList.remove('run');e.textContent=txt;
const w=p.clientWidth;if(!w)return;
const ov=e.getBoundingClientRect().width-w;
if(ov>2){e.innerHTML='<span class="mqa"></span><span class="mqa"></span>';e.children[0].textContent=txt;e.children[1].textContent=txt;e.classList.add('run');
const one=e.getBoundingClientRect().width/2;e.style.setProperty('--md',Math.max(4,one/32).toFixed(1)+'s')}});
setInterval(fx,700);addEventListener('resize',fx);fx()})();
</script>

RE.lastIndex=0;while((m=RE.exec(t))){if(m.index>last)parts.push(t.slice(last,m.index));parts.push({e:m[1]});last=RE.lastIndex}

this.textAlign=al};
})();

const wbar=k=>{const l=wl(k),a=25*(l-1)**2,b=25*l*l;return `<div class=bar><i style="width:${Math.min(100,((ws()[k].xp||0)-a)/(b-a)*100)}%"></i></div>`},
 dm=t=>`<span class=chip>Nhu cầu ${Math.round(s.mk[t]*100)}% · giá x${dem(t).toFixed(2)}</span>`;

const rcBtn=(r,my)=>{const ok=r.f.every(i=>fl().some(f=>f.id==i)),sel=WP.length==3&&rcKey(WP)==rcKey(r.f);return `<button class="s ${sel?'on2':''}" ${ok?'':'style="opacity:.5"'} onclick="XB.rc('${r.id}')"><b>${esc(r.n)}</b> <span style="display:inline-flex;vertical-align:middle">${r.f.map(i=>fw(i,16)).join('')}</span></button>`};

V.ws=()=>{ws();const lv=L2(),have=fl().filter(f=>(s.st[f.id]||0)>0);
 const chips=(a,fn)=>have.length?`<div class=strip2>${have.map(f=>`<button class="s ${a.includes(f.id)?'on2':''}" onclick="XB.${fn}('${f.id}')">${fw(f.id,20)} ${f.n} <b>${s.st[f.id]}</b></button>`).join('')}</div>`:'<p class=mut>Kho đang trống, hãy nhập hoa trước.</p>';
 const fm=WF.reduce((a,id)=>a+C[id]*3,0)+VS[WV][1],pm=WP.reduce((a,id)=>a+C[id]*(WC+1),0)+BOT[WC-1];
 return `<div class=card><h3>🎓 Workshop</h3><p class=mut style="margin:0">Không giới hạn số lần, nhưng mỗi mẻ cần thời gian hoàn thành (mỗi bàn làm 1 mẻ một lúc, vẫn chạy khi bạn thoát game). Tác phẩm lên kệ, đưa ra gian hàng để bán dần. Làm nhiều một loại thì nhu cầu giảm, giá giảm theo, hồi dần mỗi ngày.</p></div>
 ${Z.jobCard()}<div class=card><div class=row><h3>💐 Cắm hoa</h3><span>${dm('fa')} <b>Cấp ${wl('fa')}</b></span></div>${wbar('fa')}${lv<2?'<p class=mut>Mở khóa ở cấp độ 2.</p>':`<p class=mut style="margin:6px 0 2px">1. Chọn 2–4 loại hoa (mỗi loại 3 bông)</p>${chips(WF,'tf')}<p class=mut style="margin:6px 0 2px">2. Chọn kiểu cắm</p><div class=strip2>${VS.map((v,i)=>`<button class="s ${WV==i?'on2':''}" onclick="XB.vs(${i})">${v[0]} <span class=mut>${$(v[1])}</span></button>`).join('')}</div><div class=row><span class=mut>Chi phí vật liệu ~${$(fm)}</span><button class=p ${WF.length<2||s.wq.some(j=>j.t=='fa')?'disabled':''} onclick="XB.mkFa()">Cắm hoa · ⏱ ${wfmt(fdur(Math.max(2,WF.length),WV))}</button></div>`}</div>
 <div class=card><div class=row><h3>🧪 Điều chế nước hoa</h3><span>${dm('pf')} <b>Cấp ${wl('pf')}</b></span></div>${wbar('pf')}${lv<4?'<p class=mut>Mở khóa ở cấp độ 4.</p>':`${rcUI()}<p class=mut style="margin:6px 0 2px">1. Hoặc tự chọn đúng 3 hương (khác nhóm thì chất lượng cao hơn)</p>${chips(WP,'tp')}${WP.length?`<p class=mut style="margin:2px 0">${WP.map(id=>nm(id)+' · '+FAM[id]).join(' | ')}</p>`:''}${rcSave()}<div class=row><span>2. Nồng độ</span><span>${CN.map((c,i)=>`<button class="s ${WC==i+1?'on2':''}" onclick="XB.c(${i+1})">${c}</button>`).join(' ')}</span></div><div class=row><span class=mut>Cần ${WC+1} bông mỗi hương · ~${$(pm)}</span><button class=p ${WP.length<3||s.wq.some(j=>j.t=='pf')?'disabled':''} onclick="XB.mkPf()">Điều chế · ⏱ ${wfmt(pdur(WC))}</button></div>`}</div>`+Z.shelfCard()};

 const tot=inc+wt+rt;if(!tot)return;s.money=Math.max(0,s.money-tot);
 if(inc)L('out','Thuế & phí','Thuế thu nhập',1,inc,d);if(wt)L('out','Thuế & phí','Thuế tài sản',1,wt,d);if(rt)L('out','Thuế & phí','Phụ phí mặt bằng',1,rt,d);
 r.tax={inc,wt,rt};r.pf=(r.pf||0)-tot;save()};
{const o=endDay;endDay=function(){o();try{Z.eod()}catch(e){console.error(e)}}}
{const o=V.shop;V.shop=function(){const h=o(),x=s.ph=='end'&&s.rpt&&s.rpt.tax;if(!x)return h;return h+`<div class=card><h3>⚖️ Thuế & phí</h3>${[['Thuế thu nhập',x.inc],['Thuế tài sản',x.wt],['Phụ phí mặt bằng',x.rt]].filter(r=>r[1]).map(r=>`<div class=row><span>${r[0]}</span><b class=bad>-${$(r[1])}</b></div>`).join('')}</div>`}}

<script>
/* ===== V29: 2 chế độ - Chơi ngay (local) / Discord (tự động lưu) ===== */
(function(){
  const MODE_KEY = 'jsMode';
  const INTENT_KEY = 'jsAuthIntent';
  window.DISCORD_OK = false;

  function setMode(m){ try{ localStorage.setItem(MODE_KEY, m); }catch(e){} }
  function getMode(){ try{ return localStorage.getItem(MODE_KEY) || 'guest'; }catch(e){ return 'guest'; } }

  async function hasAccount(uid){
    try{
      const r = await supabaseClient.from('game_saves').select('user_id').eq('user_id', uid).maybeSingle();
      if (r && r.error) {
        const m = (r.error.message || '') + (r.error.code || '');
        if (/42P01|PGRST205|game_saves|schema cache/i.test(m)) {
          toast('Chưa tạo được bảng game_saves trên Supabase. Hãy chạy SQL tạo bảng trước.');
        }
        return null; // lỗi: không chắc, KHÔNG được coi là chưa đăng ký
      }
      return !!(r && r.data);
    }catch(e){ return null; }
  }

  // Đăng xuất an toàn: không chờ quá 1,5 giây, luôn xóa token cục bộ
  function safeSignOut(){
    return Promise.race([
      Promise.resolve().then(function(){ return supabaseClient.auth.signOut({ scope: 'local' }); }).catch(function(){}),
      new Promise(function(r){ setTimeout(r, 1500); })
    ]).then(function(){
      try{ Object.keys(localStorage).forEach(function(k){ if (/^sb-.*-auth-token/i.test(k)) localStorage.removeItem(k); }); }catch(e){}
    });
  }

  window.playNow = function(){
    window.DISCORD_OK = false;
    setMode('guest');
    const go = function(){ currentUser = null; if (typeof play === 'function') play(); };
    if (typeof currentUser !== 'undefined' && currentUser) {
      safeSignOut().then(go, go);
    } else go();
  };

  window.loginWithDiscord = function(){
    try{ localStorage.setItem(INTENT_KEY, 'login'); }catch(e){}
    if (typeof loginDiscord === 'function') loginDiscord();
  };

  window.registerWithDiscord = function(){
    try{ localStorage.setItem(INTENT_KEY, 'register'); }catch(e){}
    if (typeof loginDiscord === 'function') loginDiscord();
  };

  window.logoutToMenu = async function(){
    if (window.__loggingOut) return;
    window.__loggingOut = true;
    // 1. Lưu tiến trình hiện tại (máy + tài khoản) trước khi đăng xuất
    try{ save(); }catch(e){}
    if (window.DISCORD_OK && window.CLOUD && typeof window.CLOUD.flush === 'function') {
      toast('Đang lưu tiến trình...');
      let saved = false;
      try{ saved = await Promise.race([window.CLOUD.flush(), new Promise(function(r){ setTimeout(function(){ r(false); }, 8000); })]); }catch(e){}
      if (!saved && !confirm('Chưa lưu được tiến trình lên tài khoản (có thể do mất mạng). Đăng xuất sẽ xóa tiến trình trên máy này. Vẫn đăng xuất?')) {
        window.__loggingOut = false;
        return;
      }
    }
    try{ await safeSignOut(); }catch(e){}
    currentUser = null;
    window.DISCORD_OK = false;
    setMode('guest');
    try{ if (typeof live !== 'undefined' && live && live.iv) clearInterval(live.iv); }catch(e){}
    try{ live = null; cur = null; CART = {}; pop = ''; }catch(e){}
    try{ s = def(); }catch(e){}
    try{
      Object.keys(localStorage).forEach(function(k){
        if (!/^sb-|supabase|jsMode|jsAuthIntent/i.test(k)) localStorage.removeItem(k);
      });
    }catch(e){}
    // 2. Về ngay trang chủ, rồi tải lại để khởi tạo sạch
    try{ scr = 'menu'; document.body.classList.add('m'); mdl(); renderMenu(); }catch(e){}
    toast('Đã lưu tiến trình và đăng xuất. Đăng nhập lại để chơi tiếp.');
    setTimeout(function(){ location.reload(); }, 600);
  };

  // Menu 2 chế độ
  renderMenu = function(){
    { const fn = document.getElementById('floatNotif'); if (fn) fn.remove(); }
    const p = hasProg();
    const logged = (typeof currentUser !== 'undefined' && currentUser && window.DISCORD_OK);
    const nm = logged ? (currentUser.user_metadata?.preferred_username || currentUser.user_metadata?.name || currentUser.email || 'Discord') : '';
    const waiting = !logged && !window.AUTH_READY && getMode() === 'discord';
    const status = waiting
      ? '<p class=mut style="margin:6px 0 2px">⏳ Đang kiểm tra tài khoản...</p>'
      : logged
      ? '<p class=mut style="margin:6px 0 2px">☁️ Đã đăng nhập <b>@'+esc(nm)+'</b><br>Tiến trình tự động lưu lên Discord</p>'
      : '<p class=mut style="margin:6px 0 2px">Chế độ <b>Chơi ngay</b> · chỉ lưu trên máy này<br>Khôi phục thủ công bằng <b>mã</b> hoặc <b>QR</b></p>';

    const buttons = waiting ? '' : logged
      ? '<button class="p big" onclick="play()">'+ic('play',20)+' Chơi'+(p?' tiếp':'')+'</button>'
        +(p?'<span class=mut>Ngày '+s.day+'</span>':'')
        +'<button class="s big" onclick="logoutToMenu()">Đăng xuất Discord</button>'
      : '<button class="p big" onclick="playNow()">'+ic('play',20)+' Chơi ngay</button>'
        +'<button class="s big" onclick="loginWithDiscord()">Đăng nhập Discord</button>'
        +'<p class=mut style="font-size:.78rem;margin:4px 0 0;line-height:1.35">Chưa có tài khoản? <a href="#" onclick="registerWithDiscord();return false" style="color:inherit;font-weight:700;text-decoration:underline">Ấn vào đây</a> để đăng ký.</p>';

    const restoreBtn = '<button class="s" style="width:100%;margin-top:6px" onclick="mdl(\'r\')">'+ic('save',18)+' Khôi phục bằng mã / QR</button>';

    document.getElementById('menu').innerHTML =
      '<svg class=mbg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice"><circle cx=320 cy=110 r=70 style="fill:var(--sun)" opacity=.35 /><circle cx=320 cy=110 r=24 style="fill:var(--sun)"/><g class=cl><ellipse cx=80 cy=120 rx=44 ry=15 fill=#fff opacity=.85 /><ellipse cx=110 cy=108 rx=28 ry=14 fill=#fff opacity=.85 /></g><g class="cl d2"><ellipse cx=250 cy=200 rx=36 ry=12 fill=#fff opacity=.7 /><ellipse cx=272 cy=191 rx=22 ry=11 fill=#fff opacity=.7 /></g><path d="M0 620Q100 560 210 610T400 590V800H0z" style="fill:var(--h1);opacity:.7"/><path d="M0 690Q120 650 230 690T400 675V800H0z" style="fill:var(--h1)"/><path d="M0 740Q140 710 260 745T400 730V800H0z" style="fill:color-mix(in srgb,var(--h1) 78%,#1b4a2a)"/><rect x=40 y=640 width=8 height=50 fill="#8a5a30"/><circle cx=44 cy=625 r=28 fill="#6cc07a"/><rect x=352 y=630 width=8 height=60 fill="#8a5a30"/><circle cx=356 cy=612 r=32 fill="#58ad69"/></svg>'
      +'<div class=mtop><button class="s" onclick="mdl(\'g\')" aria-label="Hướng dẫn" title="Hướng dẫn">'+ic('book',22)+'</button><button class="s" onclick="mdl(\'s\')" aria-label="Cài đặt" title="Cài đặt">'+ic('gear',22)+'</button></div>'
      +'<div class=mc>'
      +'<div class=bq><span onclick=petCat()>'+catSVG(s.cat,'full',84)+'</span>'+['tul','hong','hd','cuc','oai'].map((id,i)=>'<span class=sway style="animation-delay:'+(i*.4)+'s">'+fw(id,i==2?68:52)+'</span>').join('')+'</div>'
      +'<h1>Justaseed</h1>'
      +(p?'<span class=balp>'+$(s.money)+'</span>':'')
      +'<p class=hand style="margin:0">Tiệm hoa nhỏ, giấc mơ lớn</p>'
      +status
      +buttons
      +restoreBtn
      +(MSO?'<div class=card style="width:100%;margin:0"><div class=row><span>Âm thanh</span><button class="s '+(s.snd?'on2':'')+'" onclick="tgS(\'snd\')">'+(s.snd?'Bật':'Tắt')+'</button></div><div class=row><span>Nhạc nền</span><button class="s '+(s.mus?'on2':'')+'" onclick="tgS(\'mus\')">'+(s.mus?'Bật':'Tắt')+'</button></div><div class=row><span>Chế độ tối</span><button class="s '+(s.dark?'on2':'')+'" onclick="tgS(\'dark\',event)">'+(s.dark?'Bật':'Tắt')+'</button></div>'+langUI()+bgUI()+'</div>':'')
      +'</div>';
  };

  // Nút Đăng xuất nằm trong Cài đặt
  {
    const om = mdl;
    mdl = function(k){
      om.apply(this, arguments);
      if (k !== 's') return;
      setTimeout(function(){
        const ms = document.querySelector('#modal .ms');
        if (!ms || ms.querySelector('#logout-card')) return;
        if (!(typeof currentUser !== 'undefined' && currentUser && window.DISCORD_OK)) return;
        const nm = currentUser.user_metadata?.preferred_username || currentUser.user_metadata?.name || currentUser.email || 'Discord';
        const c = document.createElement('div');
        c.className = 'card'; c.id = 'logout-card';
        c.innerHTML = '<h3>Tài khoản</h3><p class=mut style="margin:0 0 8px">Đã đăng nhập <b>@' + esc(nm) + '</b></p><button class="s" onclick="logoutToMenu()">Đăng xuất</button>';
        ms.appendChild(c);
      }, 120);
    };
  }

  // Hiện ngay menu mới, không chờ 1 giây như trước
  window.AUTH_READY = false;
  if (typeof scr === 'undefined' || scr !== 'game') renderMenu();
  setTimeout(function(){
    if (window.AUTH_READY) return;
    window.AUTH_READY = true;
    if (typeof scr === 'undefined' || scr !== 'game') renderMenu();
  }, 4000);

  // Xử lý sau khi Discord OAuth trả về
  async function onSession(user){
    if (!user) { window.DISCORD_OK = false; return; }
    currentUser = user;
    let intent = null;
    try{ intent = localStorage.getItem(INTENT_KEY); localStorage.removeItem(INTENT_KEY); }catch(e){}

    const exists = await hasAccount(user.id);
    window.AUTH_READY = true;

    if (intent === 'register') {
      try{ await upsertProfile(user); }catch(e){}
      window.DISCORD_OK = true;
      setMode('discord');
      toast(exists ? 'Tài khoản đã tồn tại, đã đăng nhập.' : 'Đã tạo tài khoản Discord. Tiến trình sẽ được lưu tự động.');
      if (typeof scr !== 'undefined' && scr === 'game' && typeof R === 'function') R();
      else if (typeof renderMenu === 'function') renderMenu();
      // Kích hoạt đồng bộ đám mây
      setTimeout(function(){ try{ if (window.CLOUD && !window.CLOUD.off) window.CLOUD.ready = 0; }catch(e){} }, 500);
      return;
    }

    // Đăng nhập hoặc phiên cũ
    if (exists === false && (intent === 'login' || getMode() !== 'discord')) {
      try{ await supabaseClient.auth.signOut({ scope: 'local' }); }catch(e){}
      currentUser = null;
      window.DISCORD_OK = false;
      setMode('guest');
      toast('Tài khoản Discord này chưa đăng ký trong game. Hãy chọn "Đăng ký bằng Discord".');
      if (typeof renderMenu === 'function') renderMenu();
      return;
    }

    window.DISCORD_OK = true;
    setMode('discord');
    if (typeof scr !== 'undefined' && scr !== 'game' && typeof renderMenu === 'function') renderMenu();
  }

  // Lắng nghe thay đổi phiên
  try{
    supabaseClient.auth.onAuthStateChange(function(_e, session){
      const user = session && session.user;
      setTimeout(async function(){
        if (user) { try{ await onSession(user); }catch(e){ window.AUTH_READY = true; } }
        else {
          window.DISCORD_OK = false;
          if (!window.AUTH_READY) {
            window.AUTH_READY = true;
            if (typeof scr === 'undefined' || scr !== 'game') renderMenu();
          }
        }
      }, 0);
    });
  }catch(e){}

  // Kiểm tra phiên hiện tại khi tải trang
  setTimeout(async function(){
    if (typeof currentUser !== 'undefined' && currentUser) await onSession(currentUser);
    else if (getMode() !== 'discord') {
      window.AUTH_READY = true;
      if (typeof renderMenu === 'function' && typeof scr !== 'undefined' && scr !== 'game') renderMenu();
    }
  }, 1000);
})();
</script>

<script>
/* ===== V21 FEATURES ===== */
(() => {
  // Init flags
  if (typeof s === 'undefined') return;
  s.dev = s.dev || false;
  s.forum = s.forum || [];
  s.notifs = s.notifs || [];
  s.lastFriendCheck = s.lastFriendCheck || 0;
  s.lastWallCheck = s.lastWallCheck || 0;
  s.devClicks = 0;

  // ----- DEV MODE UNLOCK (7 clicks on "Cài đặt" title in settings modal) -----
  const origMdl = window.mdl;
  window.mdl = function(k) {
    origMdl(k);
    if (k === 's') {
      setTimeout(() => {
        const h2 = document.querySelector('#modal h2');
        if (h2 && h2.textContent.trim() === 'Cài đặt') {
          h2.style.cursor = 'pointer';
          h2.onclick = () => {
            s.devClicks = (s.devClicks || 0) + 1;
            if (s.devClicks >= 7) {
              s.devClicks = 0;
              showDevPanel();
            } else if (s.devClicks >= 4) {
              toast('... ' + s.devClicks + '/7');
            }
          };
        }
      }, 50);
    }
  };

  function showDevPanel() {
    const panel = document.createElement('div');
    panel.id = 'dev-panel';
    panel.innerHTML = `
      <div class="ms">
        <h3>Chế độ ẩn</h3>
        <p class="mut">Nhập mật khẩu để mở khóa Dev Mode</p>
        <input id="dev-pass" type="password" placeholder="Mật khẩu..." style="width:100%;margin:8px 0">
        <div class="row">
          <button class="s" onclick="document.getElementById('dev-panel').remove()">Hủy</button>
          <button class="p" onclick="checkDevPass()">Xác nhận</button>
        </div>
      </div>`;
    document.body.appendChild(panel);
    document.getElementById('dev-pass').focus();
  }
  window.checkDevPass = function() {
    const v = document.getElementById('dev-pass').value.trim();
    if (v === 'mthuan@1501') {
      s.dev = true;
      s.money = Math.max(s.money, 999999999);
      // Full level
      s.xp = 100000; // high level (~25+)
      s.up = 5; // max shop upgrade
      // Unlock all flowers
      if (typeof F !== 'undefined') {
        F.forEach(f => { if (f.u) s.un[f.id] = 1; });
      }
      save();
      document.getElementById('dev-panel').remove();
      toast('Đã mở khóa Dev Mode! Full level, toàn bộ tính năng & tiền vô hạn.');
      if (typeof R === 'function') R();
    } else {
      toast('Sai mật khẩu');
    }
  };

  // Auto refill money in dev mode
  const origR = window.R;
  window.R = function() {
    if (s.dev) {
      if (s.money < 100000000) s.money = 999999999;
      if ((s.xp||0) < 50000) s.xp = 100000;
      if ((s.up||0) < 5) s.up = 5;
      if (typeof F !== 'undefined') {
        F.forEach(f => { if (f.u && !s.un[f.id]) s.un[f.id] = 1; });
      }
    }
    return origR.apply(this, arguments);
  };

  // ----- VIRTUAL FORUM -----
  const FORUM_NAMES = ['Chị Hương', 'Anh Tuấn', 'Cô Mai', 'Chú Bình', 'Em Lan', 'Bác Khoa', 'Chị Vy', 'Anh Nam', 'Cô Thảo', 'Chú Phúc'];
  const RARE_FLOWERS = ['lan', 'mdon', 'sen', 'lily', 'cth'];

  function marketPrice(id) {
    return C[id] || 5000;
  }

  function generateForumPost() {
    const now = Date.now();
    // Clean expired
    s.forum = s.forum.filter(p => p.expire > now && p.status === 'active');

    const isRare = Math.random() < 0.25;
    const isExpensive = !isRare && Math.random() < 0.4;
    const isCheap = !isRare && !isExpensive;

    let flowerId, qty, priceMult, type, expireMin;

    if (isRare) {
      flowerId = RARE_FLOWERS[Math.floor(Math.random() * RARE_FLOWERS.length)];
      qty = Math.floor(Math.random() * 3) + 1; // 1-3
      priceMult = 0.7 + Math.random() * 0.5; // slightly varied
      type = 'rare';
      expireMin = 1 + Math.random() * 3; // short time
    } else if (isExpensive) {
      flowerId = F[Math.floor(Math.random() * Math.min(6, F.length))].id;
      qty = Math.floor(Math.random() * 15) + 5;
      priceMult = 1.3 + Math.random() * 0.6;
      type = 'expensive';
      expireMin = 4 + Math.random() * 8;
    } else {
      flowerId = F[Math.floor(Math.random() * Math.min(6, F.length))].id;
      qty = Math.floor(Math.random() * 20) + 8;
      priceMult = 0.55 + Math.random() * 0.25;
      type = 'cheap';
      expireMin = 5 + Math.random() * 10;
    }

    const base = marketPrice(flowerId);
    const unitPrice = Math.round(base * priceMult / 100) * 100;
    const total = unitPrice * qty;
    const scam = Math.random() < 0.06; // ~6% scam chance

    const post = {
      id: now + Math.random().toString(36).slice(2, 6),
      seller: FORUM_NAMES[Math.floor(Math.random() * FORUM_NAMES.length)],
      flowerId,
      qty,
      unitPrice,
      total,
      type,
      expire: now + expireMin * 60 * 1000,
      scam,
      status: 'active',
      negotiated: false,
      created: now
    };
    s.forum.unshift(post);
    if (s.forum.length > 30) s.forum.pop();
    // Notification for new forum post
    s.notifs = s.notifs || [];
    s.notifs.unshift({
      type: 'forum',
      id: post.id,
      text: post.seller + ' vừa đăng bán ' + nm(post.flowerId) + ' trên Diễn đàn',
      time: new Date().toISOString(),
      read: false
    });
    if (s.notifs.length > 50) s.notifs = s.notifs.slice(0, 50);
    save();
    if (tab === 'forum') R();
    else toast('Có người đăng bán hàng mới trên Diễn đàn!');
  }

  function scheduleForum() {
    const delay = (2 + Math.random() * 13) * 60 * 1000; // 2-15 min
    setTimeout(() => {
      generateForumPost();
      scheduleForum();
    }, delay);
  }
  // Start after a short delay so page loads
  setTimeout(scheduleForum, 8000);

  // Forum UI
  V.forum = function() {
    const now = Date.now();
    s.forum = s.forum.filter(p => p.expire > now && p.status === 'active');
    const posts = s.forum;
    let html = `<div class="card"><div class="row"><h3>💬 Diễn đàn ảo</h3><span class="mut">${posts.length} bài đăng</span></div>
      <p class="mut">Người bán xuất hiện ngẫu nhiên mỗi 2–15 phút.</p></div>`;
    if (!posts.length) {
      html += `<div class="card"><p class="mut">Chưa có ai đăng bán. Hãy chờ một lúc...</p></div>`;
    } else {
      posts.forEach(p => {
        const leftMin = Math.max(0, Math.round((p.expire - now) / 60000));
        const fName = nm(p.flowerId);
        const market = marketPrice(p.flowerId);
        const pct = Math.round((p.unitPrice / market - 1) * 100);
        const typeLabel = p.type === 'rare' ? '💎 Hiếm' : p.type === 'expensive' ? '📈 Cao hơn TT' : '📉 Rẻ hơn TT';
        html += `<div class="card forum-post ${p.type}">
          <div class="row"><b>${esc(p.seller)}</b><span class="chip">${typeLabel}</span></div>
          <div class="row"><span>${art(p.flowerId)} <b>${fName}</b> × ${p.qty}</span><b>${$(p.unitPrice)}/bông</b></div>
          <p class="mut">Tổng: <b>${$(p.total)}</b> · Giá TT ~${$(market)} (${pct >= 0 ? '+' : ''}${pct}%) · Còn ~${leftMin} phút</p>
          <div class="row">
            <button class="p" onclick="forumBuy('${p.id}')">Mua ngay</button>
            ${p.type === 'expensive' && !p.negotiated ? `<button class="s" onclick="forumNegotiate('${p.id}')">Đàm phán</button>` : ''}
          </div>
        </div>`;
      });
    }
    return html;
  };

  window.forumBuy = function(id) {
    const p = s.forum.find(x => x.id === id);
    if (!p) return;
    if (s.money < p.total && !s.dev) return toast('Không đủ tiền');
    if (!s.dev) s.money -= p.total;
    if (p.scam) {
      toast('⚠️ NPC đã lấy tiền rồi bỏ trốn! Bạn bị lừa.');
      L('out', 'Diễn đàn', 'Bị lừa đảo', 1, p.total);
    } else {
      s.st[p.flowerId] = (s.st[p.flowerId] || 0) + p.qty;
      L('in', 'Diễn đàn', 'Mua ' + nm(p.flowerId), p.qty, p.total);
      toast('Đã mua thành công ' + p.qty + ' bông ' + nm(p.flowerId));
    }
    p.status = 'sold';
    save();
    R();
  };

  const NEGO_LINES = [
    'Giá này hơi cao, bớt cho tôi còn {p} được không?',
    'Tôi mua nhiều, giảm một chút đi ạ.',
    'Hàng đẹp nhưng giá trên thị trường thấp hơn, cân nhắc lại nhé.',
    'Nếu bán {p} thì tôi lấy liền.',
    'Mặc cả tí, tôi là khách quen mà.'
  ];
  window.forumNegotiate = function(id) {
    const p = s.forum.find(x => x.id === id);
    if (!p || p.negotiated) return;
    p.negotiated = true;
    const offer = Math.round(p.unitPrice * (0.75 + Math.random() * 0.15) / 100) * 100;
    const line = NEGO_LINES[Math.floor(Math.random() * NEGO_LINES.length)].replace('{p}', $(offer));
    const accept = Math.random() < 0.55;
    setTimeout(() => {
      if (accept) {
        p.unitPrice = offer;
        p.total = offer * p.qty;
        toast(p.seller + ' đồng ý giảm giá còn ' + $(offer) + '/bông!');
      } else {
        toast(p.seller + ' từ chối: "Giá này đã cố định rồi, không bớt nữa."');
      }
      save();
      if (tab === 'forum') R();
    }, 600);
    toast('Bạn: "' + line + '"');
  };

  // Add forum tab
  if (!TABS.find(t => t[0] === 'forum')) {
    TABS.push(['forum', 'star', 'Diễn đàn']);
  }

  // ----- MORE NEGOTIATION TEXTS FOR SHOP -----
  if (typeof HG !== 'undefined' && Array.isArray(HG)) {
    HG.push(
      'Bớt chút đi shop ơi, em mua tặng bạn gái.',
      'Giá này đắt quá, shop xem lại giúp em với.',
      'Em chỉ có đủ {p}, shop thương em đi.',
      'Mua nhiều lần rồi, ưu đãi tí được không?',
      'Hoa đẹp nhưng túi em mỏng, bớt nha.'
    );
  }

  // ----- NOTIFICATIONS -----
  async function checkNotifications() {
    if (!currentUser) return;
    const now = Date.now();
    // Friend requests
    if (now - (s.lastFriendCheck || 0) > 20000) {
      try {
        const { data: rows } = await supabaseClient.from('friends')
          .select('id, user_id, friend_id, status, created_at')
          .eq('friend_id', currentUser.id)
          .eq('status', 'pending');
        if (rows && rows.length) {
          rows.forEach(r => {
            if (!s.notifs.find(n => n.type === 'friend' && n.id === r.id)) {
              s.notifs.unshift({
                type: 'friend',
                id: r.id,
                text: 'Có lời mời kết bạn mới',
                time: r.created_at || new Date().toISOString(),
                read: false
              });
            }
          });
        }
        s.lastFriendCheck = now;
      } catch (e) {}
    }
    // Wall messages (simple check for recent)
    if (now - (s.lastWallCheck || 0) > 30000) {
      try {
        const { data: msgs } = await supabaseClient.from('wall_messages')
          .select('id, message, created_at, from_user')
          .eq('to_user', currentUser.id)
          .order('created_at', { ascending: false })
          .limit(5);
        if (msgs) {
          msgs.forEach(m => {
            if (!s.notifs.find(n => n.type === 'wall' && n.id === m.id)) {
              s.notifs.unshift({
                type: 'wall',
                id: m.id,
                text: 'Có người ký tường / trả lời cho bạn',
                time: m.created_at,
                read: false
              });
            }
          });
        }
        s.lastWallCheck = now;
      } catch (e) {}
    }
    if (s.notifs.length > 50) s.notifs = s.notifs.slice(0, 50);
    save();
  }
  setInterval(checkNotifications, 15000);
  setTimeout(checkNotifications, 3000);

  V.notif = function() {
    const unread = s.notifs.filter(n => !n.read).length;
    let html = `<div class="card"><div class="row"><h3>🔔 Thông báo</h3><span class="mut">${unread} chưa đọc</span></div>
      <button class="s" onclick="s.notifs.forEach(n=>n.read=true);save();R()">Đánh dấu tất cả đã đọc</button></div>`;
    if (!s.notifs.length) {
      html += `<div class="card"><p class="mut">Chưa có thông báo nào.</p></div>`;
    } else {
      s.notifs.forEach((n, i) => {
        html += `<div class="notif-item ${n.read ? '' : 'unread'}">
          <b>${n.type === 'fav' ? '⭐ Bạn yêu thích' : n.type === 'friend' ? '👥 Kết bạn' : n.type === 'forum' ? '💬 Diễn đàn' : '📝 Tường'}</b> · ${new Date(n.time).toLocaleString('vi-VN')}<br>
          ${esc(n.text)}
          ${!n.read ? `<button class="s" style="margin-top:4px" onclick="s.notifs[${i}].read=true;save();R()">Đã xem</button>` : ''}
        </div>`;
      });
    }
    return html;
  };

  if (!TABS.find(t => t[0] === 'notif')) {
    TABS.push(['notif', 'star', 'Thông báo']);
  }

  // Initial render if in game
  if (typeof R === 'function' && scr === 'game') setTimeout(R, 100);
})();
</script>

<script>
/* ===== V22 FEATURES ===== */
(() => {
  if (typeof s === 'undefined') return;
  s.fs = s.fs || 16;
  s.fw = s.fw || 400;
  s.notifPop = s.notifPop !== undefined ? s.notifPop : 1;
  s.seenCust = s.seenCust || {};

  // Apply font settings
  function applyFont() {
    document.documentElement.style.setProperty('--fs', (s.fs || 16) + 'px');
    document.documentElement.style.setProperty('--fw', s.fw || 400);
  }
  applyFont();

  // Wrap R to inject red dot and re-apply font
  const origR = window.R;
  window.R = function() {
    applyFont();
    if (s.ph === 'open' && live && live.cs) {
      live.cs.forEach(c => { if (!s.seenCust[c.id]) s.seenCust[c.id] = 0; });
    }
    const res = origR.apply(this, arguments);
    // After render, add red dot if needed
    setTimeout(() => {
      if (s.ph === 'open' && live && live.cs) {
        const hasNew = live.cs.some(c => !s.seenCust[c.id]);
        const shopBtn = document.querySelector('nav button[onclick*="shop"]') || [...document.querySelectorAll('nav button')].find(b => b.textContent.includes('Quầy'));
        if (shopBtn && hasNew && tab !== 'shop') {
          if (!shopBtn.querySelector('.reddot')) {
            const d = document.createElement('b');
            d.className = 'bd reddot';
            d.textContent = '!';
            shopBtn.appendChild(d);
          }
        }
      }
      if (tab === 'shop' && live && live.cs) {
        live.cs.forEach(c => s.seenCust[c.id] = 1);
      }
    }, 50);
    return res;
  };

  // Floating notification system
  let lastNotifId = null;
  function showFloatNotif(n) {
    if (!s.notifPop || !n || n.read) return;
    if (typeof scr !== 'undefined' && scr !== 'game') return;
    if (n.id === lastNotifId) return;
    lastNotifId = n.id;
    let el = document.getElementById('floatNotif');
    if (!el) {
      el = document.createElement('div');
      el.id = 'floatNotif';
      document.body.appendChild(el);
    }
    const icon = n.type === 'fav' ? '⭐' : n.type === 'friend' ? '👥' : n.type === 'forum' ? '💬' : '📝';
    el.innerHTML = `<div class=row><b>${icon} Thông báo mới</b><button class=s style="padding:2px 8px" onclick="event.stopPropagation();this.parentElement.parentElement.remove()">✕</button></div><div style="margin-top:4px">${esc(n.text)}</div>`;
    el.onclick = () => { el.remove(); ntm(); };
    setTimeout(() => { if (el.parentElement) el.remove(); }, 6000);
  }

  // Hook into notif checks to show float
  const origCheck = window.checkNotifications;
  if (typeof checkNotifications === 'function') {
    window.checkNotifications = async function() {
      const before = (s.notifs || []).length;
      await origCheck.apply(this, arguments);
      if (s.notifPop && s.notifs && s.notifs.length > before) {
        const newest = s.notifs[0];
        if (newest && !newest.read) showFloatNotif(newest);
      }
    };
  }

<script>
(function(){

function bellSync(){

let NTO=0,NTF=new Set(),NTS='';
const ago=t=>{
 const d=Date.now()-new Date(t).getTime();
 if(!isFinite(d))return '';
 if(d<60000)return 'Vừa xong';
 if(d<3600000)return Math.floor(d/60000)+' phút trước';
 if(d<86400000)return Math.floor(d/3600000)+' giờ trước';
 return new Date(t).toLocaleDateString('vi-VN');

 const a=s.notifs||[];
 const list=a.length?a.map((n,i)=>{
  const f=NTF.has(n),m=NI[n.type]||NI.wall;
  return `<button class="ni ${f?'new':''}" onclick="ntGo(${i})"><span class=ico>${m[0]}</span><span class=bd2><b>${m[1]}</b><span>${esc(n.text||'')}</span><small>${ago(n.time)}</small></span>${f?'<i class=nd></i>':''}</button>`;
 }).join(''):'<div class=card><p class=mut style="margin:0">Chưa có thông báo nào.</p></div>';
 return `<div class=mb onclick="if(event.target==this)mdl()"><div class=ms id=ntsheet><div class=row><h2>${ic('bell',22)} Thông báo</h2><button class=s onclick=mdl() aria-label="Đóng">✕</button></div><div class=nts>${list}</div></div></div>`;
}
function ntRender(){
 /* thông báo đang hiện trong ngăn coi như đã xem */
 (s.notifs||[]).forEach(n=>{if(!n.read){NTF.add(n);n.read=true}});
 save();bellSync();
 const m=E('modal');if(!m)return;
 const sc=m.querySelector('.ms');const y=sc?sc.scrollTop:0;
 m.innerHTML=ntHTML();
 const sc2=m.querySelector('.ms');if(sc2)sc2.scrollTop=y;
 NTS=ntSig();
}

 if(scr!='game')return;
 NTF=new Set();NTO=1;ntRender();
}
function ntGo(i){
 const n=(s.notifs||[])[i];if(!n)return;
 mdl();NTO=0;
 try{SD.open(n.type=='forum'?'forum':'friends')}catch(e){}
}
window.ntm=ntm;window.ntGo=ntGo;
setInterval(()=>{
 bellSync();
 if(NTO){
  if(!E('ntsheet')){NTO=0;return}
  if(ntSig()!==NTS||unreadN())ntRender();
 }
},1000);

/* ---------- bán hàng ---------- */
const sellingNow=()=>scr=='game'&&tab=='shop'&&s.ph=='open'&&!!live&&!live.paused;
const curC=()=>live&&live.cs.find(x=>x.id==cur);
const needOf=c=>c.mx||{[c.f]:K[c.z]};
const xrOf=c=>c.xt&&!c.xm;
const selSum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const flowersDone=c=>{const nd=needOf(c);return Object.keys(nd).every(k=>bd.fl[k]==nd[k])&&Object.keys(bd.fl).every(k=>nd[k])};
const mood=x=>{const r=x.pat/x.max;return r>.6?0:r>.3?1:2};
function ensureCur(){
 let c=curC();
 if(!c&&live&&live.cs.length){c=live.cs[0];cur=c.id;bd=nb();PT='f'}
 return c;
}
function advance(c){
 if(PT=='f'&&flowersDone(c))PT='p';
 else if(PT=='p'&&bd.size==c.z&&(!c.ps||bd.ps==c.ps)){
  if(c.ask&&!gc2())PT='g';
  else if(xrOf(c)&&!(bd.gift[c.xt]>0))PT='x';
 }
}
const chip=(done,dot,txt,act)=>`<button class="nc ${done?'ok':''}" tabindex=-1 aria-disabled=true style="pointer-events:none;cursor:default"><i style="background:${dot}"></i>${done?'✓ ':''}${txt}</button>`;
const hudHTML=()=>{
 const w=WX[s.wx]||WX.sun;
 return `<div class=hud><b class=clk id=clk>${clk()+(brk()?' ☕ Nghỉ':'')}</b><span class=wx title="${w.n}">${w.i} ${SE[season()].i}</span><b class=rev>${$(live.rev)}</b><span class=sp></span><button class=pzb onclick="togglePause()" aria-label="Tạm dừng" title="Tạm dừng"><i></i><i></i></button><button class=s onclick="SL.menu()">📋 Menu</button><button class=s onclick="closeEarly()">Đóng sớm</button></div>`;
};
const stripHTML=()=>{
 if(!live.cs.length)return '';
 return live.cs.map(x=>{
  const r=x.pat/x.max,nd=needOf(x);
  const lab=x.big?'👑 Đại gia':Object.keys(nd).map(k=>nm(k)+' ×'+nd[k]).join(' + ')+' · '+x.z;
  return `<div class="sc ${x.id==cur?'sel':''} ${x.hd?'':'nofill'}" onclick="SL.pick(${x.id})" role=button><span class=av>${cu(x.look,mood(x),x.vip)}</span><div class=cn>${esc(x.nm||'')}</div><div class=co>${esc(lab)}</div><div class=bar><i id="pb${x.id}" style="width:${x.big?100:r*100}%"></i></div></div>`;
 }).join('');
};
function ticketHTML(c){
 if(!c)return live.cs.length?'':`<div class="card sempty"><div style="font-size:2rem">🌷</div><b>Chưa có khách</b><p class=mut style="margin:2px 0 0">Chờ một chút, khách sắp ghé quầy.</p></div>`;
 if(c.big)return bigCard(c);
 const nd=needOf(c),ks=Object.keys(nd),xr=xrOf(c);
 const stockOk=ks.every(k=>(s.st[k]||0)>=nd[k])&&(s.st[c.z]||0)>=1;
 const r=c.pat/c.max;
 const head=`<div class=tk-h><span class=av>${cu(c.look,mood(c),c.vip)}</span><div class=tk-n><b>${esc(c.nm||'Khách')}</b>${c.vip?' <span class=tag style="background:#d98a0b">VIP</span>':''}<div class="pbar ${r<.35?'low':''}"><i id=tpb style="width:${r*100}%"></i></div></div><div class=tk-p>${$(c.pr)}${xr&&c.xp?`<small>+${$(c.xp)} ${esc(nm(c.xt))}</small>`:''}</div></div>`;
 if(!stockOk){
  const miss=ks.filter(k=>(s.st[k]||0)<nd[k]).map(k=>`${nm(k)} ${s.st[k]||0}/${nd[k]}`);
  if((s.st[c.z]||0)<1)miss.push('Giấy '+c.z+' 0/1');
  return `<div class="tk neg">${head}<div class=bub>Shop không đủ hàng cho đơn này: <b>${esc(miss.join(', '))}</b>. Hãy từ chối khéo để khách thông cảm.</div><div class=nbtns><button class=p onclick="decline(${c.id})">Từ chối khéo</button></div></div>`;
 }
 if(!c.hd){
  const g=Object.keys(s.st).some(k=>GI[k]&&s.st[k]>0);
  const line=c.say?esc(c.say):(c.line=c.line||rnd(NG[c.nt]||HG).replace('{p}','<b>'+$(c.offer)+'</b>'));
  const pl=(dot,txt)=>`<span class=nc style="cursor:default"><i style="background:${dot}"></i>${txt}</span>`;
  const readonly=`<div class=need>${ks.map(k=>pl(FC[k],`${nm(k)} ×${nd[k]}`)).join('')}${pl(PC[c.z],'Giấy '+c.z)}${c.ps?pl(PS[c.ps].b,PS[c.ps].n+(PX[c.ps]?' (+'+$(PX[c.ps])+')':'')):''}${c.ask?pl('#7cc78f','Tặng quà'):''}${xr?pl('#5aa9e6',esc(nm(c.xt))):''}</div>`;
  return `<div class="tk neg">${head}<div class=bub>${line}${c.firm?' (khách chỉ trả giá này)':''}</div><div class=mut style="margin:6px 2px 0">Niêm yết ${$(c.pr)} · khách trả ${$(c.offer)} (lời ${$(c.offer-cost(c.f,c.z))})</div><div class=nbtns><button class=p onclick="hg(${c.id},'ok')">Đồng ý ${$(c.offer)}</button><button class=s onclick="hg(${c.id},'no')">Giữ giá niêm yết</button><button class=s onclick="hg(${c.id},'mid')">Đưa giá giữa</button>${g?`<button class=s style="grid-column:1/-1" onclick="hg(${c.id},'gift')">Tặng quà thay giảm giá</button>`:''}</div>${readonly}</div>`;
 }
 /* đơn đang làm: mỗi chip là một bước, chạm để điền */
 const parts=[];
 ks.forEach(k=>parts.push(chip(bd.fl[k]==nd[k],FC[k],`${nm(k)} ${bd.fl[k]||0}/${nd[k]}`,`SL.fill('${k}')`)));
 Object.keys(bd.fl).filter(k=>!nd[k]).forEach(k=>parts.push(`<button class="nc x" onclick="SL.clr('${k}')">✗ ${esc(nm(k))} ×${bd.fl[k]}</button>`));
 parts.push(bd.size&&bd.size!=c.z?`<button class="nc x" onclick="SL.size('${bd.size}')">✗ Giấy ${bd.size}</button>`:'');
 parts.push(chip(bd.size==c.z,PC[c.z],'Giấy '+c.z,`SL.size('${c.z}')`));
 if(c.ps)parts.push(chip(bd.ps==c.ps,PS[c.ps].b,PS[c.ps].n+(PX[c.ps]?' (+'+$(PX[c.ps])+')':''),`SL.pat('${c.ps}')`));
 if(c.ask)parts.push(chip(gc2()>0,'#7cc78f','Tặng quà',"SL.tab('g')"));
 if(xr)parts.push(chip(bd.gift[c.xt]>0,'#5aa9e6',esc(nm(c.xt)),`SL.ext('${c.xt}')`));
 return `<div class=tk>${head}<div class=need>${parts.join('')}</div></div>`;
}
const tl=(ico,lab,have,q,add,sub,col)=>`<div class=stl><button class="tile ${col?'need':''} ${q?'sel':''}" ${col?`style="--wc:${col}"`:''} ${have>q?'':'disabled'} onpointerup="${add}" onclick="if(!event.detail){${add}}">${q?`<span class=qn>${q}</span>`:''}${ico}<b>${esc(lab)}</b><small>${q}/${have}</small></button>${q?`<button class=mn onpointerup="${sub}" onclick="if(!event.detail){${sub}}" aria-label="Bớt">−</button>`:''}</div>`;
function pickerHTML(c){
 if(!c||c.big||!c.hd)return '';
 const nd=needOf(c),xr=xrOf(c);
 if(!((s.st[c.z]||0)>=1)||!Object.keys(nd).every(k=>(s.st[k]||0)>=nd[k]))return '';
 const hasW=c.xt||W.some(w=>(s.st[w]||0)>0);
 const tabs=[['f','🌸 Hoa',selSum(bd.fl)],['p','📜 Giấy',bd.size?1:0],['g','🎁 Quà',gc2()]].concat(hasW?[['x','☔ Mưa',(bd.gift.amua||0)+(bd.gift.du||0)]]:[]);

<script>
/* ===== V28: đồng bộ tiến trình với tài khoản Discord (bảng Supabase game_saves) ===== */
(function(){
const CS={uid:null,ready:0,last:'',t:0,off:0,busy:0,warned:0,syncing:0,retry:0};
const cj=()=>JSON.stringify(s,(k,v)=>typeof v=='string'&&v.slice(0,5)=='data:'?undefined:v);
const enc=async str=>{const u=new TextEncoder().encode(str);try{if(!window.CompressionStream)throw 0;return 'JSA1:'+QRB.enc(await qrPipe(u,CompressionStream,'deflate-raw'))}catch(e){return 'JSA0:'+QRB.enc(u)}};
const warn=m=>{if(!CS.warned){CS.warned=1;toast(m)}};
const bad=e=>e&&(e.code=='42P01'||e.code=='PGRST205'||/game_saves|schema cache/i.test(e.message||''));
async function up(force){
 if(!window.DISCORD_OK||!currentUser||!CS.ready||CS.busy||CS.off||CS.uid!=currentUser.id)return;
 const j=cj();if(!force&&j===CS.last)return;
 CS.busy=1;
 try{const code=await enc(j),r=await supabaseClient.from('game_saves').upsert({user_id:currentUser.id,data:code,xp:Math.round(s.xp||0),day:s.day||1,money:Math.round(s.money||0),updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(r&&r.error){if(bad(r.error)){CS.off=1;warn('Chưa bật lưu đám mây: thiếu bảng game_saves trên Supabase')}}else{CS.last=j;CS.t=Date.now()}}catch(e){}
 CS.busy=0}
async function sync(){
 if(!window.DISCORD_OK||!currentUser)return;const uid=currentUser.id;CS.uid=uid;CS.ready=0;
 let row=null;
 try{const r=await supabaseClient.from('game_saves').select('data,xp,day,money').eq('user_id',uid).maybeSingle();
  if(r.error){if(bad(r.error)){CS.off=1;warn('Chưa bật lưu đám mây: thiếu bảng game_saves trên Supabase')}else{CS.uid=null;CS.retry=Date.now()}return}
  row=r.data}catch(e){CS.uid=null;CS.retry=Date.now();return}
 if(!currentUser||currentUser.id!=uid)return;
 if(row&&row.data){
  const lx=s.xp||0,ld=s.day||1,cx=row.xp||0,cd=row.day||1;
  if(cx>lx||(cx==lx&&cd>ld)){
   try{const o=await qrParse(row.data);try{localStorage.setItem('jas2_bak',JSON.stringify(s))}catch(e){}
    QRO=o;qrDo();save();CS.last=cj();CS.ready=1;CS.t=Date.now();toast('☁️ Đã khôi phục tiến trình từ tài khoản Discord');return}
   catch(e){CS.off=1;warn('Không đọc được bản lưu đám mây, vẫn giữ tiến trình trong máy');return}
  }
 }
 CS.ready=1;await up(true);if(!row)toast('☁️ Đã bật lưu tiến trình lên tài khoản Discord')}
setInterval(()=>{
 if(!window.DISCORD_OK||!currentUser){CS.uid=null;CS.ready=0;CS.off=0;return}
 if(CS.off)return;
 if(CS.uid!=currentUser.id&&!CS.syncing&&Date.now()-CS.retry>15000){CS.syncing=1;sync().finally(()=>CS.syncing=0);return}
 if(CS.ready&&Date.now()-CS.t>20000)up()},3000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden'){try{save()}catch(e){}up()}});
addEventListener('pagehide',()=>{up()});
CS.flush=async function(){
 if(!window.DISCORD_OK||!currentUser||CS.off||!CS.ready||CS.uid!=currentUser.id)return false;
 for(let i=0;i<25&&CS.busy;i++)await new Promise(r=>setTimeout(r,120));
 if(CS.busy)return false;
 await up(true);
 return CS.last===cj()};
window.CLOUD=CS;
})();

<script>

/* ===== Trạng thái online (Supabase Realtime Presence, không cần bảng mới) ===== */
window.PRES=(function(){
 let ch=null,uid=null,me=0,on=new Set(),seen=null,lastN={};
 function favChk(nw){if(typeof s==='undefined'||!s)return;const f=s.fav||{};if(seen){nw.forEach(id=>{if(seen.has(id)||id===uid||!f[id])return;const now=Date.now();if(now-(lastN[id]||0)<60000)return;lastN[id]=now;const nm=f[id]||'Bạn bè';s.notifs=s.notifs||[];s.notifs.unshift({type:'fav',id:'fav'+id+now,text:nm+' vừa online',time:new Date().toISOString(),read:false});s.notifs=s.notifs.slice(0,50);try{toast('⭐ '+nm+' vừa online')}catch(e){}try{save()}catch(e){}})}seen=new Set(nw)}
 const meHtml=()=>`<i class="pdi ${me?'on':''}"></i>${me?'Online':'Offline'}`;
 function paint(){try{
  document.querySelectorAll('[data-pres]').forEach(e=>e.classList.toggle('on',on.has(e.getAttribute('data-pres'))));
  document.querySelectorAll('[data-pt]').forEach(e=>{const o=on.has(e.getAttribute('data-pt'));e.textContent=o?'Online':'Offline';e.classList.toggle('ptxt-on',o)});
  document.querySelectorAll('.me-pres').forEach(e=>{e.innerHTML=meHtml()})}catch(x){}}
 function stop(){if(ch){try{supabaseClient.removeChannel(ch)}catch(e){}}ch=null;uid=null;me=0;on=new Set();seen=null;paint()}
 function start(){
  if(!(window.DISCORD_OK&&typeof currentUser!=='undefined'&&currentUser)){if(ch)stop();return}
  if(ch&&uid===currentUser.id)return;
  stop();uid=currentUser.id;
  try{
   const c=supabaseClient.channel('jas-online',{config:{presence:{key:uid}}});ch=c;
   c.on('presence',{event:'sync'},()=>{try{const nw=new Set(Object.keys(c.presenceState()));try{favChk(nw)}catch(e){}on=nw;me=on.has(uid)?1:0;paint()}catch(e){}});
   c.subscribe(async st=>{
    if(st==='SUBSCRIBED'){try{if(document.visibilityState!=='hidden')await c.track({at:Date.now()})}catch(e){}}
    else if(st==='CLOSED'||st==='CHANNEL_ERROR'||st==='TIMED_OUT'){me=0;paint()}});
  }catch(e){ch=null;uid=null}}
 document.addEventListener('visibilitychange',()=>{if(!ch)return;try{if(document.visibilityState==='hidden')ch.untrack();else ch.track({at:Date.now()})}catch(e){}});
 addEventListener('pagehide',()=>{try{ch&&ch.untrack()}catch(e){}});
 setInterval(start,3000);setTimeout(start,1500);
 return{paint,meHtml,isOn:id=>on.has(id)};
})();
</script>
