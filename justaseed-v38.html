<script>
/* ===== Bổ sung Justaseed theo yêu cầu ===== */
(function(){
  /* Vá giấy gói: TẮT. Trước đây khối này không bao giờ chạy (lỗi tham chiếu nowH). Đặt window.JAS_PAPER_PATCH=1 trước đoạn này nếu muốn bật. */
  if(!window.JAS_PAPER_PATCH)return;
  // Cho phép mua giấy gói không giới hạn theo suất nhà cung cấp.
  const isPaper=id=>['S','M','L'].includes(String(id));
  const oldChg=chg;
  chg=function(si,id,d){
    if(!isPaper(id))return oldChg(si,id,d);
    if(s.ph!=='prep')return;
    const k=si+id,q=CART[k]||0,p=pc(id,SP[si].m);
    if(d>0){
      if(cartTotal()+p>s.money){toast('Không đủ tiền cho giỏ hàng');return}
      CART[k]=q+1;
    }else if(q>0){CART[k]=q-1;if(!CART[k])delete CART[k]}
    R();
  };
  const oldSetQ=setQ;
  setQ=function(si,id,v){
    if(!isPaper(id))return oldSetQ(si,id,v);
    const p=pc(id,SP[si].m),k=si+id,cur=CART[k]||0,other=cartTotal()-cur*p;
    const n=Math.max(0,Math.min(Math.floor((s.money-other)/p),Math.floor(+v||0)));
    if(n)CART[k]=n;else delete CART[k];R();
  };
  const oldBuyAll=buyAll;
  buyAll=function(si,id){
    if(!isPaper(id))return oldBuyAll(si,id);
    const p=pc(id,SP[si].m),k=si+id,n=Math.floor((s.money-cartTotal())/p);
    if(n>0)CART[k]=(CART[k]||0)+n;else toast('Không đủ tiền để nhập thêm');R();
  };
  // Giá áo mưa/dù luôn được cộng vào đơn khi khách chọn mua; phần xử lý gốc
  // đã cộng XP[id] vào giá bán và ghi nhận doanh thu theo c.xt/c.xp.
})();
</script>

<script>
/* ===== V37: SUY NGHĨ TRÊN AVATAR + ĐOẠN NHẠC TRÊN HỒ SƠ ===== */
const CLIPID=/^[\w-]{11}$/;
const clipFmt=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function clipNorm(g){
 if(!g||!CLIPID.test(String(g.id||'')))return null;
 const st=Math.max(0,Math.min(86400,Math.floor(+g.st||0)));
 const en=Math.max(st+3,Math.min(st+60,Math.floor(+g.en||0)||st+20));
 return {id:g.id,st,en,name:String(g.name||'Bài hát').slice(0,80),ar:String(g.ar||'').slice(0,50)};
}
function clipChip(g0){
 const g=clipNorm(g0);if(!g)return '';
 return `<div class="clipchip" data-clipui data-clipbtn data-id="${g.id}" data-st="${g.st}" data-en="${g.en}" role="button" tabindex="0" onclick="ClipMu.tap(this)" onkeydown="if(event.key=='Enter')ClipMu.tap(this)"><img src="https://i.ytimg.com/vi/${g.id}/mqdefault.jpg" alt=""><div class="cpt"><b>${esc(g.name)}</b><small>${esc(g.ar||'YouTube')} · ${clipFmt(g.st)}–${clipFmt(g.en)}</small></div><span class="cpl" data-clipico>▶</span></div>`;
}

/* ---- trình phát đoạn nhạc riêng (phát từ giây A đến giây B) ---- */
const ClipMu=(function(){
 let pl=null,plP=null,cur=null,resume=0,iv=0,tmr=0,t0=0;
 function wrap(){let w=document.getElementById('clipWrap');if(!w){w=document.createElement('div');w.id='clipWrap';w.style.cssText='position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden';w.innerHTML='<div id="clipEl"></div>';document.body.appendChild(w)}return w}
 function ytReady(){return new Promise((res,rej)=>{
  if(window.YT&&window.YT.Player)return res();
  if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;document.head.appendChild(sc)}
  let n=0;const k=setInterval(()=>{if(window.YT&&window.YT.Player){clearInterval(k);res()}else if(++n>75){clearInterval(k);rej(new Error('yt'))}},200)})}
 function giveBack(){if(resume){resume=0;try{if(!MS.playing&&MS.now)MU.tog()}catch(e){}}}
 function arm(ms){clearTimeout(tmr);tmr=setTimeout(()=>stop(),ms)}
 function ensure(){
  if(pl)return Promise.resolve(pl);if(plP)return plP;wrap();
  plP=ytReady().then(()=>new Promise(res=>{
   const p=new YT.Player('clipEl',{width:'200',height:'200',playerVars:{playsinline:1,rel:0,controls:0},events:{
    onReady:()=>{pl=p;res(p)},
    onStateChange:e=>{const st=e&&e.data;
     if(st===1){if(!cur){try{p.pauseVideo()}catch(x){}return}arm((cur.en-cur.st)*1000+1500);ui()}
     else if(st===0){stop()}
     else if(st===2&&cur&&Date.now()-t0>1200){stop()}},
    onError:()=>{toast('Không phát được đoạn nhạc');stop()}}});
  })).catch(e=>{plP=null;throw e});
  return plP}
 function tick(){
  if(!cur){clearInterval(iv);iv=0;return}
  if(!document.querySelector('[data-clipui]')){stop();return}            // rời khỏi hồ sơ -> dừng
  if(Date.now()-t0>2500&&MS.playing){stop(true)}                          // người chơi tự bật nhạc -> nhường
 }
 function ui(){document.querySelectorAll('[data-clipbtn]').forEach(el=>{
  const on=!!cur&&cur.key===el.dataset.id+':'+el.dataset.st+':'+el.dataset.en;
  const ic=el.querySelector('[data-clipico]');if(ic)ic.textContent=on?'⏸':'▶';
  const ch=el.closest('.clipchip');if(ch)ch.classList.toggle('on',on)})}
 function stop(keep){
  const had=!!cur;cur=null;clearTimeout(tmr);clearInterval(iv);iv=0;
  if(had&&pl){try{pl.pauseVideo()}catch(e){}}
  if(keep)resume=0;else giveBack();
  ui()}
 function play(m){
  try{CardMu.stop(true)}catch(e){}
  if(!cur&&MS.playing){resume=1;try{MU.tog()}catch(e){}}               // tạm dừng nhạc của người chơi, hết đoạn sẽ bật lại
  cur=m;t0=Date.now();arm((m.en-m.st)*1000+8000);
  if(!iv)iv=setInterval(tick,400);
  ensure().then(p=>{if(cur!==m)return;try{p.setVolume&&p.setVolume(100);p.loadVideoById({videoId:m.id,startSeconds:m.st,endSeconds:m.en})}catch(e){stop()}})
   .catch(()=>{toast('Không tải được trình phát nhạc');stop()});
  ui()}
 return {
  tap(el){const id=el.dataset.id,st=+el.dataset.st,en=+el.dataset.en;
   if(!CLIPID.test(id||'')||!(en>st))return;
   const key=id+':'+st+':'+en;
   if(cur&&cur.key===key){stop();return}
   play({id,st,en,key})},
  stop,ui}
})();

/* ---- suy nghĩ ---- */
function thSet(v){
 v=String(v||'').replace(/\s+/g,' ').trim().slice(0,60);
 s.pf=s.pf||{nm:'Chủ tiệm',av:null,pre:'cat'};
 if(v)s.pf.th=v;else delete s.pf.th;
 save();try{syncProfile()}catch(e){}
 toast(v?'Đã cập nhật suy nghĩ':'Đã xóa suy nghĩ');
 if(scr=='game')R();pfm()}
function thFocus(){const i=document.getElementById('thIn');if(i){try{i.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}i.focus()}}

/* ---- chọn đoạn nhạc ---- */
let PK=null;
function clipOpen(target){
 const c=window.MU&&MU.cur();
 if(!c||!CLIPID.test(c.id||''))return toast('Chưa có bài nào đang nghe. Hãy mở một bài trong tab Nhạc trước');
 let D=MS.dur>0?Math.floor(MS.dur/1000):600;D=Math.max(10,D);
 const g=target=='cd'?(typeof CO!=='undefined'&&CO&&CO.mt):(s.pf&&s.pf.sg),same=g&&g.id===c.id&&(g.en|0)>(g.st|0);
 let st=same?(g.st|0):Math.floor((MS.pos||0)/1000),len=same?Math.max(3,(g.en|0)-(g.st|0)):20;
 st=Math.max(0,Math.min(st,D-3));len=Math.max(3,Math.min(30,len,D-st));
 PK={id:c.id,name:c.name||'',ar:c.ar||'',th:c.th||'',D,st,len,target:target||'pf'};
 ClipMu.stop();clipRender()}
function clipRender(){
 const k=PK;if(!k)return;
 $q('modal').innerHTML=`<div class=mb onclick="if(event.target==this)clipClose()"><div class=ms data-clipui>
 <div class=row><h2>Chọn đoạn nhạc</h2><button class=s onclick="clipClose()" aria-label="Đóng">✕</button></div>
 <div style="display:flex;gap:12px;align-items:center;margin:4px 0 10px"><img src="https://i.ytimg.com/vi/${k.id}/mqdefault.jpg" alt="" style="width:72px;height:72px;border-radius:14px;object-fit:cover;flex:0 0 auto"><div style="min-width:0"><b style="display:block;overflow-wrap:anywhere">${esc(k.name||'Video YouTube')}</b><span class=mut>${esc(k.ar||'YouTube')} · ${clipFmt(k.D)}</span></div></div>
 <div class=card>
  <div class=row><span>Bắt đầu</span><b id=pkS></b></div>
  <input class=rg type=range id=pkSt min=0 max=${k.D-3} step=1 value=${k.st} oninput="clipPk()">
  <div class=row><span>Độ dài (tối đa 30 giây)</span><b id=pkL></b></div>
  <input class=rg type=range id=pkLn min=3 max=${Math.min(30,k.D-k.st)} step=1 value=${k.len} oninput="clipPk()">
  <p class=mut id=pkR style="margin:4px 0 8px"></p>
  <button class=s onclick="clipHere()">📍 Lấy vị trí đang nghe làm điểm bắt đầu</button>
 </div>
 <div class=row><button class=s id=pkP data-clipbtn data-id="${k.id}" data-st="${k.st}" data-en="${k.st+k.len}" onclick="ClipMu.tap(this)"><span data-clipico>▶</span> Nghe thử</button><button class=p onclick="clipSave()">Lưu lên hồ sơ</button></div>
 </div></div>`;
 clipPk(true)}
function clipPk(init){
 const k=PK,a=document.getElementById('pkSt'),b=document.getElementById('pkLn');if(!k||!a||!b)return;
 if(!init)ClipMu.stop();
 k.st=Math.max(0,Math.min(k.D-3,+a.value||0));
 const mx=Math.max(3,Math.min(30,k.D-k.st));b.max=mx;
 k.len=Math.max(3,Math.min(mx,+b.value||3));b.value=k.len;
 document.getElementById('pkS').textContent=clipFmt(k.st);
 document.getElementById('pkL').textContent=k.len+'s';
 document.getElementById('pkR').textContent='Đoạn được chọn: '+clipFmt(k.st)+' – '+clipFmt(k.st+k.len);
 const p=document.getElementById('pkP');if(p){p.dataset.st=k.st;p.dataset.en=k.st+k.len}
 ClipMu.ui()}
function clipHere(){
 const k=PK,a=document.getElementById('pkSt');if(!k||!a)return;
 a.value=Math.max(0,Math.min(k.D-3,Math.floor((MS.pos||0)/1000)));clipPk()}
function clipClose(){ClipMu.stop();const cd=PK&&PK.target=='cd';mdl();if(cd)cardUI();else if(scr!='game')pfm()}
function clipSave(){
 const k=PK;if(!k)return;
 ClipMu.stop();
 if(k.target=='cd'){
  CO.m=1;CO.mt={id:k.id,name:k.name,ar:k.ar,th:k.th,st:k.st,en:k.st+k.len};s.cd={...CO};save();
  mdl();toast('Đã gắn đĩa than: '+clipFmt(k.st)+' – '+clipFmt(k.st+k.len));
  cardLoadMi().then(()=>cardUI());return}
 s.pf=s.pf||{nm:'Chủ tiệm',av:null,pre:'cat'};
 s.pf.sg={id:k.id,name:String(k.name||'').slice(0,80),ar:String(k.ar||'').slice(0,50),st:k.st,en:k.st+k.len};
 save();try{syncProfile()}catch(e){}
 mdl();toast('Đã thêm nhạc lên hồ sơ');
 if(scr=='game')R();pfm()}
function clipDel(){
 ClipMu.stop();if(s.pf)delete s.pf.sg;
 save();try{syncProfile()}catch(e){}
 toast('Đã gỡ nhạc khỏi hồ sơ');
 if(scr=='game')R();pfm()}

/* ---- đồng bộ lên máy chủ: thêm th (suy nghĩ) + sg (đoạn nhạc) ---- */
{const o=buildGav;buildGav=function(){
 const r=o();
 try{
  const d=JSON.parse(r.slice(4)),p=s.pf||{},g=clipNorm(p.sg);
  d.th=p.th?String(p.th).slice(0,60):null;
  d.sg=g?{id:g.id,name:g.name,ar:g.ar,st:g.st,en:g.en}:null;
  return 'gav:'+JSON.stringify(d)
 }catch(e){return r}}}
/* ---- hồ sơ bạn bè: đọc th + sg ---- */
{const o=friendState;friendState=function(d){
 const fs=o(d);
 try{fs.pf.th=String(d.th||'').slice(0,60);fs.pf.sg=d.sg||null;fs.pf.ro=1}catch(e){}
 return fs}}

/* ---- giao diện hồ sơ: bong bóng suy nghĩ trên avatar + đĩa nhạc + thẻ chỉnh sửa ---- */
{const o=window.pfmModal;window.pfmModal=function(){o();try{
 const ms=document.querySelector('#modal .ms');if(!ms)return;
 const p=s.pf||{},ro=!!p.ro,hd=ms.firstElementChild,h2=hd&&hd.querySelector('h2');if(!h2)return;
 const av=h2.previousElementSibling,th=String(p.th||'').slice(0,60);
 const mg=p.cv?'margin:-46px 0 22px':'';
 if(av){
  if(th)av.insertAdjacentHTML('beforebegin',`<div class="thw" style="${mg}"><div class="thb">${esc(th)}</div></div>`);
  else if(!ro)av.insertAdjacentHTML('beforebegin',`<div class="thw" style="${mg}"><div class="thb empty" onclick="thFocus()">💭 Bạn đang nghĩ gì?</div></div>`)}
 const chip=clipChip(p.sg),sub=h2.nextElementSibling;
 if(chip&&sub)sub.insertAdjacentHTML('afterend',`<div class="clipw">${chip}</div>`);
 if(!ro){
  const pad=hd.nextElementSibling,grid=pad&&pad.firstElementChild;
  const has=!!clipNorm(p.sg);
  const cards=`<div class=card><h3>💭 Suy nghĩ</h3><p class=mut style="margin:0 0 6px">Hiện phía trên avatar. Bạn bè bấm vào avatar của bạn để xem.</p><div class=row><input id=thIn maxlength=60 value="${esc(p.th||'')}" placeholder="Bạn đang nghĩ gì?" style="flex:1;width:auto" onchange="thSet(this.value)"></div>${p.th?`<div class=row style="justify-content:flex-start"><button class=s onclick="thSet('')">Xóa suy nghĩ</button></div>`:''}</div>
<div class=card><h3>🎵 Nhạc trên hồ sơ</h3><p class=mut style="margin:0 0 6px">Chọn bài đang nghe trong tab Nhạc rồi cắt một đoạn (tối đa 30 giây). Bạn bè bấm vào đĩa để nghe khi xem hồ sơ.</p><div class=row style="justify-content:flex-start;flex-wrap:wrap"><button class=p onclick="clipOpen()">${has?'Chọn lại từ bài đang nghe':'⬆ Tải bài đang nghe lên'}</button>${has?`<button class=s onclick="clipDel()">Gỡ nhạc</button>`:''}</div></div>`;
  if(grid)grid.insertAdjacentHTML('afterend',cards)}
}catch(e){console.error(e)}}}

/* ---- card visit: chọn đoạn nhạc cho đĩa than ---- */
cardMusic=function(){
 if(CO.m){CO.m=0;s.cd={...CO};save();cardUI();return}
 clipOpen('cd')};
{const o=cardUI;cardUI=function(){o();try{
 const b=[...document.querySelectorAll('#modal button')].find(x=>(x.getAttribute('onclick')||'').indexOf('cardMusic')>=0);
 if(!b)return;
 const mt=CO.m&&CO.mt,has=mt&&(mt.en|0)>(mt.st|0);
 if(CO.m)b.insertAdjacentHTML('afterend',`<button class=s onclick="clipOpen('cd')">✂️ ${has?'Đổi đoạn ('+clipFmt(mt.st)+'–'+clipFmt(mt.en)+')':'Chọn đoạn'}</button>`);
 else b.textContent='🎵 Thêm bài đang nghe vào card (chọn đoạn)';
}catch(e){console.error(e)}}}
/* ---- đồng bộ đoạn nhạc của đĩa than ---- */
{const o=buildGav;buildGav=function(){
 const r=o();
 try{const d=JSON.parse(r.slice(4)),mt=s.cd&&s.cd.m&&s.cd.mt;
  if(d.mu&&mt&&(mt.en|0)>(mt.st|0)){d.mu.st=mt.st|0;d.mu.en=mt.en|0}
  return 'gav:'+JSON.stringify(d)}catch(e){return r}}}
</script>

<style>

<script>
/* ===== V38: BẢNG TIN: đăng danh thiếp lên tường dạng news feed, có thả tim + bình luận ===== */
let FEEDMODE='feed',FEEDCAP='';
const FEED={posts:[],likes:{},cm:{},pmap:{},open:{},ids:[],t:0,more:false,busy:0,err:''};
const FEED_PAGE=8;
const feedMissing=e=>!!e&&(e.code=='42P01'||e.code=='PGRST205'||/does not exist|schema cache|Could not find the table/i.test(e.message||''));
function feedTime(d){
 const t=new Date(d).getTime();if(!t)return '';
 const m=Math.floor((Date.now()-t)/60000);
 if(m<1)return 'Vừa xong';if(m<60)return m+' phút trước';
 const h=Math.floor(m/60);if(h<24)return h+' giờ trước';
 const dd=Math.floor(h/24);if(dd<7)return dd+' ngày trước';
 return new Date(t).toLocaleDateString('vi-VN')}
const feedImgOk=x=>typeof x=='string'&&/^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(x);

/* ---- thông tin người đăng (tên + avatar) ---- */
async function feedProfiles(uids){
 const need=[...new Set(uids)].filter(u=>u&&u!==(currentUser&&currentUser.id)&&!FEED.pmap[u]);
 if(!need.length)return;
 try{
  const {data:ps}=await supabaseClient.from('profiles').select('id, display_name, username').in('id',need);
  (ps||[]).forEach(p=>FEED.pmap[p.id]={...p});
  const {data:sp}=await supabaseClient.from('shop_public').select('user_id, game_avatar').in('user_id',need);
  (sp||[]).forEach(r=>{const d=parseGav(r.game_avatar),p=FEED.pmap[r.user_id]||(FEED.pmap[r.user_id]={id:r.user_id});
   p.gav='gav:'+JSON.stringify({av:d.av||null,pre:d.pre||null,fr:d.fr||0,afr:d.afr?1:0})});
 }catch(e){console.warn(e)}
 need.forEach(u=>{if(!FEED.pmap[u])FEED.pmap[u]={id:u}})}
function feedWho(uid){
 if(currentUser&&uid===currentUser.id){const dn=discordNames(currentUser);return {name:dn.display||'Bạn',av:avH(34)}}
 const p=FEED.pmap[uid]||{};
 return {name:p.display_name||p.username||'Người chơi',av:friendAvTap(p.gav,34,uid)}}

/* ---- dựng HTML ---- */
function feedLikeBtn(pid){
 const L=FEED.likes[pid]||{n:0,me:0};
 return `<span class=fhe>${L.me?'❤️':'🤍'}</span><span>${L.n||''}</span>`}
function feedCmHtml(pid){
 const uid=currentUser.id,own=(FEED.posts.find(p=>p.id===pid)||{}).user_id===uid;
 const a=FEED.cm[pid]||[];
 return a.map(c=>{const w=feedWho(c.user_id),mine=c.user_id===uid;
  return `<div class=fcm><span style="line-height:0;flex:0 0 auto">${currentUser&&mine?avH(26):friendAvTap((FEED.pmap[c.user_id]||{}).gav,26,c.user_id)}</span><div class=fcb><b>${esc(w.name)}</b> ${esc(c.body)}<br><small>${feedTime(c.created_at)}</small></div>${mine||own?`<button class="s fcx" onclick="feedDelCm(${pid},${c.id})" aria-label="Xóa bình luận">✕</button>`:''}</div>`}).join('')
 +`<div class=row style="gap:6px;margin:6px 0 0"><input id="fci-${pid}" maxlength=300 placeholder="Viết bình luận..." style="flex:1;width:auto" onkeydown="if(event.key=='Enter')feedComment(${pid})"><button class=p onclick="feedComment(${pid})">Gửi</button></div>`}
function feedPostHtml(p){
 const own=p.user_id===currentUser.id,w=feedWho(p.user_id);
 const img=feedImgOk(p.image)?`<img class=fpimg src="${p.image}" alt="Danh thiếp" loading=lazy>`:'';
 const n=(FEED.cm[p.id]||[]).length;
 return `<div class="card fpost" id="fp-${p.id}"><div class=fph><span style="line-height:0;flex:0 0 auto">${w.av}</span><div class=fpn><b>${esc(w.name)}</b><small class=mut>${feedTime(p.created_at)}</small></div>${own?`<button class="s fcx" onclick="feedDelPost(${p.id})" aria-label="Xóa bài đăng">🗑</button>`:''}</div>${p.caption?`<p class=fpcap>${esc(p.caption)}</p>`:''}${img}<div class=fpa><button class="s ${(FEED.likes[p.id]||{}).me?'liked':''}" id="fl-${p.id}" onclick="feedLike(${p.id})">${feedLikeBtn(p.id)}</button><button class=s id="fcb-${p.id}" onclick="feedToggleCm(${p.id})">💬 <span>${n||''}</span></button></div><div id="fc-${p.id}" style="display:${FEED.open[p.id]?'block':'none'};margin-top:8px">${feedCmHtml(p.id)}</div></div>`}
function feedPaint(){
 const box=document.getElementById('feed-box');if(!box)return;
 const keep={};box.querySelectorAll('input[id^=fci-]').forEach(i=>{if(i.value)keep[i.id]=i.value});

   :`<div class=fsetup><b>Không tải được bảng tin</b><p class=mut style="margin:4px 0 0">${esc(FEED.err)}</p></div>`}

 h+=FEED.posts.map(feedPostHtml).join('');
 if(FEED.more&&!FEED.err)h+=`<button class=s style="width:100%;margin:6px 0" onclick="feedLoad(true)" ${FEED.busy?'disabled':''}>${FEED.busy?'Đang tải...':'Xem thêm'}</button>`;

/* ---- tải dữ liệu ---- */
async function feedLoad(more){
 if(!currentUser||FEED.busy)return;
 FEED.busy=1;if(!more)FEED.err='';feedPaint();
 try{
  const uid=currentUser.id;
  if(!more){
   const {data:fr}=await supabaseClient.from('friends').select('user_id, friend_id, status').eq('status','accepted').or(`user_id.eq.${uid},friend_id.eq.${uid}`);
   FEED.ids=[uid,...new Set((fr||[]).map(r=>r.user_id===uid?r.friend_id:r.user_id))]}
  let q=supabaseClient.from('feed_posts').select('id, user_id, image, caption, music, created_at').in('user_id',FEED.ids).order('created_at',{ascending:false}).limit(FEED_PAGE);
  if(more&&FEED.posts.length)q=q.lt('created_at',FEED.posts[FEED.posts.length-1].created_at);
  const {data:ps,error}=await q;
  if(error){FEED.err=error.message||'Lỗi';if(!more)FEED.posts=[];return}
  const got=ps||[];
  FEED.more=got.length>=FEED_PAGE;
  FEED.posts=more?FEED.posts.concat(got.filter(x=>!FEED.posts.some(y=>y.id===x.id))):got;
  const ids=got.map(p=>p.id);
  if(ids.length){
   const [lk,cm]=await Promise.all([
    supabaseClient.from('feed_likes').select('post_id, user_id').in('post_id',ids),
    supabaseClient.from('feed_comments').select('id, post_id, user_id, body, created_at').in('post_id',ids).order('created_at',{ascending:true}).limit(500)]);
   ids.forEach(id=>{FEED.likes[id]={n:0,me:0};FEED.cm[id]=[]});
   (lk.data||[]).forEach(r=>{const L=FEED.likes[r.post_id];if(L){L.n++;if(r.user_id===uid)L.me=1}});
   (cm.data||[]).forEach(c=>{if(FEED.cm[c.post_id])FEED.cm[c.post_id].push(c)});
   await feedProfiles([...got.map(p=>p.user_id),...(cm.data||[]).map(c=>c.user_id)])}
  FEED.t=Date.now();
 }catch(e){FEED.err=(e&&e.message)||String(e)}
 finally{FEED.busy=0;feedPaint()}}
function feedEnter(){
 const el=document.getElementById('friend-content');if(!el)return;
 el.innerHTML='<div id="feed-box"></div>';
 feedPaint();
 if(!FEED.t||Date.now()-FEED.t>30000)feedLoad()}

/* ---- tim ---- */
async function feedLike(pid){
 if(!currentUser)return;
 const L=FEED.likes[pid]||(FEED.likes[pid]={n:0,me:0}),was=L.me;
 const set=()=>{const b=document.getElementById('fl-'+pid);if(b){b.innerHTML=feedLikeBtn(pid);b.classList.toggle('liked',!!L.me)}};
 L.me=was?0:1;L.n=Math.max(0,L.n+(was?-1:1));set();
 const t=supabaseClient.from('feed_likes');
 const r=was?await t.delete().eq('post_id',pid).eq('user_id',currentUser.id):await t.insert({post_id:pid,user_id:currentUser.id});
 if(r.error&&r.error.code!='23505'){L.me=was;L.n=Math.max(0,L.n+(was?1:-1));set();toast('Lỗi: '+r.error.message)}}

/* ---- đăng: ảnh nén JPEG + chú thích + đoạn nhạc ---- */
function feedJpeg(src){
 return new Promise((res,rej)=>{
  const i=new Image();i.crossOrigin='anonymous';
  i.onload=()=>{
   let w=Math.min(720,i.naturalWidth||i.width),q=.82,out='';
   for(let k=0;k<4;k++){
    const h=Math.round(w*(i.naturalHeight||i.height)/(i.naturalWidth||i.width)),c=document.createElement('canvas');
    c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(i,0,0,w,h);
    out=c.toDataURL('image/jpeg',q);
    if(out.length<600000)break;w=Math.round(w*.8);q=Math.max(.5,q-.1)}
   res(out)};
  i.onerror=rej;i.src=src})}
uploadCardToWall=async function(){
 if(!currentUser)return toast('Hãy liên kết Discord');
 const img=document.getElementById('cpv');

 try{

   const c=document.createElement('canvas'),i=new Image();i.crossOrigin='anonymous';
   i.onload=()=>{c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0);res(c.toDataURL('image/png'))};
   i.onerror=rej;i.src=img.src});
  const {error}=await supabaseClient.from('shop_public').upsert({
   user_id:currentUser.id,card_image:b64,shop_name:(s.pf&&s.pf.nm)||s.name||'Tiệm hoa',game_avatar:buildGav(),
   day:s.day||1,money:s.money||0,level:typeof lvOf==='function'?lvOf(s.xp||0):1,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(error)throw error;
  window.__postedCache=null;
  const jpg=await feedJpeg(b64),cap=String(FEEDCAP||'').trim().slice(0,200),mt=CO&&CO.m&&CO.mt;
  const hasClip=mt&&(mt.en|0)>(mt.st|0);

  const {error:fe}=await supabaseClient.from('feed_posts').insert({user_id:currentUser.id,image:jpg,caption:cap||null,music});
  if(fe){
   toast(feedMissing(fe)?'Đã cập nhật danh thiếp. Bảng tin chưa bật: cần chạy file justaseed-feed.sql':'Đăng bảng tin lỗi: '+fe.message);return}
  FEEDCAP='';FEED.t=0;FEEDMODE='feed';
  toast('Đã đăng lên bảng tin!');
  try{mdl();SD.open('friends')}catch(e){}
 }catch(e){toast('Lỗi: '+(e.message||e));console.error(e)}};
